<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>View Profile</title>

<style>
:root{
    --bg:#0f1115;
    --panel:#1a1d24;
    --panel2:#222630;
    --border:#2e3440;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --primary:#4ade80;
    --danger:#ef4444;
    --warning:#f59e0b;
    --info:#3b82f6;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

/* BACK BUTTON */

.back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
    padding:10px 14px;
    border-radius:12px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
    transition:.2s;
    font-weight:bold;
}

.back:hover{
    border-color:var(--info);
    transform:translateY(-1px);
}

/* CARD */

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:35px 30px;
    transition:.2s;
}

.card:hover{
    border-color:var(--info);
}

/* AVATAR */

.avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
    border:4px solid var(--border);
    background:#111827;
}

/* USERNAME */

.username{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-top:18px;
    color:var(--text);
}

/* STATUS */

.status{
    text-align:center;
    margin-top:8px;
    font-size:14px;
    font-weight:bold;
}

.online{
    color:var(--primary);
}

.offline{
    color:var(--muted);
}

/* BIO */

.bio{
    margin-top:20px;
    text-align:center;
    color:var(--muted);
    line-height:1.6;
    font-size:15px;
    padding:0 10px;
}

/* INFO */

.info{
    margin-top:18px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

/* BADGES */

.badges{
    margin-top:20px;
    text-align:center;
}

.badge{
    display:inline-block;
    background:rgba(74,222,128,0.15);
    color:var(--primary);
    border:1px solid rgba(74,222,128,0.3);
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    margin:4px;
    font-weight:bold;
}

/* EMPTY */

.empty{
    text-align:center;
    color:var(--muted);
    padding:30px;
}

/* MOBILE */

@media(max-width:700px){

    .card{
        padding:25px 20px;
    }

    .username{
        font-size:24px;
    }

    .avatar{
        width:110px;
        height:110px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div
        class="back"
        onclick="history.back()"
    >
        ← Back
    </div>

    <div
        class="card"
        id="profile"
    >
        <div class="empty">
            Loading...
        </div>
    </div>

</div>

<script type="module">

import { db } from "./js/firebase.js";

import {
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= PARAMS ================= */

const params =
    new URLSearchParams(
        location.search
    );

const uid =
    params.get("uid");

const container =
    document.getElementById(
        "profile"
    );

/* ================= HELPERS ================= */

function formatDate(ms){

    if(!ms){
        return "Unknown";
    }

    const num = Number(ms);

    if(isNaN(num)){
        return "Unknown";
    }

    return new Date(num)
        .toLocaleDateString();

}

function escapeHtml(str){

    return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ================= LOAD PROFILE ================= */

async function loadProfile(){

    try{

        if(!uid){

            container.innerHTML = `
                <div class="empty">
                    No user selected.
                </div>
            `;

            return;

        }

        const ref =
            doc(db, "users", uid);

        const snap =
            await getDoc(ref);

        if(!snap.exists()){

            container.innerHTML = `
                <div class="empty">
                    User not found.
                </div>
            `;

            return;

        }

        const user =
            snap.data();

        const badges =
            Array.isArray(user.badges)
            ? user.badges
            : [];

        container.innerHTML = `

            <img
                class="avatar"
                src="${
                    escapeHtml(
                        user.photoURL ||
                        "https://via.placeholder.com/130"
                    )
                }"
            >

            <div class="username">
                ${
                    escapeHtml(
                        user.username ||
                        "Unknown User"
                    )
                }
            </div>

            <div class="
                status
                ${
                    user.status === "Online"
                    ? "online"
                    : "offline"
                }
            ">
                ${
                    escapeHtml(
                        user.status ||
                        "Offline"
                    )
                }
            </div>

            <div class="bio">
                ${
                    escapeHtml(
                        user.bio ||
                        "No bio provided."
                    )
                }
            </div>

            <div class="info">
                Joined:
                ${
                    formatDate(
                        user.created
                    )
                }
            </div>

            <div class="badges">

                ${
                    badges.length
                    ? badges.map(b => `
                        <span class="badge">
                            ${escapeHtml(b)}
                        </span>
                    `).join("")
                    : `
                        <span class="badge">
                            No Badges
                        </span>
                    `
                }

            </div>

        `;

    }catch(err){

        console.error(err);

        container.innerHTML = `
            <div class="empty">
                Failed to load profile.
            </div>
        `;

    }

}

/* ================= INIT ================= */

loadProfile();

</script>

</body>
</html>
