<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>View Profile</title>

<style>
:root{
    --primary:#c40000;
    --primary-hover:#a30000;
    --bg:#f4f4f4;
    --card:#ffffff;
    --muted:#666;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.card{
    background:var(--card);
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    border-top:5px solid var(--primary);
}

.back{
    margin-bottom:15px;
    display:inline-block;
    color:var(--primary);
    cursor:pointer;
    font-weight:bold;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
    border:4px solid #eee;
}

.username{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

.status{
    text-align:center;
    margin-top:5px;
    font-size:14px;
}

.online{ color:green; }
.offline{ color:gray; }

.bio{
    margin-top:15px;
    text-align:center;
    color:var(--muted);
}

.info{
    margin-top:15px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
}

.badges{
    margin-top:15px;
    text-align:center;
}

.badge{
    display:inline-block;
    background:var(--primary);
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin:3px;
}
</style>
</head>

<body>

<div class="container">

    <div class="back" onclick="history.back()">
        ← Back
    </div>

    <div class="card" id="profile">
        Loading...
    </div>

</div>

<script type="module">

import { db } from "./js/firebase.js";
import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(location.search);
const uid = params.get("uid");

const container = document.getElementById("profile");

function formatDate(ms){
    if(!ms) return "Unknown";
    const num = Number(ms);
    if(isNaN(num)) return "Unknown";
    return new Date(num).toLocaleDateString();
}

async function loadProfile(){

    if(!uid){
        container.innerHTML = "No user selected.";
        return;
    }

    const ref = doc(db, "users", uid);
    const snap = await getDoc(ref);

    if(!snap.exists()){
        container.innerHTML = "User not found.";
        return;
    }

    const user = snap.data();
    const badges = Array.isArray(user.badges) ? user.badges : [];

    container.innerHTML = `
        <img class="avatar"
            src="${user.photoURL || 'https://via.placeholder.com/120'}"
        >

        <div class="username">
            ${user.username || "Unknown User"}
        </div>

        <div class="status ${user.status === "Online" ? "online" : "offline"}">
            ${user.status || "Offline"}
        </div>

        <div class="bio">
            ${user.bio || "No bio provided."}
        </div>

        <div class="info">
            Joined: ${formatDate(user.created)}
        </div>

        <div class="badges">
            ${badges.map(b => `<span class="badge">${b}</span>`).join("")}
        </div>
    `;
}

loadProfile();

</script>

</body>
</html>
