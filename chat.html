<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Irridium - Chat</title>

<style>
body { font-family: Arial; background:#23262a; padding:20px; }

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

#messages {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 10px;
}

.msg {
  margin: 5px 0;
  padding: 6px;
  border-radius: 6px;
}

.me { background: #d1f5d3; }
.other { background: #eee; }

input,button {
  padding: 10px;
  margin-top: 5px;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Irridium Chat on Emerald</h2>

  <!-- TOP BAR -->
  <div class="topbar">
    <input id="toUser" placeholder="Private chat username">
    <button onclick="openChat()">Private Chat</button>
    <button onclick="openGlobalChat()">🌍 Global Chat</button>
    <button onclick="openGroupList()">👥 Group Chats</button>

    <!-- ✅ ADDED: VIDEO CALL -->
    <button onclick="openVideoCall()">📹 Video Call</button>
  </div>

  <div class="topbar">
    <input id="groupName" placeholder="Group name">
    <input id="groupUsers" placeholder="Users (comma separated)">
    <button onclick="createGroupChat()">👥 Create Group</button>
  </div>

  <div id="groupList"
       style="display:none;border:1px solid #ccc;padding:10px;margin-bottom:10px;border-radius:6px;background:#fafafa;">
  </div>

  <div id="messages"></div>

  <input id="msgInput" placeholder="Message...">
  <button onclick="sendMsg()">Send</button>

</div>

<script type="module">

import {
  doc,
  getDoc,
  getDocs,
  collection,
  setDoc,
  updateDoc,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");
let currentChatId = null;

/* ================= CHAT ID ================= */
function getChatId(a,b){
  return [a,b].sort().join("_");
}

/* ================= VIDEO CALL (NEW) ================= */
window.openVideoCall = function () {
  // simple integration bridge to video.html
  const id = prompt("Enter or create Call ID (share with other user):");

  if (!id) return;

  localStorage.setItem("callId", id);
  window.location.href = "video.html?call=" + id;
};

/* ================= MARK AS SEEN ================= */
async function markSeen(chatId){
  if(!chatId) return;

  await setDoc(doc(db,"chatSeen",chatId + "_" + me),{
    chatId,
    user: me,
    lastSeen: Date.now()
  });
}

/* ================= PRIVATE CHAT ================= */
window.openChat = async function() {

  const other = document.getElementById("toUser").value.trim();
  if (!other) return;

  currentChatId = getChatId(me, other);

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"private",
      participants:[me,other],
      messages:[],
      created:Date.now()
    });
  }

  await markSeen(currentChatId);
  loadMessages();
};

/* ================= GLOBAL CHAT ================= */
window.openGlobalChat = async function() {

  currentChatId = "GLOBAL_CHAT";

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"global",
      participants:["GLOBAL"],
      messages:[],
      created:Date.now()
    });
  }

  await markSeen(currentChatId);
  loadMessages();
};

/* ================= GROUP CHAT CREATION ================= */
window.createGroupChat = async function() {

  const name = document.getElementById("groupName").value.trim();
  const users = document.getElementById("groupUsers").value.trim();

  if (!name || !users) return;

  const list = users.split(",").map(u => u.trim());

  if (!list.includes(me)) list.push(me);

  const id = "group_" + Date.now();

  await setDoc(doc(db,"chats",id),{
    type:"group",
    name,
    participants:list,
    messages:[],
    created:Date.now()
  });

  currentChatId = id;

  await markSeen(currentChatId);
  loadMessages();
};

/* ================= GROUP LIST ================= */
window.openGroupList = async function() {

  const box = document.getElementById("groupList");

  if (box.style.display === "block") {
    box.style.display = "none";
    return;
  }

  box.style.display = "block";
  box.innerHTML = "Loading groups...";

  const snap = await getDocs(collection(db,"chats"));

  box.innerHTML = "";

  let found = false;

  snap.forEach(chatDoc => {

    const data = chatDoc.data();
    if (data.type !== "group") return;

    if (!data.participants || !data.participants.includes(me)) return;

    found = true;

    const row = document.createElement("div");
    row.style.marginBottom = "10px";

    row.innerHTML = `
      <b>👥 ${data.name || chatDoc.id}</b><br>
      <button onclick="joinGroupChat('${chatDoc.id}')">
        Open Group
      </button>
    `;

    box.appendChild(row);
  });

  if (!found) {
    box.innerHTML = "<i>No group chats available.</i>";
  }
};

/* ================= JOIN GROUP ================= */
window.joinGroupChat = async function(chatId){

  const ref = doc(db,"chats",chatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    alert("Group not found.");
    return;
  }

  const data = snap.data();

  if (data.type === "group") {
    if (!data.participants || !data.participants.includes(me)) {
      alert("You are not a member of this group.");
      return;
    }
  }

  currentChatId = chatId;

  document.getElementById("groupList").style.display = "none";

  await markSeen(currentChatId);
  loadMessages();
};

/* ================= LOAD MESSAGES ================= */
async function loadMessages(){

  if (!currentChatId) return;

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  const box = document.getElementById("messages");
  box.innerHTML = "";

  const data = snap.data();
  if (!data) return;

  if (data.type === "group") {
    if (!data.participants || !data.participants.includes(me)) {
      box.innerHTML = "<b>Access denied: You are not in this group.</b>";
      return;
    }

    box.innerHTML += `<b>👥 Group: ${data.name}</b><hr>`;
  }

  const messages = data.messages || [];

  if (messages.length === 0) {
    box.innerHTML += "<i>No messages yet</i>";
    return;
  }

  messages.forEach(m => {

    const div = document.createElement("div");

    div.className = "msg " + (m.from === me ? "me" : "other");

    const timestamp = m.time
      ? new Date(m.time).toLocaleString()
      : "";

    div.innerHTML = `
      <b>${m.from || "Unknown"}:</b>
      ${m.text || ""}
      <div style="font-size:11px;opacity:0.7;margin-top:3px;">
        ${timestamp}
      </div>
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* ================= SEND MESSAGE ================= */
window.sendMsg = async function(){

  const text = document.getElementById("msgInput").value;
  if (!text || !currentChatId) return;

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  const data = snap.data();

  if (data.type === "group") {
    if (!data.participants || !data.participants.includes(me)) {
      alert("You are not allowed to send messages in this group.");
      return;
    }
  }

  await updateDoc(ref,{
    messages: arrayUnion({
      from: me,
      text,
      time: Date.now()
    }),
    updated: Date.now()
  });

  document.getElementById("msgInput").value = "";

  loadMessages();
};

/* ================= AUTO REFRESH ================= */
setInterval(loadMessages,2000);

</script>

</body>
</html>
