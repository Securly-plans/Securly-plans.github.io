<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Irridium - Chat</title>

<style>
body { font-family: Arial; background:#23262a; padding:20px; }

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

#messages {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 10px;
}

.msg {
  margin: 5px 0;
  padding: 6px;
  border-radius: 6px;
}

.me { background: #d1f5d3; }
.other { background: #eee; }

input,button {
  padding: 10px;
  margin-top: 5px;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Irridium Chat on Emerald</h2>

  <!-- CHAT CONTROLS -->
  <div class="topbar">
    <input id="toUser" placeholder="Private chat username">
    <button onclick="openChat()">Private Chat</button>
    <button onclick="openGlobalChat()">🌍 Global Chat</button>
    <button onclick="openGroupList()">👥 Group Chats</button>
  </div>

  <!-- GROUP CHAT CREATOR -->
  <div class="topbar">
    <input id="groupName" placeholder="Group name">
    <input id="groupUsers" placeholder="Users (comma separated)">
    <button onclick="createGroupChat()">👥 Create Group</button>
  </div>

  <!-- GROUP LIST -->
  <div id="groupList"
       style="
         display:none;
         border:1px solid #ccc;
         padding:10px;
         margin-bottom:10px;
         border-radius:6px;
         background:#fafafa;">
  </div>

  <div id="messages"></div>

  <input id="msgInput" placeholder="Message...">
  <button onclick="sendMsg()">Send</button>

</div>

<script type="module">

import {
  doc,
  getDoc,
  getDocs,
  collection,
  setDoc,
  updateDoc,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");

let currentChatId = null;

/* ================= CHAT ID ================= */
function getChatId(a,b){
  return [a,b].sort().join("_");
}

/* ================= PRIVATE CHAT ================= */
window.openChat = async function() {

  const other = document.getElementById("toUser").value.trim();
  if (!other) return;

  currentChatId = getChatId(me, other);

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"private",
      participants:[me,other],
      messages:[],
      created:Date.now()
    });
  }

  loadMessages();
};

/* ================= GLOBAL CHAT ================= */
window.openGlobalChat = async function() {

  currentChatId = "GLOBAL_CHAT";

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"global",
      participants:["GLOBAL"],
      messages:[],
      created:Date.now()
    });
  }

  loadMessages();
};

/* ================= GROUP CHAT CREATION ================= */
window.createGroupChat = async function() {

  const name = document.getElementById("groupName").value.trim();
  const users = document.getElementById("groupUsers").value.trim();

  if (!name || !users) return;

  const list = users.split(",").map(u => u.trim());

  if (!list.includes(me)) {
    list.push(me);
  }

  const id = "group_" + Date.now();

  currentChatId = id;

  await setDoc(doc(db,"chats",id),{
    type:"group",
    name,
    participants:list,
    messages:[],
    created:Date.now()
  });

  loadMessages();
};

/* ================= VIEW GROUP CHATS ================= */
window.openGroupList = async function() {

  const box = document.getElementById("groupList");

  if (box.style.display === "block") {
    box.style.display = "none";
    return;
  }

  box.style.display = "block";
  box.innerHTML = "Loading groups...";

  const snap = await getDocs(collection(db,"chats"));

  box.innerHTML = "";

  let found = false;

  snap.forEach(chatDoc => {

    const data = chatDoc.data();

    if (data.type !== "group") return;

    found = true;

    const row = document.createElement("div");

    row.style.marginBottom = "10px";

    row.innerHTML = `
      <b>👥 ${data.name || chatDoc.id}</b>
      <br>
      <button onclick="joinGroupChat('${chatDoc.id}')">
        Open Group
      </button>
    `;

    box.appendChild(row);
  });

  if (!found) {
    box.innerHTML = "<i>No group chats found.</i>";
  }
};

/* ================= JOIN GROUP CHAT ================= */
window.joinGroupChat = async function(chatId){

  currentChatId = chatId;

  document.getElementById(
    "groupList"
  ).style.display = "none";

  loadMessages();
};

/* ================= LOAD MESSAGES ================= */
async function loadMessages(){

  if (!currentChatId) return;

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  const box = document.getElementById("messages");
  box.innerHTML = "";

  const data = snap.data();

  if (!data) return;

  if (data.type === "group") {

    const title = document.createElement("div");

    title.innerHTML = `
      <b>👥 Group: ${data.name}</b>
      <hr>
    `;

    box.appendChild(title);
  }

  const messages = data.messages || [];

  if (messages.length === 0) {
    box.innerHTML += "<i>No messages yet</i>";
    return;
  }

  messages.forEach(m => {

    const div = document.createElement("div");

    div.className =
      "msg " +
      (m.from === me ? "me" : "other");

    let timestamp = "";

    if (m.time) {
      timestamp =
        new Date(m.time)
        .toLocaleString();
    }

    div.innerHTML = `
      <b>${m.from || "Unknown"}:</b>
      ${m.text || ""}

      <div style="
        font-size:11px;
        opacity:0.7;
        margin-top:3px;">
        ${timestamp}
      </div>
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* ================= SEND MESSAGE ================= */
window.sendMsg = async function(){

  const text =
    document.getElementById("msgInput").value;

  if (!text || !currentChatId) return;

  const ref =
    doc(db,"chats",currentChatId);

  await updateDoc(ref,{
    messages: arrayUnion({
      from: me,
      text,
      time: Date.now()
    }),
    updated: Date.now()
  });

  document.getElementById("msgInput").value = "";

  loadMessages();
};

/* ================= AUTO REFRESH ================= */
setInterval(loadMessages,2000);

</script>

</body>
</html>
