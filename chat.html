<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Irridium - Chat</title>

<style>
body { font-family: Arial; background:#23262a; padding:20px; }

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

#messages {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 10px;
}

.msg {
  margin: 5px 0;
  padding: 6px;
  border-radius: 6px;
}

.me { background: #d1f5d3; }
.other { background: #eee; }

input,button {
  padding: 10px;
  margin-top: 5px;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}

.media-preview {
  max-width: 200px;
  margin-top: 5px;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Irridium Chat on Emerald</h2>

  <div class="topbar">
    <input id="toUser" placeholder="Private chat username">
    <button onclick="openChat()">Private Chat</button>
    <button onclick="openGlobalChat()">🌍 Global Chat</button>
    <button onclick="openGroupList()">👥 Group Chats</button>
  </div>

  <div class="topbar">
    <input id="groupName" placeholder="Group name">
    <input id="groupUsers" placeholder="Users (comma separated)">
    <button onclick="createGroupChat()">👥 Create Group</button>
  </div>

  <div id="groupList" style="display:none;border:1px solid #ccc;padding:10px;margin-bottom:10px;border-radius:6px;background:#fafafa;"></div>

  <div id="messages"></div>

  <!-- MESSAGE INPUT -->
  <input id="msgInput" placeholder="Message...">

  <!-- MEDIA INPUT -->
  <input type="file" id="mediaInput" accept="image/*,video/*">

  <button onclick="sendMsg()">Send</button>

</div>

<script type="module">

import {
  doc,
  getDoc,
  getDocs,
  collection,
  setDoc,
  updateDoc,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import { db, storage } from "./js/firebase.js";

const me = localStorage.getItem("username");
let currentChatId = null;

function getChatId(a,b){
  return [a,b].sort().join("_");
}

async function markSeen(chatId){
  if(!chatId) return;
  await setDoc(doc(db,"chatSeen",chatId + "_" + me),{
    chatId,
    user: me,
    lastSeen: Date.now()
  });
}

/* ================= CHAT OPENERS ================= */

window.openChat = async function() {

  const other = document.getElementById("toUser").value.trim();
  if (!other) return;

  currentChatId = getChatId(me, other);

  const refDoc = doc(db,"chats",currentChatId);
  const snap = await getDoc(refDoc);

  if (!snap.exists()) {
    await setDoc(refDoc,{
      type:"private",
      participants:[me,other],
      messages:[],
      created:Date.now()
    });
  }

  await markSeen(currentChatId);
  loadMessages();
};

window.openGlobalChat = async function() {

  currentChatId = "GLOBAL_CHAT";

  const refDoc = doc(db,"chats",currentChatId);
  const snap = await getDoc(refDoc);

  if (!snap.exists()) {
    await setDoc(refDoc,{
      type:"global",
      participants:["GLOBAL"],
      messages:[],
      created:Date.now()
    });
  }

  await markSeen(currentChatId);
  loadMessages();
};

window.createGroupChat = async function() {

  const name = document.getElementById("groupName").value.trim();
  const users = document.getElementById("groupUsers").value.trim();

  if (!name || !users) return;

  const list = users.split(",").map(u => u.trim());
  if (!list.includes(me)) list.push(me);

  const id = "group_" + Date.now();

  await setDoc(doc(db,"chats",id),{
    type:"group",
    name,
    participants:list,
    messages:[],
    created:Date.now()
  });

  currentChatId = id;
  await markSeen(currentChatId);
  loadMessages();
};

/* ================= GROUP LIST ================= */

window.openGroupList = async function() {

  const box = document.getElementById("groupList");

  if (box.style.display === "block") {
    box.style.display = "none";
    return;
  }

  box.style.display = "block";
  box.innerHTML = "Loading groups...";

  const snap = await getDocs(collection(db,"chats"));

  box.innerHTML = "";

  snap.forEach(chatDoc => {

    const data = chatDoc.data();
    if (data.type !== "group") return;
    if (!data.participants?.includes(me)) return;

    const row = document.createElement("div");

    row.innerHTML = `
      <b>👥 ${data.name}</b><br>
      <button onclick="joinGroupChat('${chatDoc.id}')">Open Group</button>
    `;

    box.appendChild(row);
  });
};

window.joinGroupChat = async function(chatId){

  currentChatId = chatId;
  document.getElementById("groupList").style.display = "none";
  await markSeen(currentChatId);
  loadMessages();
};

/* ================= LOAD MESSAGES ================= */

async function loadMessages(){

  if (!currentChatId) return;

  const snap = await getDoc(doc(db,"chats",currentChatId));
  const box = document.getElementById("messages");

  box.innerHTML = "";

  const data = snap.data();
  if (!data) return;

  if (data.type === "group" && !data.participants?.includes(me)) {
    box.innerHTML = "<b>Access denied</b>";
    return;
  }

  const messages = data.messages || [];

  messages.forEach(m => {

    const div = document.createElement("div");
    div.className = "msg " + (m.from === me ? "me" : "other");

    let mediaHTML = "";

    if (m.imageURL) {
      mediaHTML += `<img src="${m.imageURL}" class="media-preview">`;
    }

    if (m.videoURL) {
      mediaHTML += `<video src="${m.videoURL}" controls class="media-preview"></video>`;
    }

    div.innerHTML = `
      <b>${m.from}:</b> ${m.text || ""}
      ${mediaHTML}
      <div style="font-size:11px;opacity:.7;margin-top:3px;">
        ${m.time ? new Date(m.time).toLocaleString() : ""}
      </div>
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* ================= SEND MESSAGE (TEXT + MEDIA) ================= */

window.sendMsg = async function(){

  if (!currentChatId) return;

  const text = document.getElementById("msgInput").value.trim();
  const file = document.getElementById("mediaInput").files[0];

  const refDoc = doc(db,"chats",currentChatId);
  const snap = await getDoc(refDoc);
  const data = snap.data();

  let imageURL = null;
  let videoURL = null;

  if (file) {

    const storageRef = ref(storage, "chatMedia/" + Date.now() + "-" + file.name);

    await uploadBytes(storageRef, file);
    const url = await getDownloadURL(storageRef);

    if (file.type.startsWith("image")) {
      imageURL = url;
    } else if (file.type.startsWith("video")) {
      videoURL = url;
    }
  }

  await updateDoc(refDoc,{
    messages: arrayUnion({
      from: me,
      text,
      imageURL,
      videoURL,
      time: Date.now()
    }),
    updated: Date.now()
  });

  document.getElementById("msgInput").value = "";
  document.getElementById("mediaInput").value = "";

  loadMessages();
};

/* ================= AUTO REFRESH ================= */
setInterval(loadMessages, 2000);

</script>

</body>
</html>
