<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Irridium - Chat</title>

<style>
body { font-family: Arial; background:#23262a; padding:20px; }

.container {
  max-width: 700px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

#messages {
  height: 400px;
  overflow-y: auto;
  border: 1px solid #ccc;
  padding: 10px;
  margin-bottom: 10px;
}

.msg {
  margin: 5px 0;
  padding: 6px;
  border-radius: 6px;
}

.me { background: #d1f5d3; }
.other { background: #eee; }

.msg img{
  max-width:200px;
  display:block;
  margin-top:5px;
  border-radius:6px;
}

input,button {
  padding: 10px;
  margin-top: 5px;
}

.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Irridium Chat on Emerald</h2>

  <div class="topbar">
    <input id="toUser" placeholder="Private chat username">
    <button onclick="openChat()">Private Chat</button>
    <button onclick="openGlobalChat()">🌍 Global Chat</button>
    <button onclick="openGroupList()">👥 Group Chats</button>
    <button onclick="window.location.href='video.html'">
  📹 Video Chat
</button>
  </div>

  <div class="topbar">
    <input id="groupName" placeholder="Group name">
    <input id="groupUsers" placeholder="Users (comma separated)">
    <button onclick="createGroupChat()">👥 Create Group</button>
  </div>

  <div id="groupList" style="display:none;border:1px solid #ccc;padding:10px;margin-bottom:10px;border-radius:6px;background:#fafafa;"></div>

  <div id="messages"></div>

  <!-- MESSAGE INPUT + MEDIA -->
  <input id="msgInput" placeholder="Message...">

  <input
  type="file"
  id="fileInput"
  accept="image/*,video/*,audio/*,.pdf,.txt,.zip,.doc,.docx"> 

  <button onclick="sendMsg()">Send</button>

</div>

<script type="module">

import {
  doc,
  getDoc,
  getDocs,
  collection,
  setDoc,
  updateDoc,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {
  db,
  storage
} from "./js/firebase.js";

const me = localStorage.getItem("username");
let currentChatId = null;

function getChatId(a,b){
  return [a,b].sort().join("_");
}

/* MARK SEEN */
async function markSeen(chatId){
  if(!chatId) return;
  await setDoc(doc(db,"chatSeen",chatId + "_" + me),{
    chatId, user: me, lastSeen: Date.now()
  });
}

/* OPEN CHAT */
window.openChat = async function() {

  const other = document.getElementById("toUser").value.trim();
  if (!other) return;

  currentChatId = getChatId(me, other);

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"private",
      participants:[me,other],
      messages:[],
      created:Date.now()
    });
  }

  await markSeen(currentChatId);
  loadMessages();
};

/* GLOBAL CHAT */
window.openGlobalChat = async function() {
  currentChatId = "GLOBAL_CHAT";

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"global",
      participants:["GLOBAL"],
      messages:[],
      created:Date.now()
    });
  }

  await markSeen(currentChatId);
  loadMessages();
};

/* CREATE GROUP */
window.createGroupChat = async function(){

  const name =
    document.getElementById("groupName")
    .value
    .trim();

  if(!name){
    alert("Enter group name");
    return;
  }

  let users =
    document.getElementById("groupUsers")
    .value
    .split(",")
    .map(u=>u.trim())
    .filter(Boolean);

  if(!users.includes(me)){
    users.push(me);
  }

  const groupId =
    "group_" + Date.now();

  await setDoc(
    doc(db,"chats",groupId),
    {
      type:"group",
      name,
      participants:users,
      messages:[],
      created:Date.now()
    }
  );

  currentChatId = groupId;
await markSeen(groupId);
loadMessages();
alert("Group created.");
};

/* OPEN GROUP LIST */
window.openGroupList = async function(){

  const box =
    document.getElementById("groupList");

  box.style.display =
    box.style.display==="block"
      ? "none"
      : "block";

  if(box.style.display==="none"){
    return;
  }

  box.innerHTML = "Loading...";

  const snap =
    await getDocs(collection(db,"chats"));

  box.innerHTML = "";

  snap.forEach(chat=>{

    const data = chat.data();

    if(data.type!=="group"){
      return;
    }

    if(
      !data.participants ||
      !data.participants.includes(me)
    ){
      return;
    }

    const btn =
      document.createElement("button");

    btn.textContent =
      "👥 " + data.name;

    btn.onclick = async () => {
  currentChatId = chat.id;
  await markSeen(chat.id);
  loadMessages();
};

    box.appendChild(btn);
    box.appendChild(document.createElement("br"));
  });
};

/* SEND MESSAGE (WITH MEDIA) */
window.sendMsg = async function(){

  if(!currentChatId){
    alert("Open a chat first.");
    return;
  }

  const text =
    document.getElementById("msgInput")
    .value
    .trim();

  const file =
    document.getElementById("fileInput")
    .files[0];

  let mediaURL = null;
  let mediaType = null;

  if(file){

    const storageRef =
      ref(
        storage,
        `chatUploads/${currentChatId}/${Date.now()}_${file.name}`
      );

    await uploadBytes(
      storageRef,
      file
    );

    mediaURL =
      await getDownloadURL(storageRef);

    mediaType =
      file.type;
  }

  if(!text && !mediaURL){
    return;
  }

  const chatRef =
    doc(db,"chats",currentChatId);

  await updateDoc(chatRef,{
    messages:arrayUnion({
      from:me,
      text:text || "",
      media:mediaURL,
      mediaType,
      time:Date.now()
    }),
    updated:Date.now()
  });

  document.getElementById("msgInput").value="";
  document.getElementById("fileInput").value="";

  loadMessages();
};
/* LOAD MESSAGES */
async function loadMessages(){

  if(!currentChatId){
    return;
  }

  const chatRef =
    doc(db,"chats",currentChatId);

  const snap =
    await getDoc(chatRef);

  const box =
    document.getElementById("messages");

  const wasNearBottom =
    box.scrollHeight -
    box.scrollTop -
    box.clientHeight < 50;

  box.innerHTML = "";

  const data =
    snap.data();

  if(!data){
    return;
  }

  const messages =
    data.messages || [];

  messages.forEach(m=>{

    const div =
      document.createElement("div");

    div.className =
      "msg " +
      (m.from===me
        ? "me"
        : "other");

    let mediaHTML = "";

    if(m.media){

      if(
        m.mediaType &&
        m.mediaType.startsWith("image/")
      ){

        mediaHTML =
          `<img src="${m.media}">`;

      }else if(
        m.mediaType &&
        m.mediaType.startsWith("video/")
      ){

        mediaHTML =
          `
          <video controls width="250">
            <source src="${m.media}">
          </video>
          `;

      }else if(
        m.mediaType &&
        m.mediaType.startsWith("audio/")
      ){

        mediaHTML =
          `
          <audio controls>
            <source src="${m.media}">
          </audio>
          `;

      }else{

        mediaHTML =
          `
          <a href="${m.media}" target="_blank">
            📎 Download File
          </a>
          `;
      }
    }

    div.innerHTML = `
      <b>${m.from}:</b>
      <div>${m.text || ""}</div>
      ${mediaHTML}
      <div style="font-size:11px;opacity:.7;">
        ${new Date(m.time).toLocaleString()}
      </div>
    `;

    box.appendChild(div);
  });

  if(wasNearBottom){
    box.scrollTop =
      box.scrollHeight;
  }
}

setInterval(loadMessages, 2000);

</script>

</body>
</html>
