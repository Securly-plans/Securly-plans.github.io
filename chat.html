<script type="module">

import {
  doc,
  getDoc,
  setDoc,
  updateDoc,
  arrayUnion,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");

let currentChatId = null;

/* ================= CHAT ID ================= */
function getChatId(a,b){
  return [a,b].sort().join("_");
}

/* ================= PRIVATE CHAT ================= */
window.openChat = async function() {

  const other = document.getElementById("toUser").value.trim();
  if (!other) return;

  currentChatId = getChatId(me, other);

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"private",
      participants:[me,other],
      messages:[],
      created:Date.now()
    });
  }

  loadMessages();
};

/* ================= GLOBAL CHAT ================= */
window.openGlobalChat = async function() {

  currentChatId = "GLOBAL_CHAT";

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    await setDoc(ref,{
      type:"global",
      participants:["GLOBAL"],
      messages:[],
      created:Date.now()
    });
  }

  loadMessages();
};

/* ================= LOAD MESSAGES (WITH TIMESTAMPS) ================= */
async function loadMessages(){

  if (!currentChatId) return;

  const ref = doc(db,"chats",currentChatId);
  const snap = await getDoc(ref);

  const box = document.getElementById("messages");
  box.innerHTML = "";

  const data = snap.data();
  if (!data) return;

  data.messages.forEach(m=>{

    const div = document.createElement("div");
    div.className = "msg " + (m.from===me ? "me" : "other");

    // ⏱ FORMAT TIMESTAMP
    let timeText = "";

    if (m.time) {
      const date = new Date(m.time);
      timeText = date.toLocaleString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    div.innerHTML = `
      <b>${m.from || "Unknown"}:</b>
      ${m.text || ""}
      <span style="float:right; font-size:11px; opacity:0.6;">
        ${timeText}
      </span>
    `;

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

/* ================= SEND MESSAGE ================= */
window.sendMsg = async function(){

  const text = document.getElementById("msgInput").value;
  if (!text || !currentChatId) return;

  const ref = doc(db,"chats",currentChatId);

  await updateDoc(ref,{
    messages: arrayUnion({
      from: me,
      text,
      time: Date.now()
    }),
    updated: Date.now()
  });

  document.getElementById("msgInput").value = "";
  loadMessages();
};

/* ================= AUTO REFRESH ================= */
setInterval(loadMessages,2000);

</script>
