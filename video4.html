<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iridium Video Chat</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 20px; }
        .hidden { display: none; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-top: 15px; }
        .video-tile { background: #222; border-radius: 8px; padding: 10px; text-align: center; position: relative; }
        video { width: 100%; border-radius: 4px; background: #000; }
        .controls { margin: 15px 0; }
        button { padding: 10px 15px; margin-right: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Iridium Video Chat</h1>
    <p>Status: <span id="status">Ready</span></p>

    <!-- Call Setup Section -->
    <div id="setup-section">
        <h3>Start a Group Call</h3>
        <button onclick="startCall()">Start New Call</button>
        <p><strong>Call ID:</strong> <span id="call-id-display">None</span></p>

        <h3>Join Existing Call</h3>
        <input type="text" id="call-id-input" placeholder="Enter Call ID">
        <button onclick="joinCall()">Join Call</button>
    </div>

    <!-- Active Live Video Session -->
    <div id="active-call-section" class="hidden">
        <h2>Live Video Session (<span id="participant-count">0</span> people)</h2>
        
        <!-- FIXED: Added explicit container for participants to resolve innerHTML crash -->
        <div id="participants-list" class="video-grid">
            <div class="video-tile" id="local-stream-container">
                <p>You (Local)</p>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
        </div>

        <div class="controls">
            <button id="mic-btn" onclick="toggleMic()">🎤 Mic</button>
            <button id="cam-btn" onclick="toggleCam()">📷 Camera</button>
            <button id="leave-btn" onclick="leaveCall()" style="background:#ff3333; color:white;">Leave Call</button>
        </div>
    </div>

    <!-- Scripts (Ensuring execution after DOM elements load) -->
    <script>
        // Global variables for WebRTC & App State
        let localStream = null;
        let peerConnections = {};
        let currentCallId = null;

        // Mock configuration or Firestore hook setup
        // Assumes your global firebase-config.js and session.js populate necessary drivers
        
        async function initLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const localVideo = document.getElementById('local-video');
                if (localVideo) localVideo.srcObject = localStream;
            } catch (err) {
                console.error("Error accessing media devices:", err);
            }
        }

        async function startCall() {
            console.log("Starting call...");
            await initLocalStream();
            
            // Logic mimicking your Firestore call room creation
            currentCallId = "ROOM_" + Math.random().toString(36).substring(2, 9).toUpperCase();
            
            const idDisplay = document.getElementById('call-id-display');
            if (idDisplay) idDisplay.innerText = currentCallId;

            // Transition UI view
            enterCall();

            // Setup real-time listener simulating Firestore updates
            simulateParticipantStream();
        }

        async function joinCall() {
            const inputId = document.getElementById('call-id-input')?.value.trim();
            if (!inputId) {
                alert("Please enter a valid Call ID.");
                return;
            }
            currentCallId = inputId;
            await initLocalStream();
            enterCall();
        }

        function enterCall() {
            document.getElementById('setup-section')?.classList.add('hidden');
            document.getElementById('active-call-section')?.classList.remove('hidden');
            
            // Initial call to populate UI safely
            updateParticipants([]);
        }

        // FIXED: Complete rewrite of updateParticipants with deep defensive null-guards
        function updateParticipants(participants) {
            console.log("Updating participants UI...", participants);
            
            // 1. Safe lookup for the list container
            const listContainer = document.getElementById('participants-list');
            // 2. Safe lookup for the counter indicator
            const countDisplay = document.getElementById('participant-count');

            // Defensive block: update counter only if the element actually exists
            if (countDisplay) {
                countDisplay.innerHTML = participants.length.toString();
            }

            // Defensive block: manipulate container only if it exists in the DOM
            if (!listContainer) {
                console.error("Critical UI Error: 'participants-list' element was not found in the HTML DOM structure.");
                return; // Guard statement prevents 'Cannot set properties of null' crash
            }

            // Clear dynamic elements, keeping local video safe if desired
            // In this version, we clear everything except our local container anchor
            const localTile = document.getElementById('local-stream-container');
            listContainer.innerHTML = ''; 
            
            if (localTile) {
                listContainer.appendChild(localTile);
            }

            // Loop and build out peer participants safely
            participants.forEach(participant => {
                const tile = document.createElement('div');
                tile.className = 'video-tile';
                tile.id = `peer-${participant.id}`;
                
                const label = document.createElement('p');
                label.innerText = participant.name || 'Remote User';
                
                const videoEl = document.createElement('video');
                videoEl.autoplay = true;
                videoEl.playsinline = true;
                // videoEl.srcObject = participant.stream; // Map WebRTC stream here when ready
                
                tile.appendChild(label);
                tile.appendChild(videoEl);
                listContainer.appendChild(tile);
            });
        }

        function leaveCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('setup-section')?.classList.remove('hidden');
            document.getElementById('active-call-section')?.classList.add('hidden');
            currentCallId = null;
        }

        function toggleMic() { /* Toggle audio track state */ }
        function toggleCam() { /* Toggle video track state */ }

        // Simulation helper for debugging real-time changes safely
        function simulateParticipantStream() {
            setTimeout(() => {
                const mockParticipants = [
                    { id: 'user123', name: 'Wmonroe01 (Remote)' }
                ];
                updateParticipants(mockParticipants);
            }, 2000);
        }
    </script>
</body>
</html>
