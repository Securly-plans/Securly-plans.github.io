<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chat Moderator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f4f4;
}

header{
    background:#c40000;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    display:flex;
    height:calc(100vh - 60px);
}

.sidebar{
    width:300px;
    background:white;
    border-right:1px solid #ddd;
    overflow-y:auto;
}

.chat-list{
    padding:10px;
}

.chat-item{
    padding:12px;
    margin-bottom:5px;
    background:#eee;
    border-radius:8px;
    cursor:pointer;
}

.chat-item:hover{
    background:#ddd;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.tools{
    background:white;
    padding:10px;
    border-bottom:1px solid #ddd;
    display:flex;
    gap:10px;
}

.tools input{
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.message{
    background:white;
    margin-bottom:10px;
    padding:10px;
    border-radius:8px;
    border-left:4px solid #c40000;
}

.meta{
    color:#777;
    font-size:12px;
    margin-bottom:5px;
}

.actions{
    margin-top:8px;
}

.actions button{
    margin-right:5px;
}

.server-box{
    background:white;
    padding:10px;
    border-top:1px solid #ddd;
    display:flex;
    gap:10px;
}

.server-box input{
    flex:1;
    padding:10px;
}

button{
    cursor:pointer;
}
</style>
</head>
<body>

<header>
<h2>Chat Moderator Panel</h2>
</header>

<div class="container">

<div class="sidebar">
<div class="chat-list" id="chatList"></div>
</div>

<div class="main">

<div class="tools">
<input id="userSearch" placeholder="Search username">
<input id="msgSearch" placeholder="Search message">
</div>

<div class="messages" id="messages"></div>

<div class="server-box">
<input id="serverMessage" placeholder="Send server announcement">
<button id="sendServer">Send</button>
</div>

</div>
</div>

<script type="module">

import { db } from "./js/firebase.js";

import {
collection,
getDocs,
doc,
getDoc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const chatList = document.getElementById("chatList");
const messagesDiv = document.getElementById("messages");

let currentChat = null;
let currentMessages = [];

async function loadChats(){

    chatList.innerHTML = "";

    const snap = await getDocs(collection(db,"chats"));

    snap.forEach(docSnap=>{

        const div = document.createElement("div");
        div.className = "chat-item";
        div.textContent = docSnap.id;

        div.onclick = ()=>loadChat(docSnap.id);

        chatList.appendChild(div);

    });

}

async function loadChat(chatId){

    currentChat = chatId;

    const ref = doc(db,"chats",chatId);
    const snap = await getDoc(ref);

    if(!snap.exists()) return;

    const data = snap.data();

    currentMessages = data.messages || [];

    renderMessages();

}

function renderMessages(){

    const userFilter =
        document.getElementById("userSearch")
        .value
        .toLowerCase();

    const msgFilter =
        document.getElementById("msgSearch")
        .value
        .toLowerCase();

    messagesDiv.innerHTML = "";

    currentMessages.forEach((msg,index)=>{

        if(
            userFilter &&
            !msg.from.toLowerCase().includes(userFilter)
        ) return;

        if(
            msgFilter &&
            !msg.text.toLowerCase().includes(msgFilter)
        ) return;

        const div = document.createElement("div");
        div.className = "message";

        const date = new Date(msg.time);

        div.innerHTML = `
        <div class="meta">
            <b>${msg.from}</b><br>
            ${date.toLocaleString()}
        </div>

        <div>${msg.text}</div>

        <div class="actions">
            <button onclick="editMsg(${index})">
                Edit
            </button>

            <button onclick="deleteMsg(${index})">
                Delete
            </button>
        </div>
        `;

        messagesDiv.appendChild(div);

    });

}

window.editMsg = async function(index){

    const newText = prompt(
        "Edit message",
        currentMessages[index].text
    );

    if(newText === null) return;

    currentMessages[index].text = newText;

    await saveMessages();

}

window.deleteMsg = async function(index){

    if(!confirm("Delete this message?")) return;

    currentMessages.splice(index,1);

    await saveMessages();

}

async function saveMessages(){

    const ref = doc(db,"chats",currentChat);

    await updateDoc(ref,{
        messages: currentMessages
    });

    renderMessages();

}

document
.getElementById("sendServer")
.onclick = async ()=>{

    if(!currentChat){
        alert("Select a chat first.");
        return;
    }

    const text =
        document
        .getElementById("serverMessage")
        .value
        .trim();

    if(!text) return;

    currentMessages.push({
        from:"Server",
        text:text,
        time:Date.now()
    });

    await saveMessages();

    document
    .getElementById("serverMessage")
    .value = "";

};

document
.getElementById("userSearch")
.addEventListener("input",renderMessages);

document
.getElementById("msgSearch")
.addEventListener("input",renderMessages);

loadChats();

setInterval(()=>{
    if(currentChat){
        loadChat(currentChat);
    }
},3000);

</script>

</body>
</html>
