<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Monitor</title>

<style>
body{
  font-family:Arial;
  padding:20px;
  background:#f4f4f4;
}

h1{
  text-align:center;
  color:#d10000;
}

.box{
  background:white;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.chat{
  background:#eee;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
}

.message{
  padding:6px;
  border-bottom:1px solid #ccc;
}

button{
  padding:6px;
  margin:4px;
  cursor:pointer;
}

small{
  color:gray;
}
</style>
</head>

<body>

<h1>Chat Moderator Panel</h1>

<div class="box">
  <button onclick="loadChats()">Refresh Chats</button>
  <div id="chatList"></div>
</div>

<script type="module">

import {
  collection,
  getDocs,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= LOAD CHATS ================= */
window.loadChats = async function(){

  const box = document.getElementById("chatList");
  box.innerHTML = "Loading chats...";

  const snap = await getDocs(collection(db,"chats"));

  box.innerHTML = "";

  if (snap.empty){
    box.innerHTML = "No chats found";
    return;
  }

  snap.forEach(d => {

    const div = document.createElement("div");
    div.className = "chat";

    div.innerHTML = `
      <b>Chat ID:</b> ${d.id}<br>

      <button onclick="toggleChat('${d.id}', this)">
        ▼ View Messages
      </button>

      <div id="chat-${d.id}" style="display:none;margin-top:10px;"></div>
    `;

    box.appendChild(div);
  });
};

/* ================= TOGGLE CHAT ================= */
window.toggleChat = async function(chatId, btn){

  const box = document.getElementById("chat-" + chatId);

  if (box.style.display === "block"){
    box.style.display = "none";
    btn.innerText = "▼ View Messages";
    return;
  }

  box.style.display = "block";
  btn.innerText = "▲ Hide Messages";

  box.innerHTML = "Loading messages...";

  const ref = doc(db, "chats", chatId);
  const snap = await getDoc(ref);

  if (!snap.exists()){
    box.innerHTML = "Chat not found";
    return;
  }

  const data = snap.data();
  const messages = data.messages || [];

  box.innerHTML = "";

  if (messages.length === 0){
    box.innerHTML = "<i>No messages</i>";
    return;
  }

  messages.forEach((msg, index) => {

    const time = msg.time
      ? new Date(msg.time).toLocaleString()
      : "Unknown";

    const row = document.createElement("div");
    row.className = "message";

    row.innerHTML = `
      <b>${msg.from || "Unknown"}:</b> ${msg.text || ""}<br>
      <small>${time}</small><br>

      <button onclick="editMessage('${chatId}', ${index})">
        Edit
      </button>

      <button onclick="deleteMessage('${chatId}', ${index})"
        style="background:red;color:white;">
        Delete
      </button>
    `;

    box.appendChild(row);
  });
};

/* ================= EDIT MESSAGE ================= */
window.editMessage = async function(chatId, index){

  const ref = doc(db, "chats", chatId);
  const snap = await getDoc(ref);

  const data = snap.data();
  const messages = data.messages || [];

  const oldText = messages[index]?.text || "";
  const newText = prompt("Edit message:", oldText);

  if (!newText) return;

  messages[index].text = newText;

  await updateDoc(ref, {
    messages: messages
  });

  loadChats();
};

/* ================= DELETE MESSAGE ================= */
window.deleteMessage = async function(chatId, index){

  if(!confirm("Delete message?")) return;

  const ref = doc(db, "chats", chatId);
  const snap = await getDoc(ref);

  const data = snap.data();
  const messages = data.messages || [];

  messages.splice(index, 1);

  await updateDoc(ref, {
    messages: messages
  });

  loadChats();
};

/* ================= INIT ================= */
window.addEventListener("DOMContentLoaded", loadChats);

</script>

</body>
</html>
