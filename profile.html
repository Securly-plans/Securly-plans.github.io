<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<script type="module" src="./js/session.js"></script>

<style>
:root{
  --bg:#0f1115;
  --panel:#1a1d24;
  --panel2:#222630;
  --border:#2e3440;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --primary:#4ade80;
  --primaryHover:#22c55e;
  --danger:#ef4444;
  --dangerHover:#dc2626;
  --info:#3b82f6;
  --warning:#f59e0b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:#111827;
  border-bottom:1px solid var(--border);
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.header h1{
  margin:0;
  color:var(--primary);
  font-size:28px;
}

.header .status{
  color:var(--muted);
  font-size:14px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.grid{
  display:grid;
  grid-template-columns:350px 1fr;
  gap:20px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

.card h2,
.card h3{
  margin-top:0;
}

.profile-top{
  text-align:center;
}

.avatar{
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid var(--primary);
  margin-bottom:15px;
  background:#111827;
}

.username{
  font-size:26px;
  font-weight:bold;
}

.role-badge{
  display:inline-block;
  margin-top:10px;
  padding:6px 14px;
  border-radius:999px;
  background:#111827;
  border:1px solid var(--border);
  color:var(--primary);
  font-size:14px;
}

.status-badge{
  margin-top:12px;
  display:inline-block;
  padding:6px 14px;
  border-radius:999px;
  font-size:13px;
  background:#1f2937;
}

.info-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.info-row:last-child{
  border-bottom:none;
}

.label{
  color:var(--muted);
}

.bio-box{
  background:#111827;
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
  line-height:1.5;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#111827;
  color:white;
  font-size:15px;
}

textarea{
  resize:vertical;
  min-height:90px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  transition:0.2s;
}

button:hover{
  opacity:0.92;
}

.btn-primary{
  background:var(--primary);
  color:black;
}

.btn-primary:hover{
  background:var(--primaryHover);
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-danger:hover{
  background:var(--dangerHover);
}

.badges{
  margin-top:10px;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  margin:4px;
  background:var(--info);
  font-size:13px;
}

.friend-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.friend{
  background:#111827;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.friend button{
  width:auto;
  padding:8px 12px;
  background:var(--danger);
  color:white;
}

.section-title{
  margin-bottom:15px;
  color:var(--primary);
}

.toast-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
}

.toast{
  padding:12px 16px;
  border-radius:10px;
  margin-bottom:10px;
  color:white;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

.toast.info{
  background:#2563eb;
}

@media(max-width:900px){

  .grid{
    grid-template-columns:1fr;
  }

  .container{
    padding:15px;
  }

}
</style>
</head>

<body>

<div class="header">
  <h1>My Profile</h1>

  <div class="status">
    Iridium User Panel
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="container">

  <div class="grid">

    <!-- LEFT -->
    <div>

      <div class="card profile-top">

        <img
          id="avatar"
          class="avatar"
          src="https://via.placeholder.com/140"
        >

        <div
          class="username"
          id="username"
        >
          Loading...
        </div>

        <div
          class="role-badge"
          id="role"
        >
          user
        </div>

        <div
          class="status-badge"
          id="statusDisplay"
        >
          Offline
        </div>

        <div class="badges" id="badgesContainer"></div>

      </div>

      <div class="card">

        <h3 class="section-title">
          Account Information
        </h3>

        <div class="info-row">
          <span class="label">Joined</span>
          <span id="joinedDate">Loading...</span>
        </div>

        <div class="info-row">
          <span class="label">Friends</span>
          <span id="friendCount">0</span>
        </div>

      </div>

      <div class="card">

        <h3 class="section-title">
          Bio
        </h3>

        <div
          class="bio-box"
          id="bioDisplay"
        >
          No bio set.
        </div>

      </div>

    </div>

    <!-- RIGHT -->
    <div>

      <div class="card">

        <h2 class="section-title">
          Edit Profile
        </h2>

        <textarea
          id="bioInput"
          maxlength="120"
          placeholder="Write your bio..."
        ></textarea>

        <button
          id="saveBioBtn"
          class="btn-primary"
        >
          Save Bio
        </button>

        <br><br>

        <input
          id="avatarInput"
          placeholder="Profile image URL"
        >

        <button
          id="saveAvatarBtn"
          class="btn-primary"
        >
          Update Avatar
        </button>

        <br><br>

        <select id="statusSelect">
          <option>Online</option>
          <option>Away</option>
          <option>Busy</option>
          <option>Offline</option>
        </select>

        <button
          id="saveStatusBtn"
          class="btn-primary"
        >
          Update Status
        </button>

      </div>

      <div class="card">

        <h2 class="section-title">
          Security
        </h2>

        <input
          id="newPass"
          type="password"
          placeholder="New password"
        >

        <button
          id="saveBtn"
          class="btn-primary"
        >
          Change Password
        </button>

        <br><br>

        <input
          id="newUsername"
          type="text"
          placeholder="New username"
        >

        <button
          id="saveUserBtn"
          class="btn-primary"
        >
          Change Username
        </button>

      </div>

      <div class="card">

        <h2 class="section-title">
          Friends
        </h2>

        <input
          id="friendUser"
          placeholder="Username to add"
        >

        <button
          id="addFriendBtn"
          class="btn-primary"
        >
          Add Friend
        </button>

        <br><br>

        <div
          class="friend-list"
          id="friendList"
        >
          No friends yet.
        </div>

      </div>

      <div class="card">

        <button
          id="logoutBtn"
          class="btn-danger"
        >
          Log Out
        </button>

      </div>

    </div>

  </div>

</div>

<script type="module">

import {
  collection,
  query,
  where,
  getDocs,
  updateDoc,
  doc,
  arrayUnion
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db }
from "./js/firebase.js";

const usernameLS =
  localStorage.getItem("username");

if(!usernameLS){
  window.location = "index.html";
}

let docId = null;
let currentUser = null;

/* TOAST */
function toast(msg,type="info"){

  const box =
    document.getElementById("toastContainer");

  const div =
    document.createElement("div");

  div.className =
    "toast " + type;

  div.textContent = msg;

  box.appendChild(div);

  setTimeout(()=>{
    div.remove();
  },3000);

}

/* HASH */
async function hashPassword(password){

  const enc =
    new TextEncoder();

  const buf =
    await crypto.subtle.digest(
      "SHA-256",
      enc.encode(password)
    );

  return Array
    .from(new Uint8Array(buf))
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");

}

/* LOAD PROFILE */
async function load(){

  const q =
    query(
      collection(db,"users"),
      where("username","==",usernameLS)
    );

  const snap =
    await getDocs(q);

  if(snap.empty){

    toast("User not found","error");

    return;
  }

  const d =
    snap.docs[0];

  docId = d.id;

  currentUser =
    d.data();

  document.getElementById(
    "username"
  ).innerText =
    currentUser.username;

  document.getElementById(
    "role"
  ).innerText =
    currentUser.role || "user";

  document.getElementById(
    "bioDisplay"
  ).innerText =
    currentUser.bio || "No bio set.";

  document.getElementById(
    "friendCount"
  ).innerText =
    currentUser.friends?.length || 0;

  document.getElementById(
    "avatar"
  ).src =
    currentUser.photoURL ||
    "https://via.placeholder.com/140";

  document.getElementById(
    "statusDisplay"
  ).innerText =
    currentUser.status || "Offline";

  document.getElementById(
    "joinedDate"
  ).innerText =
    currentUser.created
      ? new Date(
          currentUser.created
        ).toLocaleDateString()
      : "Unknown";

  /* BADGES */
  const badges =
    document.getElementById(
      "badgesContainer"
    );

  badges.innerHTML = "";

  (currentUser.badges || [])
  .forEach(badge=>{

    const div =
      document.createElement("div");

    div.className =
      "badge";

    div.textContent =
      badge;

    badges.appendChild(div);

  });

  /* FRIENDS */
  const list =
    document.getElementById(
      "friendList"
    );

  list.innerHTML = "";

  if(currentUser.friends?.length){

    currentUser.friends
    .forEach(friend=>{

      const div =
        document.createElement("div");

      div.className =
        "friend";

      div.innerHTML = `
        <span>${friend}</span>

        <button onclick="removeFriend('${friend}')">
          Remove
        </button>
      `;

      list.appendChild(div);

    });

  }else{

    list.innerHTML =
      "<div style='color:var(--muted)'>No friends yet.</div>";

  }

}

/* REMOVE FRIEND */
window.removeFriend =
async function(friend){

  const updated =
    currentUser.friends
    .filter(f=>f!==friend);

  await updateDoc(
    doc(db,"users",docId),
    {
      friends: updated
    }
  );

  toast("Friend removed","info");

  load();

};

/* SAVE BIO */
document.getElementById(
  "saveBioBtn"
).onclick =
async ()=>{

  const bio =
    document
    .getElementById("bioInput")
    .value
    .trim();

  await updateDoc(
    doc(db,"users",docId),
    {
      bio
    }
  );

  toast("Bio updated","success");

  load();

};

/* AVATAR */
document.getElementById(
  "saveAvatarBtn"
).onclick =
async ()=>{

  const photoURL =
    document
    .getElementById("avatarInput")
    .value
    .trim();

  if(!photoURL){
    return toast(
      "Enter image URL",
      "error"
    );
  }

  await updateDoc(
    doc(db,"users",docId),
    {
      photoURL
    }
  );

  toast(
    "Avatar updated",
    "success"
  );

  load();

};

/* STATUS */
document.getElementById(
  "saveStatusBtn"
).onclick =
async ()=>{

  const status =
    document
    .getElementById("statusSelect")
    .value;

  await updateDoc(
    doc(db,"users",docId),
    {
      status
    }
  );

  toast(
    "Status updated",
    "success"
  );

  load();

};

/* PASSWORD */
document.getElementById(
  "saveBtn"
).onclick =
async ()=>{

  const pass =
    document
    .getElementById("newPass")
    .value;

  if(!pass){

    return toast(
      "Enter password",
      "error"
    );

  }

  const passwordHash =
    await hashPassword(pass);

  await updateDoc(
    doc(db,"users",docId),
    {
      passwordHash
    }
  );

  document.getElementById(
    "newPass"
  ).value = "";

  toast(
    "Password updated",
    "success"
  );

};

/* USERNAME */
document.getElementById(
  "saveUserBtn"
).onclick =
async ()=>{

  const val =
    document
    .getElementById("newUsername")
    .value
    .trim();

  if(!val){

    return toast(
      "Enter username",
      "error"
    );

  }

  await updateDoc(
    doc(db,"users",docId),
    {
      username: val
    }
  );

  localStorage.setItem(
    "username",
    val
  );

  toast(
    "Username updated",
    "success"
  );

  setTimeout(()=>{
    location.reload();
  },1000);

};

/* FRIEND */
document.getElementById(
  "addFriendBtn"
).onclick =
async ()=>{

  const friend =
    document
    .getElementById("friendUser")
    .value
    .trim();

  if(!friend){

    return toast(
      "Enter username",
      "error"
    );

  }

  await updateDoc(
    doc(db,"users",docId),
    {
      friends: arrayUnion(friend)
    }
  );

  document.getElementById(
    "friendUser"
  ).value = "";

  toast(
    "Friend added",
    "success"
  );

  load();

};

/* LOGOUT */
document.getElementById(
  "logoutBtn"
).onclick = ()=>{

  localStorage.clear();

  window.location =
    "index.html";

};

load();

</script>

</body>
</html>
