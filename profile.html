<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Profile</title>
</head>
<body>

<h1>Profile</h1>
<p>Username: <span id="username"></span></p>
<p>Role: <span id="role"></span></p>

<input id="newPass" placeholder="New password" type="password">
<button id="saveBtn">Update Password</button>

<br><br>

<input id="newUsername" placeholder="New username">
<button id="saveUserBtn">Update Username</button>

<button id="logoutBtn">Logout</button>

<script type="module">
import {
  collection, query, where, getDocs, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const usernameLS = localStorage.getItem("username");

if (!usernameLS) window.location = "index.html";

let docId;

async function load() {

  const q = query(collection(db, "users"), where("username", "==", usernameLS));
  const snap = await getDocs(q);

  const d = snap.docs[0];
  docId = d.id;

  document.getElementById("username").innerText = d.data().username;
  document.getElementById("role").innerText = d.data().role;
}

document.getElementById("saveUserBtn").onclick = async () => {
  const val = document.getElementById("newUsername").value;

  await updateDoc(doc(db, "users", docId), {
    username: val
  });

  localStorage.setItem("username", val);
  location.reload();
};

document.getElementById("logoutBtn").onclick = () => {
  localStorage.clear();
  window.location = "index.html";
};

load();
</script>

</body>
</html>
