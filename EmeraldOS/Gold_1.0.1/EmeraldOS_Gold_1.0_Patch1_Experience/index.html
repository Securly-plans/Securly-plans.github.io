<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EmeraldOS Gold 1.0 Patch 1 Login</title><link rel="stylesheet" href="gold10.css"><link rel="stylesheet" href="gold10-patch1.css"><style>body{display:grid;place-items:center;background:linear-gradient(135deg,#eaf3fb,#f9fbfd)!important}.login{width:min(440px,92vw);background:rgba(255,255,255,.96);border:1px solid #d3dde8;box-shadow:var(--shadow);padding:24px;color:#111827}.login h1{font-weight:400;margin-top:0}.login input{width:100%;padding:12px;margin:8px 0;background:#fff;border:1px solid #aebdca;color:#111827}.login button{width:100%;margin-top:8px}</style></head><body><div class="login"><div class="boot-logo">G10</div><h1>EmeraldOS Gold 1.0 Patch 1</h1><p class="muted">Independent Gold workspace with a lighter Windows 10-inspired experience.</p><input id="user" placeholder="Username"><input id="pass" placeholder="Password" type="password"><button class="btn primary" onclick="login()">Sign in</button><button class="btn" onclick="location.href='register.html'">Create local profile</button><button class="btn" onclick="location.href='bios.html'">BIOS / DOS</button></div><script>function login(){const u=document.getElementById('user').value||'GoldUser';localStorage.setItem('username',u);localStorage.setItem('loggedIn','true');location.href='loading.html';}</script></body></html>
