<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Starting EmeraldOS Gold 8.0</title><link rel="icon" href="emerald-gold-80-logo.svg" type="image/svg+xml"><style>body{margin:0;height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#0b5c96 50%,#0f7b4d);font-family:'Segoe UI',Arial,sans-serif;color:#111827}.box{text-align:center;width:min(720px,92vw);background:rgba(255,255,255,.92);border:1px solid #d6e2ee;box-shadow:0 24px 70px rgba(15,23,42,.32);padding:36px}.logo{width:96px;height:96px;margin:auto;border-radius:22px;background:linear-gradient(135deg,#fff7c2,#f6c343,#0078d4,#0f7b4d);display:grid;place-items:center;font-size:56px;font-weight:900;color:#0f172a}.bar{height:7px;background:#dbe6f2;border-radius:20px;overflow:hidden;margin:24px 0}.bar span{display:block;height:100%;width:40%;background:#0078d4;animation:run 1.25s infinite}@keyframes run{from{transform:translateX(-120%)}to{transform:translateX(260%)}}.hint{color:#607086}.btn{padding:10px 14px;border:1px solid #b7c8db;background:white;color:#111827;margin:4px}.primary{background:#0078d4;border-color:#0078d4;color:white}.kbd{font-family:Consolas,monospace;background:#eef3f8;border:1px solid #d6e2ee;padding:2px 6px}</style></head><body><div class="box"><div class="logo">G</div><h1>EmeraldOS Gold 8.0</h1><p id="msg">Starting cloud virtual machine services...</p><div class="bar"><span></span></div><p class="hint"><span class="kbd">F12</span> Emerald BIOS A6 / Emerald DOS · <span class="kbd">F9</span> Staff Edition · <span class="kbd">F1</span> Support</p><button class="btn" onclick="openBIOS()">BIOS / DOS</button><button class="btn" onclick="openStaff()">Staff Edition</button><button class="btn" onclick="location.href='register.html'">Register</button><button class="btn primary" onclick="continueBoot()">Continue</button></div><script>function isLoggedIn(){return localStorage.getItem('loggedIn')==='true'||localStorage.getItem('gold80_loggedIn')==='true'}function continueBoot(){location.href=isLoggedIn()?'OS.html':'index.html'}function openBIOS(){clearTimeout(bootTimer);location.href='bios.html'}function openStaff(){clearTimeout(bootTimer);location.href='staff.html'}const bootTimer=setTimeout(()=>{document.getElementById('msg').textContent=isLoggedIn()?'Restoring your Gold cloud VM...':'Opening EmeraldOS Gold login...';setTimeout(continueBoot,350)},1600);window.addEventListener('keydown',e=>{if(e.key==='F12'){e.preventDefault();openBIOS()}if(e.key==='F9'){e.preventDefault();openStaff()}if(e.key==='F1'){e.preventDefault();location.href='OS.html#support'}if(e.key==='Enter'){e.preventDefault();continueBoot()}});</script></body></html>
