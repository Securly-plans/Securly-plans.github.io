<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Gold Staff Edition</title>
<link rel="icon" type="image/svg+xml" href="emerald-gold-60-logo.svg">
<style>
:root{--accent:#0078d4;--gold:#c99616;--bg:#edf5ff;--panel:#fff;--panel2:#f4f7fb;--text:#111827;--muted:#64748b;--border:#d1dbe8;--shadow:0 22px 55px rgba(0,0,0,.2);font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dbeeff,#fff8dc,#e5fff3);color:var(--text)}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(1160px,96vw);background:rgba(255,255,255,.93);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.top{padding:22px;background:linear-gradient(135deg,#0f172a,#0f5f8f,#0f7b4d);color:white;display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,#fff6cd,#d69e1d,#0f7b4d);display:grid;place-items:center;font-weight:900;font-size:34px}.content{padding:22px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.field{width:100%;padding:11px;border:1px solid var(--border);border-radius:6px;margin:5px 0 12px;font:inherit}.btn{padding:9px 14px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font:inherit}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{background:#fee2e2;color:#991b1b}.btn.gold{background:linear-gradient(135deg,#d69e1d,#0f7b4d);border:0;color:white}.panel{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin:10px 0}.muted{color:var(--muted);line-height:1.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.ticket{background:white;border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0}.status{min-height:26px;margin-top:10px}.err{color:#b91c1c}.ok{color:#047857}.kbd{font-family:Consolas,monospace;background:#eaf0f7;border:1px solid var(--border);border-radius:5px;padding:2px 6px}.split{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:white;border:1px solid var(--border);border-radius:10px;padding:14px}@media(max-width:880px){.grid,.split{grid-template-columns:1fr}}
.remote-live-screen{height:360px;border:1px solid var(--border);background:linear-gradient(135deg,#dbeafe,#fff,#dcfce7);display:flex;flex-direction:column;overflow:hidden}.remote-live-desktop{flex:1;padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-content:flex-start}.remote-live-icon{width:74px;text-align:center;font-size:11px}.remote-live-icon img{width:42px;height:42px;display:block;margin:0 auto 5px}.remote-live-window{width:210px;height:82px;background:rgba(255,255,255,.92);border:1px solid var(--border);box-shadow:0 8px 20px rgba(15,23,42,.14);padding:10px}.remote-live-window.active{outline:3px solid rgba(0,120,212,.35)}.remote-live-window small{display:block;color:var(--muted);margin-top:8px}.remote-live-taskbar{height:34px;background:#f8fafc;border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;padding:0 10px}.remote-live-taskbar b{background:#0078d4;color:#fff;padding:4px 9px}</style>
</head>
<body>
<div class="shell"><div class="card"><div class="top"><div class="logo">G</div><div><h1>EmeraldOS Gold Staff Edition</h1><p>Gold 6.0 staff login, ticket review, live remote desktop control, diagnostics, and administrative controls.</p></div></div><div class="content" id="app"></div></div></div>
<script type="module">
const PREFIX='gold60_';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}};
const write=(k,v)=>{localStorage.setItem(k,JSON.stringify(v));return v};
const now=()=>new Date().toISOString();
async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
let fb=null;try{fb=await import('./firebase.js')}catch(e){console.warn('Firebase unavailable',e)}
const allowedRoles=['admin','administrator','moderator','mod','operator','staff','executive','owner','network administrator'];
function session(){const s=read(PREFIX+'staff_session',null);return s&&s.verified&&!s.preview&&isStaffRole(s)?s:null}
function tickets(){return read(PREFIX+'tickets',[])}function saveTickets(t){write(PREFIX+'tickets',t)}
function remoteSessions(){return read(PREFIX+'remote_sessions',[])}function saveRemoteSessions(v){write(PREFIX+'remote_sessions',v)}
async function syncRemoteSession(session){if(fb?.setDoc&&fb?.doc&&fb?.db){try{await fb.setDoc(fb.doc(fb.db,'emeraldOSGoldRemoteSessions',session.id),session)}catch(e){console.warn('remote session sync failed',e)}}}
function activeRemoteSessions(){const ts=Date.now();return remoteSessions().filter(s=>s.status==='active'&&s.controlGranted&&(!s.expiresAt||new Date(s.expiresAt).getTime()>ts))}
async function loadCloudRemoteSessions(){if(!fb?.getDocs||!fb?.collection||!fb?.db){alert('Firebase is not available on this page.');return}try{const snap=await fb.getDocs(fb.collection(fb.db,'emeraldOSGoldRemoteSessions'));const merged=[...remoteSessions()];snap.forEach(d=>{const x={id:d.id,...d.data()};const i=merged.findIndex(r=>r.id===x.id);if(i>=0)merged[i]={...merged[i],...x};else merged.unshift(x)});saveRemoteSessions(merged);addNotification('Remote sessions refreshed','Loaded remote sessions from Firestore.');dashboard()}catch(e){alert('Could not load cloud remote sessions. Check Firestore rules. '+e.message)}}
async function refreshCloudRemoteSessionsQuiet(){
  if(!fb?.getDocs||!fb?.collection||!fb?.db) return;
  try{
    const snap=await fb.getDocs(fb.collection(fb.db,'emeraldOSGoldRemoteSessions'));
    const merged=[...remoteSessions()];
    snap.forEach(d=>{const x={id:d.id,...d.data()};const i=merged.findIndex(r=>r.id===x.id);if(i>=0)merged[i]={...merged[i],...x};else merged.unshift(x)});
    saveRemoteSessions(merged);
  }catch(e){console.warn('quiet remote refresh failed',e)}
}
function remoteSnapshot(id){return read(PREFIX+'remote_snapshot_'+id,null)||remoteSessions().find(r=>r.id===id)?.snapshot||null}
function liveDesktopHTML(id){const snap=remoteSnapshot(id);if(!snap)return `<h2>Live Remote Desktop</h2><p class="muted">No live desktop snapshot has arrived yet. Ask the user to keep Gold open while remote control is active, then refresh cloud sessions.</p><button class="btn" onclick="loadCloudRemoteSessions()">Refresh Cloud Sessions</button>`;return `<h2>Direct Live Remote Desktop</h2><p class="muted">${esc(snap.user)} · ${esc(snap.build)} · updated ${new Date(snap.updatedAt).toLocaleTimeString()} · live control enabled</p><div class="remote-live-screen"><div class="remote-live-desktop">${(snap.desktop||[]).slice(0,12).map(a=>`<div class="remote-live-icon"><img src="${esc(a.logo)}"><span>${esc(a.name)}</span></div>`).join('')}${(snap.windows||[]).map(w=>`<div class="remote-live-window ${w.active?'active':''}"><b>${esc(w.title)}</b><small>${w.maximized?'Maximized':w.minimized?'Minimized':'Open'}</small></div>`).join('')}</div><div class="remote-live-taskbar"><b>Gold</b><span>${(snap.windows||[]).length} windows</span><span>${snap.mailUnread||0} unread mail</span><span>${snap.ticketCount||0} tickets</span></div></div><div class="toolbar"><button class="btn" onclick="sendRemoteCommand('${id}','openApp',{app:'support'})">Open Support</button><button class="btn" onclick="sendRemoteCommand('${id}','openApp',{app:'settings'})">Open Settings</button><button class="btn" onclick="sendRemoteCommand('${id}','openApp',{app:'explorer'})">Open Explorer</button><button class="btn" onclick="sendRemoteCommand('${id}','openApp',{app:'office'})">Open Office</button><button class="btn" onclick="sendRemoteCommand('${id}','tile')">Tile</button><button class="btn" onclick="sendRemoteCommand('${id}','cascade')">Cascade</button><button class="btn" onclick="sendRemoteCommand('${id}','closeAll')">Close All</button><button class="btn" onclick="sendStaffMessage('${id}')">Send Message</button><button class="btn danger" onclick="sendRemoteCommand('${id}','end')">End Control</button></div><h3>Open windows</h3>${(snap.windows||[]).map(w=>`<div class="ticket"><b>${esc(w.title)}</b><p class="muted">${esc(w.id)} · ${w.active?'Active · ':''}${w.minimized?'Minimized':w.maximized?'Maximized':'Open'}</p></div>`).join('')||'<p class="muted">No open windows.</p>'}`}
function viewRemoteDesktop(id){app.innerHTML=liveDesktopHTML(id)+`<div class="toolbar"><button class="btn" onclick="dashboard()">Back to Staff Dashboard</button><button class="btn" onclick="loadCloudRemoteSessions()">Refresh Cloud</button></div>`;let tick=setInterval(async()=>{if(!document.body.contains(app)||!app.textContent.includes('Remote Desktop')){clearInterval(tick);return}await refreshCloudRemoteSessionsQuiet();app.innerHTML=liveDesktopHTML(id)+`<div class="toolbar"><button class="btn" onclick="dashboard()">Back to Staff Dashboard</button><button class="btn" onclick="loadCloudRemoteSessions()">Refresh Cloud</button></div>`},1200)}
async function sendRemoteCommand(sessionId,type,args={}){const cmd={id:crypto.randomUUID?.()||String(Date.now()),type,args,from:session()?.username||'Staff',time:now()};write(PREFIX+'remote_commands_'+sessionId,[cmd,...read(PREFIX+'remote_commands_'+sessionId,[])]);let sessions=remoteSessions();let r=sessions.find(x=>x.id===sessionId)||{id:sessionId,user:'Unknown',status:'active',controlGranted:true,createdAt:now()};r.lastCommand=cmd;r.updatedAt=now();saveRemoteSessions([r,...sessions.filter(x=>x.id!==sessionId)]);await syncRemoteSession(r);addNotification('Remote command sent',type+' sent to session '+sessionId);dashboard()}
function remoteCard(r){return `<div class="ticket"><h3>${esc(r.user||'Unknown user')} <span class="muted">${esc(r.status)}</span></h3><p class="muted">Session ${esc(r.id)} · expires ${r.expiresAt?new Date(r.expiresAt).toLocaleString():'No expiry'}</p><div class="toolbar"><button class="btn primary" onclick="viewRemoteDesktop('${r.id}')">View Live Desktop</button><button class="btn" onclick="sendRemoteCommand('${r.id}','openApp',{app:'support'})">Open Support</button><button class="btn" onclick="sendRemoteCommand('${r.id}','openApp',{app:'settings'})">Open Settings</button><button class="btn" onclick="sendRemoteCommand('${r.id}','openApp',{app:'explorer'})">Open Explorer</button><button class="btn" onclick="sendRemoteCommand('${r.id}','openApp',{app:'office'})">Open Office</button><button class="btn" onclick="sendRemoteCommand('${r.id}','tile')">Tile Windows</button><button class="btn" onclick="sendRemoteCommand('${r.id}','cascade')">Cascade</button><button class="btn" onclick="sendRemoteCommand('${r.id}','saveWorkspace')">Save Workspace</button><button class="btn" onclick="sendStaffMessage('${r.id}')">Send Message</button><button class="btn danger" onclick="sendRemoteCommand('${r.id}','end')">End Control</button></div></div>`}
function sendStaffMessage(id){const body=prompt('Message to the user');if(body)sendRemoteCommand(id,'notify',{title:'Staff message',body})}
function notifications(){return read(PREFIX+'notifications',[])}function addNotification(title,body){write(PREFIX+'notifications',[{id:crypto.randomUUID?.()||String(Date.now()),title,body,app:'Gold Staff Edition',time:now(),read:false},...notifications()])}
function roleOf(x){return String(x.role||x.role2||x.position||x.clearance||'').toLowerCase().trim()}
function isStaffRole(x){const r=roleOf(x);return x.isAdmin===true||x.admin===true||allowedRoles.includes(r)||allowedRoles.some(a=>r.includes(a))}
function matchHash(x,h,plain){return x.passwordHash===h||x.mailPasswordHash===h||x.emeraldMailPasswordHash===h||x.password===plain}
async function getDocSafe(col,id){try{const snap=await fb.getDoc(fb.doc(fb.db,col,id));return snap.exists()?{id:snap.id,data:snap.data()}:null}catch(e){console.warn(col,'direct lookup failed',e);return null}}
async function scanCollection(col,predicate){try{const q=await fb.getDocs(fb.collection(fb.db,col));let found=null;q.forEach(d=>{const x=d.data();if(!found&&predicate(x,d.id))found={id:d.id,data:x}});return found}catch(e){console.warn(col,'scan failed',e);throw e}}
async function findEmeraldUser(username,hash,plain){
  if(!fb?.db||!fb?.getDoc) throw new Error('Firebase module did not load.');
  const uname=username.toLowerCase().trim();
  for(const id of [username,uname,username.trim()]){const found=await getDocSafe('users',id);if(found){const x=found.data;if(String(x.username||found.id).toLowerCase()===uname&&matchHash(x,hash,plain)&&!x.locked)return found}}
  return await scanCollection('users',(x,id)=>String(x.username||id).toLowerCase()===uname&&matchHash(x,hash,plain)&&!x.locked);
}
async function findMail(email,hash,plain){
  if(!fb?.db||!fb?.getDoc) throw new Error('Firebase module did not load.');
  const mail=email.toLowerCase().trim(); const user=mail.split('@')[0];
  for(const id of [mail,email,user,mail.replaceAll('/','_')]){const found=await getDocSafe('EmeraldMail',id);if(found){const x=found.data;const candidate=String(x.email||x.address||x.mail||found.id).toLowerCase();if((candidate===mail||String(x.username||'').toLowerCase()===user)&&matchHash(x,hash,plain))return found}}
  return await scanCollection('EmeraldMail',(x,id)=>{const candidate=String(x.email||x.address||x.mail||id).toLowerCase();return (candidate===mail||String(x.username||'').toLowerCase()===user)&&matchHash(x,hash,plain)});
}
function render(){const s=session();if(s?.verified)return dashboard();login()}
function login(){app.innerHTML=`<div class="grid"><section><h2>Staff Login</h2><p class="muted">Use your EmeraldOS login and Emerald Mail account. Gold 6.0 includes role detection, support resources, reports, remote-control command delivery, direct document lookup, and collection scan.</p><label>EmeraldOS username<input id="u" class="field" autocomplete="username" placeholder="EmeraldOS username"></label><label>EmeraldOS password<input id="p" class="field" type="password" autocomplete="current-password"></label><label>Emerald Mail address<input id="m" class="field" placeholder="name@mail.monroecorp.org"></label><label>Emerald Mail password<input id="mp" class="field" type="password"></label><div class="toolbar"><button class="btn primary" id="loginBtn">Login</button><button class="btn" id="sessionBtn">Use current OS session</button><button class="btn" onclick="location.href='index.html'">Normal Login</button><button class="btn" onclick="location.href='OS.html'">Back to Gold</button></div><p id="status" class="status muted"></p></section><section><h2>Staff Edition 6.0</h2><div class="panel"><b>Login fixes</b><p>Accepts Administrator/Operator-style roles, direct Firestore document IDs, and Emerald Mail records stored by email or username.</p></div><div class="panel"><b>Support review</b><p>View, reply to, and resolve Support Center tickets.</p></div><div class="panel"><b>Remote assistance</b><p>Visible support actions, diagnostics requests, broadcasts, and workspace export. No silent destructive actions are included.</p></div><div class="panel"><b>Required access</b><p>EmeraldOS account must have a staff role and the Emerald Mail password must verify.</p></div></section></div>`;document.getElementById('loginBtn').onclick=verifyLogin;document.getElementById('sessionBtn').onclick=useCurrentSession}
async function verifyLogin(){const status=document.getElementById('status');status.className='status muted';status.textContent='Checking EmeraldOS and Emerald Mail credentials...';const username=document.getElementById('u').value.trim();const pass=document.getElementById('p').value;const mail=document.getElementById('m').value.trim().toLowerCase();const mailPass=document.getElementById('mp').value;if(!username||!pass||!mail||!mailPass){status.className='status err';status.textContent='Enter EmeraldOS username/password and Emerald Mail address/password.';return}try{const h=await sha256(pass), mh=await sha256(mailPass);const u=await findEmeraldUser(username,h,pass);if(!u){status.className='status err';status.textContent='EmeraldOS account not found, password did not match, or account is locked.';return}if(!isStaffRole(u.data)){status.className='status err';status.textContent='EmeraldOS account verified, but the role is not staff/admin/mod/operator/executive/owner.';return}const m=await findMail(mail,mh,mailPass);if(!m){status.className='status err';status.textContent='Emerald Mail account was not found or password did not match.';return}write(PREFIX+'staff_session',{verified:true,username:String(u.data.username||username),mail,role:roleOf(u.data)||'staff',userId:u.id,mailId:m.id,time:now()});addNotification('Staff login','Gold Staff Edition login successful.');status.className='status ok';status.textContent='Login successful. Opening Staff Dashboard...';setTimeout(render,350)}catch(e){console.error(e);status.className='status err';status.textContent='Firebase verification failed. Check Firestore rules for users and EmeraldMail.'}}
async function useCurrentSession(){const status=document.getElementById('status');const username=localStorage.getItem('username')||localStorage.getItem(PREFIX+'username');const role=String(localStorage.getItem('role')||localStorage.getItem('role2')||localStorage.getItem(PREFIX+'role')||'').toLowerCase();if(!username||!(localStorage.getItem('loggedIn')==='true'||localStorage.getItem(PREFIX+'loggedIn')==='true')){status.className='status err';status.textContent='No normal EmeraldOS Gold login session was found. Sign in normally first.';return}if(!(allowedRoles.includes(role)||allowedRoles.some(a=>role.includes(a)))){status.className='status err';status.textContent='Current OS session is not a staff/admin/mod/operator role.';return}write(PREFIX+'staff_session',{verified:true,username,role,sessionOnly:true,time:now()});addNotification('Staff login','Staff Edition opened from current OS session.');render()}
function dashboard(){const s=session(),all=tickets();app.innerHTML=`<h2>Staff Dashboard</h2><p class="muted">Signed in as ${esc(s.username)} · ${esc(s.role)} ${s.sessionOnly?'· OS session mode':''}</p><div class="toolbar"><button class="btn primary" onclick="location.href='OS.html'">Open Gold Desktop</button><button class="btn" onclick="location.href='bios.html'">Open Bell BIOS</button><button class="btn" id="broadcast">Broadcast</button><button class="btn" id="export">Export Tickets</button><button class="btn" onclick="loadCloudRemoteSessions()">Refresh Cloud Remote Sessions</button><button class="btn" onclick="staffResources()">Staff Resources</button><button class="btn" onclick="staffReports()">Reports</button><button class="btn danger" id="logout">Sign out</button></div><div class="split"><div class="metric"><b>Open Tickets</b><p style="font-size:38px;margin:6px 0">${all.filter(t=>t.status!=='Resolved').length}</p></div><div class="metric"><b>Remote Requests</b><p style="font-size:38px;margin:6px 0">${all.filter(t=>t.remote&&t.status!=='Resolved').length}</p></div><div class="metric"><b>Active Control</b><p style="font-size:38px;margin:6px 0">${activeRemoteSessions().length}</p></div><div class="metric"><b>Notifications</b><p style="font-size:38px;margin:6px 0">${notifications().filter(n=>!n.read).length}</p></div></div><div class="grid"><section><div class="panel"><h3>Remote Access Controls</h3><p class="muted">Remote tools are support-focused and visible to users.</p><div class="toolbar"><button class="btn" id="diag">Request diagnostics notification</button><button class="btn" id="save">Save visible staff log</button><button class="btn" onclick="download('gold-staff-session.json',JSON.stringify(session(),null,2))">Export staff session</button></div></div><div class="panel"><h3>Remote Control Sessions</h3><p class="muted">These tools only work after a user requests remote help and grants control. The user sees a banner and can end the session at any time.</p>${activeRemoteSessions().map(remoteCard).join('')||'<p class="muted">No active remote-control sessions on this device. If using separate devices, commands also sync through Firestore when allowed.</p>'}</div><div class="panel"><h3>Staff Notes</h3><textarea id="staffNotes" class="field" rows="7" placeholder="Internal staff notes stored locally on this device.">${esc(read(PREFIX+'staff_notes',''))}</textarea><button class="btn" onclick="localStorage.setItem('${PREFIX}staff_notes',document.getElementById('staffNotes').value);alert('Saved.')">Save Notes</button></div></section><section><h3>Tickets</h3>${all.map(ticketHTML).join('')||'<p class="muted">No tickets.</p>'}</section></div>`;document.getElementById('logout').onclick=()=>{localStorage.removeItem(PREFIX+'staff_session');render()};document.getElementById('broadcast').onclick=()=>{const msg=prompt('Broadcast message');if(msg){addNotification('Staff Broadcast',msg);alert('Broadcast added to notification stream.')}};document.getElementById('export').onclick=()=>download('gold60-tickets.json',JSON.stringify(all,null,2));document.getElementById('diag').onclick=()=>addNotification('Staff diagnostic request','Staff requested diagnostics. Open Support Center and submit a diagnostic ticket.');document.getElementById('save').onclick=()=>{const logs=read(PREFIX+'staff_logs',[]);write(PREFIX+'staff_logs',[{time:now(),staff:s.username,action:'manual staff log',note:'Staff opened dashboard tools.'},...logs]);alert('Staff log added.')}}
function ticketHTML(t){return `<div class="ticket"><h3>${esc(t.title)} <span class="muted">${esc(t.status||'Open')}</span></h3><p>${esc(t.body)}</p><p class="muted">${esc(t.user)} · ${esc(t.category)} · ${esc(t.priority)} · ${t.time?new Date(t.time).toLocaleString():''}</p>${(t.replies||[]).map(r=>`<blockquote><b>${esc(r.from)}:</b> ${esc(r.body)}</blockquote>`).join('')}<div class="toolbar"><button class="btn" onclick="replyTicket('${t.id}')">Reply</button><button class="btn primary" onclick="resolveTicket('${t.id}')">Resolve</button></div></div>`}
window.sendRemoteCommand=sendRemoteCommand;window.sendStaffMessage=sendStaffMessage;window.viewRemoteDesktop=viewRemoteDesktop;window.loadCloudRemoteSessions=loadCloudRemoteSessions;window.replyTicket=id=>{const all=tickets(),t=all.find(x=>x.id===id),body=prompt('Reply to ticket');if(t&&body){t.replies=t.replies||[];t.replies.unshift({from:session()?.username||'Staff',body,time:now()});t.status='Waiting on User';saveTickets(all);addNotification('Staff replied to ticket',t.title);render()}};
window.resolveTicket=id=>{const all=tickets(),t=all.find(x=>x.id===id);if(t){t.status='Resolved';t.resolvedAt=now();saveTickets(all);addNotification('Ticket resolved',t.title);render()}};
window.staffResources=()=>{app.innerHTML=`<h2>Staff Resources</h2><p class="muted">Gold 6.0 staff resources for support, escalation and remote assistance.</p><div class="split"><div class="metric"><b>Remote Policy</b><p>User consent and visible banner required.</p></div><div class="metric"><b>Login Support</b><p>Check Firebase files, users collection, role, and lock status.</p></div><div class="metric"><b>Gold Office</b><p>Collect diagnostics and app/tab details.</p></div><div class="metric"><b>User Appstore</b><p>Verify source and permissions before marking Staff Verified.</p></div></div><div class="toolbar"><button class="btn" onclick="dashboard()">Back</button><button class="btn primary" onclick="staffReports()">Reports</button></div>`};
window.staffReports=()=>{const all=tickets();app.innerHTML=`<h2>Staff Reports</h2><div class="split"><div class="metric"><b>Open</b><p style="font-size:32px">${all.filter(t=>t.status!=='Resolved').length}</p></div><div class="metric"><b>Resolved</b><p style="font-size:32px">${all.filter(t=>t.status==='Resolved').length}</p></div><div class="metric"><b>Remote</b><p style="font-size:32px">${remoteSessions().length}</p></div><div class="metric"><b>Logs</b><p style="font-size:32px">${read(PREFIX+'staff_logs',[]).length}</p></div></div><div class="toolbar"><button class="btn primary" onclick="download('gold60-staff-report.json',JSON.stringify({tickets:all,remote:remoteSessions(),logs:read(PREFIX+'staff_logs',[])},null,2))">Export Report</button><button class="btn" onclick="dashboard()">Back</button></div>`};
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
window.addEventListener('keydown',e=>{if(e.key==='F12'){e.preventDefault();location.href='bios.html'}if(e.key==='Escape'&&session()?.verified){e.preventDefault();location.href='OS.html'}});
render();
setInterval(()=>{ if(session()) refreshCloudRemoteSessionsQuiet(); }, 2500);
</script>
</body>
</html>
