<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldOS 5.7</title>
<link rel="icon" type="image/png" href="assets/logos/system-customizer.png">
<link rel="stylesheet" href="os.css">
</head>
<body>
<div id="desktop" aria-label="EmeraldOS Desktop"></div>

<nav id="start-menu" class="start-menu" aria-label="Start menu">
    <section class="start-rail">EmeraldOS 5.7</section>
    <section class="start-panel">
        <input id="start-search" class="start-search" type="search" placeholder="Search apps..." autocomplete="off">
        <div id="start-apps" class="start-apps"></div>
        <div class="start-footer">
            <button data-os-action="open-app" data-app-id="system-customizer">System Customizer</button>
            <button data-os-action="restart">Restart</button>
        </div>
    </section>
</nav>

<footer id="taskbar">
    <button id="start-btn" class="start-btn" type="button">
        <img src="assets/logos/system-customizer.png" alt="" aria-hidden="true">
        <span>Start</span>
    </button>
    <div id="taskbar-apps" class="taskbar-apps" aria-label="Open apps"></div>
    <button id="notification-btn" class="notification-btn" type="button">Notifications</button>
    <time id="clock" class="clock"></time>
</footer>

<aside id="notification-center" class="notification-center" aria-label="Notification center">
    <header>
        <strong>Notifications</strong>
        <button data-os-action="clear-notifications">Clear</button>
    </header>
    <div id="notification-list"></div>
</aside>

<div id="toast-area" class="toast-area" aria-live="polite"></div>

<script type="module" src="os.js"></script>
</body>
</html>
