<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register EmeraldOS Gold</title><link rel="stylesheet" href="gold12.css"></head><body class="gold12"><div class="setup-overlay"><div class="setup-card"><aside class="setup-side"><div class="gold-logo-xl">G</div><h1>Create Gold Profile</h1></aside><main class="setup-main"><h2>Register</h2><input id="u" class="field" placeholder="Username"><input id="m" class="field" placeholder="Gold Mail address"><input id="p" type="password" class="field" placeholder="Password"><button class="btn primary" onclick="localStorage.setItem('username',document.getElementById('u').value||'GoldUser');localStorage.setItem('gold12_mail_identity',document.getElementById('m').value);localStorage.setItem('loggedIn','true');location.href='loading.html'">Create Local Profile</button><button class="btn" onclick="location.href='index.html'">Back</button></main></div></div></body></html>
