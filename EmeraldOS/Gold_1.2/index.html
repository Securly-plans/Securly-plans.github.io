<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EmeraldOS Gold Login</title><link rel="stylesheet" href="gold12.css"></head><body class="gold12"><div class="setup-overlay"><div class="setup-card"><aside class="setup-side"><div class="gold-logo-xl">G</div><h1>EmeraldOS Gold 1.2</h1><p>Sign in to start your Gold workspace.</p></aside><main class="setup-main"><h2>Login</h2><input id="u" class="field" placeholder="Username" value="GoldUser"><input id="p" class="field" type="password" placeholder="Password"><div class="toolbar"><button class="btn primary" onclick="localStorage.setItem('username',document.getElementById('u').value||'GoldUser');localStorage.setItem('loggedIn','true');location.href='loading.html'">Login</button><button class="btn" onclick="location.href='register.html'">Register</button><button class="btn" onclick="location.href='staff.html'">Staff Edition</button></div><p class="muted">This page uses local sign-in for testing. Connect your existing auth page if needed.</p></main></div></div></body></html>
