<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emerald Systems BIOS A1</title><link rel="icon" type="image/svg+xml" href="emerald-gold-logo.svg"><style>body{margin:0;background:#020617;color:#86efac;font-family:Consolas,'Courier New',monospace}.bios{max-width:980px;margin:0 auto;padding:24px}.box{border:1px solid #22c55e;padding:16px;margin:12px 0;background:#03130b}.title{color:#facc15;font-size:24px}input{background:transparent;color:#86efac;border:0;border-bottom:1px solid #22c55e;font:inherit;outline:0;width:80%}button{background:#052e16;color:#bbf7d0;border:1px solid #22c55e;padding:8px 12px;margin:4px;font:inherit}</style><script>function run(){const i=document.getElementById('cmd'),o=document.getElementById('out'),c=i.value.trim().toUpperCase();i.value='';function p(s){o.textContent+='\nA1> '+c+'\n'+s+'\n'}if(c==='HELP')p('Commands: HELP VER DIR BOOT GOLD STAFF SETUP RESTORE CLEAR TIME MEM EXIT');else if(c==='VER')p('Emerald Systems BIOS A1 / EmeraldOS Gold 1.2');else if(c==='DIR')p('OS.html\nstaff.html\nloading.html\nplans.html\nEmerald DOS');else if(c==='BOOT'||c==='GOLD')location.href='OS.html';else if(c==='STAFF')location.href='staff.html';else if(c==='SETUP'){localStorage.removeItem('gold12_setup_done');location.href='OS.html'}else if(c==='RESTORE')p('Open EmeraldOS Gold and use Restore Center.');else if(c==='CLEAR')o.textContent='Emerald Systems BIOS A1\nEmerald DOS Ready\n';else if(c==='TIME')p(new Date().toString());else if(c==='MEM')p('Browser memory managed by host system. Local storage keys: '+Object.keys(localStorage).length);else if(c==='EXIT')location.href='loading.html';else p('Unknown command. Type HELP.')}addEventListener('DOMContentLoaded',()=>document.getElementById('cmd').focus())</script></head><body><main class="bios"><div class="title">Emerald Systems BIOS A1</div><div>EmeraldOS Gold 1.2 Firmware Interface</div><div class="box"><button onclick="location.href='OS.html'">Boot Gold</button><button onclick="location.href='staff.html'">Staff Edition</button><button onclick="localStorage.removeItem('gold12_setup_done');location.href='OS.html'">Run Setup</button><button onclick="localStorage.clear();location.href='OS.html'">Clear Local Storage</button></div><pre id="out" class="box">Emerald Systems BIOS A1

Type HELP for commands.</pre><div>A1&gt; <input id="cmd" onkeydown="if(event.key==='Enter')run()"></div></main></body></html>
