<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AdminOS Console Alpha+</title>

<style>

:root{
  --win-bg:#008080;
  --win-gray:#c0c0c0;
  --win-dark:#808080;
  --win-light:#ffffff;
  --win-text:#000;
  --terminal-bg:#000000;
  --terminal-green:#00ff88;
}

/* =========================
   BASE PAGE (WIN95 DESKTOP)
========================= */

body {
  margin: 0;
  background: var(--win-bg);
  font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
}

/* =========================
   WINDOW FRAME (MAIN TERMINAL)
========================= */

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;

  /* Win95 window look */
  margin: 20px;
  border: 2px solid var(--win-dark);
  border-top: 2px solid var(--win-light);
  border-left: 2px solid var(--win-light);

  background: var(--win-gray);
}

/* =========================
   TITLE BAR (WIN95 STYLE)
========================= */

#header {
  padding: 6px 10px;

  background: #000080;
  color: white;
  font-size: 12px;
  font-weight: bold;

  border-bottom: 2px solid var(--win-dark);
}

/* =========================
   TERMINAL AREA
========================= */

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;

  background: var(--terminal-bg);
  color: var(--terminal-green);

  font-family: "Courier New", monospace;
  font-size: 13px;

  white-space: pre-wrap;

  border-left: 2px inset var(--win-dark);
  border-right: 2px inset var(--win-dark);
}

/* =========================
   LINE COLORS
========================= */

.line { margin: 2px 0; }

.error { color: #ff4d4d; }
.success { color: var(--terminal-green); }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

/* =========================
   INPUT BAR (WIN95 TASKBAR STYLE)
========================= */

#inputBar {
  display: flex;
  align-items: center;

  padding: 6px;

  background: var(--win-gray);

  border-top: 2px solid var(--win-light);
  border-bottom: 2px solid var(--win-dark);
}

#inputBar div {
  margin-right: 6px;
  font-weight: bold;
}

/* INPUT FIELD */
#cmdInput {
  flex: 1;

  background: #000;
  color: var(--terminal-green);

  border: 2px inset var(--win-dark);

  font-family: "Courier New", monospace;
  font-size: 13px;

  padding: 4px;

  outline: none;
}

/* =========================
   SUGGESTION BOX (WIN95 POPUP)
========================= */

#suggestBox {
  position: absolute;
  bottom: 60px;
  left: 20px;

  background: var(--win-gray);
  border: 2px outset var(--win-light);

  padding: 4px;

  font-size: 12px;

  display: none;
  max-height: 150px;
  overflow-y: auto;

  min-width: 260px;
}

.suggest-item {
  padding: 4px;
  cursor: pointer;

  border: 1px solid transparent;
}

.suggest-item:hover {
  background: #000080;
  color: white;
  border: 1px dotted white;
}

/* =========================
   SCROLLBAR (WIN95 FEEL)
========================= */

#console::-webkit-scrollbar {
  width: 14px;
}

#console::-webkit-scrollbar-track {
  background: var(--win-gray);
}

#console::-webkit-scrollbar-thumb {
  background: var(--win-dark);
  border: 2px outset var(--win-light);
}

/* =========================
   SMALL WIN95 POLISH
========================= */

#header {
  letter-spacing: 0.3px;
}

</style>
</head>

<body>

<div id="wrap">
  <div id="header">AdminOS Console - Copyright 2026, Monroe Enterainment Services. Administrator Access Only. Violators will be prosecuted.</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<div id="suggestBox"></div>

<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  query,
  orderBy,
  limit,
  setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./firebase.js";
import { aiParse, setSmartSuggest, isSmartSuggestEnabled } from "./js/consolesuggest.js";
import { resolveUser } from "./js/converter.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");
const suggestBox = document.getElementById("suggestBox");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= ANNOUNCEMENT SYSTEM (ADDED) ================= */

function setAnnouncement(data) {
  return updateDoc(doc(db, "system", "announcement"), data);
}

function setEmergency(data) {
  return setDoc(
    doc(db, "system", "emergency"),
    data,
    { merge: true }
  );
}

/* ================= COMMAND SUGGESTIONS ================= */

function updateSuggestions(val) {

  const inputVal = val.toLowerCase().trim();

  if (!inputVal) {
    suggestBox.style.display = "none";
    return;
  }

  const matches = Object.keys(commands)
    .filter(cmd => cmd.startsWith(inputVal))
    .slice(0, 8);

  if (!matches.length) {
    suggestBox.style.display = "none";
    return;
  }

  suggestBox.innerHTML = "";

  matches.forEach(cmd => {

    const item = document.createElement("div");

    item.className = "suggest-item";
    item.textContent = "› " + cmd;

    item.onclick = () => {
      input.value = cmd;
      input.focus();
      suggestBox.style.display = "none";
    };
    
    suggestBox.appendChild(item);

  });

  suggestBox.style.display = "block";
}

/* ================= STATE ================= */

let globalLockState = null;
let currentChatId = null;
let currentChatMessages = [];

let consoleAuthenticated = false;
let awaitingConsolePassword = true;

async function authenticateConsole(password) {

  try {

    const snap = await getDoc(
      doc(db, "system", "consoleLogin")
    );

    if (!snap.exists()) {

      print(
        "Console login configuration missing.",
        "error"
      );

      return false;

    }

    const realPassword =
      snap.data()?.consolePassword;

    if (password === realPassword) {

      consoleAuthenticated = true;
      awaitingConsolePassword = false;

      print("--------------------------------");
      print(
        "Console Authentication Successful",
        "success"
      );
      print("--------------------------------");

      return true;

    }

    print(
      "Invalid console password.",
      "error"
    );

    return false;

  } catch (err) {

    print(
      "Authentication error: " +
      err.message,
      "error"
    );

    return false;

  }

}

/* ================= RUNNER ================= */

async function run(inputStr) {

  if (!inputStr || !inputStr.trim()) return;

  /* ================= LOGIN GATE ================= */

  if (!consoleAuthenticated) {
    print("> ****", "warn");

    await authenticateConsole(inputStr);
    return;
  }

  /* ================= OUTPUT INPUT ================= */

  print(
    "> " + (globalLockState ? "****" : inputStr),
    "warn"
  );

  /* ================= GLOBAL LOCK FLOW ================= */

  if (globalLockState) {
    return handleGlobalLockFlow(inputStr);
  }

  /* ================= PARSE INPUT ================= */

  const parts = inputStr.trim().split(" ");
  let cmd = (parts.shift() || "").toLowerCase();
  let args = parts;

  /* ================= DIRECT COMMAND CHECK ================= */

  let fn = commands[cmd];

  /* ================= AI SMART-SUGGEST LAYER ================= */

  if (!fn && isSmartSuggestEnabled()) {

    try {

      const result = await aiParse(inputStr);

      if (result?.cmd && commands[result.cmd]) {

        print("🧠 Smart-Suggest active", "info");
        print("→ mapped to: " + result.cmd, "info");

        if (result.args && Array.isArray(result.args)) {
          args = result.args;
        }

        cmd = result.cmd;
        fn = commands[cmd];

      } else {
        print("AI could not map command", "warn");
      }

    } catch (err) {
      print("Smart-Suggest error: " + err.message, "error");
    }
  }

  /* ================= EXECUTION SAFETY ================= */

  if (!fn) {
    print("Unknown command: " + cmd, "error");
    return;
  }

  /* ================= EXECUTE COMMAND ================= */

  try {
    await fn(args);
  } catch (err) {
    print("ERROR: " + (err?.message || err), "error");
  }
}

/* ================= ANNOUNCEMENT COMMANDS (ADDED ONLY) ================= */

register("announce.set", async (a) => {
  const text = a.join(" ");
  await setAnnouncement({ text, enabled: true });
  print("Announcement updated", "success");
}, "Set announcement text");

register("announce.enable", async () => {
  await setAnnouncement({ enabled: true });
  print("Announcement enabled", "success");
}, "Enable announcement");

register("announce.disable", async () => {
  await setAnnouncement({ enabled: false });
  print("Announcement disabled", "warn");
}, "Disable announcement");

register("announce.color", async (a) => {
  const color = a[0] || "info";

}, "Set announcement color");

register("announce.emergency.set", async (a) => {

  await setEmergency({

  print("Emergency broadcast enabled", "error");

}, "Enable emergency broadcast");

register("announce.emergency.disable", async () => {

  await setEmergency({
    enabled: false,
    text: ""

  print("Emergency broadcast disabled", "success");

}, "Disable emergency broadcast");

register("announce.emergency.view", async () => {

  const snap = await getDoc(doc(db, "system", "emergency"));

  print(JSON.stringify(snap.data(), null, 2), "info");

}, "View emergency broadcast");

/* ================= NOTIFICATIONS (ADDED) ================= */

register("notify.user.push", async (a) => {

  const target = a[0];
  const message = a.slice(1).join(" ");

  if (!target || !message) {
    return print("Usage: notify.user.push [userId/username] [message]", "error");
  }

  const user = await findUser(target);

  if (!user) {
    return print("User not found: " + target, "error");
  }

  await addDoc(collection(db, "notifications"), {
    userId: user.id,
    username: user.username || null,
    title: "Admin Notification",
    body: message,
    read: false,
    timestamp: Date.now()
  });

  print("Notification Sent → " + user.username, "success");

}, "Send push/in-app notification to a user");

/* ================= GLOBAL LOCK ================= */

function startGlobalLock(mode) {
  globalLockState = { mode, password: "", confirmed: false, y: false };

  print("-------------------------------------------");
  print("Enter verification password:");
  print("-------------------------------------------");
}

function clearFlow() {
  globalLockState = null;
  suggestBox.style.display = "none";
}

function handleGlobalLockFlow(inputStr) {
  const state = globalLockState;

  switch(true) {

    case !state.password: {
      state.password = inputStr;

      getDoc(doc(db, "system", "config")).then(snap => {
        const real = snap.data()?.globalLockPassword;

        if (inputStr !== real) {
          print("-------------------------------------------");
          print("Verification Failure, Closing Console.");
          setTimeout(() => window.close(), 1200);
          return;
        }

        state.confirmed = true;

        print("-------------------------------------------");
        print("Verification Confirmed. Are you sure? Y/N");
        print("-------------------------------------------");
      });

      break;
    }

    case state.confirmed && !state.y: {
      const v = inputStr.toLowerCase();

      if (v === "n") {
        print("Command Canceled.");
        clearFlow();
        return;
      }

      if (v === "y") {
        state.y = true;
        print("-------------------------------------------");
        print('Intent Confirmed. Enter "Exe" or "Execute" or "Cancel".');
        print("-------------------------------------------");
      }

      break;
    }

    case state.y: {
      const v = inputStr.toLowerCase();

      if (v === "cancel") {
        print("Command Canceled.");
        clearFlow();
        return;
      }

           if (v === "exe" || v === "execute") {

        print("-------------------------------------------");
        print("Executing Command...");

        setTimeout(async () => {

          try {

            await updateDoc(doc(db, "system", "config"), {
              globalLock: state.mode === "enable",
              loginDisabled: state.mode === "enable",
              chatDisabled: state.mode === "enable",
              adminDisabled: state.mode === "enable"
            });

            print("Command has been executed.", "success");

          } catch (err) {

            print("Execution failed: " + err.message, "error");

          }

          globalLockState = null;

        }, 1200);
      }

      break;
    }
  }
}

/* ================= USERS (UPDATED RESOLVER SYSTEM) ================= */

register("user.list", async () => {
  const snap = await getDocs(collection(db, "users"));

  if (snap.empty) {
    return print("No users found", "warn");
  }

  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username || "no-username"} | ${u.role || "user"} | locked:${u.locked || false}`);
  });

}, "List users");


register("user.delete", async (a) => {

  const user = await resolveUser(a[0]);
  if (!user) return print("User not found", "error");

  await deleteDoc(doc(db, "users", user.id));

  print(`User deleted → ${user.username}`, "success");

}, "Delete user");


register("user.role", async (a) => {

  const user = await resolveUser(a[0]);
  const role = a[1];

  if (!user) return print("User not found", "error");
  if (!role) return print("Usage: user.role [user] [role]", "error");

  await updateDoc(doc(db, "users", user.id), {
    role
  });

  print(`Role updated → ${user.username} = ${role}`, "success");

}, "Change role");


register("user.lock", async (a) => {

  const user = await resolveUser(a[0]);
  if (!user) return print("User not found", "error");

  const reason = a.slice(1).join(" ") || "No reason provided";

  await updateDoc(doc(db, "users", user.id), {
    locked: true,
    lockReason: reason
  });

  print(`User locked → ${user.username}`, "error");

}, "Lock user");


register("user.unlock", async (a) => {

  const user = await resolveUser(a[0]);
  if (!user) return print("User not found", "error");

  await updateDoc(doc(db, "users", user.id), {
    locked: false,
    lockReason: ""
  });

  print(`User unlocked → ${user.username}`, "success");

}, "Unlock user");


register("user.info", async (a) => {

  const user = await resolveUser(a[0]);
  if (!user) return print("User not found", "error");

  print("=== USER INFO ===", "info");
  print("ID: " + user.id);
  print("Username: " + (user.username || "none"));
  print("Role: " + (user.role || "user"));
  print("Locked: " + (user.locked || false));
  print("Reason: " + (user.lockReason || "none"));

}, "View user info");


register("user.notify", async (a) => {

  const user = await resolveUser(a[0]);
  const message = a.slice(1).join(" ");

  if (!user) return print("User not found", "error");
  if (!message) return print("Usage: user.notify [user] [message]", "error");

  await addDoc(collection(db, "notifications"), {
    userId: user.id,
    username: user.username || null,
    title: "Admin Message",

    read: false,
    timestamp: Date.now()
  });

}, "Send notification to user");
/* ================= PAGE COMMANDS ================= */

/**
 * Safety helper (optional but recommended)
 * Prevents obvious javascript: / data: injection in redirects
 */
function sanitizeUrl(url) {
  try {
    const parsed = new URL(url, window.location.origin);

    // block dangerous protocols
    if (!["http:", "https:", "file:"].includes(parsed.protocol)) {
      return null;
    }

    return parsed.href;
  } catch {
    return null;
  }
}

/* PAGE REDIRECT */
register("page.redirect", async (a) => {
  const url = a.join(" ").trim();

  if (!url) {
    return print("Usage: page.redirect [url]", "error");
  }

  const safe = sanitizeUrl(url);

  if (!safe) {
    return print("Invalid or unsafe URL blocked", "error");
  }

  print("Redirecting to: " + safe, "info");

  setTimeout(() => {
    window.location.href = safe;
  }, 500);

}, "Redirect browser to a URL");

/* PAGE OPEN (new tab) */
register("page.open", async (a) => {
  const url = a.join(" ").trim();

  if (!url) {
    return print("Usage: page.open [url]", "error");
  }

  const safe = sanitizeUrl(url);

  if (!safe) {
    return print("Invalid or unsafe URL blocked", "error");
  }

  window.open(safe, "_blank", "noopener,noreferrer");

  print("Opened in new tab: " + safe, "success");

}, "Open URL in new tab");

register("page.info", async () => {

/* ================= CHAT COMMANDS ================= */

/* LIST CHATS */

register("chat.list", async () => {

  const snap = await getDocs(
    collection(db, "chats")
  );

  print("=== CHATS ===", "info");

  if (snap.empty) {
    print("No chats found", "warn");
    return;
  }

  snap.forEach(chat => {
    print(chat.id);
  });

  await writeDebugLog(
    "chat.list",
    "Viewed chat list"
  );

}, "List all chats");

/* OPEN CHAT */

register("chat.view", async (a) => {

  const chatId = a.join(" ");

  if (!chatId) {
    print(
      "Usage: chat.view [chatId]",
      "error"
    );
    return;
  }

  const snap = await getDoc(
    doc(db, "chats", chatId)
  );

  if (!snap.exists()) {
    print(
      "Chat not found",
      "error"
    );
    return;
  }

  currentChatId = chatId;

  currentChatMessages =
    snap.data().messages || [];

  print(
    "=== CHAT: " + chatId + " ===",
    "info"
  );

  if (!currentChatMessages.length) {
    print(
      "No messages",
      "warn"
    );
  }

  currentChatMessages.forEach(
    (msg, index) => {

      print(
        "[" + index + "] "
        + (msg.from || "Unknown")
        + ": "
        + (msg.text || "")
      );

    }
  );

  await writeDebugLog(
    "chat.view",
    chatId
  );

}, "Open chat");

/* DELETE MESSAGE */

register("chat.delete", async (a) => {

  if (!currentChatId) {
    print(
      "Open a chat first",
      "error"
    );
    return;
  }

  const index =
    parseInt(a[0]);

  if (
    isNaN(index) ||
    !currentChatMessages[index]
  ) {
    print(
      "Invalid message number",
      "error"
    );
    return;
  }

  const removed =
    currentChatMessages[index];

  currentChatMessages.splice(
    index,
    1
  );

  await updateDoc(
    doc(db, "chats", currentChatId),
    {
      messages:
        currentChatMessages
    }
  );

  await writeDebugLog(
    "chat.delete",
    currentChatId +
    " #" +
    index +
    " " +
    (removed.text || "")
  );

  print(
    "Message deleted",
    "success"
  );

}, "Delete message");

/* CLEAR CHAT */

register("chat.clear", async () => {

  if (!currentChatId) {
    print(
      "Open a chat first",
      "error"
    );
    return;
  }

  await updateDoc(
    doc(db, "chats", currentChatId),
    {
      messages: []
    }
  );

  currentChatMessages = [];

  await writeDebugLog(
    "chat.clear",
    currentChatId
  );

  print(
    "Chat cleared",
    "success"
  );

}, "Clear chat");

/* EXPORT CHAT */

register("chat.export", async () => {

  if (!currentChatId) {
    print(
      "Open a chat first",
      "error"
    );
    return;
  }

  const blob = new Blob(
    [
      JSON.stringify(
        currentChatMessages,
        null,
        2
      )
    ],
    {
      type:
      "application/json"
    }
  );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    currentChatId +
    ".json";

  link.click();

  await writeDebugLog(
    "chat.export",
    currentChatId
  );

  print(
    "Export complete",
    "success"
  );

}, "Export chat");

/* SERVER MESSAGE */

register("chat.server", async (a) => {

  if (!currentChatId) {
    print(
      "Open a chat first",
      "error"
    );
    return;
  }

  const text =
    a.join(" ");

  if (!text) {
    print(
      "Usage: chat.server [message]",
      "error"
    );
    return;
  }

  currentChatMessages.push({

    from: "Server",
    text: text,
    time: Date.now(),

    media: null,
    mediaType: null

  });

  await updateDoc(
    doc(db, "chats", currentChatId),
    {
      messages:
        currentChatMessages
    }
  );

  await writeDebugLog(
    "chat.server",
    currentChatId +
    " | " +
    text
  );

  print(
    "Server message sent",
    "success"
  );

}, "Send server message");

/* ================= DEBUG LOG ================= */

async function writeDebugLog(action, details = "") {

  try {

    await addDoc(
      collection(db, "debugLogs"),
      {
        action,
        details,
        admin:
          localStorage.getItem("username")
          || "Unknown",
        timestamp: Date.now()
      }
    );

  } catch (err) {

    console.error(
      "Debug Log Error:",
      err
    );

  }

}

/* VIEW LOGS */

register(
  "debug.log",
  async () => {

    const q = query(
      collection(
        db,
        "debugLogs"
      ),
      orderBy(
        "timestamp",
        "desc"
      ),
      limit(50)
    );

    const snap =
      await getDocs(q);

    if (snap.empty) {

      print(
        "No logs found",
        "warn"
      );

      return;
    }

    print(
      "=== LAST 50 LOGS ===",
      "info"
    );

    snap.forEach(docSnap => {

      const log =
        docSnap.data();

      print(
        "[" +
        new Date(
          log.timestamp
        ).toLocaleString() +
        "] "
        +
        log.admin +
        " -> " +
        log.action +
        (
          log.details
            ? " | " +
              log.details
            : ""
        )
      );

    });

  },
  "View debug logs"
);

/* CLEAR LOGS */

register(
  "debug.log.clear",
  async () => {

    const snap =
      await getDocs(
        collection(
          db,
          "debugLogs"
        )
      );

    if (snap.empty) {

      print(
        "No logs found",
        "warn"
      );

      return;
    }

    let count = 0;

    for (const d of snap.docs) {

      await deleteDoc(
        doc(
          db,
          "debugLogs",
          d.id
        )
      );

      count++;

    }

    print(
      "Deleted " +
      count +
      " logs",
      "success"
    );

  },
  "Clear debug logs"
);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
    suggestBox.style.display = "none";
  }
});

input.addEventListener("input", (e) => {
  updateSuggestions(e.target.value);
});
