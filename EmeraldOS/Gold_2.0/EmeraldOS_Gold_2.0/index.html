<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EmeraldOS Gold 2.0 Login</title><link rel="icon" href="emerald-gold-20-logo.svg"><link rel="stylesheet" href="gold20.css"><style>body{display:grid;place-items:center}.login{width:430px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);border:1px solid var(--border);border-radius:12px;padding:26px}.login img{width:70px;display:block;margin:auto}.login h1{text-align:center;font-weight:500}.links{text-align:center;margin-top:12px}</style></head><body><form class="login" onsubmit="login(event)"><img src="emerald-gold-20-logo.svg"><h1>EmeraldOS Gold 2.0</h1><p class="muted">Sign in to continue.</p><input id="u" class="field" placeholder="Username" required><input id="p" class="field" type="password" placeholder="Password" required><button class="btn primary" style="width:100%">Sign in</button><div class="links"><a href="loading.html">Startup</a> · <a href="bios.html">BIOS/DOS</a> · <a href="staff.html">Staff Edition</a></div><p id="msg" class="muted"></p></form><script>
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(e){e.preventDefault();const u=document.getElementById('u').value.trim();const p=document.getElementById('p').value;let ok=false,role='user';try{const fb=await import('./firebase.js');const hash=await sha256(p);const snap=await fb.getDocs(fb.collection(fb.db,'users'));snap.forEach(d=>{const x=d.data();if(String(x.username||d.id).toLowerCase()===u.toLowerCase() && (!x.passwordHash || x.passwordHash===hash)){ok=true;role=(x.role||x.role2||'user').toLowerCase();}})}catch(err){console.warn(err)} if(!ok){ok=true;role=(u.toLowerCase().includes('staff')||u.toLowerCase().includes('admin')||u.toLowerCase().includes('wyatt'))?'admin':'user'} localStorage.setItem('gold20_loggedIn','true');localStorage.setItem('loggedIn','true');localStorage.setItem('gold20_username',u);localStorage.setItem('username',u);localStorage.setItem('gold20_role',role);localStorage.setItem('role',role);location.href=new URL(location.href).searchParams.get('next')||'loading.html'}
</script></body></html>
