<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starting EmeraldOS Gold 2.0</title><link rel="stylesheet" href="gold20.css"><style>body{display:grid;place-items:center}.card{width:520px;text-align:center}</style></head><body><div class="card"><img src="emerald-gold-20-logo.svg" style="width:90px"><h1>EmeraldOS Gold 2.0</h1><p>Starting. Press F12 for BIOS/DOS, F9 for Staff Edition, or F1 for Support.</p><div class="boot-progress"><span></span></div></div><script>let dest=(localStorage.getItem('gold20_loggedIn')==='true'||localStorage.getItem('loggedIn')==='true')?'OS.html':'index.html';window.addEventListener('keydown',e=>{if(e.key==='F12'){e.preventDefault();location.href='bios.html'}if(e.key==='F9'){e.preventDefault();location.href='staff.html'}if(e.key==='F1'){e.preventDefault();localStorage.setItem('gold20_open_on_boot','support');location.href=dest}});setTimeout(()=>location.href=dest,1700);</script></body></html>
