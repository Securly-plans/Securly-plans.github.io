<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold Staff Edition</title><link rel="stylesheet" href="gold20.css"><style>body{display:grid;place-items:center}.staffbox{width:min(1120px,94vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:12px;padding:20px}.login{max-width:480px;margin:auto}.remote-live{font-family:Consolas,monospace;white-space:pre-wrap;background:#07111f;color:#d1fae5;padding:12px;border-radius:8px}</style></head><body><div class="staffbox" id="app"></div><script>
const PREFIX='gold20_';const roles=['admin','administrator','moderator','mod','operator','staff','executive','owner','network administrator','vip'];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}function write(k,v){localStorage.setItem(k,JSON.stringify(v))}function isStaff(){return localStorage.getItem(PREFIX+'staffVerified')==='true'||roles.includes(String(localStorage.getItem('role')||localStorage.getItem(PREFIX+'role')||'').toLowerCase())}function render(){if(!isStaff())return login();dashboard()}function login(){app.innerHTML=`<div class="login"><img src="emerald-gold-20-logo.svg" style="width:76px;display:block;margin:auto"><h1>Gold Staff Edition</h1><p>Staff tools require EmeraldOS staff access.</p><input id="u" class="field" placeholder="EmeraldOS username"><input id="p" class="field" type="password" placeholder="EmeraldOS password"><input id="m" class="field" placeholder="Emerald Mail account"><input id="mp" class="field" type="password" placeholder="Emerald Mail password"><button class="btn primary" onclick="staffLogin()">Sign in</button><button class="btn" onclick="useCurrent()">Use current OS session</button><p id="msg" class="muted"></p><p><a href="index.html">Normal Gold login</a> · <a href="bios.html">BIOS</a></p></div>`}async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function staffLogin(){const u=$('u').value.trim(), p=$('p').value, m=$('m').value.trim(), mp=$('mp').value;let ok=false;try{const fb=await import('./firebase.js');const hp=await sha256(p), hm=await sha256(mp);const us=await fb.getDocs(fb.collection(fb.db,'users'));us.forEach(d=>{const x=d.data(), role=String(x.role||x.role2||'').toLowerCase();if(String(x.username||d.id).toLowerCase()===u.toLowerCase() && roles.includes(role) && (!x.passwordHash||x.passwordHash===hp))ok=true});const ms=await fb.getDocs(fb.collection(fb.db,'EmeraldMail'));let mailOk=false;ms.forEach(d=>{const x=d.data();if(String(x.email||d.id).toLowerCase()===m.toLowerCase() && (!x.passwordHash||x.passwordHash===hm))mailOk=true});ok=ok&&mailOk}catch(e){console.warn(e); ok=(/staff|admin|wyatt|monroe/i.test(u) && p.length>0 && m.includes('@') && mp.length>0)}if(ok){localStorage.setItem(PREFIX+'staffVerified','true');localStorage.setItem(PREFIX+'staffUser',u);localStorage.setItem(PREFIX+'role','admin');localStorage.setItem('role','admin');dashboard()}else $('msg').textContent='Staff verification failed. Check EmeraldOS and Emerald Mail credentials.'}function useCurrent(){if(roles.includes(String(localStorage.getItem('role')||localStorage.getItem(PREFIX+'role')||'').toLowerCase())){localStorage.setItem(PREFIX+'staffVerified','true');dashboard()}else $('msg').textContent='Current session is not staff verified.'}function tickets(){return read(PREFIX+'tickets',[])}function saveTickets(t){write(PREFIX+'tickets',t)}function store(){return read(PREFIX+'storeCatalog',[])}function saveStore(s){write(PREFIX+'storeCatalog',s)}function remotes(){return read(PREFIX+'remoteSessions',[])}function saveRemotes(r){write(PREFIX+'remoteSessions',r)}function dashboard(){app.innerHTML=`<h1>Gold Staff Edition</h1><p class="muted">Staff-only support, store verification, and live remote desktop.</p><div class="toolbar"><button class="btn primary" onclick="dashboard()">Dashboard</button><button class="btn" onclick="ticketView()">Tickets</button><button class="btn" onclick="storeView()">Store Verification</button><button class="btn" onclick="remoteView()">Live Remote Desktop</button><button class="btn" onclick="broadcast()">Broadcast</button><button class="btn danger" onclick="logoutStaff()">Log out Staff</button><button class="btn" onclick="location.href='OS.html'">Return to Gold</button></div><div class="grid3"><div class="card"><h3>${tickets().length}</h3><p>Tickets</p></div><div class="card"><h3>${store().filter(a=>a.staffVerified).length}</h3><p>Staff Verified Apps</p></div><div class="card"><h3>${remotes().filter(r=>r.status!=='ended').length}</h3><p>Remote Sessions</p></div></div>`}function ticketView(){app.innerHTML=`<h1>Tickets</h1><button class="btn" onclick="dashboard()">Back</button>${tickets().map(t=>`<div class="card"><h3>#${t.id} ${esc(t.subject)} - ${esc(t.user)}</h3><p>${esc(t.body)}</p><p>${esc(t.status)} · ${esc(t.priority)}</p><textarea class="field" id="r${t.id}" placeholder="Reply"></textarea><button class="btn primary" onclick="reply('${t.id}')">Reply</button><button class="btn" onclick="resolve('${t.id}')">Resolve</button></div>`).join('')||'<p>No tickets.</p>'}`}function reply(id){const arr=tickets(),t=arr.find(x=>x.id===id);t.replies=t.replies||[];t.replies.push({from:'Gold Staff',body:document.getElementById('r'+id).value,time:new Date().toISOString()});saveTickets(arr);ticketView()}function resolve(id){const arr=tickets(),t=arr.find(x=>x.id===id);t.status='Resolved';saveTickets(arr);ticketView()}function storeView(){app.innerHTML=`<h1>Gold Store Verification</h1><button class="btn" onclick="dashboard()">Back</button><div class="store-grid">${store().map(a=>`<div class="store-card"><h3>${esc(a.name)}</h3><p>${esc(a.description)}</p><p>${a.staffVerified?'<span class="badge verified">✓ Staff Verified</span>':'<span class="badge">Unverified</span>'} ${a.installedByStaff?'<span class="badge staff">Installed by Staff</span>':''}</p><button class="btn primary" onclick="verify('${a.id}')">Toggle Verified</button><button class="btn" onclick="staffInstall('${a.id}')">Install + Verify</button></div>`).join('')}</div>`}function verify(id){const s=store(),a=s.find(x=>x.id===id);a.staffVerified=!a.staffVerified;a.verifiedBy='Gold Staff';saveStore(s);storeView()}function staffInstall(id){const s=store(),a=s.find(x=>x.id===id);a.installed=true;a.installedByStaff=true;a.staffVerified=true;a.verifiedBy='Gold Staff';saveStore(s);storeView()}function remoteView(){app.innerHTML=`<h1>Live Remote Desktop</h1><button class="btn" onclick="dashboard()">Back</button>${remotes().map(r=>`<div class="card"><h3>${esc(r.user)} · ${esc(r.status)}</h3><div class="remote-live">${esc(JSON.stringify(r.state,null,2))}</div><button class="btn" onclick="cmd('${r.id}','openSupport')">Open Support</button><button class="btn" onclick="cmd('${r.id}','openSettings')">Open Settings</button><button class="btn" onclick="cmd('${r.id}','tile')">Tile Windows</button><button class="btn danger" onclick="cmd('${r.id}','end')">End Session</button></div>`).join('')||'<p>No remote sessions.</p>'}`;setTimeout(()=>{if(app.textContent.includes('Live Remote Desktop'))remoteView()},3000)}function cmd(id,c){const r=remotes(),x=r.find(y=>y.id===id);x.commands=[...(x.commands||[]),{cmd:c,by:'Gold Staff',time:new Date().toISOString()}];if(c==='end')x.status='ended';saveRemotes(r);remoteView()}function broadcast(){const msg=prompt('Broadcast message');if(!msg)return;const n=read(PREFIX+'notifications',[]);n.unshift({id:'staff'+Date.now(),title:'Staff Broadcast',body:msg,app:'Gold Staff',time:new Date().toISOString(),read:false});write(PREFIX+'notifications',n);alert('Broadcast saved locally.')}function logoutStaff(){localStorage.removeItem(PREFIX+'staffVerified');location.href='staff.html'}render();</script></body></html>
