<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Gold 2.0</title>
<link rel="icon" type="image/svg+xml" href="emerald-gold-20-logo.svg">
<link rel="stylesheet" href="gold20.css">
<script>
(function(){
  const ok = localStorage.getItem('gold20_loggedIn') === 'true' || localStorage.getItem('loggedIn') === 'true';
  if(!ok) location.replace('index.html?next=OS.html');
})();
</script>
<script>
(function(){
  function goBIOS(){ location.href='bios.html'; }
  function goStaff(){ location.href='staff.html'; }
  function goSupport(){ localStorage.setItem('gold20_open_on_boot','support'); location.href='OS.html'; }
  window.addEventListener('keydown', e => {
    if(e.key === 'F12'){ e.preventDefault(); goBIOS(); }
    if(e.key === 'F9'){ e.preventDefault(); goStaff(); }
    if(e.key === 'F1'){ e.preventDefault(); goSupport(); }
  });
})();
</script>
<script defer src="gold20.js"></script>
</head>
<body class="gold20">
  <div id="boot" class="boot-screen">
    <img src="emerald-gold-20-logo.svg" alt="EmeraldOS Gold logo" class="boot-logo">
    <h1>EmeraldOS Gold 2.0</h1>
    <p>Loading desktop, support, Gold Store, verified apps, and staff services.</p>
    <div class="boot-hints">F12 BIOS/DOS · F9 Staff Edition · F1 Support</div>
    <div class="boot-progress"><span></span></div>
  </div>
  <main id="desktop" aria-label="EmeraldOS Gold 2.0 desktop"></main>
  <section id="startMenu" class="start-menu hidden"></section>
  <section id="searchPanel" class="side-panel hidden"></section>
  <section id="actionCenter" class="action-center hidden"></section>
  <section id="taskView" class="task-view hidden"></section>
  <section id="setupWizard" class="setup-overlay hidden"></section>
  <div id="windowLayer"></div>
  <footer id="taskbar">
    <button id="startBtn" class="start-btn" title="Start"><img src="emerald-gold-20-logo.svg" alt=""></button>
    <button id="searchBtn" class="task-btn search-wide">Type here to search</button>
    <button id="taskViewBtn" class="task-btn" title="Task View">▣</button>
    <div id="taskApps" class="task-apps"></div>
    <button id="supportBtn" class="task-btn" title="Support">Support</button>
    <button id="actionBtn" class="task-btn" title="Notifications">🔔 0</button>
    <button id="staffBtn" class="task-btn staff-shortcut" title="Staff Edition">Staff</button>
    <button id="logoutBtn" class="task-btn logout-btn" title="Log out">⏻</button>
    <div id="clock" class="clock"></div>
  </footer>
</body>
</html>
