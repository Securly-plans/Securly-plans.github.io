<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emerald Systems BIOS A1</title><style>body{margin:0;background:#04160b;color:#afffbf;font-family:Consolas,monospace}.wrap{max-width:980px;margin:auto;padding:28px}.panel{border:2px solid #79ff92;padding:18px;margin:14px 0;background:#001b0b}.row{display:grid;grid-template-columns:220px 1fr;gap:12px}.btn{background:#043b15;color:#afffbf;border:1px solid #79ff92;padding:8px 12px;margin:5px;font-family:inherit}input{background:#000;color:#afffbf;border:1px solid #79ff92;padding:8px;width:100%;font-family:inherit}.dos{height:240px;overflow:auto;white-space:pre-wrap;background:#000;padding:12px}</style></head><body><div class="wrap"><h1>Emerald Systems BIOS A1</h1><p>Bell-style BIOS / Emerald DOS for EmeraldOS Gold 2.0</p><div class="panel"><h2>Boot Options</h2><button class="btn" onclick="boot()">Normal Boot</button><button class="btn" onclick="location.href='index.html'">Login</button><button class="btn" onclick="safe()">Safe Mode</button><button class="btn" onclick="location.href='staff.html'">Staff Edition</button><button class="btn" onclick="support()">Support Center</button><button class="btn" onclick="localStorage.removeItem('gold20_setupDone');boot()">Run Setup</button></div><div class="panel"><h2>Emerald DOS</h2><div id="out" class="dos">Emerald DOS Gold 2.0
Type HELP.
</div><input id="cmd" autofocus onkeydown="if(event.key==='Enter')run(this.value)"></div><div class="panel"><h2>System Options</h2><div class="row"><b>Version</b><span>EmeraldOS Gold 2.0</span><b>BIOS</b><span>Emerald Systems BIOS A1</span><b>Shortcuts</b><span>F12 BIOS · F9 Staff · F1 Support</span></div></div></div><script>function boot(){location.href=(localStorage.getItem('gold20_loggedIn')==='true'||localStorage.getItem('loggedIn')==='true')?'OS.html':'index.html'}function safe(){localStorage.setItem('gold20_safemode','true');boot()}function support(){localStorage.setItem('gold20_open_on_boot','support');boot()}function run(v){const out=document.getElementById('out');const c=String(v||'').trim().toUpperCase();out.textContent+='> '+c+'\n';if(c==='HELP')out.textContent+='BOOT LOGIN STAFF SUPPORT SAFE SETUP RESET VER DIR TIME CLEAR EXIT\n';else if(c==='BOOT')boot();else if(c==='LOGIN')location.href='index.html';else if(c==='STAFF')location.href='staff.html';else if(c==='SUPPORT')support();else if(c==='SAFE')safe();else if(c==='SETUP'){localStorage.removeItem('gold20_setupDone');boot()}else if(c==='RESET'){if(confirm('Reset Gold local data?')){Object.keys(localStorage).filter(k=>k.startsWith('gold20_')).forEach(k=>localStorage.removeItem(k));location.href='index.html'}}else if(c==='VER')out.textContent+='EmeraldOS Gold 2.0 / Emerald Systems BIOS A1\n';else if(c==='DIR')out.textContent+='OS.HTML INDEX.HTML STAFF.HTML GOLD20.JS GOLD20.CSS APP-LOGOS\n';else if(c==='TIME')out.textContent+=new Date().toString()+'\n';else if(c==='CLEAR')out.textContent='';else if(c==='EXIT')boot();else out.textContent+='Bad command or file name\n';document.getElementById('cmd').value='';}</script></body></html>
