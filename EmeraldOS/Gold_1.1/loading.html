<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Starting EmeraldOS Gold 1.1</title><link rel="stylesheet" href="gold10.css"><link rel="stylesheet" href="gold10-patch1.css"><link rel="stylesheet" href="gold10-patch2.css"><style>body{display:grid;place-items:center}.boot-card{background:rgba(245,249,253,.96);color:#111827;border:1px solid rgba(15,23,42,.12)}.boot-card p{color:#334155}.boot-card .f12-hint{display:block;margin-top:10px;background:#eaf3ff;border:1px solid #bfdcff;color:#0f172a;padding:8px}</style></head><body><div class="boot-card"><div class="boot-logo">G10</div><h1>Starting EmeraldOS Gold 1.1</h1><p>Loading Gold shell, Settings, Explorer, Office, Mail, Store, Restore Center, BIOS hooks, and app fixes...</p><div class="f12-hint">Press F12 now for Emerald Systems BIOS A1 / Emerald DOS. Press F9 for Gold Staff Edition.</div><div class="boot-bar"><span></span></div></div><script>let bootTimer=setTimeout(()=>location.href='OS.html',1600);window.addEventListener('keydown',e=>{if(e.key==='F12'){e.preventDefault();clearTimeout(bootTimer);location.href='bios.html';}});window.addEventListener('keydown',e=>{if(e.key==='F9'){e.preventDefault();clearTimeout(bootTimer);location.href='staff.html';}});</script></body></html>
