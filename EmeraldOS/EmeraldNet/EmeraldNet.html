<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EmeraldNet</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "MS Sans Serif", Arial;
    background: #c0c0c0;
}

.browser-window {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.titlebar {
    background: linear-gradient(to right,#000080,#1084d0);
    color: white;
    padding: 4px 8px;
    font-weight: bold;
}

.toolbar {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #c0c0c0;
}

button {
    border: 2px solid #fff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    background: #c0c0c0;
    padding: 4px 10px;
    font-family: inherit;
}

.address {
    display: flex;
    padding: 4px;
    gap: 4px;
}

input {
    flex: 1;
    border: 2px inset white;
    padding: 4px;
}

iframe {
    flex: 1;
    border: none;
    background: white;
}

.status {
    padding: 4px;
    border-top: 1px solid gray;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="browser-window">

    <div class="titlebar">
        🌿 EmeraldNet 2.0
    </div>

    <div class="toolbar">
        <button onclick="goBack()">◄ Back</button>
        <button onclick="goForward()">Forward ►</button>
        <button onclick="reloadPage()">Refresh</button>
        <button onclick="home()">Home</button>
    </div>

    <div class="address">
        <input id="address" placeholder="Enter address or search">
        <button onclick="go()">Go</button>
    </div>

    <iframe id="view"></iframe>

    <div class="status" id="status">
        Ready.
    </div>

</div>

<script>
const proxy =
    "https://autumn-pond-38e6.wyatt-monroe2013.workers.dev/?url=";

let historyList = [];
let historyIndex = -1;

function setStatus(text) {
    document.getElementById("status").textContent = text;
}

function openURL(url, addHistory = true) {

    if (url === "about:emerald") {

        document.getElementById("view").srcdoc = `
            <h1>EmeraldNet 2.0</h1>
            <p>Cloudflare Proxy Engine</p>
            <p>Welcome to EmeraldOS.</p>
        `;

        setStatus("Internal page.");
        return;
    }

    if (!url.startsWith("http")) {

        if (url.includes(".")) {
            url = "https://" + url;
        } else {
            url =
                "https://duckduckgo.com/?q=" +
                encodeURIComponent(url);
        }
    }

    document.getElementById("address").value = url;

    document.getElementById("view").src =
        proxy + encodeURIComponent(url);

    setStatus("Loading " + url);

    if (addHistory) {
        historyList =
            historyList.slice(0, historyIndex + 1);

        historyList.push(url);
        historyIndex++;
    }
}

function go() {
    openURL(
        document.getElementById("address").value
    );
}

function home() {
    openURL("about:emerald", false);
}

function reloadPage() {

    if (historyIndex >= 0) {
        openURL(
            historyList[historyIndex],
            false
        );
    }
}

function goBack() {

    if (historyIndex > 0) {

        historyIndex--;

        openURL(
            historyList[historyIndex],
            false
        );
    }
}

function goForward() {

    if (
        historyIndex <
        historyList.length - 1
    ) {
        historyIndex++;

        openURL(
            historyList[historyIndex],
            false
        );
    }
}

document
    .getElementById("address")
    .addEventListener("keydown", e => {

        if (e.key === "Enter") {
            go();
        }
    });

home();
</script>

</body>
</html>
