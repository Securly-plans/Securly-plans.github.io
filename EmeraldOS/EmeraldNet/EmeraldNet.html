<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EmeraldNet Alpha 3.0</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: #00ff99;
}

#topbar {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #1a1a1a;
  border-bottom: 1px solid #00ff99;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: #000;
  color: #00ff99;
}

button {
  background: #00ff99;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
  font-weight: bold;
}

iframe {
  width: 100%;
  height: calc(100vh - 60px);
  border: none;
  background: white;
}
</style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Enter URL (example: https://example.com)">
  <button onclick="go()">Go</button>
  <button onclick="back()">←</button>
  <button onclick="forward()">→</button>
</div>

<iframe id="frame"></iframe>

<script>
const proxy = "https://autumn-pond-38e6.wyatt-monroe2013.workers.dev/";

let historyStack = [];
let historyIndex = -1;

function normalize(input) {
  if (!input.startsWith("http")) return "https://" + input;
  return input;
}

function go() {
  const input = document.getElementById("url").value;
  const url = normalize(input);

  const final = proxy + encodeURIComponent(url);

  const frame = document.getElementById("frame");
  frame.src = final;

  historyStack = historyStack.slice(0, historyIndex + 1);
  historyStack.push(final);
  historyIndex++;
}

function back() {
  if (historyIndex > 0) {
    historyIndex--;
    document.getElementById("frame").src = historyStack[historyIndex];
  }
}

function forward() {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    document.getElementById("frame").src = historyStack[historyIndex];
  }
}
</script>

</body>
</html>
