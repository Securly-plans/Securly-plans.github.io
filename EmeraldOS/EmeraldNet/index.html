<!DOCTYPE html>
<html>
<head>
<title>EmeraldNet Full</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: #00ff99;
}

#bar {
  display: flex;
  padding: 10px;
  background: black;
}

input {
  flex: 1;
  padding: 10px;
  background: #111;
  color: #00ff99;
  border: 1px solid #00ff99;
}

button {
  padding: 10px;
  background: #00ff99;
  border: none;
  cursor: pointer;
}

iframe {
  width: 100%;
  height: 90vh;
  border: none;
  background: white;
}
</style>
</head>

<body>

<div id="bar">
  <input id="url" placeholder="Search or URL">
  <button onclick="go()">Go</button>
</div>

<iframe id="frame"></iframe>

<script>
const WORKER = "https://holy-sunset-ac53.wyatt-monroe2013.workers.dev/";
const TOKEN = "2UlZY5nT5QYYMbf62c8b5e7e713c719a2a8ef1c675846c3d3";

function normalize(input) {
  if (!input.startsWith("http")) {
    return "https://www.google.com/search?q=" + encodeURIComponent(input);
  }
  return input;
}

async function go() {
  const input = document.getElementById("url").value;
  const url = normalize(input);

  const api = `${WORKER}?token=${TOKEN}&url=${encodeURIComponent(url)}`;

  const frame = document.getElementById("frame");

  frame.srcdoc = "<p style='color:#00ff99;background:#000;padding:10px;'>Loading...</p>";

  const res = await fetch(api);
  const html = await res.text();

  frame.srcdoc = html;
}
</script>

</body>
</html>
