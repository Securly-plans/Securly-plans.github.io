<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestOS BIOS</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #c0c0c0;
    font-family: "Courier New", monospace;
    font-size: 15px;
    overflow: hidden;
}

.screen {
    padding: 26px;
    white-space: pre-line;
}

.white { color: #ffffff; }
.green { color: #00ff66; }
.blue { color: #00aaff; }
.yellow { color: #ffff66; }
.red { color: #ff5555; }

.menu {
    margin-top: 18px;
    border: 1px solid #808080;
    padding: 12px;
    width: 760px;
    max-width: calc(100vw - 70px);
}

.menu-title {
    color: #ffffff;
    margin-bottom: 10px;
}

.option {
    padding: 5px 8px;
    cursor: pointer;
}

.option.selected {
    background: #000080;
    color: #ffffff;
}

.footer {
    position: fixed;
    left: 26px;
    bottom: 20px;
    color: #808080;
}

.blink {
    animation: blink 1s steps(2, start) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}
</style>
</head>

<body>

<div class="screen" id="screen"></div>
<div class="footer" id="footer"></div>

<script>
"use strict";

/* =========================================================
   TESTOS BIOS BOOT MANAGER
========================================================= */

const screen = document.getElementById("screen");
const footer = document.getElementById("footer");

const BUILD = {
    id: "testos32t1",
    name: "TestOS 3.2.T.1",
    version: "3.2.T.1",
    channel: "Test",
    base: "EmeraldOS 3.2",
    test: true
};

const EDITIONS = [
    {
        id: "home",
        name: "TestOS Home",
        description: "Base edition with core apps, files, notes, docs, calendar, calculator, clock, and system settings."
    },
    {
        id: "business",
        name: "TestOS Business",
        description: "Adds workspace tools, browser, app store, chat, and media tools."
    },
    {
        id: "virtue",
        name: "TestOS Virtue",
        description: "Adds pro tools, terminal, developer tools, monitor, customization, desktop manager, and paint."
    },
    {
        id: "executive",
        name: "TestOS Executive",
        description: "Unlocks all TestOS features, including games and the executive dashboard."
    }
];

let mode = "startup";
let selectedEdition = 0;

const startupLines = [
    '<span class="white">TestBIOS Version 3.2.T.1</span>',
    'Copyright 2026 Emerald Systems',
    '',
    'Base System: EmeraldOS 3.2',
    'Test Channel: Enabled',
    '',
    'CPU: Emerald Virtual Processor 95 MHz',
    'Memory Test: 640K OK',
    'Extended Memory: 32768K OK',
    '',
    'Detecting IDE drives...',
    'Primary Master: TestOS Virtual Disk',
    'Primary Slave: None',
    '',
    'Initializing keyboard... OK',
    'Initializing display adapter... OK',
    'Checking CMOS settings... OK',
    '',
    '<span class="green">Boot device found: TestOS 3.2.T.1 System Disk</span>',
    '',
    'Loading TestOS Boot Manager...',
    ''
];

let startupIndex = 0;

function printStartup() {
    if (startupIndex < startupLines.length) {
        screen.innerHTML += startupLines[startupIndex] + "\n";
        startupIndex++;
        setTimeout(printStartup, 95);
    } else {
        mode = "build";
        renderBuildMenu();
    }
}

function renderBuildMenu() {
    screen.innerHTML = `
<span class="white">TestBIOS Boot Manager</span>
<span class="blue">Select the operating system build to boot.</span>

<div class="menu">
<div class="menu-title">Available Build</div>
<div class="option selected" onclick="chooseBuild()">
    1. ${BUILD.name}  [${BUILD.channel}]  Built on ${BUILD.base}
</div>
</div>

<span class="yellow">Press Enter or 1 to continue.</span>
<span class="blink">_</span>
`;

    footer.textContent = "DEL: BIOS setup   ESC: continue";
}

function chooseBuild() {
    mode = "edition";
    selectedEdition = 0;
    renderEditionMenu();
}

function renderEditionMenu() {
    screen.innerHTML = `
<span class="white">TestBIOS Edition Selector</span>
<span class="blue">Selected Build: ${BUILD.name}</span>

<div class="menu">
<div class="menu-title">Choose Edition To Boot</div>
${EDITIONS.map((edition, index) => `
<div class="option ${index === selectedEdition ? "selected" : ""}" onclick="chooseEdition(${index})">
    ${index + 1}. ${edition.name}
       ${edition.description}
</div>
`).join("")}
</div>

<span class="yellow">Use Up/Down arrows and Enter, or press 1-4.</span>
<span class="blink">_</span>
`;

    footer.textContent = "BACKSPACE: return to build menu   DEL: BIOS setup";
}

function chooseEdition(index) {
    selectedEdition = index;
    const edition = EDITIONS[selectedEdition];

    localStorage.setItem("testos_build_id", BUILD.id);
    localStorage.setItem("testos_build_name", BUILD.name);
    localStorage.setItem("testos_version", BUILD.version);
    localStorage.setItem("testos_channel", BUILD.channel);
    localStorage.setItem("testos_test_build", BUILD.test ? "true" : "false");
    localStorage.setItem("testos_base", BUILD.base);

    localStorage.setItem("testos_edition", edition.id);
    localStorage.setItem("testos_edition_name", edition.name);

    mode = "booting";

    screen.innerHTML = `
<span class="white">TestBIOS Boot Manager</span>

Selected build: <span class="green">${BUILD.name}</span>
Selected edition: <span class="green">${edition.name}</span>

Saving boot configuration... OK
Loading boot sector... OK
Starting TestOS loader...

<span class="blink">_</span>
`;

    footer.textContent = "Booting selected TestOS configuration...";

    setTimeout(() => {
        window.location.replace("./loading.html");
    }, 1300);
}

function renderSetup() {
    mode = "setup";

    screen.innerHTML = `
<span class="white">TestBIOS Setup Utility</span>

Main        Advanced        Boot        Security        Exit

System Disk:        TestOS Virtual Disk
Build:              ${BUILD.name}
Base:               ${BUILD.base}
Edition Selector:   Enabled
Locked Features:    Hidden
Memory:             32768K
Video Adapter:      Emerald VGA Compatible

This setup screen is decorative for now.

<span class="yellow">Press ESC to return to the boot manager.</span>
`;

    footer.textContent = "ESC: return";
}

document.addEventListener("keydown", (e) => {
    if (mode === "startup" || mode === "booting") return;

    if (e.key === "Delete") {
        renderSetup();
        return;
    }

    if (mode === "setup") {
        if (e.key === "Escape") {
            mode = "build";
            renderBuildMenu();
        }
        return;
    }

    if (mode === "build") {
        if (e.key === "Enter" || e.key === "1" || e.key === "Escape") {
            chooseBuild();
        }
        return;
    }

    if (mode === "edition") {
        if (e.key === "ArrowDown") {
            selectedEdition = (selectedEdition + 1) % EDITIONS.length;
            renderEditionMenu();
        }

        if (e.key === "ArrowUp") {
            selectedEdition = (selectedEdition - 1 + EDITIONS.length) % EDITIONS.length;
            renderEditionMenu();
        }

        if (e.key === "Enter") chooseEdition(selectedEdition);
        if (e.key === "1") chooseEdition(0);
        if (e.key === "2") chooseEdition(1);
        if (e.key === "3") chooseEdition(2);
        if (e.key === "4") chooseEdition(3);

        if (e.key === "Backspace") {
            mode = "build";
            renderBuildMenu();
        }
    }
});

setTimeout(printStartup, 300);
</script>

</body>
</html>
