<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS 3.2</title>

<link rel="icon" href="assets/EmeraldOS.png">
<link rel="stylesheet" href="os.css">

</head>

<body data-theme="classic">

    <!-- Desktop -->
    <div id="desktop"></div>

    <!-- Context Menu -->
    <div id="context-menu"></div>

    <!-- Start Menu -->
    <div id="start-menu">

        <div class="start-side">
            EmeraldOS
        </div>

        <div class="start-main">

            <input
                id="start-search"
                placeholder="Search Programs">

            <div id="start-results"></div>

            <hr>

            <div class="start-item"
                 onclick="restartOS()">
                 Restart
            </div>

            <div class="start-item"
                 onclick="logoutUser()">
                 Logout
            </div>

        </div>

    </div>

    <!-- Taskbar -->
    <div id="taskbar">

        <button id="start-btn">
            Start
        </button>

        <div id="taskbar-apps"></div>

        <div id="clock"></div>

    </div>

    <!-- Windows -->
    <div id="windows-container"></div>

    <script type="module" src="applications.js"></script>
    <script type="module" src="os.js"></script>

</body>
</html>
