<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldOS</title>

<style>
body {
    margin: 0;
    font-family: "MS Sans Serif", Arial, sans-serif;
    background: #008080;
    overflow: hidden;
}

/* ================= LOGIN SCREEN ================= */

#login-screen {
    position: absolute;
    inset: 0;
    background: #008080;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
}

.login-box {
    width: 300px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #000 #000 #fff;
    padding: 20px;
    text-align: center;
}

.login-box input {
    width: 90%;
    padding: 6px;
    margin: 5px 0;
    border: 2px inset #fff;
}

.login-box button {
    margin-top: 10px;
    padding: 5px 15px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #000 #000 #fff;
    cursor: pointer;
}

/* ================= EXISTING OS ================= */

#desktop {
    display: none;
    position: absolute;
    inset: 0;
}

#windows-container {
    display: none;
}

#taskbar {
    display: none;
}

/* Desktop icons */
#desktop-icons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 15px;
}

.icon {
    width: 80px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: white;
    user-select: none;
}

/* installed apps */
#installed-apps-zone {
    position: absolute;
    top: 0;
    left: 120px;
    display: contents;
}

/* windows */
.window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 3px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    cursor: move;
}

/* start menu */
#start-menu {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 200px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    display: none;
}

#start-menu.show {
    display: block;
}

.start-menu-item {
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
}

.start-menu-item:hover {
    background: #000080;
    color: white;
}

/* taskbar */
#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35px;
    background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex;
    align-items: center;
    padding: 2px;
}

#start-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="login-screen">
    <div class="login-box">
        <h3>Emerald OS Login</h3>
        <input id="login-user" placeholder="Username">
        <input id="login-pass" type="password" placeholder="Password">
        <button onclick="doLogin()">Login</button>
    </div>
</div>

<!-- ================= DESKTOP ================= -->
<main id="desktop">

    <div id="desktop-icons">
        <div class="icon" onclick="Applications.notes()">📄<br>Notes</div>
        <div class="icon" onclick="Applications.files()">📁<br>Files</div>
        <div class="icon" onclick="Applications.store()">🛒<br>Store</div>
        <div class="icon" onclick="Applications.system()">💻<br>System</div>
        <div class="icon" onclick="Applications.chat()">💬<br>Chat</div>
    </div>

    <div id="installed-apps-zone"></div>

</main>

<!-- START MENU -->
<aside id="start-menu">
    <div class="start-menu-item" onclick="Applications.notes()">📄 Notes</div>
    <div class="start-menu-item" onclick="Applications.files()">📁 File Explorer</div>
    <div class="start-menu-item" onclick="Applications.store()">🛒 App Store</div>
    <div class="start-menu-item" onclick="Applications.system()">💻 System</div>
    <div class="start-menu-item" onclick="Applications.chat()">💬 Chat</div>
</aside>

<!-- WINDOWS -->
<div id="windows-container"></div>

<!-- TASKBAR -->
<footer id="taskbar">
    <button id="start-btn">Start</button>
</footer>

<script src="os.js"></script>

<script>
function doLogin() {
    const user = document.getElementById("login-user").value;

    if (!user) return alert("Enter username");

    localStorage.setItem("loggedIn", "true");
    localStorage.setItem("osUsername", user);

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("desktop").style.display = "block";
    document.getElementById("windows-container").style.display = "block";
    document.getElementById("taskbar").style.display = "flex";
}

window.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem("loggedIn") === "true") {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("desktop").style.display = "block";
        document.getElementById("windows-container").style.display = "block";
        document.getElementById("taskbar").style.display = "flex";
    }
});
</script>

</body>
</html>
