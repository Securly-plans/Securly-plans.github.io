<!DOCTYPE html>
<html>
<head>
<title>EmeraldOS Register</title>

<style>
body {
    margin:0;
    background:#008080;
    font-family:Tahoma;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.panel {
    width:340px;
    background:#c0c0c0;
    border:2px solid;
    border-color:#fff #000 #000 #fff;
    padding:15px;
}

.title {
    background:#000080;
    color:white;
    padding:5px;
    font-weight:bold;
    margin:-15px -15px 10px -15px;
}

input {
    width:100%;
    margin:6px 0;
    padding:6px;
    border:2px inset #fff;
    box-sizing:border-box;
}

button {
    width:100%;
    padding:6px;
    margin-top:8px;
    border:2px outset #fff;
    background:#c0c0c0;
    cursor:pointer;
}

button:active {
    border:2px inset #fff;
}
</style>
</head>

<body>

<div class="panel">
    <div class="title">Create EmeraldOS Account</div>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button id="regBtn">Register</button>
    <button id="backBtn">Back to Login</button>
</div>

<script type="module">
import { db } from "./firebase.js";
import {
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", enc);
    return [...new Uint8Array(hash)]
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

async function register() {
    const username = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value;

    if (!username || !password) {
        alert("Fill all fields");
        return;
    }

    const ref = doc(db, "emeraldOSUsers", username);
    const snap = await getDoc(ref);

    if (snap.exists()) {
        alert("User already exists");
        return;
    }

    const hash = await sha256(password);

    await setDoc(ref, {
        username,
        passwordHash: hash,
        created: Date.now(),
        lastLogin: null
    });

    alert("Account created!");
    window.location.href = "index.html";
}

function goLogin() {
    window.location.href = "index.html";
}

window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("regBtn").addEventListener("click", register);
    document.getElementById("backBtn").addEventListener("click", goLogin);
});
</script>

</body>
</html>
