<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starting EmeraldOS...</title>

<style>
/* =========================================================
   EMERALDOS LOADING.HTML
   Compatible with BIOS build + edition selector
========================================================= */

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;

    background: #008080;
    color: #000;

    font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
    font-size: 12px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   BOOT WINDOW
========================================================= */

.boot-window {
    width: 440px;
    background: #c0c0c0;

    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #808080;
    border-bottom: 2px solid #808080;

    box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
}

/* =========================================================
   TITLE BAR
========================================================= */

.title {
    background: #000080;
    color: #ffffff;

    padding: 4px 6px;

    font-size: 12px;
    font-weight: bold;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title-controls {
    display: flex;
    gap: 2px;
}

.title-button {
    width: 16px;
    height: 14px;

    background: #c0c0c0;
    color: #000;

    border-top: 1px solid #ffffff;
    border-left: 1px solid #ffffff;
    border-right: 1px solid #808080;
    border-bottom: 1px solid #808080;

    font-size: 10px;
    line-height: 12px;
    text-align: center;
}

/* =========================================================
   CONTENT
========================================================= */

.content {
    padding: 14px;
}

.logo {
    width: 72px;
    height: 72px;

    margin: 8px auto 10px auto;

    background:
        url("https://securly-plans.github.io/EmeraldOS/assets/EmeraldOS.png")
        center / contain
        no-repeat;
}

.status-text {
    text-align: center;
    margin-bottom: 10px;
    line-height: 1.4;
}

.build-box {
    background: #ffffff;

    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;

    padding: 7px;
    margin-bottom: 10px;

    line-height: 1.5;
}

.test-warning {
    display: none;

    background: #ffffcc;

    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;

    padding: 7px;
    margin-bottom: 10px;
}

/* =========================================================
   LOG
========================================================= */

.log {
    height: 110px;

    background: #ffffff;
    color: #000000;

    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;

    padding: 6px;

    overflow: hidden;

    font-family: "Courier New", monospace;
    font-size: 11px;
    line-height: 1.35;
}

/* =========================================================
   PROGRESS BAR
========================================================= */

.bar {
    margin-top: 10px;

    height: 17px;

    background: #ffffff;

    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;

    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;

    background: repeating-linear-gradient(
        90deg,
        #000080,
        #000080 10px,
        #c0c0c0 10px,
        #c0c0c0 14px
    );

    transition: width 0.18s linear;
}

/* =========================================================
   FOOTER STATUS
========================================================= */

.footer-status {
    margin-top: 10px;

    background: #d4d0c8;

    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #ffffff;
    border-bottom: 1px solid #ffffff;

    padding: 4px 6px;

    font-size: 11px;
}

.blink {
    animation: blink 1s steps(2, start) infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="boot-window">

    <div class="title">
        <span id="windowTitle">EmeraldOS Startup</span>

        <div class="title-controls">
            <div class="title-button">_</div>
            <div class="title-button">□</div>
            <div class="title-button">×</div>
        </div>
    </div>

    <div class="content">

        <div class="logo"></div>

        <div class="status-text" id="statusText">
            Starting EmeraldOS system files...
        </div>

        <div class="build-box">
            <b>Selected Build:</b>
            <span id="buildName">EmeraldOS 5.2</span>
            <br>

            <b>Version:</b>
            <span id="buildVersion">5.0</span>
            <br>

            <b>Channel:</b>
            <span id="buildChannel">Stable</span>
            <br>

            <b>Edition:</b>
            <span id="editionName">EmeraldOS Virtue</span>
        </div>

        <div class="test-warning" id="testWarning">
            <b>Security Notice:</b>
            Executive edition requires verified Emerald Games administrator access.
        </div>

        <div class="log" id="log">
            Boot loader initialized...
        </div>

        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>

        <div class="footer-status" id="footerStatus">
            Preparing boot sequence<span class="blink">_</span>
        </div>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   EMERALDOS LOADER SCRIPT
========================================================= */

(function () {

    const progress =
        document.getElementById("progress");

    const log =
        document.getElementById("log");

    const statusText =
        document.getElementById("statusText");

    const footerStatus =
        document.getElementById("footerStatus");

    const windowTitle =
        document.getElementById("windowTitle");

    const buildNameEl =
        document.getElementById("buildName");

    const buildVersionEl =
        document.getElementById("buildVersion");

    const buildChannelEl =
        document.getElementById("buildChannel");

    const editionNameEl =
        document.getElementById("editionName");

    const testWarning =
        document.getElementById("testWarning");

    /* =====================================================
       READ BIOS CONFIGURATION
    ===================================================== */

    const selectedBuild =
        localStorage.getItem("40_build_name")
        || "EmeraldOS 5.2";

    const selectedVersion =
        localStorage.getItem("40_version")
        || "5.0";

    const selectedChannel =
        localStorage.getItem("40_channel")
        || "Stable";

    const selectedEditionId =
        localStorage.getItem("40_edition")
        || "virtue";

    const selectedEdition =
        localStorage.getItem("40_edition_name")
        || "EmeraldOS Virtue";

    const isTestBuild =
        localStorage.getItem("40_test_build") === "true"
        || selectedChannel.toLowerCase() === "test"
        || selectedVersion.includes("T");

    /* =====================================================
       APPLY BUILD INFO TO PAGE
    ===================================================== */

    document.title =
        "Starting " + selectedBuild + "...";

    windowTitle.textContent =
        selectedBuild + " Startup";

    buildNameEl.textContent =
        selectedBuild;

    buildVersionEl.textContent =
        selectedVersion;

    buildChannelEl.textContent =
        selectedChannel;

    editionNameEl.textContent =
        selectedEdition;

    statusText.textContent =
        "Starting " + selectedBuild + " as " + selectedEdition + "...";

    if (isTestBuild) {
        testWarning.style.display = "block";
    }

    /* =====================================================
       BOOT STEPS
    ===================================================== */

    const bootSteps = [
        "Loading " + selectedBuild + " kernel",
        "Reading BIOS boot configuration",
        "Loading " + selectedEdition + " profile",
        "Mounting virtual filesystem",
        "Initializing desktop shell",
        "Loading edition manager",
        "Restoring Firebase desktop layout",
        "Starting HKEY registry service",
        "Starting notification engine",
        "Loading user interface resources",
        "Checking experimental services",
        "Preparing EmeraldOS session",
        "Launching EmeraldOS shell"
    ];

    let percent = 0;
    let stepIndex = 0;
    let booted = false;

    /* =====================================================
       HELPERS
    ===================================================== */

    function addLog(message) {
        log.innerHTML += "<br>" + message;
        log.scrollTop = log.scrollHeight;
    }

    function setProgress(value) {
        progress.style.width = value + "%";
    }

    function setStatus(message) {
        statusText.textContent = message;
        footerStatus.innerHTML =
            message + '<span class="blink">_</span>';
    }

    function bootComplete() {
        if (booted) return;

        booted = true;

        setProgress(100);

        addLog("Boot complete.");
        addLog("Starting OS.html...");

        setStatus("Welcome to " + selectedBuild + "...");

        setTimeout(() => {
            window.location.replace("./OS.html");
        }, 650);
    }

    function getStatusForPercent(value) {
        if (value < 20) {
            return "Loading system files...";
        }

        if (value < 40) {
            return "Initializing " + selectedEdition + "...";
        }

        if (value < 60) {
            return "Preparing desktop environment...";
        }

        if (value < 80) {
            return "Loading EmeraldOS services...";
        }

        if (value < 98) {
            return "Finalizing boot sequence...";
        }

        return "Ready to launch EmeraldOS...";
    }

    /* =====================================================
       START BOOT LOOP
    ===================================================== */

    addLog("Selected build: " + selectedBuild);
    addLog("Selected edition: " + selectedEdition);
    addLog("Channel: " + selectedChannel);
    addLog("Version: " + selectedVersion);
    addLog("Edition ID: " + selectedEditionId);
    addLog("Starting boot sequence...");

    const interval = setInterval(() => {

        percent += Math.random() * 9 + 4;

        if (percent > 100) {
            percent = 100;
        }

        setProgress(percent);
        setStatus(getStatusForPercent(percent));

        const threshold =
            stepIndex * (100 / bootSteps.length);

        if (
            percent >= threshold &&
            stepIndex < bootSteps.length
        ) {
            addLog(
                bootSteps[stepIndex] + " ... OK"
            );

            stepIndex++;
        }

        if (percent >= 100) {
            clearInterval(interval);
            bootComplete();
        }

    }, 190);

    /* =====================================================
       SAFETY FALLBACK
    ===================================================== */

    setTimeout(() => {
        bootComplete();
    }, 9000);

})();
</script>

</body>
</html>
