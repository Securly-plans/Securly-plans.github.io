<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Silver Advanced BIOS</title>
<style>
body{margin:0;background:#020813;color:#dfefff;font-family:Consolas,monospace;height:100vh;display:flex;align-items:center;justify-content:center}.bios{width:min(780px,94vw);background:linear-gradient(180deg,#061a32,#07111f);border:1px solid #6aa5da;box-shadow:0 0 45px #1b6fad66;border-radius:14px;overflow:hidden}.bar{padding:12px 16px;background:linear-gradient(90deg,#103a63,#071829);font-weight:bold}.content{padding:20px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #24415d;padding:9px 0}button{background:linear-gradient(#e8f5ff,#95b9d7);border:1px solid #376c99;border-radius:7px;padding:8px 14px;color:#041525;font-weight:bold}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}</style>
</head>
<body><div class="bios"><div class="bar">EmeraldOS Silver Advanced BIOS</div><div class="content"><h2>Advanced Boot Manager</h2><div class="row"><span>Product line</span><b>EmeraldOS Silver Advanced</b></div><div class="row"><span>Shell</span><b>Aero-modern advanced desktop</b></div><div class="row"><span>Base compatibility</span><b>EmeraldOS Platform 5.7</b></div><div class="row"><span>Mode</span><b>Unified no-edition advanced model</b></div><div class="actions"><button onclick="location.href='loading.html'">Start Silver Advanced</button><button onclick="localStorage.setItem('silver_advanced_safe_mode','true');location.href='loading.html'">Safe Mode</button><button onclick="localStorage.removeItem('silver_advanced_session');alert('Local Silver Advanced session reset.')">Reset Local Session</button></div></div></div></body></html>
