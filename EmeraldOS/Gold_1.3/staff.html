<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Gold Staff Edition</title>
<link rel="icon" type="image/svg+xml" href="emerald-gold-13-logo.svg">
<style>
:root{--accent:#0078d4;--gold:#c99616;--bg:#edf5ff;--panel:#fff;--panel2:#f4f7fb;--text:#111827;--muted:#64748b;--border:#d1dbe8;--shadow:0 22px 55px rgba(0,0,0,.2);font-family:'Segoe UI',Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#dbeeff,#fff8dc,#e5fff3);color:var(--text)}.shell{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(1120px,96vw);background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.top{padding:22px;background:linear-gradient(135deg,#0f172a,#0f5f8f,#0f7b4d);color:white;display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,#fff6cd,#d69e1d,#0f7b4d);display:grid;place-items:center;font-weight:900;font-size:34px}.content{padding:22px}.grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.field{width:100%;padding:10px;border:1px solid var(--border);border-radius:5px;margin:5px 0 12px}.btn{padding:9px 14px;border:1px solid var(--border);border-radius:5px;background:#fff}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{background:#fee2e2;color:#991b1b}.panel{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin:10px 0}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.ticket{background:white;border:1px solid var(--border);border-radius:8px;padding:12px;margin:10px 0}@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell"><div class="card"><div class="top"><div class="logo">G</div><div><h1>EmeraldOS Gold Staff Edition</h1><p>Staff login, support tickets, remote assistance, BIOS tools, and administrative controls.</p></div></div><div class="content" id="app"></div></div></div>
<script type="module">
const PREFIX='gold13_';
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}};
const write=(k,v)=>{localStorage.setItem(k,JSON.stringify(v));return v};
const now=()=>new Date().toISOString();
async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
let fb=null;try{fb=await import('./firebase.js')}catch(e){console.warn('Firebase unavailable',e)}
function session(){return read(PREFIX+'staff_session',null)}
function tickets(){return read(PREFIX+'tickets',[])}function saveTickets(t){write(PREFIX+'tickets',t)}
function notifications(){return read(PREFIX+'notifications',[])}function addNotification(title,body){write(PREFIX+'notifications',[{id:crypto.randomUUID?.()||String(Date.now()),title,body,app:'Gold Staff Edition',time:now(),read:false},...notifications()])}
function render(){const s=session();if(s?.verified)return dashboard();login()}
function login(){app.innerHTML=`<div class="grid"><section><h2>Staff Login</h2><p class="muted">Use your EmeraldOS login and Emerald Mail account. Firebase rules must allow reading the required account records for production verification.</p><label>EmeraldOS username<input id="u" class="field" autocomplete="username"></label><label>EmeraldOS password<input id="p" class="field" type="password"></label><label>Emerald Mail address<input id="m" class="field" placeholder="name@mail.monroecorp.org"></label><label>Emerald Mail password<input id="mp" class="field" type="password"></label><div class="toolbar"><button class="btn primary" id="loginBtn">Login</button><button class="btn" id="previewBtn">Preview Staff Tools</button><button class="btn" onclick="location.href='OS.html'">Back to Gold</button></div><p id="status" class="muted"></p></section><section><h2>Staff Edition Features</h2><div class="panel"><b>Support review</b><p>View, reply to, and resolve Support Center tickets.</p></div><div class="panel"><b>Remote assistance</b><p>Review remote help requests and publish visible support actions.</p></div><div class="panel"><b>Control tools</b><p>Broadcast messages, request diagnostics, export local workspace, open BIOS, and view staff logs.</p></div></section></div>`;document.getElementById('loginBtn').onclick=verifyLogin;document.getElementById('previewBtn').onclick=()=>{write(PREFIX+'staff_session',{verified:true,username:'Staff Preview',role:'Preview',preview:true,time:now()});render()}}
async function verifyLogin(){const status=document.getElementById('status');status.textContent='Checking credentials...';const username=document.getElementById('u').value.trim();const pass=document.getElementById('p').value;const mail=document.getElementById('m').value.trim().toLowerCase();const mailPass=document.getElementById('mp').value;const h=await sha256(pass), mh=await sha256(mailPass);let userOK=false,mailOK=false,role='staff';try{if(fb?.getDocs&&fb?.collection&&fb?.db){const users=await fb.getDocs(fb.collection(fb.db,'users'));users.forEach(d=>{const x=d.data();if(String(x.username||'').toLowerCase()===username.toLowerCase()&&x.passwordHash===h&&!x.locked){const r=String(x.role||x.role2||'').toLowerCase();if(['admin','moderator','mod','operator','staff','executive','owner','vip'].includes(r)){userOK=true;role=r}}});const mails=await fb.getDocs(fb.collection(fb.db,'EmeraldMail'));mails.forEach(d=>{const x=d.data();if(String(x.email||'').toLowerCase()===mail&&x.passwordHash===mh){mailOK=true}})}}catch(e){console.warn(e);status.textContent='Firebase check failed. Check rules/imports or use preview mode.';return}
 if(userOK&&mailOK){write(PREFIX+'staff_session',{verified:true,username,mail,role,time:now()});addNotification('Staff login','Gold Staff Edition login successful.');render()}else status.textContent='Login failed. Check EmeraldOS role, password, Emerald Mail account, and Firestore rules.'}
function dashboard(){const s=session(),all=tickets();app.innerHTML=`<h2>Staff Dashboard</h2><p class="muted">Signed in as ${esc(s.username)} · ${esc(s.role)} ${s.preview?'· Preview mode':''}</p><div class="toolbar"><button class="btn primary" onclick="location.href='OS.html'">Open Gold Desktop</button><button class="btn" onclick="location.href='bios.html'">Open Bell BIOS</button><button class="btn" id="broadcast">Broadcast</button><button class="btn" id="export">Export Tickets</button><button class="btn danger" id="logout">Sign out</button></div><div class="grid"><section><div class="panel"><h3>Open Tickets</h3><p style="font-size:38px;margin:0">${all.filter(t=>t.status!=='Resolved').length}</p></div><div class="panel"><h3>Remote Assistance</h3><p style="font-size:38px;margin:0">${all.filter(t=>t.remote&&t.status!=='Resolved').length}</p></div><div class="panel"><h3>Staff Remote Access</h3><p class="muted">Remote tools are visible and support-focused: broadcasts, diagnostics requests, ticket replies, and workspace export. No silent destructive actions are included.</p><button class="btn" id="diag">Request diagnostics notification</button></div></section><section><h3>Tickets</h3>${all.map(ticketHTML).join('')||'<p class="muted">No tickets.</p>'}</section></div>`;document.getElementById('logout').onclick=()=>{localStorage.removeItem(PREFIX+'staff_session');render()};document.getElementById('broadcast').onclick=()=>{const msg=prompt('Broadcast message');if(msg){addNotification('Staff Broadcast',msg);alert('Broadcast added to local notification stream.')}};document.getElementById('export').onclick=()=>download('gold13-tickets.json',JSON.stringify(all,null,2));document.getElementById('diag').onclick=()=>addNotification('Staff diagnostic request','Staff requested diagnostics. Open Support Center and submit a diagnostic ticket.')}
function ticketHTML(t){return `<div class="ticket"><h3>${esc(t.title)} <span class="muted">${esc(t.status)}</span></h3><p>${esc(t.body)}</p><p class="muted">${esc(t.user)} · ${esc(t.category)} · ${esc(t.priority)} · ${new Date(t.time).toLocaleString()}</p>${(t.replies||[]).map(r=>`<blockquote><b>${esc(r.from)}:</b> ${esc(r.body)}</blockquote>`).join('')}<div class="toolbar"><button class="btn" onclick="replyTicket('${t.id}')">Reply</button><button class="btn primary" onclick="resolveTicket('${t.id}')">Resolve</button></div></div>`}
window.replyTicket=id=>{const all=tickets(),t=all.find(x=>x.id===id),body=prompt('Reply to ticket');if(t&&body){t.replies=t.replies||[];t.replies.unshift({from:session()?.username||'Staff',body,time:now()});t.status='Waiting on User';saveTickets(all);addNotification('Staff replied to ticket',t.title);render()}};
window.resolveTicket=id=>{const all=tickets(),t=all.find(x=>x.id===id);if(t){t.status='Resolved';t.resolvedAt=now();saveTickets(all);addNotification('Ticket resolved',t.title);render()}};
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}
render();
</script>
</body>
</html>
