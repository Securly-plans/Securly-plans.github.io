<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Starting EmeraldOS Gold 1.3</title><link rel="icon" href="emerald-gold-13-logo.svg" type="image/svg+xml"><style>body{margin:0;height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#0f5f8f,#0f7b4d);font-family:'Segoe UI',Arial,sans-serif;color:white}.box{text-align:center;width:min(560px,92vw)}.logo{width:90px;height:90px;margin:auto;border-radius:22px;background:linear-gradient(135deg,#fff6cd,#d69e1d,#0f7b4d);display:grid;place-items:center;font-size:54px;font-weight:900;box-shadow:0 24px 60px rgba(0,0,0,.4)}.bar{height:6px;background:rgba(255,255,255,.25);border-radius:20px;overflow:hidden;margin:24px 0}.bar span{display:block;height:100%;width:40%;background:#fff;animation:run 1.25s infinite}@keyframes run{from{transform:translateX(-120%)}to{transform:translateX(260%)}}.hint{opacity:.85}button{padding:10px 14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:white;border-radius:5px;margin:4px}</style></head><body><div class="box"><div class="logo">G</div><h1>EmeraldOS Gold 1.3</h1><p>Starting desktop and services...</p><div class="bar"><span></span></div><p class="hint">F12 = Emerald Systems BIOS A1 · F9 = Staff Edition</p><button onclick="location.href='bios.html'">BIOS</button><button onclick="location.href='staff.html'">Staff</button><button onclick="location.href='OS.html'">Boot now</button></div><script>let boot=setTimeout(()=>location.href='OS.html',2200);window.addEventListener('keydown',e=>{if(e.key==='F12'){clearTimeout(boot);location.href='bios.html'}if(e.key==='F9'){clearTimeout(boot);location.href='staff.html'}})</script></body></html>
