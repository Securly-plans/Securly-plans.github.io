<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Silver Beta 3.0</title>
<link rel="icon" href="https://securly-plans.github.io/EmeraldOS/assets/EmeraldOS.png">
<link rel="stylesheet" href="os.css">
<link rel="stylesheet" href="silver-beta3.css">
<script type="module" src="os.js"></script>
<script type="module" src="emerald57.js"></script>
<script src="silver-beta3.js"></script>
</head>
<body data-theme="silver-beta30" data-silver-product="EmeraldOS Silver">
    <div id="desktop"></div>
    <div id="context-menu"></div>
    <div id="start-menu">
        <div class="start-side">Silver</div>
        <div class="start-main">
            <input id="start-search" placeholder="Search Silver programs, files, settings, and apps">
            <div id="start-results"></div>
            <hr>
            <div class="start-item" onclick="openSilver30Workspace()">Silver Workspace</div>
            <div class="start-item" onclick="openSilver30DriveOffice()">Silver Drive + Office</div>
            <div class="start-item" onclick="openSilver30Communications()">Silver Communications</div>
            <div class="start-item" onclick="openSilver30Creator()">Silver Creator Studio</div>
            <div class="start-item" onclick="openSilver30ControlPanel()">Silver Control Panel</div>
            <div class="start-item" onclick="openSilver30Apps()">All Silver Apps</div>
            <div class="start-item" onclick="restartOS()">Restart Silver</div>
            <div class="start-item" onclick="logoutUser()">Logout</div>
        </div>
    </div>
    <div id="taskbar">
        <button id="start-btn" title="EmeraldOS Silver">Silver</button>
        <div id="taskbar-apps"></div>
        <button id="silver-bell" title="Universal Silver Notifications" onclick="window.openSilver30Notifications?.()">0</button>
        <button id="silver-sync" title="Silver Sync Status" onclick="window.openSilver30Network?.()">Sync</button>
        <div id="emerald40-edition-badge"></div>
        <div id="emerald40-build-badge">Silver Beta 3.0</div>
        <div id="clock"></div>
    </div>
    <div id="windows-container"></div>
</body>
</html>
