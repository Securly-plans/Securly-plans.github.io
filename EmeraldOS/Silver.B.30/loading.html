<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Starting EmeraldOS Silver Beta 3.0...</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#102033;background:radial-gradient(circle at 18% 80%,rgba(111,222,174,.38),transparent 0 18%,transparent 42%),radial-gradient(circle at 76% 14%,rgba(177,221,255,.70),transparent 0 17%,transparent 46%),linear-gradient(135deg,#45586c,#8da2b5 44%,#dbe4ec);display:flex;align-items:center;justify-content:center}.boot{width:520px;border-radius:17px;border:1px solid rgba(255,255,255,.76);background:linear-gradient(to bottom,rgba(255,255,255,.76),rgba(226,238,249,.88));box-shadow:0 22px 62px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.94);backdrop-filter:blur(19px);overflow:hidden}.title{padding:11px 15px;background:linear-gradient(to bottom,rgba(255,255,255,.38),rgba(65,92,118,.34));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);font-weight:700}.content{padding:25px;text-align:center}.orb{width:78px;height:78px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle at 35% 25%,#fff,#d8f1ff 12%,#94c5f0 40%,#527b9f 72%,#1c3246);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 10px rgba(255,255,255,.9),0 0 30px rgba(150,214,255,.72),0 9px 22px rgba(0,0,0,.32)}h1{margin:0;color:#102d4b;font-size:25px}.sub{margin:6px 0 18px;color:#37556d}.bar{height:15px;border-radius:999px;background:rgba(255,255,255,.65);border:1px solid rgba(70,111,143,.35);overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.18)}.fill{height:100%;width:12%;border-radius:999px;background:linear-gradient(to right,#e8f7ff,#7dc8ff,#22a463);animation:load 2.8s ease-in-out forwards}@keyframes load{to{width:100%}}.log{margin-top:14px;text-align:left;background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.84);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;color:#28465f}.footer{font-size:11px;color:#456279;margin-top:12px}@media(max-width:560px){.boot{width:92vw}}
</style>
</head>
<body>
<div class="boot"><div class="title">EmeraldOS Silver Boot Manager</div><div class="content"><div class="orb"></div><h1>EmeraldOS Silver Beta 3.0</h1><div class="sub">Silverglass product line</div><div class="bar"><div class="fill"></div></div><div class="log" id="log">Loading Silver shell...<br>Preparing Silver Apps...<br>Starting sidebar gadgets...<br>Loading EmeraldOS platform services...</div><div class="footer">Original EmeraldOS Silver design. No Microsoft assets included.</div></div></div>
<script>setTimeout(()=>{document.getElementById('log').innerHTML+='<br>Starting OS.html...';},1600);setTimeout(()=>{window.location.href='OS.html';},3100);</script>
</body>
</html>
