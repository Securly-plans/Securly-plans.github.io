<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting EmeraldOS...</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #05070a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #7CFFB2;
            overflow: hidden;
        }

        .logo {
            width: 180px;
            height: 180px;
            background: url("assets/EmeraldOS.png") center/contain no-repeat;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.4); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .text {
            font-size: 16px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }

        .bar {
            width: 220px;
            height: 4px;
            background: #0f1a14;
            margin-top: 25px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #7CFFB2;
            animation: load 3.5s linear forwards;
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>

<body>

    <div class="logo"></div>

    <div class="text">
        Booting EmeraldOS<span class="dots"></span>
    </div>

    <div class="bar">
        <div class="progress"></div>
    </div>

    <script>
        // fake boot delay then redirect
        setTimeout(() => {
            window.location.href = "OS.html";
        }, 4000);
    </script>

</body>
</html>
