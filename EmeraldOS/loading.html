<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starting EmeraldOS...</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #008080;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "MS Sans Serif", Tahoma, sans-serif;
    color: #000;
}

/* Boot Window */
.boot-window {
    width: 420px;
    background: #c0c0c0;
    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #808080;
    border-bottom: 2px solid #808080;
    padding: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.title {
    background: #000080;
    color: white;
    padding: 4px 6px;
    font-size: 13px;
    margin: -14px -14px 10px -14px;
}

.logo {
    width: 64px;
    height: 64px;
    background: url("assets/EmeraldOS.png") center/contain no-repeat;
    margin: 10px auto;
}

.text {
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 10px;
    text-align: center;
}

.log {
    font-size: 11px;
    background: #ffffff;
    border: 1px solid #808080;
    padding: 6px;
    height: 100px;
    overflow: hidden;
    font-family: monospace;
}

.bar {
    margin-top: 10px;
    height: 16px;
    background: #ffffff;
    border: 1px solid #808080;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(
        90deg,
        #000080,
        #000080 10px,
        #c0c0c0 10px,
        #c0c0c0 14px
    );
    transition: width 0.2s linear;
}
</style>
</head>

<body>

<div class="boot-window">
    <div class="title">EmeraldOS is loading...</div>

    <div class="logo"></div>

    <div class="text" id="statusText">
        Starting EmeraldOS system files...
    </div>

    <div class="log" id="log">
        Boot sequence initialized...
    </div>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>
</div>

<script>
(function () {

    const progress = document.getElementById("progress");
    const log = document.getElementById("log");
    const statusText = document.getElementById("statusText");

    let percent = 0;
    let stepIndex = 0;
    let booted = false;

    const steps = [
        "Loading kernel modules",
        "Initializing memory manager",
        "Mounting virtual filesystem",
        "Starting graphics subsystem",
        "Loading UI engine",
        "Checking system integrity",
        "Launching EmeraldOS shell"
    ];

    function addLog(text) {
        log.innerHTML += "<br>" + text;
        log.scrollTop = log.scrollHeight;
    }

    function setProgress(value) {
        progress.style.width = value + "%";
    }

    function bootComplete() {
        if (booted) return;
        booted = true;

        statusText.textContent = "Welcome to EmeraldOS...";

        setTimeout(() => {
            window.location.replace("./OS.html");
        }, 600);
    }

    const interval = setInterval(() => {

        // Smooth randomized progress
        percent += Math.random() * 10 + 3;

        if (percent > 100) percent = 100;

        setProgress(percent);

        // Step-based logs
        const threshold = stepIndex * (100 / steps.length);

        if (percent >= threshold && stepIndex < steps.length) {
            addLog(steps[stepIndex] + " ... OK");
            stepIndex++;
        }

        // Status text updates
        if (percent < 30) {
            statusText.textContent = "Starting EmeraldOS system files...";
        } else if (percent < 60) {
            statusText.textContent = "Loading system components...";
        } else if (percent < 90) {
            statusText.textContent = "Preparing user interface...";
        } else {
            statusText.textContent = "Finalizing boot sequence...";
        }

        if (percent >= 100) {
            clearInterval(interval);
            addLog("Boot complete.");
            bootComplete();
        }

    }, 180);

    // Safety fallback (prevents infinite loading)
    setTimeout(() => {
        bootComplete();
    }, 9000);

})();
</script>

</body>
</html>
