<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starting EmeraldOS...</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #008080;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "MS Sans Serif", Tahoma, sans-serif;
    color: #000;
}

/* Boot Window */
.boot-window {
    width: 420px;
    background: #c0c0c0;
    border-top: 2px solid #ffffff;
    border-left: 2px solid #ffffff;
    border-right: 2px solid #808080;
    border-bottom: 2px solid #808080;
    padding: 14px;
}

.title {
    background: #000080;
    color: white;
    padding: 4px 6px;
    font-size: 13px;
    margin: -14px -14px 10px -14px;
}

.logo {
    width: 64px;
    height: 64px;
    background: url("assets/EmeraldOS.png") center/contain no-repeat;
    margin: 10px auto;
}

.text {
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 10px;
}

.log {
    font-size: 11px;
    background: #ffffff;
    border: 1px solid #808080;
    padding: 6px;
    height: 90px;
    overflow: hidden;
}

.bar {
    margin-top: 10px;
    height: 16px;
    background: #ffffff;
    border: 1px solid #808080;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(
        90deg,
        #000080,
        #000080 10px,
        #c0c0c0 10px,
        #c0c0c0 14px
    );
    animation: load 3.8s linear forwards;
}

@keyframes load {
    from { width: 0%; }
    to { width: 100%; }
}
</style>
</head>

<body>

<div class="boot-window">
    <div class="title">Microsoft Windows 95 Startup</div>

    <div class="logo"></div>

    <div class="text">
        Starting EmeraldOS system files...
    </div>

    <div class="log">
        Loading kernel... OK<br>
        Initializing display driver... OK<br>
        Mounting virtual disk... OK<br>
        Starting UI shell... OK<br>
        Checking system integrity... OK<br>
        Launching EmeraldOS...
    </div>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>
</div>

<script>
(function () {
    const progress = document.getElementById("progress");

    let hasBooted = false;

    function bootOS() {
        if (hasBooted) return;
        hasBooted = true;

        // IMPORTANT: force navigation (works on GitHub Pages + local servers)
        window.location.replace("./OS.html");
    }

    // Primary: animation finished
    progress.addEventListener("animationend", bootOS);

    // Fallback 1: timer safety
    setTimeout(bootOS, 4500);

    // Fallback 2: ensure even slow devices don't get stuck
    setTimeout(bootOS, 6000);
})();
</script>

</body>
</html>
