<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gold Local Profile</title><style>body{font-family:'Segoe UI',Arial,sans-serif;background:#eaf4ff;display:grid;place-items:center;height:100vh;margin:0}.card{background:white;padding:24px;border-radius:12px;box-shadow:0 20px 45px #0002;width:min(420px,92vw)}input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #cbd5e1}.btn{padding:10px 14px;background:#0078d4;color:white;border:0;border-radius:5px}</style></head><body><div class="card"><h1>Gold Local Profile</h1><p>This creates a local profile name for EmeraldOS Gold if you are not using the main EmeraldOS login.</p><input id="u" placeholder="Username"><button class="btn" onclick="localStorage.setItem('gold30_username',u.value||'GoldUser');location.href='loading.html'">Continue</button></div></body></html>
