<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Starting EmeraldOS Vista Alpha 2.0...</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#102033;background:radial-gradient(circle at 18% 80%,rgba(96,212,157,.42),transparent 0 18%,transparent 42%),radial-gradient(circle at 72% 15%,rgba(155,198,255,.70),transparent 0 17%,transparent 46%),linear-gradient(135deg,#253a55,#617f9e 44%,#c5d7e6);display:flex;align-items:center;justify-content:center}.boot{width:500px;border-radius:16px;border:1px solid rgba(255,255,255,.72);background:linear-gradient(to bottom,rgba(255,255,255,.70),rgba(223,237,249,.84));box-shadow:0 20px 60px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.92);backdrop-filter:blur(18px);overflow:hidden}.title{padding:10px 14px;background:linear-gradient(to bottom,rgba(255,255,255,.35),rgba(49,91,129,.32));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);font-weight:650}.content{padding:24px;text-align:center}.orb{width:78px;height:78px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle at 35% 25%,#fff,#a9f2b9 13%,#18a15a 42%,#006b37 74%,#003719);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 10px rgba(255,255,255,.9),0 0 30px rgba(117,208,255,.7),0 9px 22px rgba(0,0,0,.32)}h1{margin:0;color:#102d4b;font-size:24px}.sub{margin:6px 0 18px;color:#37556d}.bar{height:15px;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(70,111,143,.35);overflow:hidden;box-shadow:inset 0 1px 4px rgba(0,0,0,.18)}.fill{height:100%;width:12%;border-radius:999px;background:linear-gradient(to right,#1e9f60,#78cfff,#f8ffff);animation:load 2.8s ease-in-out forwards}@keyframes load{to{width:100%}}.log{margin-top:14px;text-align:left;background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:10px;font-size:12px;line-height:1.6;color:#28465f}.footer{font-size:11px;color:#456279;margin-top:12px}@media(max-width:560px){.boot{width:92vw}}
</style>
</head>
<body>
<div class="boot"><div class="title">EmeraldOS Vista Boot Manager</div><div class="content"><div class="orb"></div><h1>EmeraldOS Vista Alpha 2.0</h1><div class="sub">Aurora Glass product line</div><div class="bar"><div class="fill"></div></div><div class="log" id="log">Loading glass shell...<br>Preparing Control Panel...<br>Starting desktop gadgets...<br>Loading EmeraldOS 5.7 platform...</div><div class="footer">Original Vista-inspired EmeraldOS design. No Microsoft assets included.</div></div></div>
<script>
setTimeout(()=>{document.getElementById('log').innerHTML+='<br>Starting OS.html...';},1600);
setTimeout(()=>{window.location.href='OS.html';},3100);
</script>
</body>
</html>
