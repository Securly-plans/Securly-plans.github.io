<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Gold T.U.2</title>
<link rel="stylesheet" href="gold-tu2.css">
</head>
<body>
<div id="goldDesktop" class="desktop">
  <div class="desktop-brand"><img src="emerald-gold-tu2-logo.svg" alt="EmeraldOS Gold"><span>EmeraldOS Gold T.U.2</span></div>
  <div id="icons" class="icons"></div>
  <div id="windows" class="windows"></div>
  <div id="setup" class="setup hidden"></div>
  <footer class="taskbar">
    <button id="startBtn" class="start">◆ Gold</button>
    <button id="searchBtn">Search</button>
    <div id="running" class="running"></div>
    <button id="syncBtn">Save VM</button>
    <button id="updateBtn">Check update</button>
    <button id="logoutBtn">Log out</button>
    <div id="clock" class="clock"></div>
  </footer>
  <section id="startMenu" class="start-menu hidden"></section>
</div>
<script src="gold-tu2.js"></script>
</body>
</html>
