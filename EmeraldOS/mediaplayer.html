<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Media Player</title>

<style>

:root{
    --win-bg:#008080;
    --win-face:#c0c0c0;
    --win-light:#ffffff;
    --win-shadow:#808080;
    --win-dark:#000000;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:"MS Sans Serif",Tahoma,sans-serif;
    background:#008080;
}

body{
    display:flex;
    flex-direction:column;
}

/* TITLE BAR */

.titlebar{
    height:28px;
    background:linear-gradient(to right,#000080,#1084d0);
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 6px;
    font-size:12px;
    font-weight:bold;
}

.window-buttons{
    display:flex;
    gap:2px;
}

.window-buttons button{
    width:18px;
    height:18px;
    padding:0;
    font-size:11px;
}

/* TOOLBAR */

.toolbar{
    background:var(--win-face);
    padding:6px;
    border-bottom:2px solid gray;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

button{
    background:var(--win-face);
    border-top:2px solid white;
    border-left:2px solid white;
    border-right:2px solid gray;
    border-bottom:2px solid gray;
    padding:5px 12px;
    font-family:"MS Sans Serif";
    cursor:pointer;
}

button:active{
    border-top:2px solid gray;
    border-left:2px solid gray;
    border-right:2px solid white;
    border-bottom:2px solid white;
}

input[type=file]{
    display:none;
}

/* MAIN */

.main{
    flex:1;
    display:grid;
    grid-template-columns:240px 1fr;
    overflow:hidden;
}

/* PLAYLIST */

.sidebar{
    background:#c0c0c0;
    border-right:2px solid gray;
    overflow-y:auto;
    padding:8px;
}

.sidebar h3{
    margin-top:0;
    font-size:13px;
}

.file{
    background:#d4d0c8;
    border-top:2px solid white;
    border-left:2px solid white;
    border-right:2px solid gray;
    border-bottom:2px solid gray;
    padding:8px;
    margin-bottom:6px;
    cursor:pointer;
    word-break:break-word;
}

.file:hover{
    background:#e0e0e0;
}

.file.active{
    background:#000080;
    color:white;
}

/* VIEWER */

.viewer{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
}

.viewer video,
.viewer img{
    max-width:100%;
    max-height:100%;
}

.viewer audio{
    width:90%;
}

.viewer iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

.viewer pre{
    color:white;
    padding:20px;
    white-space:pre-wrap;
}

/* STATUS BAR */

.status{
    height:24px;
    background:#c0c0c0;
    border-top:2px solid white;
    display:flex;
    align-items:center;
    padding:0 8px;
    font-size:12px;
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:16px;
    height:16px;
}

::-webkit-scrollbar-track{
    background:#c0c0c0;
}

::-webkit-scrollbar-thumb{
    background:#a0a0a0;
    border:2px solid #c0c0c0;
}

@media(max-width:800px){

    .main{
        grid-template-columns:1fr;
        grid-template-rows:180px 1fr;
    }

}

</style>
</head>

<body>

<div class="toolbar">

    <button onclick="fileInput.click()">
        Open
    </button>

    <button onclick="playMedia()">
        Play
    </button>

    <button onclick="pauseMedia()">
        Pause
    </button>

    <button onclick="stopMedia()">
        Stop
    </button>

    <button onclick="ejectMedia()">
        Eject
    </button>

    <input
        id="fileInput"
        type="file"
        multiple
        accept="video/*,audio/*,image/*,.pdf,.txt,.json,.log,.html,.svg"
    >

</div>

<div class="main">

    <div class="sidebar">

        <h3>Playlist</h3>

        <div id="playlist"></div>

    </div>

    <div class="viewer" id="viewer">

        <div style="color:#00ff00;font-family:monospace;text-align:center;">
            EmeraldOS Media Player<br><br>
            Insert media to begin.
        </div>

    </div>

</div>

<div class="status" id="status">
    Ready.
</div>

<script>

const fileInput = document.getElementById("fileInput");
const playlist = document.getElementById("playlist");
const viewer = document.getElementById("viewer");
const status = document.getElementById("status");

let files = [];
let current = null;

fileInput.addEventListener("change", ()=>{

    files = [...fileInput.files];

    playlist.innerHTML = "";

    files.forEach((file,index)=>{

        const div = document.createElement("div");

        div.className = "file";
        div.textContent = file.name;

        div.onclick = ()=>openFile(index);

        playlist.appendChild(div);

    });

    if(files.length){
        openFile(0);
    }
});

function openFile(index){

    const file = files[index];

    if(!file) return;

    document.querySelectorAll(".file")
        .forEach(f=>f.classList.remove("active"));

    document.querySelectorAll(".file")[index]
        .classList.add("active");

    viewer.innerHTML = "";

    status.textContent =
        file.name +
        " - " +
        Math.round(file.size/1024) +
        " KB";

    const url = URL.createObjectURL(file);

    if(file.type.startsWith("video")){

        current = document.createElement("video");
        current.src = url;
        current.controls = true;

    }
    else if(file.type.startsWith("audio")){

        current = document.createElement("audio");
        current.src = url;
        current.controls = true;

    }
    else if(file.type.startsWith("image")){

        current = document.createElement("img");
        current.src = url;

    }
    else if(
        file.name.endsWith(".pdf") ||
        file.name.endsWith(".html") ||
        file.name.endsWith(".svg")
    ){

        current = document.createElement("iframe");
        current.src = url;

    }
    else if(
        file.name.endsWith(".txt") ||
        file.name.endsWith(".json") ||
        file.name.endsWith(".log")
    ){

        const reader = new FileReader();

        reader.onload = ()=>{

            const pre =
                document.createElement("pre");

            pre.textContent = reader.result;

            viewer.appendChild(pre);
        };

        reader.readAsText(file);

        current = null;

        return;
    }
    else{

        viewer.innerHTML =
            "<div style='color:white'>Unsupported file type.</div>";

        return;
    }

    viewer.appendChild(current);

    if(current.play){
        current.play().catch(()=>{});
    }
}

function playMedia(){

    if(current?.play){
        current.play();
    }
}

function pauseMedia(){

    if(current?.pause){
        current.pause();
    }
}

function stopMedia(){

    if(current){

        if(current.pause){
            current.pause();
        }

        if(current.currentTime !== undefined){
            current.currentTime = 0;
        }
    }
}

function ejectMedia(){

    viewer.innerHTML = `
        <div style="
            color:#00ff00;
            font-family:monospace;
            text-align:center;
        ">
            No media loaded.
        </div>
    `;

    status.textContent = "Ready.";

    current = null;
}

</script>

</body>
</html>
