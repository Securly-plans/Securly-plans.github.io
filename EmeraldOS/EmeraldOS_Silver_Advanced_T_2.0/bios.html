<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Advanced 10 Firmware</title><link rel="stylesheet" href="advanced10.css"><style>body{background:#001b2e;color:#b7ffdf;font-family:Consolas,monospace;padding:24px;overflow:auto}.box{border:1px solid #00ff99;padding:18px;max-width:860px}.key{color:#fff}</style></head><body><div class="box"><h1>EmeraldOS Advanced 10 Firmware</h1><p>Independent model firmware screen.</p><p><span class="key">Enter</span> Boot Advanced 10</p><p><span class="key">R</span> Recovery / Restore Center</p><p><span class="key">P</span> Product Plans</p><p><span class="key">Esc</span> Login</p></div><script>document.addEventListener('keydown',e=>{if(e.key==='Enter')location.href='loading.html';if(e.key.toLowerCase()==='r')location.href='OS.html#restore';if(e.key.toLowerCase()==='p')location.href='plans.html';if(e.key==='Escape')location.href='index.html';});</script></body></html>
