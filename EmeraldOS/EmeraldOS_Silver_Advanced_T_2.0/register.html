<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Advanced 10 Profile</title><link rel="stylesheet" href="advanced10.css"><style>body{display:grid;place-items:center}.login{width:min(430px,92vw);background:rgba(31,36,45,.96);border:1px solid rgba(255,255,255,.15);box-shadow:var(--shadow);padding:24px;color:var(--text)}.login h1{font-weight:300;margin-top:0}.login input{width:100%;padding:12px;margin:8px 0;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--text)}.login button{width:100%;margin-top:8px}</style></head><body><div class="login"><div class="boot-logo">E10</div><h1>Create Profile</h1><p class="muted">Creates a local Advanced 10 profile for testing.</p><input id="user" placeholder="Username"><input id="display" placeholder="Display name"><button class="btn primary" onclick="reg()">Create and start</button><button class="btn" onclick="location.href='index.html'">Back</button></div><script>function reg(){const u=document.getElementById('user').value||'AdvancedUser';localStorage.setItem('username',u);localStorage.setItem('displayName',document.getElementById('display').value||u);localStorage.setItem('loggedIn','true');location.href='loading.html';}</script></body></html>
