<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>View Users</title>

<style>

:root{
    --win-bg:#008080;
    --win-face:#c0c0c0;
    --win-light:#ffffff;
    --win-shadow:#808080;
    --win-dark:#000000;
    --title:#000080;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--win-bg);
    font-family:"MS Sans Serif",Tahoma,sans-serif;
    color:black;
}

/* ================= WINDOW ================= */

.container{
    max-width:1200px;
    margin:20px auto;
    padding:8px;
    background:var(--win-face);

    border-top:2px solid var(--win-light);
    border-left:2px solid var(--win-light);
    border-right:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-shadow);
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(to right,#000080,#1084d0);
    color:white;
    padding:6px;
    margin-bottom:12px;
}

.header h1{
    margin:0 0 10px;
    font-size:18px;
    color:white;
    font-weight:bold;
}

/* ================= SEARCH ================= */

.search{
    width:100%;
    padding:6px;

    border-top:2px solid var(--win-shadow);
    border-left:2px solid var(--win-shadow);
    border-right:2px solid var(--win-light);
    border-bottom:2px solid var(--win-light);

    background:white;
    color:black;
    font-family:Tahoma,sans-serif;
    font-size:12px;
    outline:none;
}

/* ================= GRID ================= */

.users-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:12px;
}

/* ================= USER CARD ================= */

.user-card{
    background:var(--win-face);

    border-top:2px solid var(--win-light);
    border-left:2px solid var(--win-light);
    border-right:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-shadow);

    padding:15px;
}

.user-card:hover{
    background:#d8d8d8;
}

/* ================= AVATAR ================= */

.avatar{
    width:80px;
    height:80px;
    display:block;
    margin:auto;

    object-fit:cover;

    border-top:2px solid var(--win-shadow);
    border-left:2px solid var(--win-shadow);
    border-right:2px solid var(--win-light);
    border-bottom:2px solid var(--win-light);

    background:white;
}

/* ================= USERNAME ================= */

.username{
    text-align:center;
    font-weight:bold;
    font-size:16px;
    margin-top:10px;
}

/* ================= STATUS ================= */

.status{
    text-align:center;
    margin-top:6px;
    font-size:12px;
    font-weight:bold;
}

.online{
    color:green;
}

.offline{
    color:gray;
}

/* ================= BIO ================= */

.bio{
    margin-top:12px;
    padding:8px;
    min-height:45px;

    background:white;

    border-top:2px solid var(--win-shadow);
    border-left:2px solid var(--win-shadow);
    border-right:2px solid var(--win-light);
    border-bottom:2px solid var(--win-light);

    font-size:12px;
    line-height:1.4;
}

/* ================= INFO ================= */

.info{
    margin-top:10px;
    font-size:12px;
    text-align:center;
}

/* ================= BADGES ================= */

.badges{
    margin-top:10px;
    text-align:center;
}

.badge{
    display:inline-block;

    background:#d4d0c8;

    border-top:2px solid var(--win-light);
    border-left:2px solid var(--win-light);
    border-right:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-shadow);

    padding:3px 8px;
    margin:2px;
    font-size:11px;
    font-weight:bold;
}

/* ================= BUTTON ================= */

.profile-btn{
    width:100%;
    margin-top:12px;
    padding:6px;

    font-family:"MS Sans Serif",Tahoma,sans-serif;
    font-size:12px;

    background:var(--win-face);

    border-top:2px solid var(--win-light);
    border-left:2px solid var(--win-light);
    border-right:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-shadow);

    cursor:pointer;
}

.profile-btn:active{
    border-top:2px solid var(--win-shadow);
    border-left:2px solid var(--win-shadow);
    border-right:2px solid var(--win-light);
    border-bottom:2px solid var(--win-light);
}

/* ================= EMPTY ================= */

.empty{
    grid-column:1/-1;

    background:var(--win-face);

    border-top:2px solid var(--win-light);
    border-left:2px solid var(--win-light);
    border-right:2px solid var(--win-shadow);
    border-bottom:2px solid var(--win-shadow);

    padding:40px;
    text-align:center;
    font-size:13px;
}

/* ================= SCROLLBAR ================= */

::-webkit-scrollbar{
    width:16px;
}

::-webkit-scrollbar-track{
    background:#c0c0c0;
}

::-webkit-scrollbar-thumb{
    background:#a0a0a0;
    border:2px solid #c0c0c0;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .container{
        margin:0;
        max-width:100%;
    }

    .users-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>User Directory</h1>

        <input
            type="text"
            id="search"
            class="search"
            placeholder="Search username..."
        >

    </div>

    <div id="users" class="users-grid"></div>

</div>

<script type="module">

import { db } from "./js/firebase.js";

import {
    collection,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const usersContainer =
    document.getElementById("users");

const searchInput =
    document.getElementById("search");

let allUsers = [];

/* ================= FORMAT DATE ================= */

function formatDate(created){

    if(!created){
        return "Unknown";
    }

    const ms = Number(created);

    if(isNaN(ms)){
        return "Unknown";
    }

    return new Date(ms)
        .toLocaleDateString();

}

/* ================= ESCAPE HTML ================= */

function escapeHtml(str){

    return String(str || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/* ================= RENDER USERS ================= */

function renderUsers(){

    const search =
        searchInput.value
        .trim()
        .toLowerCase();

    usersContainer.innerHTML = "";

    const filtered =
        allUsers.filter(user =>
            (user.username || "")
            .toLowerCase()
            .includes(search)
        );

    if(filtered.length === 0){

        usersContainer.innerHTML = `
            <div class="empty">
                No users found.
            </div>
        `;

        return;
    }

    filtered.forEach(user => {

        const card =
            document.createElement("div");

        card.className =
            "user-card";

        const badges =
            Array.isArray(user.badges)
            ? user.badges
            : [];

        card.innerHTML = `

            <img
                class="avatar"
                src="${
                    escapeHtml(
                        user.photoURL ||
                        "https://via.placeholder.com/90"
                    )
                }"
            >

            <div class="username">
                ${
                    escapeHtml(
                        user.username ||
                        "Unknown User"
                    )
                }
            </div>

            <div class="
                status
                ${
                    user.status === "Online"
                    ? "online"
                    : "offline"
                }
            ">
                ${
                    escapeHtml(
                        user.status ||
                        "Offline"
                    )
                }
            </div>

            <div class="bio">
                ${
                    escapeHtml(
                        user.bio ||
                        "No bio provided."
                    )
                }
            </div>

            <div class="info">
                Joined:
                ${
                    formatDate(
                        user.created
                    )
                }
            </div>

            <div class="badges">
                ${
                    badges.map(b => `
                        <span class="badge">
                            ${escapeHtml(b)}
                        </span>
                    `).join("")
                }
            </div>

            <button
                class="profile-btn"
                data-uid="${user.uid}"
            >
                View Profile
            </button>

        `;

        card
        .querySelector(".profile-btn")
        .addEventListener("click", () => {

            location.href =
                `view-profile.html?uid=${user.uid}`;

        });

        usersContainer.appendChild(card);

    });

}

/* ================= REALTIME USERS ================= */

onSnapshot(
    collection(db,"users"),
    snapshot => {

        allUsers = [];

        snapshot.forEach(doc => {

            allUsers.push({
                uid:doc.id,
                ...doc.data()
            });

        });

        renderUsers();

    }
);

/* ================= SEARCH ================= */

searchInput.addEventListener(
    "input",
    renderUsers
);

</script>

</body>
</html>
