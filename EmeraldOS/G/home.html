<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Games</title>

<link rel="stylesheet" href="style.css">

<script>
  (function () {
    const isLoggedIn = localStorage.getItem("loggedIn") === "true";
    if (!isLoggedIn) {
      window.location.replace("index.html");
    }
  })();
</script>

<style>

:root{
  --win-bg:#008080;
  --win-gray:#c0c0c0;
  --win-dark:#808080;
  --win-light:#ffffff;
  --win-text:#000;
}

*{
  box-sizing:border-box;
  font-family:"Tahoma","MS Sans Serif",Arial;
}

body{
  margin:0;
  background:var(--win-bg);
  color:var(--win-text);
}

/* =========================
   NAVBAR (WIN95 TASKBAR STYLE)
========================= */

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;

  padding:6px;
  background:var(--win-gray);

  border-bottom:2px solid var(--win-dark);
}

.navbar a,
.navbar button{
  background:var(--win-gray);
  border:2px outset var(--win-light);
  padding:4px 10px;
  font-size:12px;
  color:#000;
  text-decoration:none;
  cursor:pointer;
}

.navbar a:active,
.navbar button:active{
  border:2px inset var(--win-dark);
}

.username-badge{
  padding:3px 8px;
  background:#fff;
  border:2px inset var(--win-dark);
  font-size:12px;
}

/* =========================
   HEADER
========================= */

header{
  background:var(--win-gray);
  border-bottom:2px solid var(--win-dark);
  padding:10px;
}

header h1{
  margin:0 0 8px;
  font-size:18px;
}

header input{
  width:100%;
  max-width:420px;
  padding:6px;

  background:white;
  border:2px inset var(--win-dark);
}

/* =========================
   TITLES
========================= */

h2{
  margin:15px;
  font-size:16px;
}

/* =========================
   GAME GRID (FIXED + STABLE)
========================= */

.game-grid,
.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:10px;
  padding:10px;
}

.game-grid > div,
.video-grid > div{
  background:var(--win-gray);

  border-top:2px solid var(--win-light);
  border-left:2px solid var(--win-light);
  border-right:2px solid var(--win-dark);
  border-bottom:2px solid var(--win-dark);

  padding:6px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;

  max-height:220px;
  overflow:hidden;
}

.game-grid img,
.video-grid img{
  width:100%;
  height:120px;
  object-fit:cover;

  border:2px inset var(--win-dark);
  background:#000;
}

.game-grid b,
.video-grid b{
  font-size:12px;
  margin-top:6px;
  display:block;
}

.game-grid div,
.video-grid div{
  word-break:break-word;
}

/* =========================
   TERMS SECTION
========================= */

.resources-section{
  margin:40px auto;
  text-align:center;
}

.tos-button{
  display:inline-block;
  padding:10px 18px;

  background:var(--win-gray);
  border:2px outset var(--win-light);

  text-decoration:none;
  color:#000;
  font-weight:bold;
  font-size:12px;
}

.tos-button:active{
  border:2px inset var(--win-dark);
}

.resources-text{
  font-size:12px;
  margin-top:10px;
}

/* =========================
   🚨 NORMAL ANNOUNCEMENT (FIXED CENTER)
========================= */

#announcementBar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;

  background:var(--win-gray);
  border-top:2px solid var(--win-dark);

  padding:6px 10px;
  font-size:12px;
  color:var(--win-text);

  display:none;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  font-weight:bold;
  letter-spacing:0.2px;
}

/* =========================
   🚨 EMERGENCY OVERLAY (FIXED)
========================= */

#emergencyOverlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;

  background:var(--win-gray);

  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  border:4px solid red;

  text-align:center;
  padding:20px;
}

#emergencyTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

#emergencyText{
  font-size:14px;
  max-width:600px;

  white-space:pre-wrap;
  word-wrap:break-word;
}

/* =========================
   HOVER FEEL (SUBTLE WIN95 UX)
========================= */

.navbar a:hover,
.navbar button:hover{
  filter:brightness(0.95);
}

</style>
</head>

<script type="module" src="./js/session.js"></script>

<script type="module" src="js/playtime.js"></script>

<body>

<!-- NAVBAR (UNCHANGED STRUCTURE) -->
<div class="navbar">

  <div class="nav-left">
    <a href="home.html">Home</a>
  </div>

  <div class="nav-right">

    <span id="usernameDisplay" class="username-badge"></span>

    <a href="chat.html" class="chat-link">Chat</a>

    <a href="tickets.html" id="ticketslink" style="display:none;">Support</a>
    <a href="profile.html" id="profileLink" style="display:none;">Profile</a>

    <a href="admin-tickets.html" id="adminticketslink" class="admin-link" style="display:none;">

    </a>

    <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">

<header>
  <h1>Home</h1>

</header>

<h2>Games</h2>

<main id="gameGrid" class="game-grid"></main>
<main id="videoGrid" class="video-grid"></main>

<!-- TERMS / RESOURCES -->

<!-- TERMS / RESOURCES -->

<div class="resources-section">

  <a href="tos.html" class="tos-button">
    Emerald Terms of Service
  </a>

  <p class="resources-text">
    Additional links and resources are not available at this time.

</div>

<!-- NORMAL ANNOUNCEMENT -->
<div id="announcementBar"></div>

<!-- 🚨 EMERGENCY OVERLAY (FIXED TEXT SUPPORT) -->
<div id="emergencyOverlay">
  <div id="emergencyTitle">EMERGENCY BROADCAST</div>
  <div id="emergencyText"></div>
</div>

<script type="module">
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./firebase.js";

const bar = document.getElementById("announcementBar");
const overlay = document.getElementById("emergencyOverlay");
const emergencyText = document.getElementById("emergencyText");

/* NORMAL ANNOUNCEMENT */
onSnapshot(doc(db, "system", "announcement"), (snap) => {
  if (!snap.exists()) {
    bar.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled && data.text) {
    bar.style.display = "block";
    bar.textContent = data.text;
  } else {
    bar.style.display = "none";
  }
});

/* 🚨 EMERGENCY BROADCAST (FIXED TEXT) */
onSnapshot(doc(db, "system", "emergency"), (snap) => {
  if (!snap.exists()) {
    overlay.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled) {
    overlay.style.display = "flex";
    emergencyText.textContent =
      data.text || "System emergency active. Please wait for updates.";
  } else {
    overlay.style.display = "none";
  }
});
</script>

<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";
const isVIP = localStorage.getItem("vip") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");

if (username && isLoggedIn) {
  usernameDisplay.textContent =
    (role === "admin" ? "🛡 " : isVIP ? "⭐ " : "👤 ") + username;
}

if (isLoggedIn) {
  document.getElementById("ticketslink").style.display = "inline-block";
  document.getElementById("profileLink").style.display = "inline-block";
  document.getElementById("viewUsersLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod" || isVIP) {
  document.getElementById("adminticketslink").style.display = "inline-block";
  document.getElementById("modChatLink").style.display = "inline-block";
}

if (role === "admin") {
  document.getElementById("adminLink").style.display = "inline-block";
}

/* SEARCH */
const searchBar = document.getElementById("searchBar");
const gameGrid = document.getElementById("gameGrid");
const videoGrid = document.getElementById("videoGrid");

function filterItems() {
  const query = searchBar.value.toLowerCase().trim();
  const allItems = [...gameGrid.children, ...videoGrid.children];

  allItems.forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = (!query || text.includes(query)) ? "" : "none";
  });
}

searchBar.addEventListener("input", filterItems);
</script>

<script src="script.js"></script>

<!-- ================= PUSH NOTIFICATIONS (FIXED + CLEAN) ================= -->
<script type="module">
import { getMessaging, getToken, onMessage } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

import { app } from "./firebase.js";

/* ================= INIT MESSAGING ================= */

let messaging;

try {
  messaging = getMessaging(app);
} catch (e) {
  console.warn("FCM not supported:", e);
}

/* ================= REQUEST PERMISSION ================= */

async function initPush() {
  try {
    if (!messaging) return;

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      console.log("Notification permission denied");
      return;
    }

    /* IMPORTANT: Replace with your real VAPID key from Firebase Console */
    const token = await getToken(messaging, {
      vapidKey: "BCDlkH0Kp2EWLGF3KA08a-FaGm9bMkPoIGWN9bPz5jdVOHAiyK5xg7Bfz1U236BHvG4l7QOKH2l_UI0DbwwTInI"
    });

    if (token) {
      console.log("FCM Token:", token);
      localStorage.setItem("fcmToken", token);
    }

  } catch (err) {
    console.error("Push init error:", err);
  }
}

/* ================= FOREGROUND NOTIFICATIONS ================= */

if (messaging) {
  onMessage(messaging, (payload) => {

    const title = payload?.notification?.title || "Notification";
    const body = payload?.notification?.body || "";

    alert(`${title}\n\n${body}`);
  });
}

/* ================= SERVICE WORKER REGISTRATION ================= */

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/js/firebase-messaging-sw.js")
    .then(() => console.log("Service Worker registered"))
    .catch(err => console.error("SW error:", err));
}

/* ================= START ================= */

initPush();
</script>
