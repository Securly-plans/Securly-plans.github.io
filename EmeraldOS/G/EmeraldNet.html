<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EmeraldNet Engine</title>

<style>
body {
    margin: 0;
    font-family: "MS Sans Serif", Arial;
    background: #008080;
    height: 100vh;
    overflow: hidden;
}

.window {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #c0c0c0;
}

.titlebar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: white;
    padding: 4px;
    font-weight: bold;
}

.toolbar, .addressbar, .status, .loading {
    background: #c0c0c0;
    padding: 4px;
    flex-shrink: 0;
}

.toolbar {
    display: flex;
    gap: 4px;
}

button {
    font-family: inherit;
    font-size: 12px;
    background: #c0c0c0;
    border: 2px solid #fff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    padding: 3px 8px;
    cursor: pointer;
}

input {
    flex: 1;
    border: 2px inset #fff;
    padding: 3px;
}

.addressbar {
    display: flex;
    gap: 4px;
}

.loading {
    height: 10px;
    background: black;
}

.bar {
    height: 100%;
    width: 0%;
    background: lime;
}

.browser {
    flex: 1;
    overflow: auto;
    background: white;
    padding: 10px;
    font-family: Arial;
}

.status {
    font-size: 12px;
    border-top: 2px solid #808080;
}
</style>
</head>

<body>

<div class="window">

<div class="titlebar">🌿 EmeraldNet Engine v2</div>

<div class="toolbar">
    <button onclick="home()">🏠 Home</button>
    <button onclick="back()">◄ Back</button>
    <button onclick="forward()">Forward ►</button>
    <button onclick="refresh()">⟳</button>
</div>

<div class="addressbar">
    <input id="url" placeholder="Enter URL or search">
    <button onclick="go()">Go</button>
</div>

<div class="loading"><div class="bar" id="bar"></div></div>

<div id="browser" class="browser"></div>

<div class="status" id="status">Ready</div>

</div>

<script>
const proxy = "https://autumn-pond-38e6.wyatt-monroe2013.workers.dev/";

let history = [];
let index = -1;

function setStatus(t){ document.getElementById("status").innerText = t; }

async function load(url) {

    if (!url) return;

    if (!url.startsWith("http") && !url.includes("about:")) {
        url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
    }

    setStatus("Loading...");
    animate();

    const res = await fetch(proxy + encodeURIComponent(url));
    const html = await res.text();

    document.getElementById("browser").innerHTML = html;

    history = history.slice(0, index + 1);
    history.push(url);
    index++;

    document.getElementById("url").value = url;
    setStatus("Loaded");
}

function go(){
    load(document.getElementById("url").value);
}

function back(){
    if(index>0){ index--; load(history[index]); }
}

function forward(){
    if(index<history.length-1){ index++; load(history[index]); }
}

function refresh(){
    if(index>=0) load(history[index]);
}

function home(){
    load("about:emerald");
}

function animate(){
    let bar=document.getElementById("bar");
    bar.style.width="0%";
    let w=0;
    let i=setInterval(()=>{
        w+=10;
        bar.style.width=w+"%";
        if(w>=100) clearInterval(i);
    },40);
}

// internal page
function loadInternal(){
    document.getElementById("browser").innerHTML = `
        <h1>🌿 EmeraldNet Engine</h1>
        <p>Real proxy rendering engine active.</p>
    `;
}

function load(url){
    if(url==="about:emerald"){
        loadInternal();
        setStatus("Internal page");
        return;
    }

    if(!url.startsWith("http")){
        url="https://"+url;
    }

    goTo(url);
}

async function goTo(url){
    const res=await fetch(proxy+encodeURIComponent(url));
    const html=await res.text();

    document.getElementById("browser").innerHTML=html;
    document.getElementById("url").value=url;

    setStatus("Done");
}

load("about:emerald");
</script>

</body>
</html>
