<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EmeraldNet</title>

<style>
body {
    margin: 0;
    font-family: "MS Sans Serif", Arial;
    background: #008080;
    height: 100vh;
    overflow: hidden;
}

/* FULL SCREEN BROWSER */
.window {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #c0c0c0;
}

/* TITLE BAR */
.titlebar {
    background: linear-gradient(to right, #000080, #1084d0);
    color: white;
    padding: 4px;
    font-weight: bold;
    flex-shrink: 0;
}

/* TOOLBAR */
.toolbar {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #c0c0c0;
    border-bottom: 2px solid #808080;
    flex-shrink: 0;
}

button {
    font-family: inherit;
    font-size: 12px;
    background: #c0c0c0;
    border: 2px solid #fff;
    border-right-color: #404040;
    border-bottom-color: #404040;
    padding: 3px 8px;
    cursor: pointer;
}

button:active {
    border-right-color: #fff;
    border-bottom-color: #fff;
    border-left-color: #404040;
    border-top-color: #404040;
}

/* ADDRESS BAR */
.addressbar {
    display: flex;
    padding: 4px;
    gap: 4px;
    background: #c0c0c0;
    flex-shrink: 0;
}

input {
    flex: 1;
    font-family: inherit;
    border: 2px inset #fff;
    padding: 3px;
}

/* LOADING BAR */
.loading {
    height: 10px;
    background: #000;
    overflow: hidden;
    flex-shrink: 0;
}

.bar {
    height: 100%;
    width: 0%;
    background: lime;
}

/* BROWSER AREA (FULL SCREEN CORE) */
.browser {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

/* STATUS BAR */
.status {
    font-size: 12px;
    padding: 3px;
    background: #c0c0c0;
    border-top: 2px solid #808080;
    flex-shrink: 0;
}
</style>
</head>

<body>

<div class="window">

    <div class="titlebar">🌿 EmeraldNet 1.0</div>

    <div class="toolbar">
        <button onclick="back()">◄ Back</button>
        <button onclick="forward()">Forward ►</button>
        <button onclick="refresh()">⟳ Refresh</button>
        <button onclick="home()">🏠 Home</button>
    </div>

    <div class="addressbar">
        <input id="url" placeholder="Enter URL or search..." />
        <button onclick="go()">Go</button>
    </div>

    <div class="loading">
        <div class="bar" id="bar"></div>
    </div>

    <iframe id="browser" class="browser"></iframe>

    <div class="status" id="status">Ready</div>

</div>

<script>
const proxy = "https://autumn-pond-38e6.wyatt-monroe2013.workers.dev/?url=";

let historyStack = [];
let currentIndex = -1;

function setStatus(text) {
    document.getElementById("status").innerText = text;
}

function load(url) {
    if (!url) return;

    // internal page
    if (url === "about:emerald") {
        document.getElementById("browser").srcdoc = `
            <h1>🌿 EmeraldNet 1.0</h1>
            <p>Win95-style browser for EmeraldOS</p>
            <p>Engine: Cloudflare Proxy Backend</p>
        `;
        setStatus("Loaded internal page");
        return;
    }

    // search fallback
    if (!url.startsWith("http") && !url.includes("about:")) {
        url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
    }

    setStatus("Connecting...");
    animateBar();

    const full = proxy + encodeURIComponent(url);

    document.getElementById("browser").src = full;

    historyStack = historyStack.slice(0, currentIndex + 1);
    historyStack.push(url);
    currentIndex++;

    document.getElementById("url").value = url;
    setStatus("Loaded: " + url);
}

function go() {
    const url = document.getElementById("url").value;

    if (!url.includes(".") && !url.startsWith("about:")) {
        load("https://duckduckgo.com/?q=" + encodeURIComponent(url));
    } else {
        load(url);
    }
}

function back() {
    if (currentIndex > 0) {
        currentIndex--;
        load(historyStack[currentIndex]);
    }
}

function forward() {
    if (currentIndex < historyStack.length - 1) {
        currentIndex++;
        load(historyStack[currentIndex]);
    }
}

function refresh() {
    if (currentIndex >= 0) {
        load(historyStack[currentIndex]);
    }
}

function home() {
    load("about:emerald");
}

function animateBar() {
    const bar = document.getElementById("bar");
    bar.style.width = "0%";

    let w = 0;
    const interval = setInterval(() => {
        w += 10;
        bar.style.width = w + "%";

        if (w >= 100) {
            clearInterval(interval);
            setTimeout(() => bar.style.width = "0%", 250);
        }
    }, 60);
}

// start page
load("about:emerald");
</script>

</body>
</html>
