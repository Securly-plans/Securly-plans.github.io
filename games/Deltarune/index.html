<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune / Undertale</title>
    <style>
        /* Force the game to fill the absolute entire window cleanly */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Keeps screen black while loading */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Direct embed bypasses browser JavaScript fetch limits -->
    <iframe src="https://googleapis.com"></iframe>

</body>
</html>
