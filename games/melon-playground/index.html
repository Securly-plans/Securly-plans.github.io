<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Melon Sandbox</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <script src="sdk.js"></script>
    <script src="./Modules/JQuery/jquery-3.1.0.min.js"></script>
    <script src="./Modules/WebView/unity-webview.js"></script>
    <script src="./Modules/Lame/lame.all.js"></script>
    
    <script src="./Modules/Firebase/firebase-app-compact-9.14.0.js"></script>
    <script src="./Modules/Firebase/firebase-analytics-8.10.1.js"></script>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=960 height=600></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        // --- FIXED BUILD CONFIGURATION ---
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/126_release-web-35.0_melon_webgl_b9cfc522b8e96b8ef5fac61097b0cd131e5c2ff3_v35_0.loader.js";
        
        var canvas = document.createElement("canvas");
        var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        var ext_dxt = gl ? gl.getExtension("WEBGL_compressed_texture_s3tc") : null;
        var ext_astc = gl ? gl.getExtension("WEBGL_compressed_texture_astc") : null;
        var contextName = gl ? gl.constructor.name : "Unknown";

        var dataFile = "/126_release-web-35.0_melon_webgl_b9cfc522b8e96b8ef5fac61097b0cd131e5c2ff3_v35_0.data.unityweb";
        
        if (contextName == "WebGLRenderingContext") {
            if (ext_dxt) dataFile = "/126_release-web-35.0_melon_webgl_b9cfc522b8e96b8ef5fac61097b0cd131e5c2ff3_v35_0.data.unityweb";
            if (ext_astc) dataFile = "/126_release-web-35.0_melon_webgl_b9cfc522b8e96b8ef5fac61097b0cd131e5c2ff3_v35_0.data.unityweb";
        }

        var config = {
            dataUrl: buildUrl + dataFile,
            frameworkUrl: buildUrl + "/126_release-web-35.0_melon_webgl_b9cfc522b8e96b8ef5fac61097b0cd131e5c2ff3_v35_0.framework.js.unityweb",
            codeUrl: buildUrl + "/126_release-web-35.0_melon_webgl_b9cfc522b8e96b8ef5fac61097b0cd131e5c2ff3_v35_0.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Payge Ltd",
            productName: "Melon Sandbox",
            productVersion: "35.0",
            showBanner: unityShowBanner,
        };0if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                window.gameInstance = unityInstance;
                loadingBar.style.display = "none";
            }).catch((message) => {
                alert(message);
            });
        };
        document.body.appendChild(script);

        // File Browser Handlers for Melon Sandbox
        var libraryHandlerObjectName = "FileBrowserHandler"; 

        function openFileBrowserForOpen(filter) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = filter;
            input.onchange = e => {
                var file = e.target.files[0];
                var reader = new FileReader();
                reader.onload = () => {
                    var arrayBuffer = reader.result;
                    var uint8Array = new Uint8Array(arrayBuffer);
                    var base64 = btoa(String.fromCharCode.apply(null, uint8Array));
                    gameInstance.SendMessage(libraryHandlerObjectName, 'FileSelected', base64);
                };
                reader.readAsArrayBuffer(file);
            };
            input.click();
        }
    </script>
</body>
</html>
