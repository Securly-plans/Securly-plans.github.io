<!DOCTYPE html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link rel="stylesheet" href="25060607/theme/game.css">
	<meta name="robots" content="noindex, nofollow">
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
	<title>Wacky Nursery</title>
	<style type="text/css">
		.jss1:before {
			top: 0;
			width: 100%;
			filter: blur(16px);
			height: 100%;
			content: "";
			display: block;
			opacity: .5;
			z-index: 0;
			position: absolute;
			background-size: cover;
			background-image: url("25060607/loading.png")
		}
	</style> 
	 
	<script>
		var buildUrl = "Build";
		var versionFolder = "25060607/";
		buildUrl = "https://games.azgame.io/game/wacky-nursery/" + versionFolder + buildUrl;
		var loaderUrl = buildUrl + "/wacky-nursery-v25060607.loader.js";
		var config = {
			dataUrl: buildUrl + "/wacky-nursery-v25060607.data.unityweb",
			frameworkUrl: buildUrl + "/wacky-nursery-v25060607.framework.js.unityweb",
			codeUrl: buildUrl + "/wacky-nursery-v25060607.wasm.unityweb",
			streamingAssetsUrl: versionFolder + "StreamingAssets",
			companyName: "azgames.io",
			productName: "Wacky Nursery",
			productVersion: "25060607",
			pubId: ""
		};
		config.gameId = "wacky-nursery";
		config.eventLog = false;
		config.enableMoreGame = "no";
		config.enablePromotion = false;
	</script>
</head>

<body>
<div id="unity-container" style="display: none;">
	<canvas id="unity-canvas"></canvas> 
</div>
<div id="loadingBlock" style="">
	<div class="jss31 jss34 jss1">
	<div style="position: absolute; font-family: Arial, Helvetica, sans-serif; bottom: 10px; right: 10px; font-size: 18px; color: #ffffff; opacity: 0.5;">25060607</div>
		<div class="spinner"></div>
		<div class="jss31 jss34 jss48" style="flex: 1 1 0%;">
			<div class="jss32">
				<div class="jss7 jss9 jss20 jss3">
					<div class="jss125">
						<div class="jss123">
						 <img src="25060607/logo.png">
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="jss31 jss34" style="flex: 3 1 0%;">
			<div class="jss32">
				<div class="jss31 jss34 jss39 jss50 gameloader">
					<div class="jss32">
						<div class="gameloader-game-name">Wacky Nursery</div>
					</div>
					<div class="jss32">
						<div class="jss32 gameloader-logo">
							<img id="game-logo" src="25060607/loading.png">
						</div>
					</div>
					<div class="jss32">
						<div>
							<div class="gameloader-progressbar">
								<div class="gameloader-progressbar-progress" id="progress_fill" style="width: 0%;"></div>
							</div>
							<div class="gameloader-progress-info">Game Loading...</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
	<script> 
		var progressElement = document.getElementById('progress_fill');
		var container = document.getElementById("unity-container");
		var canvas = document.getElementById("unity-canvas");
		var loadingBar = document.querySelector("#loadingBlock");
		var progressBarFull = document.querySelector("#progress_fill");
		var progress_text = document.querySelector(".gameloader-progress-info");
		let text_percent = "";
		var script = document.createElement("script");
		script.src = loaderUrl;
		script.onload = () => {
			createUnityInstance(canvas, config, (progress) => {
				progressElement.style.width = 100 * progress + "%";
				text_percent = "Downloading file: " + Math.round(progress*100) + "%";
				progress_text.innerText = text_percent;
				if (progress >= 99) {
					progress_text.innerText = "Game Loading ...";
				}
			}).then((unityInstance) => {
				window.unityInstance = unityInstance;
				setTimeout(function() {
					loadingBar.style.display = "none";
					window.focus();
				}, 2000);
				container.style.display = "block";
			}).catch((message) => {
				alert(message);
			});
		};
		document.body.appendChild(script);
	</script>
</body>	
</html>
