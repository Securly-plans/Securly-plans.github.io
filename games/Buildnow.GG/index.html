<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>My Unity Game</title>
    <style>
        body { margin: 0; background-color: #233342; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { width: 960px; height: 600px; background: #000; display: block; }
    </style>

    <!-- 1. Pulling a universal Unity WebGL Loader directly from jsDelivr CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Your Unity Game Screen Target Container -->
    <canvas id="unity-canvas"></canvas>

    <script>
        // 2. Global variables to hook into the runtime later
        window.myGlobalUnityInstance = null;

        // 3. Define the configuration mapping directly to your Firebase Storage Bucket URLs
        const config = {
            // Replace these with your unique Firebase Storage download URL tokens
            dataUrl: "gs://securly-plans-main.firebasestorage.app/BuildNow.data.br",
            codeUrl: "gs://securly-plans-main.firebasestorage.app/BuildNow.wasm.br",
            
            // If you find your framework.js.br file, upload it to Firebase and reference it here:
            frameworkUrl: "https://googleapis.com",
            
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "UnityGame",
            productVersion: "1.0",
        };

        const canvas = document.querySelector("#unity-canvas");

        // 4. Initialize using the native Unity Loader Engine wrapper
        createUnityInstance(canvas, config, (progress) => {
            console.log("Loading Progress: " + (100 * progress) + "%");
        }).then((unityInstance) => {
            // Store the instantiated context globally
            window.myGlobalUnityInstance = unityInstance;
            console.log("Unity engine is fully ready and globally accessible!");
        }).catch((error) => {
            console.error("Unity initialization failed due to version mismatch or missing framework file:", error);
        });
    </script>
</body>
</html>
