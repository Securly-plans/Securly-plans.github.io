<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildNow GG</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #unity-canvas { width: 100%; height: 100%; background: #000; }
    </style>

    <!-- Load the official standalone BuildNow loader straight from the distribution CDN -->
    <script src="https://crazygames.com"></script>
</head>
<body>

    <canvas id="unity-canvas"></canvas>

    <script>
        // Set up the global variable hook you requested
        window.myGlobalUnityInstance = null;

        // Configuration targeting your specific heavy Firebase assets
        var config = {
            // Replace these with your unique Firebase Storage Download URLs
            dataUrl: "gs://securly-plans-main.firebasestorage.app/BuildNow.data.br",
            codeUrl: "gs://securly-plans-main.firebasestorage.app/BuildNow.wasm.br",
            
            // BuildNow uses the loader wrapper directly, so we pass an empty string here
            frameworkUrl: "", 
            
            streamingAssetsUrl: "StreamingAssets",
            companyName: "battlelab",
            productName: "BuildNow GG",
            productVersion: "1.0"
        };

        const canvas = document.querySelector("#unity-canvas");

        // Execute the global compilation hook
        createUnityInstance(canvas, config, (progress) => {
            console.log("Loading BuildNow GG Runtime... " + Math.floor(100 * progress) + "%");
        }).then((unityInstance) => {
            // Store it globally so you can modify variables or look up statuses
            window.myGlobalUnityInstance = unityInstance;
            console.log("BuildNow GG is completely initialized globally!");
        }).catch((message) => {
            console.error("Initialization issue:", message);
        });
    </script>
</body>
</html>
