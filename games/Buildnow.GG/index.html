<!DOCTYPE html>

<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuildNow GG</title>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        display: none;
        background: #000;
    }

    #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #111;
        color: #fff;

        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }

    #loading-message {
        font-size: 24px;
        font-weight: 700;
    }

    #loader-percentage {
        margin-top: 12px;
        font-size: 17px;
        font-weight: 400;
    }

    #loading-error {
        display: none;

        width: min(700px, 90vw);
        margin-top: 20px;
        padding: 14px;

        box-sizing: border-box;

        background: #240000;
        border: 1px solid #ff4444;
        border-radius: 5px;

        color: #ff7777;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;

        word-break: break-word;
    }
</style>

</head>

<body>

<!-- =========================================================
     LOADING SCREEN
========================================================== -->

<div id="loading-overlay">

    <div id="loading-message">
        Loading BuildNow GG...
    </div>

    <div id="loader-percentage">
        Initializing...
    </div>

    <div id="loading-error"></div>

</div>


<!-- =========================================================
     UNITY CANVAS
========================================================== -->

<canvas id="unity-canvas"></canvas>


<!-- =========================================================
     BUILDNOW / CRAZYGAMES COMPATIBILITY
     
     IMPORTANT:
     The compiled BuildNow framework references the exact
     global identifier "Crazygames".

     "window.Crazygames = ..." alone is not sufficient for
     every compiled JavaScript/WASM bridge, so this is declared
     as an actual global variable with "var".
========================================================== -->

<script>
    "use strict";

    var Crazygames = window.Crazygames = {

        /*
         * -----------------------------------------------------
         * Initialization
         * -----------------------------------------------------
         */

        init: function () {

            console.log(
                "[BuildNow] Crazygames.init()"
            );

            return Promise.resolve();
        },

        initialize: function () {

            console.log(
                "[BuildNow] Crazygames.initialize()"
            );

            return Promise.resolve();
        },


        /*
         * -----------------------------------------------------
         * Environment
         * -----------------------------------------------------
         */

        environment: "disabled",

        isEnabled: false,

        isAvailable: false,


        /*
         * -----------------------------------------------------
         * Game API
         * -----------------------------------------------------
         */

        game: {

            gameplayStart: function () {

                console.log(
                    "[BuildNow] Crazygames.gameplayStart()"
                );
            },

            gameplayStop: function () {

                console.log(
                    "[BuildNow] Crazygames.gameplayStop()"
                );
            },

            happytime: function () {

                console.log(
                    "[BuildNow] Crazygames.game.happytime()"
                );
            },

            pause: function () {},

            resume: function () {},

            getInviteParam: function () {

                return null;
            }
        },


        /*
         * -----------------------------------------------------
         * Advertisement API
         * -----------------------------------------------------
         */

        ad: {

            requestAd: function () {

                console.log(
                    "[BuildNow] Crazygames ad request ignored."
                );

                return Promise.resolve();
            },

            showAd: function () {

                console.log(
                    "[BuildNow] Crazygames showAd ignored."
                );

                return Promise.resolve();
            }
        },


        /*
         * -----------------------------------------------------
         * Banner API
         * -----------------------------------------------------
         */

        banner: {

            requestBanner: function () {},

            showBanner: function () {},

            hideBanner: function () {},

            clearBanner: function () {}
        },


        /*
         * -----------------------------------------------------
         * User API
         * -----------------------------------------------------
         */

        user: {

            isUserAccountAvailable: false,

            isUserLoggedIn: false,

            getUser: function () {

                return Promise.resolve(null);
            },

            getSystemInfo: function () {

                return Promise.resolve(null);
            }
        },


        /*
         * -----------------------------------------------------
         * Data API
         * -----------------------------------------------------
         */

        data: {

            getItem: function (key) {

                try {

                    return localStorage.getItem(
                        key
                    );

                } catch (error) {

                    return null;
                }
            },

            setItem: function (
                key,
                value
            ) {

                try {

                    localStorage.setItem(
                        key,
                        String(value)
                    );

                } catch (error) {

                    console.warn(
                        "[BuildNow] Could not save data:",
                        error
                    );
                }
            },

            removeItem: function (key) {

                try {

                    localStorage.removeItem(
                        key
                    );

                } catch (error) {}
            },

            clear: function () {

                try {

                    localStorage.clear();

                } catch (error) {}
            }
        },


        /*
         * -----------------------------------------------------
         * Storage API
         * -----------------------------------------------------
         */

        storage: {

            getItem: function (key) {

                try {

                    return localStorage.getItem(
                        key
                    );

                } catch (error) {

                    return null;
                }
            },

            setItem: function (
                key,
                value
            ) {

                try {

                    localStorage.setItem(
                        key,
                        String(value)
                    );

                } catch (error) {

                    console.warn(
                        "[BuildNow] Storage write failed:",
                        error
                    );
                }
            },

            removeItem: function (key) {

                try {

                    localStorage.removeItem(
                        key
                    );

                } catch (error) {}
            }
        }
    };


    /*
     * Verify that the compiled Unity bridge can see the
     * expected identifier.
     */

    console.log(
        "[BuildNow] Crazygames global:",
        typeof Crazygames
    );

</script>


<!-- =========================================================
     APPLICATION
========================================================== -->

<script>
    "use strict";


    /* =========================================================
       GLOBAL UNITY STATE
    ========================================================== */

    window.myGlobalUnityInstance = null;

    let unityStarting = false;
    let unityStarted = false;


    /* =========================================================
       FIREBASE ASSET URLS
    ========================================================== */

    const DATA_SECRET =
        "aHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vdjAvYi9zZWN1cmx5LXBsYW5zLW1haW4uZmlyZWJhc2VzdG9yYWdlLmFwcC9vL0J1aWxkTm93LmRhdGEuYnI/YWx0PW1lZGlh";


    const WASM_SECRET =
        "aHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vdjAvYi9zZWN1cmx5LXBsYW5zLW1haW4uZmlyZWJhc2VzdG9yYWdlLmFwcC9vL0J1aWxkTm93Lndhc20uYnI/YWx0PW1lZGlh";


    const FIREBASE_DATA_URL =
        atob(DATA_SECRET);


    const FIREBASE_WASM_URL =
        atob(WASM_SECRET);


    /* =========================================================
       LOADING UI
    ========================================================== */

    function setLoading(
        message,
        progress
    ) {

        const messageElement =
            document.getElementById(
                "loading-message"
            );

        const progressElement =
            document.getElementById(
                "loader-percentage"
            );


        if (messageElement) {

            messageElement.textContent =
                message;
        }


        if (progressElement) {

            progressElement.textContent =
                progress || "";
        }
    }


    function showLoadingError(
        error
    ) {

        console.error(
            "[BuildNow] Fatal error:",
            error
        );


        const errorElement =
            document.getElementById(
                "loading-error"
            );


        if (!errorElement) {
            return;
        }


        let message =
            "Unknown initialization error.";


        if (
            error &&
            typeof error.message ===
            "string"
        ) {

            message =
                error.message;

        } else if (error) {

            message =
                String(error);
        }


        errorElement.textContent =
            "BuildNow GG could not start: " +
            message;


        errorElement.style.display =
            "block";
    }


    /* =========================================================
       SCRIPT LOADER
    ========================================================== */

    function loadScript(
        src
    ) {

        return new Promise(
            function (
                resolve,
                reject
            ) {

                const existingScript =
                    document.querySelector(
                        'script[src="' +
                        src +
                        '"]'
                    );


                if (existingScript) {

                    if (
                        existingScript.dataset.loaded ===
                        "true"
                    ) {

                        resolve();

                        return;
                    }


                    existingScript.addEventListener(
                        "load",
                        function () {
                            resolve();
                        },
                        {
                            once: true
                        }
                    );


                    existingScript.addEventListener(
                        "error",
                        function () {

                            reject(
                                new Error(
                                    "Failed to load " +
                                    src
                                )
                            );

                        },
                        {
                            once: true
                        }
                    );


                    return;
                }


                const script =
                    document.createElement(
                        "script"
                    );


                script.src =
                    src;

                script.async =
                    false;


                script.onload =
                    function () {

                        script.dataset.loaded =
                            "true";

                        resolve();
                    };


                script.onerror =
                    function () {

                        reject(
                            new Error(
                                "Failed to load " +
                                src
                            )
                        );
                    };


                document.head.appendChild(
                    script
                );
            }
        );
    }


    /* =========================================================
       ASSET DOWNLOADER
    ========================================================== */

    async function downloadAssetToBlob(
        url,
        progressCallback
    ) {

        console.log(
            "[BuildNow] Downloading asset:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Asset download failed. HTTP " +
                response.status
            );
        }


        if (!response.body) {

            throw new Error(
                "Streaming asset downloads are not supported by this browser."
            );
        }


        const reader =
            response.body.getReader();


        const contentLength =
            Number(
                response.headers.get(
                    "Content-Length"
                )
            ) || 0;


        const chunks = [];

        let receivedLength =
            0;


        while (true) {

            const result =
                await reader.read();


            if (result.done) {

                break;
            }


            chunks.push(
                result.value
            );


            receivedLength +=
                result.value.length;


            if (
                contentLength > 0 &&
                typeof progressCallback ===
                "function"
            ) {

                progressCallback(
                    receivedLength /
                    contentLength
                );
            }
        }


        const blob =
            new Blob(
                chunks
            );


        return URL.createObjectURL(
            blob
        );
    }


    /* =========================================================
       UNITY STARTUP
    ========================================================== */

    async function prebootApplication() {

        /*
         * Prevent duplicate startup.
         */

        if (
            unityStarting ||
            unityStarted
        ) {

            console.warn(
                "[BuildNow] Unity startup already requested."
            );

            return;
        }


        unityStarting =
            true;


        try {

            /* -------------------------------------------------
               STEP 1
            ------------------------------------------------- */

            setLoading(
                "Preparing BuildNow GG...",
                "Initializing SDK..."
            );


            if (
                typeof Crazygames ===
                "undefined"
            ) {

                throw new Error(
                    "The required Crazygames global could not be created."
                );
            }


            console.log(
                "[BuildNow] Crazygames is available."
            );


            /* -------------------------------------------------
               STEP 2
               Initialize legacy SDK compatibility.
            ------------------------------------------------- */

            if (
                typeof Crazygames.init ===
                "function"
            ) {

                try {

                    await Crazygames.init();

                } catch (error) {

                    console.warn(
                        "[BuildNow] Crazygames initialization warning:",
                        error
                    );
                }
            }


            /* -------------------------------------------------
               STEP 3
               Download DATA.
            ------------------------------------------------- */

            setLoading(
                "Downloading game data...",
                "Assets Pack: 0%"
            );


            const localDataBlobUrl =
                await downloadAssetToBlob(
                    FIREBASE_DATA_URL,
                    function (
                        progress
                    ) {

                        setLoading(
                            "Downloading game data...",
                            "Assets Pack: " +
                            Math.floor(
                                progress *
                                100
                            ) +
                            "%"
                        );
                    }
                );


            console.log(
                "[BuildNow] DATA asset ready."
            );


            /* -------------------------------------------------
               STEP 4
               Download WASM.
            ------------------------------------------------- */

            setLoading(
                "Downloading engine...",
                "Engine Core: 0%"
            );


            const localWasmBlobUrl =
                await downloadAssetToBlob(
                    FIREBASE_WASM_URL,
                    function (
                        progress
                    ) {

                        setLoading(
                            "Downloading engine...",
                            "Engine Core: " +
                            Math.floor(
                                progress *
                                100
                            ) +
                            "%"
                        );
                    }
                );


            console.log(
                "[BuildNow] WASM asset ready."
            );


            /* -------------------------------------------------
               STEP 5
               Unity configuration.
            ------------------------------------------------- */

            setLoading(
                "Preparing WebGL...",
                "Loading Unity..."
            );


            const config = {

                dataUrl:
                    localDataBlobUrl,

                codeUrl:
                    localWasmBlobUrl,

                frameworkUrl:
                    "./BuildNow.framework.js.br",

                streamingAssetsUrl:
                    "./StreamingAssets",

                companyName:
                    "battlelab",

                productName:
                    "BuildNow GG",

                productVersion:
                    "1.0"
            };


            console.log(
                "[BuildNow] Unity configuration prepared."
            );


            /* -------------------------------------------------
               STEP 6
               Canvas.
            ------------------------------------------------- */

            const canvas =
                document.getElementById(
                    "unity-canvas"
                );


            if (!canvas) {

                throw new Error(
                    "Unity canvas was not found."
                );
            }


            canvas.style.display =
                "block";


            /* -------------------------------------------------
               STEP 7
               Load Unity loader.
            ------------------------------------------------- */

            setLoading(
                "Starting BuildNow GG...",
                "Loading Unity loader..."
            );


            await loadScript(
                "./BuildNow.loader.js"
            );


            if (
                typeof window.createUnityInstance !==
                "function"
            ) {

                throw new Error(
                    "BuildNow.loader.js loaded, but createUnityInstance() is unavailable."
                );
            }


            console.log(
                "[BuildNow] Unity loader loaded."
            );


            /* -------------------------------------------------
               STEP 8
               Create Unity instance.
            ------------------------------------------------- */

            setLoading(
                "Starting BuildNow GG...",
                "Initializing Unity..."
            );


            const unityInstance =
                await window.createUnityInstance(
                    canvas,
                    config,
                    function (
                        progress
                    ) {

                        setLoading(
                            "Starting BuildNow GG...",
                            "Unity: " +
                            Math.floor(
                                progress *
                                100
                            ) +
                            "%"
                        );
                    }
                );


            /* -------------------------------------------------
               STEP 9
               Save instance.
            ------------------------------------------------- */

            window.myGlobalUnityInstance =
                unityInstance;


            unityStarted =
                true;


            unityStarting =
                false;


            console.log(
                "[BuildNow] Unity initialized successfully."
            );


            /* -------------------------------------------------
               STEP 10
               Hide loading screen.
            ------------------------------------------------- */

            const overlay =
                document.getElementById(
                    "loading-overlay"
                );


            if (overlay) {

                overlay.style.display =
                    "none";
            }

        } catch (error) {

            unityStarting =
                false;

            showLoadingError(
                error
            );
        }
    }


    /* =========================================================
       GLOBAL ERROR HANDLERS
    ========================================================== */

    window.addEventListener(
        "error",
        function (
            event
        ) {

            console.error(
                "[BuildNow] Window error:",
                event.error ||
                event.message
            );
        }
    );


    window.addEventListener(
        "unhandledrejection",
        function (
            event
        ) {

            console.error(
                "[BuildNow] Unhandled promise rejection:",
                event.reason
            );
        }
    );


    /* =========================================================
       START APPLICATION ONCE
    ========================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            prebootApplication,
            {
                once: true
            }
        );

    } else {

        prebootApplication();
    }

</script>

</body>
</html>
