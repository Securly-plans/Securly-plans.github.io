<!-- =========================================================
     BUILDNOW APPLICATION
========================================================== -->

<script>
    "use strict";


    /* =========================================================
       UNITY STATE
    ========================================================== */

    window.myGlobalUnityInstance = null;

    let unityStarting = false;
    let unityStarted = false;


    /* =========================================================
       FIREBASE ASSET URLS
    ========================================================== */

    const DATA_SECRET =
        "aHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vdjAvYi9zZWN1cmx5LXBsYW5zLW1haW4uZmlyZWJhc2VzdG9yYWdlLmFwcC9vL0J1aWxkTm93LmRhdGEuYnI/YWx0PW1lZGlh";


    const WASM_SECRET =
        "aHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vdjAvYi9zZWN1cmx5LXBsYW5zLW1haW4uZmlyZWJhc2VzdG9yYWdlLmFwcC9vL0J1aWxkTm93Lndhc20uYnI/YWx0PW1lZGlh";


    const FIREBASE_DATA_URL =
        atob(DATA_SECRET);


    const FIREBASE_WASM_URL =
        atob(WASM_SECRET);


    /* =========================================================
       LOADING UI
    ========================================================== */

    function setLoading(
        message,
        progress
    ) {

        const messageElement =
            document.getElementById(
                "loading-message"
            );

        const progressElement =
            document.getElementById(
                "loader-percentage"
            );


        if (messageElement) {

            messageElement.textContent =
                message;
        }


        if (progressElement) {

            progressElement.textContent =
                progress || "";
        }
    }


    function showLoadingError(
        error
    ) {

        console.error(
            "[BuildNow] Fatal error:",
            error
        );


        const errorElement =
            document.getElementById(
                "loading-error"
            );


        if (!errorElement) {
            return;
        }


        let message =
            "Unknown initialization error.";


        if (
            error &&
            typeof error.message ===
            "string"
        ) {

            message =
                error.message;

        } else if (error) {

            message =
                String(error);
        }


        errorElement.textContent =
            "BuildNow GG could not start: " +
            message;


        errorElement.style.display =
            "block";
    }


    /* =========================================================
       SCRIPT LOADER
    ========================================================== */

    function loadScript(
        src
    ) {

        return new Promise(
            function (
                resolve,
                reject
            ) {

                const existingScript =
                    document.querySelector(
                        'script[src="' +
                        src +
                        '"]'
                    );


                if (existingScript) {

                    if (
                        existingScript.dataset.loaded ===
                        "true"
                    ) {

                        resolve();

                        return;
                    }


                    existingScript.addEventListener(
                        "load",
                        function () {

                            resolve();

                        },
                        {
                            once: true
                        }
                    );


                    existingScript.addEventListener(
                        "error",
                        function () {

                            reject(
                                new Error(
                                    "Failed to load " +
                                    src
                                )
                            );

                        },
                        {
                            once: true
                        }
                    );


                    return;
                }


                const script =
                    document.createElement(
                        "script"
                    );


                script.src =
                    src;

                script.async =
                    false;


                script.onload =
                    function () {

                        script.dataset.loaded =
                            "true";

                        resolve();
                    };


                script.onerror =
                    function () {

                        reject(
                            new Error(
                                "Failed to load " +
                                src
                            )
                        );
                    };


                document.head.appendChild(
                    script
                );
            }
        );
    }


    /* =========================================================
       DOWNLOAD FIREBASE ASSET
    ========================================================== */

    async function downloadAssetToBlob(
        url,
        progressCallback
    ) {

        console.log(
            "[BuildNow] Downloading asset:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Asset download failed. HTTP " +
                response.status
            );
        }


        if (!response.body) {

            throw new Error(
                "Streaming asset downloads are not supported."
            );
        }


        const reader =
            response.body.getReader();


        const contentLength =
            Number(
                response.headers.get(
                    "Content-Length"
                )
            ) || 0;


        const chunks = [];


        let receivedLength =
            0;


        while (true) {

            const result =
                await reader.read();


            if (result.done) {

                break;
            }


            chunks.push(
                result.value
            );


            receivedLength +=
                result.value.length;


            if (
                contentLength > 0 &&
                typeof progressCallback ===
                "function"
            ) {

                progressCallback(
                    receivedLength /
                    contentLength
                );
            }
        }


        const blob =
            new Blob(
                chunks
            );


        return URL.createObjectURL(
            blob
        );
    }


    /* =========================================================
       START UNITY
    ========================================================== */

    async function prebootApplication() {

        /*
         * Never create two Unity instances.
         */

        if (
            unityStarting ||
            unityStarted
        ) {

            console.warn(
                "[BuildNow] Unity startup already requested."
            );

            return;
        }


        unityStarting =
            true;


        try {

            /* -------------------------------------------------
               VERIFY CRAZYGAMES
            ------------------------------------------------- */

            setLoading(
                "Preparing BuildNow GG...",
                "Initializing SDK..."
            );


            if (
                typeof Crazygames ===
                "undefined"
            ) {

                throw new Error(
                    "Crazygames global is unavailable."
                );
            }


            if (
                typeof Crazygames.gameplayStart !==
                "function"
            ) {

                throw new Error(
                    "Crazygames.gameplayStart is unavailable."
                );
            }


            if (
                typeof Crazygames.gameplayStop !==
                "function"
            ) {

                throw new Error(
                    "Crazygames.gameplayStop is unavailable."
                );
            }


            console.log(
                "[BuildNow] Required Crazygames functions are available."
            );


            /* -------------------------------------------------
               INITIALIZE
            ------------------------------------------------- */

            if (
                typeof Crazygames.init ===
                "function"
            ) {

                try {

                    await Crazygames.init();

                } catch (error) {

                    console.warn(
                        "[BuildNow] Crazygames initialization warning:",
                        error
                    );
                }
            }


            /* -------------------------------------------------
               DATA
            ------------------------------------------------- */

            setLoading(
                "Downloading game data...",
                "Assets Pack: 0%"
            );


            const localDataBlobUrl =
                await downloadAssetToBlob(
                    FIREBASE_DATA_URL,
                    function (
                        progress
                    ) {

                        setLoading(
                            "Downloading game data...",
                            "Assets Pack: " +
                            Math.floor(
                                progress *
                                100
                            ) +
                            "%"
                        );
                    }
                );


            console.log(
                "[BuildNow] DATA asset ready."
            );


            /* -------------------------------------------------
               WASM
            ------------------------------------------------- */

            setLoading(
                "Downloading engine...",
                "Engine Core: 0%"
            );


            const localWasmBlobUrl =
                await downloadAssetToBlob(
                    FIREBASE_WASM_URL,
                    function (
                        progress
                    ) {

                        setLoading(
                            "Downloading engine...",
                            "Engine Core: " +
                            Math.floor(
                                progress *
                                100
                            ) +
                            "%"
                        );
                    }
                );


            console.log(
                "[BuildNow] WASM asset ready."
            );


            /* -------------------------------------------------
               UNITY CONFIG
            ------------------------------------------------- */

            setLoading(
                "Preparing WebGL...",
                "Loading Unity..."
            );


            const config = {

                dataUrl:
                    localDataBlobUrl,

                codeUrl:
                    localWasmBlobUrl,

                frameworkUrl:
                    "./BuildNow.framework.js.br",

                streamingAssetsUrl:
                    "./StreamingAssets",

                companyName:
                    "battlelab",

                productName:
                    "BuildNow GG",

                productVersion:
                    "1.0"
            };


            console.log(
                "[BuildNow] Unity configuration prepared."
            );


            /* -------------------------------------------------
               CANVAS
            ------------------------------------------------- */

            const canvas =
                document.getElementById(
                    "unity-canvas"
                );


            if (!canvas) {

                throw new Error(
                    "Unity canvas was not found."
                );
            }


            canvas.style.display =
                "block";


            /* -------------------------------------------------
               UNITY LOADER
            ------------------------------------------------- */

            setLoading(
                "Starting BuildNow GG...",
                "Loading Unity loader..."
            );


            await loadScript(
                "./BuildNow.loader.js"
            );


            if (
                typeof window.createUnityInstance !==
                "function"
            ) {

                throw new Error(
                    "BuildNow.loader.js loaded, but createUnityInstance() is unavailable."
                );
            }


            console.log(
                "[BuildNow] Unity loader loaded."
            );


            /* -------------------------------------------------
               CREATE UNITY INSTANCE
            ------------------------------------------------- */

            setLoading(
                "Starting BuildNow GG...",
                "Initializing Unity..."
            );


            const unityInstance =
                await window.createUnityInstance(
                    canvas,
                    config,
                    function (
                        progress
                    ) {

                        setLoading(
                            "Starting BuildNow GG...",
                            "Unity: " +
                            Math.floor(
                                progress *
                                100
                            ) +
                            "%"
                        );
                    }
                );


            /* -------------------------------------------------
               SAVE UNITY INSTANCE
            ------------------------------------------------- */

            window.myGlobalUnityInstance =
                unityInstance;


            unityStarted =
                true;


            unityStarting =
                false;


            console.log(
                "[BuildNow] Unity initialized successfully."
            );


            /* -------------------------------------------------
               HIDE LOADING SCREEN
            ------------------------------------------------- */

            const overlay =
                document.getElementById(
                    "loading-overlay"
                );


            if (overlay) {

                overlay.style.display =
                    "none";
            }

        } catch (error) {

            unityStarting =
                false;

            showLoadingError(
                error
            );
        }
    }


    /* =========================================================
       ERROR HANDLERS
    ========================================================== */

    window.addEventListener(
        "error",
        function (
            event
        ) {

            console.error(
                "[BuildNow] Window error:",
                event.error ||
                event.message
            );
        }
    );


    window.addEventListener(
        "unhandledrejection",
        function (
            event
        ) {

            console.error(
                "[BuildNow] Unhandled promise rejection:",
                event.reason
            );
        }
    );


    /* =========================================================
       START ONCE
    ========================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            prebootApplication,
            {
                once: true
            }
        );

    } else {

        prebootApplication();
    }

</script>
