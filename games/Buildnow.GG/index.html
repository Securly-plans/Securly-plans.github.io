<!DOCTYPE html> 
<html lang="en-us"> 
<head> 
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>BuildNow GG</title> 
    <style> 
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; } 
        #unity-canvas { width: 100%; height: 100%; background: #000; } 
    </style>

    <script>
        // --- HARD RESOURCE INTERCEPTOR FORCE LAYER ---
        const FIREBASE_DATA_URL = "https://googleapis.com";
        const FIREBASE_WASM_URL = "https://googleapis.com";

        // 1. Force override Fetch requests entirely by ignoring broken request objects
        const originalFetch = window.fetch;
        window.fetch = async function(input, init) {
            let urlString = "";
            if (typeof input === 'string') urlString = input;
            else if (input instanceof Request) urlString = input.url;
            else if (input instanceof URL) urlString = input.href;

            if (urlString.includes('googleapis.com') || urlString.includes('BuildNow.data.br') || urlString.includes('BuildNow.wasm.br')) {
                // If it asks for the Wasm file or a broken googleapis loop containing wasm context
                if (urlString.includes('wasm') || (init && init.headers && JSON.stringify(init.headers).includes('wasm'))) {
                    console.log("Forcing fresh Fetch stream to Firebase WASM...");
                    return originalFetch.call(this, FIREBASE_WASM_URL);
                } else {
                    console.log("Forcing fresh Fetch stream to Firebase DATA Pack...");
                    return originalFetch.call(this, FIREBASE_DATA_URL);
                }
            }
            return originalFetch.call(this, input, init);
        };

        // 2. Force override XHR open calls by throwing away the broken URL strings
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (typeof url === 'string') {
                if (url.includes('googleapis.com') || url.includes('BuildNow.data.br') || url.includes('BuildNow.wasm.br')) {
                    if (url.includes('wasm')) {
                        console.log("Forcing raw XHR redirect -> Firebase WASM...");
                        url = FIREBASE_WASM_URL;
                    } else {
                        console.log("Forcing raw XHR redirect -> Firebase DATA Pack...");
                        url = FIREBASE_DATA_URL;
                    }
                }
            }
            return originalOpen.apply(this, [method, url, ...rest]);
        };
    </script>

    <!-- Load the clean loader script natively from your GitHub repo --> 
    <script src="./BuildNow.loader.js"></script> 
</head> 
<body> 
    <canvas id="unity-canvas"></canvas> 
    <script> 
        window.myGlobalUnityInstance = null; 

        var config = { 
            dataUrl: "./BuildNow.data.br", 
            codeUrl: "./BuildNow.wasm.br", 
            frameworkUrl: "./BuildNow.framework.js.br", 
            streamingAssetsUrl: "StreamingAssets", 
            companyName: "battlelab", 
            productName: "BuildNow GG", 
            productVersion: "1.0" 
        }; 

        const canvas = document.querySelector("#unity-canvas"); 

        createUnityInstance(canvas, config, (progress) => { 
            console.log("Streaming BuildNow GG Engine: " + Math.floor(100 * progress) + "%"); 
        }).then((unityInstance) => { 
            window.myGlobalUnityInstance = unityInstance; 
            console.log("BuildNow GG Global Instance Live and Ready!"); 
        }).catch((message) => { 
            console.error("Unity boot crash exception logged:", message); 
        }); 
    </script> 
</body> 
</html>
