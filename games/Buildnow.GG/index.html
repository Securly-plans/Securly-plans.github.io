<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildNow GG</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #unity-canvas { width: 100%; height: 100%; background: #000; }
    </style>

    <!-- Load the clean, uncorrupted loader script directly from your local repository folder -->
    <script src="./WebGLBrotli.czy.loader.js"></script>
</head>
<body>

    <canvas id="unity-canvas"></canvas>

    <script>
        // 1. Declare your requested global variables hook
        window.myGlobalUnityInstance = null;

        // 2. Define the localized configuration maps targeting your GitHub repository files
        var config = {
            dataUrl: "./YourDataFile.data.br",                  // Replace with your exact filename
            codeUrl: "./YourWasmFile.wasm.br",                  // Replace with your exact filename
            frameworkUrl: "./WebGLBrotli.czy.framework.js.br",  // Replace with your exact filename
            streamingAssetsUrl: "StreamingAssets",
            companyName: "battlelab",
            productName: "BuildNow GG",
            productVersion: "1.0"
        };

        const canvas = document.querySelector("#unity-canvas");

        // 3. Fire up the localized execution engine instance
        createUnityInstance(canvas, config, (progress) => {
            console.log("Loading BuildNow GG Locally: " + Math.floor(100 * progress) + "%");
        }).then((unityInstance) => {
            // Assign instance data to the window object global memory segment
            window.myGlobalUnityInstance = unityInstance;
            console.log("BuildNow GG Initialization Finalized. Engine live on window.myGlobalUnityInstance!");
        }).catch((message) => {
            console.error("Unity local runtime startup exception:", message);
        });
    </script>
</body>
</html>
