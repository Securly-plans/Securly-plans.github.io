<!DOCTYPE html>

<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuildNow GG</title>

<style>
    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        display: none;
        background: #000;
    }

    #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #111;
        color: #fff;

        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }

    #loading-message {
        font-size: 24px;
        font-weight: 700;
    }

    #loader-percentage {
        margin-top: 12px;
        font-size: 17px;
        font-weight: 400;
    }

    #loading-error {
        display: none;

        width: min(700px, 90vw);
        margin-top: 20px;
        padding: 14px;

        box-sizing: border-box;

        background: #240000;
        border: 1px solid #ff4444;
        border-radius: 5px;

        color: #ff7777;
        font-size: 14px;
        line-height: 1.5;

        word-break: break-word;
    }
</style>

</head>

<body>

<!-- =========================================================
     LOADING SCREEN
========================================================== -->

<div id="loading-overlay">

    <div id="loading-message">
        Loading BuildNow GG...
    </div>

    <div id="loader-percentage">
        Initializing...
    </div>

    <div id="loading-error"></div>

</div>


<!-- =========================================================
     UNITY CANVAS
========================================================== -->

<canvas id="unity-canvas"></canvas>


<script>
    "use strict";


    /* =========================================================
       GLOBAL UNITY STATE
    ========================================================== */

    window.myGlobalUnityInstance = null;

    let unityStarting = false;
    let unityStarted = false;


    /* =========================================================
       CRAZYGAMES COMPATIBILITY

       The compiled BuildNow framework is attempting to access:

           Crazygames

       rather than:

           CrazyGames

       Therefore we provide the legacy global BEFORE Unity
       starts.

       This is a self-hosted compatibility layer. It does not
       attempt to impersonate the CrazyGames website or provide
       actual CrazyGames advertisements/accounts.
    ========================================================== */

    (function installCrazyGamesCompatibility() {

        if (
            typeof window.Crazygames !== "undefined" &&
            window.Crazygames !== null
        ) {
            console.log(
                "[BuildNow] Existing Crazygames object detected."
            );

            return;
        }


        console.warn(
            "[BuildNow] Crazygames SDK was not detected. " +
            "Installing self-hosted compatibility layer."
        );


        window.Crazygames = {

            /* -------------------------------------------------
               Basic initialization
            ------------------------------------------------- */

            init: function () {

                console.log(
                    "[BuildNow] Crazygames compatibility initialized."
                );

                return Promise.resolve();
            },


            initialize: function () {

                console.log(
                    "[BuildNow] Crazygames.initialize() called."
                );

                return Promise.resolve();
            },


            /* -------------------------------------------------
               Environment
            ------------------------------------------------- */

            environment: "disabled",

            isEnabled: false,

            isAvailable: false,


            /* -------------------------------------------------
               Game
            ------------------------------------------------- */

            game: {

                gameplayStart: function () {
                    console.log(
                        "[BuildNow] gameplayStart()"
                    );
                },

                gameplayStop: function () {
                    console.log(
                        "[BuildNow] gameplayStop()"
                    );
                },

                happytime: function () {
                    console.log(
                        "[BuildNow] happytime()"
                    );
                },

                pause: function () {},

                resume: function () {},

                getInviteParam: function () {
                    return null;
                }
            },


            /* -------------------------------------------------
               Advertisement compatibility
            ------------------------------------------------- */

            ad: {

                requestAd: function () {

                    console.log(
                        "[BuildNow] Ad request ignored " +
                        "(self-hosted version)."
                    );

                    return Promise.resolve();
                },

                showAd: function () {

                    console.log(
                        "[BuildNow] showAd() ignored " +
                        "(self-hosted version)."
                    );

                    return Promise.resolve();
                }
            },


            /* -------------------------------------------------
               Banner compatibility
            ------------------------------------------------- */

            banner: {

                requestBanner: function () {},

                showBanner: function () {},

                hideBanner: function () {},

                clearBanner: function () {}
            },


            /* -------------------------------------------------
               User compatibility
            ------------------------------------------------- */

            user: {

                isUserAccountAvailable: false,

                isUserLoggedIn: false,

                getUser: function () {
                    return Promise.resolve(null);
                },

                getSystemInfo: function () {
                    return Promise.resolve(null);
                }
            },


            /* -------------------------------------------------
               Data compatibility
            ------------------------------------------------- */

            data: {

                getItem: function (key) {

                    try {
                        return localStorage.getItem(key);
                    } catch (error) {
                        return null;
                    }
                },

                setItem: function (key, value) {

                    try {
                        localStorage.setItem(
                            key,
                            String(value)
                        );
                    } catch (error) {
                        console.warn(
                            "[BuildNow] localStorage write failed:",
                            error
                        );
                    }
                },

                removeItem: function (key) {

                    try {
                        localStorage.removeItem(key);
                    } catch (error) {}
                },

                clear: function () {

                    try {
                        localStorage.clear();
                    } catch (error) {}
                }
            },


            /* -------------------------------------------------
               Storage compatibility
            ------------------------------------------------- */

            storage: {

                getItem: function (key) {

                    try {
                        return localStorage.getItem(key);
                    } catch (error) {
                        return null;
                    }
                },

                setItem: function (key, value) {

                    try {
                        localStorage.setItem(
                            key,
                            String(value)
                        );
                    } catch (error) {}
                },

                removeItem: function (key) {

                    try {
                        localStorage.removeItem(key);
                    } catch (error) {}
                }
            }
        };


        /*
         * Some older integrations use a lowercase global
         * directly rather than window.Crazygames.
         */
        try {
            window.Crazygames = window.Crazygames;
        } catch (error) {
            console.error(
                "[BuildNow] Could not expose Crazygames:",
                error
            );
        }

    })();


    /* =========================================================
       FIREBASE ASSET URLS
    ========================================================== */

    const DATA_SECRET =
        "aHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vdjAvYi9zZWN1cmx5LXBsYW5zLW1haW4uZmlyZWJhc2VzdG9yYWdlLmFwcC9vL0J1aWxkTm93LmRhdGEuYnI/YWx0PW1lZGlh";


    const WASM_SECRET =
        "aHR0cHM6Ly9maXJlYmFzZXN0b3JhZ2UuZ29vZ2xlYXBpcy5jb20vdjAvYi9zZWN1cmx5LXBsYW5zLW1haW4uZmlyZWJhc2VzdG9yYWdlLmFwcC9vL0J1aWxkTm93Lndhc20uYnI/YWx0PW1lZGlh";


    const FIREBASE_DATA_URL =
        atob(DATA_SECRET);


    const FIREBASE_WASM_URL =
        atob(WASM_SECRET);


    /* =========================================================
       UI FUNCTIONS
    ========================================================== */

    function setLoading(message, progress) {

        const messageElement =
            document.getElementById(
                "loading-message"
            );

        const progressElement =
            document.getElementById(
                "loader-percentage"
            );


        if (messageElement) {
            messageElement.textContent =
                message;
        }


        if (progressElement) {
            progressElement.textContent =
                progress || "";
        }
    }


    function showLoadingError(error) {

        console.error(
            "[BuildNow] Fatal initialization error:",
            error
        );


        const errorElement =
            document.getElementById(
                "loading-error"
            );


        if (!errorElement) {
            return;
        }


        let message =
            "Unknown initialization error.";


        if (
            error &&
            typeof error.message === "string"
        ) {
            message = error.message;
        } else if (error) {
            message = String(error);
        }


        errorElement.textContent =
            "BuildNow GG could not start: " +
            message;


        errorElement.style.display =
            "block";
    }


    /* =========================================================
       SCRIPT LOADER
    ========================================================== */

    function loadScript(src) {

        return new Promise(
            function (resolve, reject) {

                /*
                 * Don't load the same script twice.
                 */

                const existingScript =
                    document.querySelector(
                        'script[src="' +
                        src +
                        '"]'
                    );


                if (existingScript) {

                    if (
                        existingScript.dataset.loaded ===
                        "true"
                    ) {

                        resolve();

                        return;
                    }


                    existingScript.addEventListener(
                        "load",
                        function () {
                            resolve();
                        },
                        {
                            once: true
                        }
                    );


                    existingScript.addEventListener(
                        "error",
                        function () {

                            reject(
                                new Error(
                                    "Failed to load " +
                                    src
                                )
                            );

                        },
                        {
                            once: true
                        }
                    );


                    return;
                }


                const script =
                    document.createElement(
                        "script"
                    );


                script.src = src;

                script.async = false;


                script.onload =
                    function () {

                        script.dataset.loaded =
                            "true";

                        resolve();
                    };


                script.onerror =
                    function () {

                        reject(
                            new Error(
                                "Failed to load " +
                                src
                            )
                        );
                    };


                document.head.appendChild(
                    script
                );
            }
        );
    }


    /* =========================================================
       ASSET DOWNLOADER
    ========================================================== */

    async function downloadAssetToBlob(
        url,
        progressCallback
    ) {

        console.log(
            "[BuildNow] Downloading:",
            url
        );


        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Asset download failed. HTTP " +
                response.status +
                " for " +
                url
            );
        }


        if (!response.body) {

            throw new Error(
                "The browser does not support " +
                "streaming asset downloads."
            );
        }


        const reader =
            response.body.getReader();


        const contentLength =
            Number(
                response.headers.get(
                    "Content-Length"
                )
            ) || 0;


        const chunks = [];


        let receivedLength = 0;


        while (true) {

            const result =
                await reader.read();


            if (result.done) {
                break;
            }


            chunks.push(
                result.value
            );


            receivedLength +=
                result.value.length;


            if (
                contentLength > 0 &&
                typeof progressCallback ===
                "function"
            ) {

                progressCallback(
                    receivedLength /
                    contentLength
                );
            }
        }


        const blob =
            new Blob(
                chunks
            );


        return URL.createObjectURL(
            blob
        );
    }


    /* =========================================================
       UNITY STARTUP
    ========================================================== */

    async function prebootApplication() {

        /*
         * Prevent duplicate Unity instances.
         */

        if (
            unityStarting ||
            unityStarted
        ) {

            console.warn(
                "[BuildNow] Unity startup already in progress."
            );

            return;
        }


        unityStarting = true;


        try {

            /* ---------------------------------------------
               STEP 1
               Verify Crazygames compatibility exists.
            --------------------------------------------- */

            setLoading(
                "Preparing BuildNow GG...",
                "Initializing..."
            );


            if (
                typeof window.Crazygames ===
                "undefined"
            ) {

                throw new Error(
                    "Crazygames compatibility object could not be created."
                );
            }


            console.log(
                "[BuildNow] Crazygames object:",
                window.Crazygames
            );


            /* ---------------------------------------------
               STEP 2
               Initialize compatibility layer.
            --------------------------------------------- */

            if (
                typeof window.Crazygames.init ===
                "function"
            ) {

                try {

                    await window.Crazygames.init();

                } catch (error) {

                    console.warn(
                        "[BuildNow] Crazygames init warning:",
                        error
                    );
                }
            }


            /* ---------------------------------------------
               STEP 3
               Download DATA
            --------------------------------------------- */

            setLoading(
                "Downloading game data...",
                "Assets Pack: 0%"
            );


            const localDataBlobUrl =
                await downloadAssetToBlob(
                    FIREBASE_DATA_URL,
                    function (progress) {

                        setLoading(
                            "Downloading game data...",
                            "Assets Pack: " +
                            Math.floor(
                                progress * 100
                            ) +
                            "%"
                        );
                    }
                );


            console.log(
                "[BuildNow] Data asset ready."
            );


            /* ---------------------------------------------
               STEP 4
               Download WASM
            --------------------------------------------- */

            setLoading(
                "Downloading engine...",
                "Engine Core: 0%"
            );


            const localWasmBlobUrl =
                await downloadAssetToBlob(
                    FIREBASE_WASM_URL,
                    function (progress) {

                        setLoading(
                            "Downloading engine...",
                            "Engine Core: " +
                            Math.floor(
                                progress * 100
                            ) +
                            "%"
                        );
                    }
                );


            console.log(
                "[BuildNow] WASM asset ready."
            );


            /* ---------------------------------------------
               STEP 5
               Build Unity configuration
            --------------------------------------------- */

            setLoading(
                "Preparing WebGL...",
                "Loading Unity..."
            );


            const config = {

                dataUrl:
                    localDataBlobUrl,

                codeUrl:
                    localWasmBlobUrl,

                frameworkUrl:
                    "./BuildNow.framework.js.br",

                streamingAssetsUrl:
                    "./StreamingAssets",

                companyName:
                    "battlelab",

                productName:
                    "BuildNow GG",

                productVersion:
                    "1.0"
            };


            console.log(
                "[BuildNow] Unity configuration:",
                config
            );


            /* ---------------------------------------------
               STEP 6
               Get canvas
            --------------------------------------------- */

            const canvas =
                document.getElementById(
                    "unity-canvas"
                );


            if (!canvas) {

                throw new Error(
                    "Unity canvas was not found."
                );
            }


            canvas.style.display =
                "block";


            /* ---------------------------------------------
               STEP 7
               Load Unity loader
            --------------------------------------------- */

            setLoading(
                "Starting BuildNow GG...",
                "Loading Unity loader..."
            );


            await loadScript(
                "./BuildNow.loader.js"
            );


            if (
                typeof window.createUnityInstance !==
                "function"
            ) {

                throw new Error(
                    "BuildNow.loader.js loaded, " +
                    "but createUnityInstance() is unavailable."
                );
            }


            console.log(
                "[BuildNow] Unity loader loaded."
            );


            /* ---------------------------------------------
               STEP 8
               Create Unity instance
            --------------------------------------------- */

            setLoading(
                "Starting BuildNow GG...",
                "Initializing Unity..."
            );


            const unityInstance =
                await window.createUnityInstance(
                    canvas,
                    config,
                    function (progress) {

                        setLoading(
                            "Starting BuildNow GG...",
                            "Unity: " +
                            Math.floor(
                                progress * 100
                            ) +
                            "%"
                        );
                    }
                );


            /* ---------------------------------------------
               STEP 9
               Save instance
            --------------------------------------------- */

            window.myGlobalUnityInstance =
                unityInstance;


            unityStarted =
                true;


            unityStarting =
                false;


            console.log(
                "[BuildNow] Unity initialized successfully."
            );


            /* ---------------------------------------------
               STEP 10
               Hide loading screen
            --------------------------------------------- */

            const overlay =
                document.getElementById(
                    "loading-overlay"
                );


            if (overlay) {

                overlay.style.display =
                    "none";
            }

        } catch (error) {

            unityStarting =
                false;

            showLoadingError(
                error
            );
        }
    }


    /* =========================================================
       GLOBAL ERROR HANDLING
    ========================================================== */

    window.addEventListener(
        "error",
        function (event) {

            console.error(
                "[BuildNow] Window error:",
                event.error ||
                event.message
            );
        }
    );


    window.addEventListener(
        "unhandledrejection",
        function (event) {

            console.error(
                "[BuildNow] Unhandled promise rejection:",
                event.reason
            );
        }
    );


    /* =========================================================
       START APPLICATION EXACTLY ONCE
    ========================================================== */

    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            prebootApplication,
            {
                once: true
            }
        );

    } else {

        prebootApplication();
    }

</script>

</body>
</html>
