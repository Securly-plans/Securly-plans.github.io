<!DOCTYPE html> 
<html lang="en-us"> 
<head> 
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>BuildNow GG</title> 
    <style> 
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; } 
        #unity-canvas { width: 100%; height: 100%; background: #000; } 
        #loading-overlay { position: absolute; color: white; font-family: sans-serif; font-size: 24px; font-weight: bold; text-align: center; }
    </style>
</head> 
<body> 
    <div id="loading-overlay">Bypassing Network Restrictions...<br><span id="loader-percentage">0%</span></div>
    <canvas id="unity-canvas" style="display:none;"></canvas> 

    <script> 
        window.myGlobalUnityInstance = null; 

        // Uses a public, open proxy gateway wrapper to stream assets around the googleapis blocker securely
        const PROXY = "https://corsproxy.io";
        const RAW_DATA = "https://googleapis.com";
        const RAW_WASM = "https://googleapis.com";

        const FIREBASE_DATA_URL = PROXY + encodeURIComponent(RAW_DATA);
        const FIREBASE_WASM_URL = PROXY + encodeURIComponent(RAW_WASM);

        async function downloadAssetToBlob(url, name, progressCallback) {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Proxy gateway network failure! Status: ${response.status}`);
            
            const reader = response.body.getReader();
            const contentLength = +response.headers.get('Content-Length') || 0;
            
            let receivedLength = 0;
            let chunks = []; 
            
            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                chunks.push(value);
                receivedLength += value.length;
                if (contentLength > 0) {
                    progressCallback(receivedLength / contentLength);
                }
            }
            
            const blob = new Blob(chunks);
            return URL.createObjectURL(blob);
        }

        async function prebootApplication() {
            const percentageText = document.getElementById("loader-percentage");
            try {
                // 1. Stream game variables using proxy wrapper tracking channels
                const localDataBlobUrl = await downloadAssetToBlob(FIREBASE_DATA_URL, "Data", (p) => {
                    percentageText.innerText = `Assets Pack: ${Math.floor(p * 100)}%`;
                });

                const localWasmBlobUrl = await downloadAssetToBlob(FIREBASE_WASM_URL, "Wasm", (p) => {
                    percentageText.innerText = `Engine Core: ${Math.floor(p * 100)}%`;
                });

                percentageText.innerText = "Spawning WebGL Elements...";
                
                // 2. Feed our isolated local blob URLs right into the engine configuration blocks
                var config = { 
                    dataUrl: localDataBlobUrl, 
                    codeUrl: localWasmBlobUrl, 
                    frameworkUrl: "./BuildNow.framework.js.br", 
                    streamingAssetsUrl: "StreamingAssets", 
                    companyName: "battlelab", 
                    productName: "BuildNow GG", 
                    productVersion: "1.0" 
                }; 

                document.getElementById("loading-overlay").style.display = "none";
                const canvas = document.querySelector("#unity-canvas"); 
                canvas.style.display = "block";

                // 3. Mount loader only after local files are safely generated in active memory
                const script = document.createElement("script");
                script.src = "./BuildNow.loader.js";
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        console.log("Unity Loader Synchronized: " + Math.floor(100 * progress) + "%");
                    }).then((unityInstance) => {
                        // Map the execution variable context globally
                        window.myGlobalUnityInstance = unityInstance;
                        console.log("BuildNow GG Is Completely Ready and Accessible Natively!");
                    }).catch((message) => {
                        console.error("Unity component compile layout error:", message);
                    });
                };
                document.body.appendChild(script);

            } catch (error) {
                document.getElementById("loading-overlay").innerHTML = `<span style='color:red;'>Initialization Error: ${error.message}</span>`;
                console.error("Critical execution mapping fault:", error);
            }
        }

        window.addEventListener("DOMContentLoaded", prebootApplication);
    </script> 
</body> 
</html>
