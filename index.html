<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emerald</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  width: 320px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  cursor: pointer;
}

.login {
  background: #4caf50;
  color: white;
  border: none;
}

.signup {
  background: #2196f3;
  color: white;
  border: none;
}

/* ================= TOAST SYSTEM ================= */

#toastContainer {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 9999;
}

.toast {
  padding: 12px 14px;
  border-radius: 8px;
  color: white;
  font-size: 14px;
  min-width: 200px;
  animation: slideIn 0.3s ease, fadeOut 0.3s ease 3s forwards;
}

.toast.success { background: #4caf50; }
.toast.error { background: #f44336; }
.toast.info { background: #2196f3; }

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes fadeOut {
  to { opacity: 0; transform: translateX(100%); }
}
</style>

</head>

<body>

<!-- TOAST CONTAINER -->
<div id="toastContainer"></div>

<div class="box">

  <h2>Emerald</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button class="login" id="loginBtn">Login</button>

  <button class="signup" id="signupBtn" disabled>
    This site is invite only. If you don't have an account, or need support with one please contact an admin.
  </button>

</div>

<!-- AUTH -->
<script type="module" src="js/auth.js"></script>

<!-- ================= FIREBASE AUTO REDIRECT ================= -->
<script type="module">

import { db } from "./js/firebase.js";
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const HOME_PAGE = "home.html";
const settingsRef = doc(db, "settings", "appConfig");

let redirected = false;

/* ================= TOAST SYSTEM ================= */
function showToast(message, type = "info") {
  const container = document.getElementById("toastContainer");

  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.innerText = message;

  container.appendChild(toast);

  setTimeout(() => {
    toast.remove();
  }, 3500);
}

/* ================= REDIRECT ================= */

function redirectHome() {
  if (!redirected) {
    redirected = true;
    showToast("Redirecting...", "info");
    window.location.href = HOME_PAGE;
  }
}

function isLoggedIn() {
  return localStorage.getItem("loggedIn") === "true";
}

try {

  onSnapshot(settingsRef, (snap) => {

    const autoRedirect = snap.exists()
      ? snap.data().autoRedirect
      : false;

    if (redirected) return;

    // CASE 1: Admin force redirect
    if (autoRedirect) {
      showToast("Admin redirect enabled", "info");
      redirectHome();
      return;
    }

    // CASE 2: Normal login redirect
    if (isLoggedIn()) {
      showToast("Welcome back!", "success");
      redirectHome();
    }

  }, (error) => {

    console.error("Firestore listener error:", error);

    showToast("Connection issue (offline mode)", "error");

    if (isLoggedIn()) {
      redirectHome();
    }

  });

} catch (e) {

  console.error("Fatal Firebase error:", e);

  showToast("Fatal error loading app", "error");

  if (isLoggedIn()) {
    redirectHome();
  }
}

</script>

</body>
</html>
