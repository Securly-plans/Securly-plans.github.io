<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Securly Plans</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  width: 320px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  cursor: pointer;
}

.login {
  background: #4caf50;
  color: white;
  border: none;
}

.signup {
  background: #2196f3;
  color: white;
  border: none;
}
</style>

</head>

<body>

<div class="box">

  <h2>Securly Plans</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button class="login" id="loginBtn">
    Login
  </button>

  <button class="signup" id="signupBtn" disabled>
    Please Ask Wyatt Monroe for an Account
  </button>

</div>

<!-- Your existing modules -->
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>

<!-- AUTO REDIRECT (FIREBASE CONTROLLED) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyBLghWLth0syJhARDMWiJ7xNwyJAh7MWjQ",
  authDomain: "securly-plans-main.firebaseapp.com",
  projectId: "securly-plans-main"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ---------------- CONFIG ---------------- */
const settingsRef = doc(db, "settings", "appConfig");
const HOME_PAGE = "home.html";

/* Prevent double redirects */
let redirected = false;

async function handleRedirect() {
  try {
    const snap = await getDoc(settingsRef);

    const autoRedirect = snap.exists()
      ? snap.data().autoRedirect
      : false;

    const isLoggedIn = localStorage.getItem("loggedIn") === "true";

    // CASE 1: Admin forced redirect mode (bypasses login page)
    if (autoRedirect && !redirected) {
      redirected = true;
      window.location.href = HOME_PAGE;
      return;
    }

    // CASE 2: Normal login redirect
    if (isLoggedIn && !redirected) {
      redirected = true;
      window.location.href = HOME_PAGE;
    }

  } catch (err) {
    console.error("Firebase redirect check failed:", err);

    // SAFE FALLBACK (no admin config available)
    if (localStorage.getItem("loggedIn") === "true" && !redirected) {
      redirected = true;
      window.location.href = HOME_PAGE;
    }
  }
}

/* Run once on load */
handleRedirect();
</script>

</body>
</html>
