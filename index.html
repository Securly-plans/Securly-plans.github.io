<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Securly Plans</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  width: 320px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  cursor: pointer;
}

.login {
  background: #4caf50;
  color: white;
  border: none;
}

.signup {
  background: #2196f3;
  color: white;
  border: none;
}
</style>

</head>

<body>

<div class="box">

  <h2>Securly Plans</h2>

  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">

  <button class="login" id="loginBtn">
    Login
  </button>

  <button class="signup" id="signupBtn" disabled>
    Please Ask Wyatt Monroe for an Account
  </button>

</div>

<!-- Firebase backend -->
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>

<script>
/* ---------------- SAFE AUTO REDIRECT ---------------- */
(function () {

  const HOME_PAGE = "home.html";

  if (localStorage.getItem("loggedIn") === "true") {

    // small delay ensures modules are loaded before redirect
    setTimeout(() => {
      window.location.href = HOME_PAGE;
    }, 50);

  }

})();
</script>

</body>
</html>
