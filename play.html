<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Playing Game - Emerald</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .play-container{
            max-width:1000px;
            margin:0 auto;
            padding:20px;
        }

        .video-wrapper{
            position:relative;
            padding-bottom:56.25%;
            height:0;
            background:#000;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
        }

        /* ONLY TARGET GAME IFRAME */

        .video-wrapper iframe{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            border:none;
        }

        .game-info{
            margin-top:20px;
            background:#2d2d2d;
            padding:20px;
            border-radius:8px;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:15px;
            color:#ff4757;
            text-decoration:none;
            font-weight:bold;
        }

        .chat-embed{
            margin-top:20px;
            background:#2d2d2d;
            border-radius:12px;
            overflow:hidden;
            height:600px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
        }

        .chat-embed iframe{
            position:relative;
            width:100%;
            height:100%;
            min-height:600px;
            border:none;
        }

    </style>

    <!-- LOCAL STORAGE AUTH + SESSION -->

    <script>

        (function(){

            const isLoggedIn =
                localStorage.getItem(
                    "loggedIn"
                ) === "true";

            if(!isLoggedIn){

                window.location.replace(
                    "index.html"
                );

                return;
            }

            const SESSION_TIMEOUT =
                30 * 60 * 1000;

            const lastActivity =
                Number(
                    localStorage.getItem(
                        "lastActivity"
                    )
                ) || Date.now();

            /* ================= SESSION CHECK ================= */

            if(
                Date.now() - lastActivity >
                SESSION_TIMEOUT
            ){

                localStorage.clear();

                alert(
                    "You were logged out due to inactivity."
                );

                window.location.replace(
                    "index.html"
                );

                return;
            }

            /* ================= UPDATE TIMER ================= */

            function updateActivity(){

                localStorage.setItem(
                    "lastActivity",
                    Date.now()
                );
            }

            [
                "mousemove",
                "mousedown",
                "click",
                "scroll",
                "keypress",
                "touchstart"
            ].forEach(event=>{

                document.addEventListener(
                    event,
                    updateActivity,
                    true
                );

            });

            /* ================= AUTO LOGOUT ================= */

            setInterval(()=>{

                const last =
                    Number(
                        localStorage.getItem(
                            "lastActivity"
                        )
                    ) || 0;

                if(
                    Date.now() - last >
                    SESSION_TIMEOUT
                ){

                    localStorage.clear();

                    alert(
                        "You were logged out due to inactivity."
                    );

                    window.location.replace(
                        "index.html"
                    );
                }

            },10000);

            updateActivity();

        })();

    </script>

</head>

<body>

    <div class="play-container">

        <a
            href="home.html"
            class="back-btn"
        >
            ← Back to Games
        </a>

        <div class="video-wrapper">

            <iframe
                id="gameFrame"
                src=""
                allowfullscreen
            ></iframe>

        </div>

        <div class="game-info">

            <h1 id="gameTitle">
                Loading...
            </h1>

            <p id="gameDescription">
                Select a game to start playing.
            </p>

        </div>

        <!-- EMBEDDED CHAT -->

        <div class="chat-embed">

            <iframe
                src="chat.html"
            ></iframe>

        </div>

    </div>

    <script src="play-logic.js"></script>

</body>
</html>
