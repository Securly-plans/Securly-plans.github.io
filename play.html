<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Playing Game - Emerald</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .play-container{
            max-width:1000px;
            margin:0 auto;
            padding:20px;
        }

        .video-wrapper{
            position:relative;
            padding-bottom:56.25%;
            height:0;
            background:#000;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            border:none;
        }

        .game-info{
            margin-top:20px;
            background:#2d2d2d;
            padding:20px;
            border-radius:8px;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:15px;
            color:#ff4757;
            text-decoration:none;
            font-weight:bold;
        }

        .fullscreen-btn{
            margin-top:20px;
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:#00c853;
            color:white;
            font-weight:bold;
            cursor:pointer;
            transition:opacity .2s;
        }

        .fullscreen-btn:hover{
            opacity:.9;
        }

    </style>

    <!-- LOGIN CHECK -->

    <script>

        (function(){

            const isLoggedIn =
                localStorage.getItem(
                    "loggedIn"
                ) === "true";

            if(!isLoggedIn){

                window.location.replace(
                    "index.html"
                );

            }

        })();

    </script>

    <!-- SESSION HANDLER -->

    <script
        type="module"
        src="js/session.js"
    ></script>

</head>

<body>

    <div class="play-container">

        <a
            href="home.html"
            class="back-btn"
        >
            ← Back to Games
        </a>

        <div class="video-wrapper">

            <iframe
                id="gameFrame"
                src=""
                allowfullscreen
            ></iframe>

        </div>

        <button
            id="fullscreenBtn"
            class="fullscreen-btn"
        >
            Full Screen
        </button>

        <div class="game-info">

            <h1 id="gameTitle">
                Loading...
            </h1>

            <p id="gameDescription">
                Select a game to start playing.
            </p>

        </div>

    </div>

    <script src="play-logic.js"></script>

    <script>

        document
            .getElementById(
                "fullscreenBtn"
            )
            .addEventListener(
                "click",
                async () => {

                    const iframe =
                        document.getElementById(
                            "gameFrame"
                        );

                    try {

                        if(
                            iframe.requestFullscreen
                        ){

                            await iframe.requestFullscreen();

                        }
                        else if(
                            iframe.webkitRequestFullscreen
                        ){

                            await iframe.webkitRequestFullscreen();

                        }
                        else if(
                            iframe.msRequestFullscreen
                        ){

                            await iframe.msRequestFullscreen();

                        }

                    } catch(err){

                        console.error(
                            "Fullscreen failed:",
                            err
                        );

                    }

                }
            );

    </script>

</body>
</html>
