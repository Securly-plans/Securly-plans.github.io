<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Gold Boot</title>
<link rel="stylesheet" href="gold-shell.css">
<link rel="icon" href="Gold_9.0/emerald-gold-90-logo.svg" type="image/svg+xml">
<script type="module" src="gold-shell.js"></script>
</head>
<body>
<main class="boot-card" aria-live="polite">
  <div class="boot-logo">G</div>
  <h1>EmeraldOS Gold</h1>
  <p id="bootStatus">Checking system update configuration...</p>
  <div class="boot-progress"><span></span></div>
  <section id="bootFallback" class="boot-fallback" hidden>
    <p>The updater could not continue automatically.</p>
    <button id="bootFallbackBtn">Boot bundled Gold 9.0</button>
    <button id="retryBtn">Retry update check</button>
  </section>
</main>
</body>
</html>
