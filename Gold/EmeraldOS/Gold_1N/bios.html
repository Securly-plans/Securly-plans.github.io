Type HELP for available commands.</section></main><div class="cmd"><span>EDOS&gt;&nbsp;</span><input id="command" autofocus autocomplete="off"></div></div><script>
const P='gold1g_';const logged=()=>localStorage.getItem('loggedIn')==='true'||localStorage.getItem(P+'loggedIn')==='true';const user=()=>localStorage.getItem('username')||'Not signed in';const out=document.getElementById('out');function line(t=''){out.textContent+='\n'+t;out.scrollTop=out.scrollHeight}function boot(){location.href=logged()?'OS.html':'index.html?next=OS.html'}function route(hash){location.href=logged()?'OS.html'+hash:'index.html?next='+encodeURIComponent('OS.html'+hash)}function safe(){localStorage.setItem(P+'safemode','true');boot()}function clearCache(){if(!confirm('Clear replaceable Gold 1N caches? Files and account data are preserved.'))return;Object.keys(localStorage).filter(k=>/cache|thumbnail|temp|workspace$/i.test(k)).forEach(k=>localStorage.removeItem(k));line('Replaceable caches cleared.')}function mem(){return Object.keys(localStorage).reduce((n,k)=>n+k.length+(localStorage.getItem(k)||'').length,0)}function exec(v){const [raw,...args]=v.trim().split(/\s+/),c=(raw||'').toUpperCase(),a=args.join(' ');switch(c){case 'HELP':line('HELP VER DIR APPS USERS WHOAMI LOGIN REGISTER LOGOUT BOOT SAFE STAFF SUPPORT RESTORE REGEDIT TASKMGR CONTROL UPDATE SAVE CLEARCACHE DIAG TIME DATE MEM ECHO CLEAR EXIT');break;case 'VER':line('Emerald BIOS A10 / Emerald DOS / EmeraldOS Gold 1N');break;case 'DIR':line('OS.HTML  INDEX.HTML  REGISTER.HTML  STAFF.HTML  FIREBASE.JS  GOLD1N-CORE.JS  GOLD1N.JS');break;case 'APPS':line('Explorer, Office, Mail, Registry Editor, Task Manager, Control Panel, Settings, Application Editor, Support');break;case 'USERS':case 'WHOAMI':line(user()+' / '+(logged()?'signed in':'not signed in'));break;case 'LOGIN':location.href='index.html?next=OS.html';break;case 'REGISTER':location.href='register.html';break;case 'LOGOUT':['loggedIn',P+'loggedIn','gold1n_loggedIn','role','role2',P+'staff_session','gold1n_staff_session'].forEach(k=>localStorage.removeItem(k));line('Signed out.');break;case 'BOOT':boot();break;case 'SAFE':safe();break;case 'STAFF':location.href='staff.html';break;case 'SUPPORT':route('#support');break;case 'RESTORE':route('#restore');break;case 'REGEDIT':route('#regedit');break;case 'TASKMGR':route('#taskmanager');break;case 'CONTROL':route('#control');break;case 'UPDATE':route('#updateshell');break;case 'SAVE':localStorage.setItem(P+'bios_save_request','true');line('Cloud save requested for the next boot.');break;case 'CLEARCACHE':clearCache();break;case 'DIAG':line(JSON.stringify({version:'1N',folder:'Gold_1N',user:user(),loggedIn:logged(),storageCharacters:mem(),online:navigator.onLine,display:[innerWidth,innerHeight],agent:navigator.userAgent},null,2));break;case 'TIME':line(new Date().toLocaleTimeString());break;case 'DATE':line(new Date().toLocaleDateString());break;case 'MEM':line(mem()+' storage characters in use.');break;case 'ECHO':line(a);break;case 'CLEAR':out.textContent='';break;case 'EXIT':boot();break;default:line(c?'Bad command or file name: '+c:'')}}command.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=command.value;command.value='';line('\nEDOS> '+v);exec(v)}});status.textContent=`${user()} · ${logged()?'SIGNED IN':'SIGNED OUT'}`;
</script></body></html>
