<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EmeraldOS Gold 1A</title>
<link rel="icon" type="image/svg+xml" href="emerald-gold-1a-logo.svg">
<link rel="stylesheet" href="gold1a.css">
<script>
(function(){
  const loggedIn = localStorage.getItem('loggedIn') === 'true' || localStorage.getItem('gold1a_loggedIn') === 'true';
  if(!loggedIn){ const next='OS.html'+location.search+location.hash; location.replace('index.html?next='+encodeURIComponent(next)); }
})();
</script>
<script>
(function(){
  function openStartupOptions(){
    if(document.getElementById('gold1a-startup-options')) return;
    const d=document.createElement('div');
    d.id='gold1a-startup-options';
    d.className='startup-options';
    d.innerHTML=`<div class="startup-card">
      <div class="startup-logo">G</div>
      <h1>Emerald Systems BIOS A9</h1>
      <p>Startup options for EmeraldOS Gold 1A</p>
      <button onclick="location.href='bios.html'">Open modern BIOS / Emerald DOS</button>
      <button onclick="location.href='staff.html'">Open Gold Staff Edition</button>
      <button onclick="localStorage.setItem('gold1a_safemode','true');location.href='OS.html'">Boot Safe Mode</button>
      <button onclick="localStorage.removeItem('gold1a_setup_done');location.href='OS.html'">Run First-Boot Setup</button>
      <button onclick="location.href='register.html'">Register New User</button>
      <button onclick="document.getElementById('gold1a-startup-options').remove()">Continue Boot</button>
      <small>F12 = BIOS/DOS · F9 = Staff Edition · F1 = Support · Esc = Continue</small>
    </div>`;
    document.body.appendChild(d);
  }
  window.addEventListener('keydown',function(e){
    if(e.key==='F12'){ e.preventDefault(); if(document.body) openStartupOptions(); else window.__gold1a_f12=true; }
    if(e.key==='F9'){ e.preventDefault(); location.href='staff.html'; }
    if(e.key==='F1'){ e.preventDefault(); location.href='OS.html#support'; }
    if(e.key==='Escape'){ const d=document.getElementById('gold1a-startup-options'); if(d)d.remove(); }
  });
  window.addEventListener('DOMContentLoaded',function(){ if(window.__gold1a_f12) openStartupOptions(); });
})();
</script>
<script>window.EMERALDOS_GOLD_SHELL_MANAGED=new URLSearchParams(location.search).has("goldShell");window.EMERALDOS_GOLD_VERSION="1A";window.EMERALDOS_GOLD_FOLDER="Gold_1A";</script>
<script defer src="gold1a.js"></script>
</head>
<body class="gold1a gold1a-shell" data-build="1A">
  <div id="boot" class="boot-screen">
    <div class="gold-logo-xl">G</div>
    <h1>EmeraldOS Gold 1A</h1>
    <p>Starting your EmeraldOS Gold 1A cloud VM. Your apps, files, settings, support history, customizations, and workspace are restored after login.</p>
    <div class="boot-hint">Press F12 for Emerald BIOS A9 / Emerald DOS · F9 Staff Edition · F1 Support Center</div>
    <div class="boot-progress"><span></span></div>
  </div>
  <main id="desktop" aria-label="EmeraldOS Gold desktop"></main>
  <section id="startMenu" class="start-menu hidden" aria-label="Start menu"></section>
  <section id="searchPanel" class="side-panel hidden" aria-label="Search panel"></section>
  <section id="taskView" class="task-view hidden" aria-label="Task view"></section>
  <section id="actionCenter" class="action-center hidden" aria-label="Action center"></section>
  <section id="setupWizard" class="setup-overlay hidden" aria-label="First boot setup"></section>
  <div id="windowLayer" aria-label="Application windows"></div>
  <footer id="taskbar" aria-label="Taskbar">
    <button id="startBtn" class="start-btn" title="Start">G</button>
    <button id="searchBtn" class="task-btn search-wide" title="Search">Search EmeraldOS Gold</button>
    <button id="taskViewBtn" class="task-btn" title="Task View">▣</button>
    <div id="taskApps" class="task-apps"></div>
    <button id="widgetsBtn" class="task-btn" title="Widgets">☰</button>
    <button id="actionBtn" class="task-btn" title="Action Center">🔔 0</button>
    <button id="staffBtn" class="task-btn staff-shortcut" title="Gold Staff Edition">Staff</button>
    <button id="logoutBtn" class="task-btn logout-shortcut" title="Log out">Log out</button>
    <div id="clock" class="clock"></div>
  </footer>
</body>
</html>
