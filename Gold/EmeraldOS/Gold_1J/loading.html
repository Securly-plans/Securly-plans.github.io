<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Starting EmeraldOS Gold 1J</title><link rel="icon" href="emerald-gold-1j-logo.svg"><style>html,body{margin:0;height:100%;font-family:"Segoe UI",Arial,sans-serif;background:#0067b8;color:#fff;overflow:hidden}.screen{height:100%;display:grid;place-content:center;justify-items:center;text-align:center}.screen img{width:112px;height:112px}.screen h1{font-weight:300}.bar{width:min(380px,75vw);height:5px;background:rgba(255,255,255,.25);overflow:hidden;margin:22px}.bar span{display:block;height:100%;width:36%;background:#fff;animation:move 1.2s infinite}@keyframes move{from{transform:translateX(-120%)}to{transform:translateX(330%)}}button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;padding:9px 14px;margin:4px}</style></head><body><div class="screen"><img src="emerald-gold-1j-logo.svg" alt=""><h1>EmeraldOS Gold 1J</h1><p id="message">Preparing your cloud virtual machine…</p><div class="bar"><span></span></div><div><button onclick="location.href='bios.html'">BIOS / DOS</button><button onclick="location.href='staff.html'">Staff Edition</button><button onclick="continueBoot()">Continue</button></div><small>F12 BIOS / DOS · F9 Staff Edition · F1 Support</small></div><script>const logged=()=>localStorage.getItem('loggedIn')==='true'||localStorage.getItem('gold1g_loggedIn')==='true';function continueBoot(){location.href=logged()?'OS.html':'index.html?next=OS.html'}let timer=setTimeout(continueBoot,1800);addEventListener('keydown',e=>{if(e.key==='F12'){clearTimeout(timer);location.href='bios.html'}if(e.key==='F9'){clearTimeout(timer);location.href='staff.html'}if(e.key==='F1'){clearTimeout(timer);location.href=logged()?'OS.html#support':'index.html?next=OS.html%23support'}});</script></body></html>
