<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seed EmeraldOS Gold Update Pointer</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#eef4fb;margin:0;padding:30px;color:#152238}.card{max-width:780px;margin:auto;background:white;border:1px solid #ccd8e6;border-radius:10px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.12)}button{border:1px solid #0060a8;background:#0078d4;color:white;border-radius:5px;padding:10px 14px;font:inherit;cursor:pointer}pre{background:#101827;color:#dceeff;border-radius:8px;padding:14px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
  <h1>Seed system/emeraldGoldLatest</h1>
  <p>This writes the EmeraldOS Gold 9.0 direct update pointer to Firestore.</p>
  <button id="seedBtn">Set latest to Gold_9.0</button>
  <pre id="out"></pre>
</div>
<script type="module">
import { db, doc, setDoc } from './firebase.js';
const latest = {
  product: 'EmeraldOS Gold',
  latestVersion: '1.0',
  build: '10.0',
  folder: 'Gold_10.0',
  entry: 'OS.html',
  channel: 'stable',
  status: 'stable',
  required: false,
  enabled: true,
  setupMode: 'continue',
  releaseTitle: 'EmeraldOS Gold 10.0',
  summary: 'EmeraldOS Gold update-system build. The root updater reads this document and redirects to the configured version folder.',
  migrationFrom: ['8.0', '8.0.1'],
  migrationId: 'gold8-to-gold9-direct-shell',
  minShellVersion: '1.0',
  rollbackFolder: 'Gold_10.0',
  rollbackVersion: '10.0',
  releasedAt: new Date().toISOString()
};
const out = document.getElementById('out');
out.textContent = JSON.stringify(latest, null, 2);
document.getElementById('seedBtn').onclick = async () => {
  try {
    await setDoc(doc(db, 'system', 'emeraldGoldLatest'), latest);
    out.textContent = 'Saved system/emeraldGoldLatest:\n' + JSON.stringify(latest, null, 2);
  } catch (error) {
    out.textContent = 'Save failed:\n' + (error && error.message ? error.message : String(error));
  }
};
</script>
</body>
</html>
