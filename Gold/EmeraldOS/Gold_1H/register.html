<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register — EmeraldOS Gold 1H</title><link rel="icon" href="emerald-gold-1h-logo.svg"><link rel="stylesheet" href="auth.css"><script defer src="auth-common.js"></script></head><body>
<div class="auth-shell"><section class="brand"><img src="emerald-gold-1h-logo.svg" alt=""><h1>Create your Gold VM</h1><p>Registration creates an EmeraldOS account and a version-independent E.L.S.U.S. workspace.</p></section><main class="auth-card"><h2>Create account</h2><p class="muted">Your First-Boot Setup will run once across compatible Gold versions.</p><label>Display name</label><input id="displayName" autocomplete="name"><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="new-password"><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password"><div class="actions"><button id="register" class="primary">Create account</button><button onclick="location.href='index.html'">Back to sign in</button></div><div id="message" class="message"></div></main></div>
<script>window.addEventListener('DOMContentLoaded',()=>{register.onclick=async()=>{message.textContent='Creating account…';try{if(password.value!==confirmPassword.value)throw new Error('Passwords do not match.');const user=await GoldAuth.register(username.value,password.value,displayName.value);GoldAuth.beginSession(user);message.className='message success';message.textContent='Account created. Starting First-Boot Setup…';setTimeout(()=>location.href='loading.html',350)}catch(e){message.className='message';message.textContent=e.message}}});</script></body></html>
