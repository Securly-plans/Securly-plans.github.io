<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>View Users</title>

<style>
:root{
    --primary:#c40000;
    --primary-hover:#a30000;
    --bg:#f4f4f4;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* HEADER */
.header{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    border-left:6px solid var(--primary);
}

h1{
    margin:0 0 12px 0;
    color:var(--primary);
}

.search{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

/* GRID */
.users-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
}

/* CARD */
.user-card{
    background:var(--card);
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    transition:.2s;
    border-top:4px solid var(--primary);
}

.user-card:hover{
    transform:translateY(-3px);
}

.avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
    border:3px solid #eee;
}

.username{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
}

.status{
    text-align:center;
    margin-top:4px;
    font-size:13px;
}

.online{ color:green; }
.offline{ color:gray; }

.bio{
    margin-top:10px;
    font-size:14px;
    color:var(--muted);
    text-align:center;
    min-height:40px;
}

.info{
    margin-top:10px;
    font-size:13px;
    color:var(--muted);
    text-align:center;
}

.badges{
    margin-top:10px;
    text-align:center;
}

.badge{
    display:inline-block;
    background:var(--primary);
    color:white;
    padding:3px 8px;
    border-radius:20px;
    font-size:11px;
    margin:2px;
}

.profile-btn{
    margin-top:12px;
    width:100%;
    padding:10px;
    border:none;
    background:var(--primary);
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.profile-btn:hover{
    background:var(--primary-hover);
}

.empty{
    text-align:center;
    color:#777;
    margin-top:30px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>User Directory</h1>
        <input type="text" id="search" class="search" placeholder="Search username...">
    </div>

    <div id="users" class="users-grid"></div>

</div>

<script type="module">

import { db } from "./js/firebase.js";
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const usersContainer = document.getElementById("users");
const searchInput = document.getElementById("search");

let allUsers = [];

function formatDate(created){
    if(!created) return "Unknown";
    const ms = Number(created);
    if (isNaN(ms)) return "Unknown";
    return new Date(ms).toLocaleDateString();
}

function renderUsers(){

    const search = searchInput.value.trim().toLowerCase();
    usersContainer.innerHTML = "";

    const filtered = allUsers.filter(user =>
        (user.username || "").toLowerCase().includes(search)
    );

    if(filtered.length === 0){
        usersContainer.innerHTML =
        `<div class="empty">No users found.</div>`;
        return;
    }

    filtered.forEach(user => {

        const card = document.createElement("div");
        card.className = "user-card";

        const badges = Array.isArray(user.badges) ? user.badges : [];

        card.innerHTML = `
            <img class="avatar"
                src="${user.photoURL || 'https://via.placeholder.com/85'}"
            >

            <div class="username">
                ${user.username || "Unknown User"}
            </div>

            <div class="status ${user.status === "Online" ? "online" : "offline"}">
                ${user.status || "Offline"}
            </div>

            <div class="bio">
                ${user.bio || "No bio provided."}
            </div>

            <div class="info">
                Joined: ${formatDate(user.created)}
            </div>

            <div class="badges">
                ${badges.map(b => `<span class="badge">${b}</span>`).join("")}
            </div>

            <button class="profile-btn" data-uid="${user.uid}">
                View Profile
            </button>
        `;

        card.querySelector(".profile-btn").addEventListener("click", () => {
            location.href = `view-profile.html?uid=${user.uid}`;
        });

        usersContainer.appendChild(card);
    });
}

onSnapshot(collection(db,"users"), snapshot => {

    allUsers = [];

    snapshot.forEach(doc => {
        allUsers.push({
            uid: doc.id,
            ...doc.data()
        });
    });

    renderUsers();
});

searchInput.addEventListener("input", renderUsers);

</script>

</body>
</html>
