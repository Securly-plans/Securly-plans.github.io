<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Files</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div style="display:flex; height:100vh;">

<!-- Sidebar -->
<div class="sidebar">

    <div class="row" style="margin-bottom:10px;">
        <button onclick="location.href='internal-dashboard.html'">Dashboard</button>
        <button onclick="location.href='internal-writer.html'">New</button>
        <button class="secondary" onclick="location.href='../home.html'">Home</button>
    </div>

    <input id="search" placeholder="Search documents">

    <div id="list"></div>

</div>

<!-- Viewer -->
<div class="main" id="viewer">
    <div class="card">Select a document</div>
</div>

</div>

<script type="module">
import { db } from "/js/firebase.js";
import {
    collection,
    getDocs,
    query,
    where,
    addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let docs = [];
let currentDoc = null;

async function load() {
    const snap = await getDocs(collection(db, "internalDocs"));
    docs = snap.docs.map(d => d.data());
    render();
}

function render(filter = "") {
    const list = document.getElementById("list");
    list.innerHTML = "";

    docs.filter(d =>
        d.title.toLowerCase().includes(filter.toLowerCase()) ||
        d.id.toLowerCase().includes(filter.toLowerCase()) ||
        d.category.toLowerCase().includes(filter.toLowerCase())
    ).forEach(doc => {
        const div = document.createElement("div");
        div.className = "doc";
        div.innerHTML = `<b>${doc.title}</b><br><small>${doc.id}</small>`;
        div.onclick = () => openDoc(doc);
        list.appendChild(div);
    });
}

async function loadReplies(docId) {
    const q = query(collection(db, "internalDocReplies"), where("documentId", "==", docId));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
}

async function openDoc(doc) {
    currentDoc = doc;

    const replies = await loadReplies(doc.id);

    document.getElementById("viewer").innerHTML = `
        <div class="card">

            <h2>${doc.title}</h2>

            <small>${doc.id} • ${doc.category}</small>

            <hr>

            <p>
                Author: ${doc.authorUsername || "Unknown"}<br>
                Rank: ${doc.authorRole || "Unknown"}
            </p>

            <hr>

            <div>${doc.content}</div>

        </div>

        <div class="card replyBox">

            <h3>Replies</h3>

            ${replies.map(r => `
                <div style="margin-bottom:10px;">
                    <b>${r.author}</b>
                    <small>(${r.role})</small>
                    <div>${r.message}</div>
                    <hr>
                </div>
            `).join("")}

            <textarea id="replyText" placeholder="Write reply"></textarea>
            <button onclick="sendReply()">Post Reply</button>

        </div>
    `;
}

window.sendReply = async function () {
    const text = document.getElementById("replyText").value.trim();
    if (!text || !currentDoc) return;

    await addDoc(collection(db, "internalDocReplies"), {
        documentId: currentDoc.id,
        author: localStorage.getItem("username"),
        role: localStorage.getItem("role"),
        message: text,
        createdAt: Date.now()
    });

    openDoc(currentDoc);
};

document.getElementById("search").addEventListener("input", e => {
    render(e.target.value);
});

load();
</script>

</body>
</html>
