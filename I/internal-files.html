<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Files System</title>

<style>
body {
    margin: 0;
    display: flex;
    height: 100vh;
    background: #0b0f17;
    color: white;
    font-family: Arial;
}

.sidebar {
    width: 280px;
    background: #121a2a;
    border-right: 1px solid #263244;
    display: flex;
    flex-direction: column;
}

.sidebar input {
    margin: 10px;
    padding: 10px;
    background: #0f1724;
    border: 1px solid #263244;
    color: white;
}

.doc {
    padding: 10px;
    border-bottom: 1px solid #263244;
    cursor: pointer;
}

.doc:hover {
    background: #172033;
}

.main {
    flex: 1;
    padding: 20px;
    overflow: auto;
}

.card {
    background: #121a2a;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #263244;
}
</style>
</head>

<body>

<div class="sidebar">
    <input id="search" placeholder="Search docs...">
    <div id="list"></div>
</div>

<div class="main" id="viewer">
    <div class="card">Loading documents...</div>
</div>

<script type="module">
import { db } from "./js/firebase.js";
import { collection, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let docs = [];

async function load() {
    const snap = await getDocs(collection(db, "internalDocs"));

    docs = snap.docs.map(d => d.data());

    render();
}

function render(filter = "") {
    const list = document.getElementById("list");
    list.innerHTML = "";

    docs
    .filter(d =>
        d.title.toLowerCase().includes(filter.toLowerCase()) ||
        d.id.toLowerCase().includes(filter.toLowerCase()) ||
        d.category.toLowerCase().includes(filter.toLowerCase())
    )
    .forEach(doc => {
        const div = document.createElement("div");
        div.className = "doc";
        div.innerHTML = `
            <b>${doc.title}</b><br>
            <small>${doc.id} • ${doc.category}</small>
        `;
        div.onclick = () => openDoc(doc);
        list.appendChild(div);
    });
}

function openDoc(doc) {
    document.getElementById("viewer").innerHTML = `
        <div class="card">
            <h2>${doc.title}</h2>
            <p><b>${doc.id}</b> • ${doc.date} • ${doc.category}</p>
            <hr>
            ${doc.content}
        </div>
    `;
}

document.getElementById("search").addEventListener("input", e => {
    render(e.target.value);
});

load();
</script>

</body>
</html>
