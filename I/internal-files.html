<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Files</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div style="display:flex; height:100vh;">

<div class="sidebar">

<div class="row">
    <button onclick="location.href='internal-dashboard.html'">Dashboard</button>
    <button onclick="location.href='internal-writer.html'">New</button>
    <button class="secondary" onclick="location.href='../home.html'">Home</button>
</div>

<input id="search" placeholder="Search documents">

<div id="list"></div>

</div>

<div class="main" id="viewer">
    <div class="card">Select a document</div>
</div>

</div>

<script type="module">
import { db } from "/js/firebase.js";
import {
    collection,
    getDocs,
    query,
    where,
    addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===========================
   STAFF SESSION CHECK
=========================== */

const staffSession = localStorage.getItem("staffSession") === "true";
const staffId = localStorage.getItem("staffId");
const staffRole = localStorage.getItem("staffRole");
const staffName = localStorage.getItem("staffName");

if (!staffSession || !staffId) {
    window.location.href = "../staff/login.html";
}

let docs = [];
let current = null;

async function load() {
    const snap = await getDocs(collection(db, "internalDocs"));
    docs = snap.docs.map(d => d.data());
    render();
}

function render(f = "") {
    const list = document.getElementById("list");
    list.innerHTML = "";

    docs
        .filter(d =>
            d.title.toLowerCase().includes(f.toLowerCase()) ||
            d.id.toLowerCase().includes(f.toLowerCase())
        )
        .forEach(d => {
            const div = document.createElement("div");

            div.className = "doc";

            div.innerHTML = `
                <b>${d.title}</b><br>
                <span class="meta">${d.id} • ${d.category}</span>
            `;

            div.onclick = () => open(d);

            list.appendChild(div);
        });
}

async function loadReplies(id) {
    const q = query(
        collection(db, "internalDocReplies"),
        where("documentId", "==", id)
    );

    const snap = await getDocs(q);

    return snap.docs.map(d => d.data());
}

async function open(docData) {
    current = docData;

    const replies = await loadReplies(docData.id);

    document.getElementById("viewer").innerHTML = `
        <div class="card">

            <h2>${docData.title}</h2>

            <div class="meta">
                ${docData.id} • ${docData.category}
            </div>

            <hr>

            <p>
                <strong>Author:</strong>
                ${docData.authorStaffId || "Unknown"}
                •
                ${docData.authorName || "Unknown"}
                <br>

                <strong>Role:</strong>
                ${docData.authorRole || "Unknown"}
            </p>

            <hr>

            <div>${docData.content}</div>

        </div>

        <div class="card replyBox">

            <h3>Replies</h3>

            ${replies.map(r => `
                <div>

                    <b>
                        ${r.staffId || "???"}
                        •
                        ${r.authorName || "Unknown"}
                    </b>

                    <span class="meta">
                        (${r.role || "Unknown"})
                    </span>

                    <br><br>

                    ${r.message}

                    <hr>

                </div>
            `).join("")}

            <textarea id="replyText"></textarea>

            <button onclick="send()">
                Post Reply
            </button>

        </div>
    `;
}

window.send = async function () {

const text =
    document.getElementById("replyText").value.trim();

if (!text || !current) return;

await addDoc(collection(db, "internalDocReplies"), {
    documentId: current.id,

    staffId: staffId,
    authorName: staffName,
    role: staffRole,

    message: text,
    createdAt: Date.now()
});

open(current);

};


document
    .getElementById("search")
    .addEventListener("input", e => {
        render(e.target.value);
    });

load();
</script>

</body>
</html>
