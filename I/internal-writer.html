<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Document Writer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f17;
    color: #e6edf3;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.topbar {
    margin-bottom: 15px;
}

input, textarea, select {
    width: 100%;
    margin: 10px 0;
    padding: 12px;
    background: #121a2a;
    border: 1px solid #263244;
    color: white;
    border-radius: 6px;
    box-sizing: border-box;
}

textarea {
    min-height: 220px;
    resize: vertical;
}

button {
    padding: 12px 18px;
    background: #4ade80;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 10px;
}

.status {
    margin-top: 10px;
    color: #4ade80;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
    <button onclick="location.href='internal-dashboard.html'">Dashboard</button>
    <button onclick="location.href='internal-files.html'">Browse</button>
    <button onclick="location.href='../home.html'">Home</button>
</div>

<h1>Internal Document Writer</h1>

<input id="title" placeholder="Document Title">

<select id="category">
    <option value="System">System</option>
    <option value="Training">Training</option>
    <option value="Security">Security</option>
    <option value="Operations">Operations</option>
    <option value="Executive">Executive</option>
</select>

<textarea id="content" placeholder="Document content (HTML supported)"></textarea>

<button id="saveBtn">Save Document</button>

<div id="status" class="status"></div>

</div>

<script type="module">
import { db } from "/js/firebase.js";
import {
    collection,
    addDoc,
    doc,
    getDoc,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username = localStorage.getItem("username");
const role = localStorage.getItem("role");

if (!username || (role !== "admin" && role !== "mod")) {
    window.location.href = "../home.html";
}

async function getUserRole(username) {
    const snap = await getDoc(doc(db, "users", username));
    return snap.exists() ? snap.data().role : "user";
}

async function getNextId() {
    const ref = doc(db, "system", "documentCounter");

    return await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);

        let next = 1;

        if (snap.exists()) {
            next = (snap.data().current || 0) + 1;
            tx.update(ref, { current: next });
        } else {
            tx.set(ref, { current: 1 });
        }

        return "I/" + String(next).padStart(5, "0");
    });
}

document.getElementById("saveBtn").onclick = async () => {
    const title = document.getElementById("title").value.trim();
    const category = document.getElementById("category").value;
    const content = document.getElementById("content").value.trim();

    if (!title || !content) return alert("Missing fields");

    const status = document.getElementById("status");
    status.textContent = "Saving...";

    const id = await getNextId();
    const authorRole = await getUserRole(username);

    await addDoc(collection(db, "internalDocs"), {
        id,
        title,
        category,
        content,

        authorUsername: username,
        authorRole,

        createdAt: Date.now(),
        createdAtServer: serverTimestamp(),

        replies: 0
    });

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";

    status.textContent = "Saved: " + id;
};
</script>

</body>
</html>
