<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Document Writer</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f17;
    color: #e6edf3;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

input, textarea, select {
    width: 100%;
    margin: 10px 0;
    padding: 10px;
    background: #121a2a;
    border: 1px solid #263244;
    color: white;
    border-radius: 6px;
}

button {
    padding: 12px;
    background: #4ade80;
    border: none;
    font-weight: bold;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="container">
    <h1>Internal Document Writer</h1>

    <input id="title" placeholder="Title">
    
    <select id="category">
        <option>System</option>
        <option>Training</option>
        <option>Security</option>
        <option>Operations</option>
        <option>Executive</option>
    </select>

    <textarea id="content" rows="12" placeholder="Document content (HTML supported)"></textarea>

    <button onclick="saveDoc()">Save Document</button>
</div>

<script type="module">
import { db } from "/js/firebase.js";
import { collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function getOrdinalDate() {
    const d = new Date();
    const day = d.getDate();

    const suffix =
        day % 10 === 1 && day !== 11 ? "st" :
        day % 10 === 2 && day !== 12 ? "nd" :
        day % 10 === 3 && day !== 13 ? "rd" : "th";

    return d.toLocaleString("en-US", { month: "long" }) + " " + day + suffix + ", " + d.getFullYear();
}

function generateId(num) {
    return "I/" + String(num).padStart(5, "0");
}

async function saveDoc() {
    const title = document.getElementById("title").value;
    const category = document.getElementById("category").value;
    const content = document.getElementById("content").value;

    if (!title || !content) return alert("Missing fields");

    // Get current count
    const snap = await getDocs(collection(db, "internalDocs"));
    const id = generateId(snap.size + 1);

    await addDoc(collection(db, "internalDocs"), {
        id,
        title,
        category,
        date: getOrdinalDate(),
        content,
        createdAt: Date.now()
    });

    alert("Document saved: " + id);
}

window.saveDoc = saveDoc;
</script>

</body>
</html>
