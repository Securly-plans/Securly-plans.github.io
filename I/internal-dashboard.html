<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Dashboard</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0f17;
    color: white;
}

header {
    padding: 30px;
    border-bottom: 1px solid #263244;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #121a2a;
    padding: 20px;
    border-radius: 10px;
    border: 1px solid #263244;
    margin-bottom: 15px;
}

button {
    padding: 12px;
    background: #4ade80;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 10px;
}

button.secondary {
    background: #1f2937;
    color: white;
    border: 1px solid #263244;
}
</style>
</head>

<body>

<header>
    <h1>Internal Knowledge Base</h1>
    <p>Staff Access Portal</p>
</header>

<div class="container">

<div class="card">
    <h2>Navigation</h2>

    <button onclick="location.href='internal-writer.html'">New Document</button>
    <button onclick="location.href='internal-files.html'">Browse Documents</button>
    <button class="secondary" onclick="location.href='../home.html'">Home</button>
</div>

<div class="card">
    <h2>System Notes</h2>
    <p>Staff-only internal documentation system.</p>
    <p>All documents are logged and stored in Firestore.</p>
    <p>Replies are enabled for collaboration.</p>
</div>

</div>

<script>
const role = localStorage.getItem("role");

if (!role || (role !== "admin" && role !== "mod")) {
    window.location.href = "../home.html";
}
</script>

</body>
</html>
