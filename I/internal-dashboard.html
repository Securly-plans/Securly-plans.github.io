<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Internal Dashboard</title>
<link rel="stylesheet" href="style.css">

<style>
header {
    padding: 40px 20px;
    text-align: center;
}

header h1 {
    font-size: 30px;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #6ea8fe, #7cdbaf);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
}

.staff-info {
    text-align: center;
    margin-top: -20px;
    margin-bottom: 20px;
    color: var(--muted, #9ca3af);
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>Internal Knowledge Base</h1>
    <small>Staff Portal System</small>
</header>

<div class="staff-info" id="staffInfo"></div>

<div class="container grid">

<div class="card">
    <h2>Quick Actions</h2>
    <div class="row">
        <button onclick="location.href='internal-writer.html'">New Document</button>
        <button onclick="location.href='internal-files.html'">Browse</button>
        <button class="secondary" onclick="location.href='../staff/portal.html'">Staff Portal</button>
    </div>
</div>

<div class="card">
    <h2>Status</h2>
    <p>System: Online</p>
    <p>Documents: Active</p>
    <p>Access: Staff Only</p>
</div>

</div>

<script>
const staffSession = localStorage.getItem("staffSession") === "true";

if (!staffSession) {
    window.location.replace("../staff/login.html");
}

const staffRole = localStorage.getItem("staffRole") || "Unknown";
const staffId = localStorage.getItem("staffId") || "???";

document.getElementById("staffInfo").textContent =
    `Staff ID: ${staffId} | Role: ${staffRole}`;
</script>

</body>
</html>
