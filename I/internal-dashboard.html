<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="card" style="margin:20px;">
    <h1>Internal Knowledge Base</h1>
    <small>Staff Access Portal</small>
</header>

<div class="container">

<div class="card">
    <h2>Navigation</h2>

    <div class="row">
        <button onclick="location.href='internal-writer.html'">New Document</button>
        <button onclick="location.href='internal-files.html'">Browse Documents</button>
        <button class="secondary" onclick="location.href='../home.html'">Home</button>
    </div>
</div>

<div class="card">
    <h2>System Overview</h2>

    <p>Internal documentation system for staff use only.</p>
    <p>All documents are stored in Firestore under internalDocs.</p>
    <p>Replies and activity tracking are enabled.</p>
</div>

</div>

<script>
const role = localStorage.getItem("role");

if (!role || (role !== "admin" && role !== "mod")) {
    window.location.href = "../home.html";
}
</script>

</body>
</html>
