<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Logs</title>

<style>
:root{
  --bg:#0f1115;
  --panel:#1a1d24;
  --panel2:#222630;
  --text:#f1f1f1;
  --muted:#9ca3af;
  --primary:#4ade80;
  --danger:#ef4444;
  --warning:#f59e0b;
  --info:#3b82f6;
  --border:#2e3440;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:#111827;
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.header h1{
  margin:0;
  font-size:24px;
}

.header .status{
  color:var(--primary);
  font-size:14px;
}

.container{
  display:grid;
  grid-template-columns:260px 1fr;
  min-height:calc(100vh - 70px);
}

.sidebar{
  background:#151922;
  border-right:1px solid var(--border);
  padding:20px;
}

.sidebar h2{
  margin-top:0;
  font-size:18px;
}

.nav-btn{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:none;
  border-radius:10px;
  background:var(--panel);
  color:white;
  cursor:pointer;
  text-align:left;
  transition:0.2s;
}

.nav-btn:hover{
  background:var(--panel2);
}

.main{
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.card h3{
  margin:0 0 10px;
  color:var(--muted);
  font-size:15px;
}

.card .value{
  font-size:28px;
  font-weight:bold;
}

.filters{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-bottom:20px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
}

.logs{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.log{
  background:var(--panel);
  border-left:5px solid var(--info);
  border-radius:12px;
  padding:16px;
  border:1px solid var(--border);
}

.log.high{
  border-left-color:var(--danger);
}

.log.medium{
  border-left-color:var(--warning);
}

.log.low{
  border-left-color:var(--primary);
}

.log-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.log-type{
  font-weight:bold;
  font-size:16px;
}

.timestamp{
  color:var(--muted);
  font-size:13px;
}

.details{
  margin-top:10px;
  color:#d1d5db;
}

.tag{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  margin-top:10px;
}

.tag.high{
  background:rgba(239,68,68,0.15);
  color:#fca5a5;
}

.tag.medium{
  background:rgba(245,158,11,0.15);
  color:#fcd34d;
}

.tag.low{
  background:rgba(74,222,128,0.15);
  color:#86efac;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

.type-badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  background:#1f2937;
  margin-left:10px;
}

@media(max-width:900px){
  .container{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>Admin Logs Dashboard</h1>
  <div class="status" id="liveStatus">● Live Monitoring Enabled</div>
</div>

<div class="container">

  <div class="sidebar">
    <h2>Navigation</h2>

    <button class="nav-btn" onclick="window.location.href='admin.html'">
      Dashboard
    </button>

    <button class="nav-btn" onclick="window.location.href='admin-logs.html'">
      Admin Logs
    </button>

    <button class="nav-btn" onclick="window.location.href='chatmod.html'">
      Chat Moderation
    </button>

    <button class="nav-btn">
      Incident Reports
    </button>

    <button class="nav-btn">
      Security Events
    </button>
  </div>

  <div class="main">

    <div class="stats">

      <div class="card">
        <h3>Total Events</h3>
        <div class="value" id="totalLogs">0</div>
      </div>

      <div class="card">
        <h3>Warnings</h3>
        <div class="value" id="warningCount">0</div>
      </div>

      <div class="card">
        <h3>Bans</h3>
        <div class="value" id="banCount">0</div>
      </div>

      <div class="card">
        <h3>Critical Events</h3>
        <div class="value" id="criticalCount">0</div>
      </div>

      <div class="card">
        <h3>Incident Reports</h3>
        <div class="value" id="incidentCount">0</div>
      </div>

    </div>

    <div class="filters">

      <input type="text" id="searchInput" placeholder="Search by user, action, admin...">

      <select id="typeFilter">
        <option value="all">All Types</option>
        <option value="ban">Ban</option>
        <option value="mute">Mute</option>
        <option value="warning">Warning</option>
        <option value="delete-user">Delete User</option>
        <option value="incident-report">Incident Reports</option>
        <option value="lock">Lock</option>
        <option value="unlock">Unlock</option>
      </select>

      <select id="severityFilter">
        <option value="all">All Severity</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

    </div>

    <div class="logs" id="logsContainer">
      <div class="empty">Loading logs...</div>
    </div>

  </div>

</div>

<script type="module">

import {
  getFirestore,
  collection,
  query,
  orderBy,
  limit,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import { app } from "./js/firebase.js";

const db = getFirestore(app);
const auth = getAuth(app);

const logsContainer = document.getElementById("logsContainer");
const searchInput = document.getElementById("searchInput");
const typeFilter = document.getElementById("typeFilter");
const severityFilter = document.getElementById("severityFilter");

let allLogs = [];
let allIncidents = [];

if(localStorage.getItem("role") !== "admin"){
  alert("Access denied");
  location.href = "index.html";
}

onAuthStateChanged(auth, async(user) => {

  if(!user){
    location.href = "login.html";
    return;
  }

  loadLogs();
  loadIncidentReports();
});

function loadLogs(){

  const q = query(
    collection(db,"adminLogs"),
    orderBy("timestamp","desc"),
    limit(100)
  );

  onSnapshot(q,(snapshot)=>{

    allLogs = [];

    snapshot.forEach(doc=>{
      allLogs.push({
        id:doc.id,
        source:"log",
        ...doc.data()
      });
    });

    renderLogs();
    updateStats();
  });
}

function loadIncidentReports(){

  const q = query(
    collection(db,"incidentReports"),
    orderBy("timestamp","desc"),
    limit(100)
  );

  onSnapshot(q,(snapshot)=>{

    allIncidents = [];

    snapshot.forEach(doc=>{
      allIncidents.push({
        id:doc.id,
        source:"incident",
        type:"incident-report",
        adminUser:doc.data().createdBy || "Unknown",
        targetUser:doc.data().target || "System",
        details:doc.data().details || "",
        severity:doc.data().severity || "low",
        timestamp:doc.data().timestamp,
        title:doc.data().title || "Incident Report"
      });
    });

    renderLogs();
    updateStats();
  });
}

function updateStats(){

  const combined = [...allLogs, ...allIncidents];

  document.getElementById("totalLogs").textContent =
    combined.length;

  document.getElementById("warningCount").textContent =
    combined.filter(l=>l.type === "warning").length;

  document.getElementById("banCount").textContent =
    combined.filter(l=>l.type === "ban").length;

  document.getElementById("criticalCount").textContent =
    combined.filter(l=>l.severity === "high").length;

  document.getElementById("incidentCount").textContent =
    allIncidents.length;
}

function renderLogs(){

  logsContainer.innerHTML = "";

  const search = searchInput.value.toLowerCase();
  const type = typeFilter.value;
  const severity = severityFilter.value;

  const combined = [...allLogs, ...allIncidents]
    .sort((a,b)=>(b.timestamp || 0) - (a.timestamp || 0));

  const filtered = combined.filter(log=>{

    const matchesSearch =
      (log.targetUser || "").toLowerCase().includes(search) ||
      (log.adminUser || "").toLowerCase().includes(search) ||
      (log.type || "").toLowerCase().includes(search) ||
      (log.details || "").toLowerCase().includes(search) ||
      (log.title || "").toLowerCase().includes(search);

    const matchesType =
      type === "all" || log.type === type;

    const matchesSeverity =
      severity === "all" || log.severity === severity;

    return matchesSearch && matchesType && matchesSeverity;
  });

  if(filtered.length === 0){

    logsContainer.innerHTML = `
      <div class="empty">No logs found.</div>
    `;

    return;
  }

  filtered.forEach(log=>{

    const div = document.createElement("div");

    div.className = `log ${log.severity || "low"}`;

    div.innerHTML = `
      <div class="log-top">

        <div>

          <div class="log-type">

            ${capitalize(log.type || "Unknown")}

            ${log.source === "incident"
              ? `<span class="type-badge">INCIDENT</span>`
              : `<span class="type-badge">LOG</span>`
            }

          </div>

          <div class="timestamp">
            ${formatDate(log.timestamp)}
          </div>

        </div>

        <div>
          Admin:
          <b>${escapeHtml(log.adminUser || "Unknown")}</b>
        </div>

      </div>

      <div class="details">

        ${log.title
          ? `<b>Title:</b> ${escapeHtml(log.title)}<br><br>`
          : ""
        }

        <b>Target:</b>
        ${escapeHtml(log.targetUser || "Unknown")}

        <br><br>

        ${escapeHtml(log.details || "No details provided")}

      </div>

      <div class="tag ${log.severity || "low"}">
        ${capitalize(log.severity || "low")} Severity
      </div>
    `;

    logsContainer.appendChild(div);
  });
}

function formatDate(timestamp){

  if(!timestamp) return "Unknown Date";

  const date = new Date(timestamp);

  return date.toLocaleString();
}

function capitalize(text){

  return text.charAt(0).toUpperCase() + text.slice(1);
}

function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/\"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

searchInput.addEventListener("input",renderLogs);
typeFilter.addEventListener("change",renderLogs);
severityFilter.addEventListener("change",renderLogs);

</script>

</body>
</html>
