<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emerald AdminOS Console Beta</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}

/* ================= COMMAND SUGGESTIONS ================= */
#suggestBox {
  position: absolute;
  bottom: 60px;
  left: 10px;
  background: #111;
  border: 1px solid #00ff88;
  padding: 6px;
  font-size: 12px;
  display: none;
  max-height: 150px;
  overflow-y: auto;
  min-width: 260px;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">AdminOS Console - Copyright 2026, Monroe Enterainment Services. Administrator Access Only. Violators will be prosecuted.</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<div id="suggestBox"></div>

<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");
const suggestBox = document.getElementById("suggestBox");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= COMMAND SUGGESTIONS ================= */

function updateSuggestions(val) {
  const inputVal = val.toLowerCase();

  if (!inputVal) {
    suggestBox.style.display = "none";
    return;
  }

  const matches = Object.keys(commands)
    .filter(c => c.startsWith(inputVal))
    .slice(0, 6);

  if (!matches.length) {
    suggestBox.style.display = "none";
    return;
  }

  suggestBox.innerHTML = matches.map(m => `› ${m}`).join("<br>");
  suggestBox.style.display = "block";
}

/* ================= STATE ================= */

let globalLockState = null;

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + (globalLockState ? "****" : inputStr), "warn");

  if (globalLockState) {
    return handleGlobalLockFlow(inputStr);
  }

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) return print("Unknown command: " + cmd, "error");

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= GLOBAL LOCK ================= */

function startGlobalLock(mode) {
  globalLockState = { mode, password: "", confirmed: false, y: false };

  print("-------------------------------------------");
  print("Enter verification password:");
  print("-------------------------------------------");
}

function clearFlow() {
  globalLockState = null;
  consoleEl.innerHTML = "";
  suggestBox.style.display = "none";
}

/* FIXED FLOW */
function handleGlobalLockFlow(inputStr) {
  const state = globalLockState;

  switch(true) {

    case !state.password: {
      state.password = inputStr;

      getDoc(doc(db, "system", "config")).then(snap => {
        const real = snap.data()?.globalLockPassword;

        if (inputStr !== real) {
          print("-------------------------------------------");
          print("Verification Failure, Closing Console.");
          setTimeout(() => window.close(), 1200);
          return;
        }

        state.confirmed = true;

        print("-------------------------------------------");
        print("Verification Confirmed. Are you sure? Y/N");
        print("-------------------------------------------");
      });

      break;
    }

    case state.confirmed && !state.y: {
      const v = inputStr.toLowerCase();

      if (v === "n") {
        print("Command Canceled.");
        clearFlow();
        return;
      }

      if (v === "y") {
        state.y = true;
        print("-------------------------------------------");
        print('Intent Confirmed. Enter "Exe" or "Execute" or "Cancel".');
        print("-------------------------------------------");
      }

      break;
    }

    case state.y: {
      const v = inputStr.toLowerCase();

      if (v === "cancel") {
        print("Command Canceled.");
        clearFlow();
        return;
      }

      if (v === "exe" || v === "execute") {

        print("-------------------------------------------");
        print("Executing Command...");

        setTimeout(() => {

          updateDoc(doc(db, "system", "config"), {
            globalLock: state.mode === "enable",
            loginDisabled: state.mode === "enable",
            chatDisabled: state.mode === "enable",
            adminDisabled: state.mode === "enable"
          });

          print("Command has been executed.");
          clearFlow();

        }, 1200);
      }

      break;
    }
  }
}

/* ================= HELP ================= */

register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  Object.entries(helpData).forEach(([cmd, desc]) => {
    print("\n" + cmd);
    print(" → " + desc);
  });

  print("\n--- SYSTEM ---");
  print("system.status");
  print("system.reset");
  print("system.lockdown.enable");
  print("system.lockdown.disable");

  print("\n--- DEBUG ---");
  print("debug.db.test");
  print("debug.config.view");
  print("debug.latency");
  print("debug.console.clear");

}, "Help menu");

/* ================= SYSTEM COMMANDS ================= */

register("system.status", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "Shows system config");

register("system.reset", async () => {
  await updateDoc(doc(db, "system", "config"), {
    globalLock: false,
    loginDisabled: false,
    chatDisabled: false,
    adminDisabled: false
  });

  print("System reset complete", "success");
}, "Resets system flags");

register("system.lockdown.enable", () => startGlobalLock("enable"), "Enable full lockdown");
register("system.lockdown.disable", () => startGlobalLock("disable"), "Disable full lockdown");

/* ================= DEBUG COMMANDS ================= */

register("debug.db.test", async () => {
  try {
    const snap = await getDocs(collection(db, "users"));
    print("DB OK | users: " + snap.size, "success");
  } catch (e) {
    print("DB FAIL: " + e.message, "error");
  }
}, "Tests database");

register("debug.config.view", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "Views system config");

register("debug.latency", async () => {
  const start = Date.now();
  await getDocs(collection(db, "users"));
  print("Latency: " + (Date.now() - start) + "ms", "info");
}, "Checks DB latency");

register("debug.console.clear", () => {
  consoleEl.innerHTML = "";
  print("Console cleared", "success");
}, "Clears console");

/* ================= USERS ================= */

register("user.list", async () => {
  const snap = await getDocs(collection(db, "users"));
  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
  });
}, "List users");

register("user.delete", async (a) => {
  await deleteDoc(doc(db, "users", a[0]));
  print("User deleted", "success");
}, "Delete user");

register("user.role", async (a) => {
  await updateDoc(doc(db, "users", a[0]), { role: a[1] });
  print("Role updated", "success");
}, "Change role");

register("user.lock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: true,
    lockReason: a.slice(1).join(" ")
  });
  print("User locked", "error");
}, "Lock user");

register("user.unlock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: false,
    lockReason: ""
  });
  print("User unlocked", "success");
}, "Unlock user");

/* ================= INPUT ================= */

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
    suggestBox.style.display = "none";
  }
});

input.addEventListener("input", (e) => {
  updateSuggestions(e.target.value);
});

print("Admin OS ready (v9). Type 'help'.", "success");

</script>

</body>
</html>
