<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emerald AdminOS Console Alpha</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}

/* ================= COMMAND SUGGESTIONS ================= */
#suggestBox {
  position: absolute;
  bottom: 60px;
  left: 10px;
  background: #111;
  border: 1px solid #00ff88;
  padding: 6px;
  font-size: 12px;
  display: none;
  max-height: 150px;
  overflow-y: auto;
  min-width: 260px;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">AdminOS Console - Copyright 2026, Monroe Enterainment Services. Administrator Access Only. Violators will be prosecuted.</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<div id="suggestBox"></div>

<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  addDoc,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");
const suggestBox = document.getElementById("suggestBox");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= ANNOUNCEMENT ================= */

function setAnnouncement(data) {
  return updateDoc(doc(db, "system", "announcement"), data);
}

/* ================= EMERGENCY ================= */

function setEmergency(data) {
  return updateDoc(doc(db, "system", "emergency"), data);
}

/* ================= STATE ================= */

let globalLockState = null;

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + (globalLockState ? "****" : inputStr), "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) return print("Unknown command: " + cmd, "error");

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= IMPROVEMENT COMMANDS ================= */

/* SYSTEM HEALTH */
register("system.health", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  const users = await getDocs(collection(db, "users"));

  print("=== SYSTEM HEALTH ===", "info");
  print("Users: " + users.size);
  print("Config loaded: " + (snap.exists() ? "YES" : "NO"));
}, "System health check");

register("system.ping", async () => {
  const start = Date.now();
  await getDocs(collection(db, "users"));
  print("Ping: " + (Date.now() - start) + "ms", "info");
}, "DB latency test");

register("system.snapshot", async () => {
  const config = await getDoc(doc(db, "system", "config"));
  const ann = await getDoc(doc(db, "system", "announcement"));
  const em = await getDoc(doc(db, "system", "emergency"));

  print(JSON.stringify({
    config: config.data(),
    announcement: ann.data(),
    emergency: em.data()
  }, null, 2), "info");
}, "Full system snapshot");

/* SAFE MODE SIMULATION */
register("safe.mode.enable", async () => {
  await updateDoc(doc(db, "system", "config"), { safeMode: true });
  print("Safe Mode ENABLED", "warn");
}, "Enable safe mode");

register("safe.mode.disable", async () => {
  await updateDoc(doc(db, "system", "config"), { safeMode: false });
  print("Safe Mode DISABLED", "success");
}, "Disable safe mode");

register("safe.mode.status", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print("Safe Mode: " + (snap.data()?.safeMode ? "ON" : "OFF"), "info");
}, "Check safe mode");

/* ANNOUNCEMENTS IMPROVED */
register("announce.clear", async () => {
  await setAnnouncement({ text: "", enabled: false });
  print("Announcement cleared", "success");
}, "Clear announcement");

register("announce.reset", async () => {
  await setAnnouncement({ text: "", enabled: false, color: "info" });
  print("Announcement reset", "success");
}, "Reset announcement");

register("announce.status", async () => {
  const snap = await getDoc(doc(db, "system", "announcement"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "Announcement status");

/* EMERGENCY BROADCAST */
register("emergency.enable", async (a) => {
  const msg = a.join(" ") || "EMERGENCY MODE ACTIVE";
  await setEmergency({ enabled: true, message: msg, level: "critical" });
  print("EMERGENCY ENABLED", "error");
}, "Enable emergency broadcast");

register("emergency.disable", async () => {
  await setEmergency({ enabled: false, message: "", level: "none" });
  print("EMERGENCY DISABLED", "success");
}, "Disable emergency broadcast");

register("emergency.status", async () => {
  const snap = await getDoc(doc(db, "system", "emergency"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "Emergency status");

/* DEBUG */
register("debug.snapshot.full", async () => {
  const users = await getDocs(collection(db, "users"));
  const config = await getDoc(doc(db, "system", "config"));

  print("Users: " + users.size);
  print(JSON.stringify(config.data(), null, 2));
}, "Full debug snapshot");

/* INPUT */
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
    suggestBox.style.display = "none";
  }
});

print("Admin OS ready (Alpha+). Type 'help'.", "success");

</script>

</body>
</html>
