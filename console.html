<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emerald AdminOS Console Pre-Beta</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}

/* ================= SUGGESTIONS ================= */
#suggestBox {
  position: absolute;
  bottom: 60px;
  left: 10px;
  background: #111;
  border: 1px solid #00ff88;
  padding: 6px;
  font-size: 12px;
  display: none;
  max-height: 160px;
  overflow-y: auto;
  min-width: 280px;
  z-index: 9999;
}

.suggest-item {
  padding: 4px;
  cursor: pointer;
}

.suggest-item:hover {
  background: #00ff88;
  color: black;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">
    AdminOS Console - Emergency + Announcement Enabled Build
  </div>

  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<div id="suggestBox"></div>

<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");
const suggestBox = document.getElementById("suggestBox");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) return print("Unknown command: " + cmd, "error");

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= SUGGESTIONS (FIXED + CLICKABLE) ================= */

function updateSuggestions(val) {
  const inputVal = val.toLowerCase();

  if (!inputVal) return suggestBox.style.display = "none";

  const matches = Object.keys(commands)
    .filter(c => c.startsWith(inputVal))
    .slice(0, 8);

  if (!matches.length) return suggestBox.style.display = "none";

  suggestBox.innerHTML = "";

  matches.forEach(cmd => {
    const div = document.createElement("div");
    div.className = "suggest-item";
    div.textContent = "› " + cmd;

    div.onclick = () => {
      run(cmd);
      input.value = "";
      suggestBox.style.display = "none";
    };

    suggestBox.appendChild(div);
  });

  suggestBox.style.display = "block";
}

/* ================= ANNOUNCEMENTS ================= */

function setAnnouncement(data) {
  return updateDoc(doc(db, "system", "announcement"), data);
}

/* ================= EMERGENCY BROADCAST SYSTEM ================= */
/*
   This is the “override everything” system you asked for earlier.
   It is designed to be globally readable from home.html.
*/

function setEmergencyBroadcast(text, level="critical") {
  return updateDoc(doc(db, "system", "announcement"), {
    text,
    enabled: true,
    emergency: true,
    level,
    timestamp: Date.now()
  });
}

/* ================= GLOBAL LOCK ================= */

let globalLockState = null;

function startGlobalLock(mode) {
  globalLockState = { mode, password: "", confirmed: false, y: false };

  print("Enter verification password:");
}

function clearFlow() {
  globalLockState = null;
  consoleEl.innerHTML = "";
  suggestBox.style.display = "none";
}

/* ================= HELP (FULLY RESTORED DESCRIPTIONS) ================= */

register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  Object.entries(helpData).forEach(([cmd, desc]) => {
    print(cmd + " → " + desc);
  });

  print("\n--- SYSTEM ---");
  print("system.status → Show system config");
  print("system.reset → Reset system flags");
  print("system.lockdown.enable → Enable full lockdown flow");
  print("system.lockdown.disable → Disable full lockdown flow");

  print("\n--- DEBUG ---");
  print("debug.db.test → Test Firestore connection");
  print("debug.config.view → View system config");
  print("debug.latency → DB latency test");
  print("debug.console.clear → Clear console");

  print("\n--- ANNOUNCEMENTS ---");
  print("announce.set → Set announcement text");
  print("announce.enable → Enable announcement");
  print("announce.disable → Disable announcement");
  print("announce.color → Set announcement color");
  print("announce.view → View announcement");

  print("\n--- EMERGENCY ---");
  print("announce.emergency.set → Force global override broadcast");
  print("announce.emergency.clear → Remove emergency broadcast");

}, "Show all commands");

/* ================= SYSTEM ================= */

register("system.status", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "Show system status");

register("system.reset", async () => {
  await updateDoc(doc(db, "system", "config"), {
    globalLock: false,
    loginDisabled: false,
    chatDisabled: false,
    adminDisabled: false
  });
  print("System reset complete", "success");
}, "Reset system");

register("system.lockdown.enable", () => startGlobalLock("enable"), "Enable lockdown");
register("system.lockdown.disable", () => startGlobalLock("disable"), "Disable lockdown");

/* ================= DEBUG ================= */

register("debug.db.test", async () => {
  const snap = await getDocs(collection(db, "users"));
  print("DB OK | users: " + snap.size, "success");
}, "Test DB");

register("debug.config.view", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "View config");

register("debug.latency", async () => {
  const start = Date.now();
  await getDocs(collection(db, "users"));
  print("Latency: " + (Date.now() - start) + "ms", "info");
}, "Latency test");

register("debug.console.clear", () => {
  consoleEl.innerHTML = "";
  print("Cleared", "success");
}, "Clear console");

/* ================= USERS ================= */

register("user.list", async () => {
  const snap = await getDocs(collection(db, "users"));
  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
  });
}, "List users");

register("user.delete", async (a) => {
  await deleteDoc(doc(db, "users", a[0]));
  print("User deleted", "success");
}, "Delete user");

register("user.role", async (a) => {
  await updateDoc(doc(db, "users", a[0]), { role: a[1] });
  print("Role updated", "success");
}, "Change role");

register("user.lock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: true,
    lockReason: a.slice(1).join(" ")
  });
  print("User locked", "error");
}, "Lock user");

register("user.unlock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: false,
    lockReason: ""
  });
  print("User unlocked", "success");
}, "Unlock user");

/* ================= ANNOUNCEMENTS COMMANDS ================= */

register("announce.set", async (a) => {
  await setAnnouncement({ text: a.join(" "), enabled: true });
  print("Announcement set", "success");
}, "Set announcement");

register("announce.enable", async () => {
  await setAnnouncement({ enabled: true });
  print("Announcement enabled", "success");
}, "Enable announcement");

register("announce.disable", async () => {
  await setAnnouncement({ enabled: false });
  print("Announcement disabled", "warn");
}, "Disable announcement");

register("announce.color", async (a) => {
  await setAnnouncement({ color: a[0] || "info" });
  print("Color updated", "info");
}, "Set color");

register("announce.view", async () => {
  const snap = await getDoc(doc(db, "system", "announcement"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "View announcement");

/* ================= EMERGENCY COMMANDS ================= */

register("announce.emergency.set", async (a) => {
  await setEmergencyBroadcast(a.join(" "), "critical");
  print("EMERGENCY BROADCAST ACTIVE", "error");
}, "Force emergency override broadcast");

register("announce.emergency.clear", async () => {
  await setAnnouncement({
    text: "",
    enabled: false,
    emergency: false
  });
  print("Emergency cleared", "success");
}, "Clear emergency broadcast");

/* ================= INPUT ================= */

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
    suggestBox.style.display = "none";
  }
});

input.addEventListener("input", (e) => {
  updateSuggestions(e.target.value);
});

print("AdminOS ready (FULL RESTORE + EMERGENCY MODE). Type 'help'.", "success");

</script>

</body>
</html>
