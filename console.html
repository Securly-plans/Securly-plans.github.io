<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AdminOS Console Beta</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">AdminOS Console - Copyright 2026, Monroe Enterainment Services</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<script type="module">

import { db } from "./js/firebase.js";
import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= STATE MACHINE (GLOBAL LOCK FLOW) ================= */

let globalLockState = null;
let tempInput = "";

/*
STATES:
null
await_password
await_confirm
await_y_n
await_execute
*/

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + (globalLockState ? "****" : inputStr), "warn");

  /* GLOBAL LOCK FLOW OVERRIDE */
  if (globalLockState) {
    return handleGlobalLockFlow(inputStr);
  }

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) return print("Unknown command: " + cmd, "error");

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= GLOBAL LOCK FLOW ================= */

function startGlobalLock(mode) {
  globalLockState = {
    mode,
    password: "",
    confirmed: false,
    y: false
  };

  print("-------------------------------------------");
  print("Enter verification password:");
  print("-------------------------------------------");
}

function clearFlow() {
  globalLockState = null;
  tempInput = "";
  consoleEl.innerHTML = "";
}

function handleGlobalLockFlow(inputStr) {

  const state = globalLockState;

  switch(true) {

    /* STEP 1 PASSWORD */
    case !state.password: {
      state.password = inputStr;

      // fetch password from firestore
      getDoc(doc(db, "system", "config")).then(snap => {

        const real = snap.data()?.globalLockPassword;

        if (inputStr !== real) {
          print("-------------------------------------------");
          print("Verification Failure, Closing Console.");
          setTimeout(() => window.close(), 1200);
          return;
        }

        state.confirmed = true;

        print("-------------------------------------------");
        print("Verification Confirmed. Are you sure? Y/N");
        print("-------------------------------------------");
      });

      break;
    }

    /* STEP 2 Y/N */
    case state.confirmed && !state.y: {
      const v = inputStr.toLowerCase();

      if (v === "n") {
        print("Command Canceled.");
        clearFlow();
        return;
      }

      if (v === "y") {
        state.y = true;
        print("-------------------------------------------");
        print('Intent Confirmed. Enter "Exe" or "Execute" or "Cancel".');
        print("-------------------------------------------");
        print("Waiting...");
      }

      break;
    }

    /* STEP 3 EXECUTE */
    case state.y: {
      const v = inputStr.toLowerCase();

      if (v === "cancel") {
        print("Command Canceled.");
        clearFlow();
        return;
      }

      if (v === "exe" || v === "execute") {

        print("-------------------------------------------");
        print("Executing Command...");

        setTimeout(() => {
          if (state.mode === "enable") {
            updateDoc(doc(db, "system", "config"), {
              globalLock: true,
              loginDisabled: true,
              chatDisabled: true,
              adminDisabled: true
            });
          } else {
            updateDoc(doc(db, "system", "config"), {
              globalLock: false,
              loginDisabled: false,
              chatDisabled: false,
              adminDisabled: false
            });
          }

          print("Command has been executed.");
          clearFlow();

        }, 1200);
      }

      break;
    }
  }
}

/* ================= HELP ================= */

register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  Object.entries(helpData).forEach(([cmd, desc]) => {
    print("\n" + cmd);
    print(" → " + desc);
  });

  print("\n--- GLOBAL LOCK ---");
  print("system.globallock.enable");
  print("system.globallock.disable");

}, "Shows all commands with descriptions");

/* ================= SYSTEM ================= */

register("clear", () => consoleEl.innerHTML = "", "Clears console");

register("status", () => {
  print("System OK", "success");
}, "System status check");

/* ================= USERS (RESTORED) ================= */

register("user.list", async () => {
  const snap = await getDocs(collection(db, "users"));
  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
  });
}, "Lists all users");

register("user.delete", async (a) => {
  await deleteDoc(doc(db, "users", a[0]));
  print("User deleted", "success");
}, "Deletes user");

register("user.role", async (a) => {
  await updateDoc(doc(db, "users", a[0]), { role: a[1] });
  print("Role updated", "success");
}, "Changes role");

register("user.lock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: true,
    lockReason: a.slice(1).join(" ")
  });
  print("User locked", "error");
}, "Locks user");

register("user.unlock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: false,
    lockReason: ""
  });
  print("User unlocked", "success");
}, "Unlocks user");

/* ================= GLOBAL LOCK COMMANDS ================= */

register("system.globallock.enable", () => {
  startGlobalLock("enable");
}, "Triggers global lock ENABLE flow");

register("system.globallock.disable", () => {
  startGlobalLock("disable");
}, "Triggers global lock DISABLE flow");

/* ================= INPUT ================= */

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
  }
});

print("Admin OS ready (v9). Type 'help'.", "success");

</script>

</body>
</html>
