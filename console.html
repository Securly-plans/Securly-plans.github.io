<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AdminOS Console Beta</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">ADMIN OS CONSOLE — Firebase v9 (Crash-Proof)</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<script type="module">

import { db } from "./js/firebase.js";
import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  query,
  orderBy,
  limit,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= CLEAR + UI RESET ================= */

function clearConsole() {
  consoleEl.innerHTML = "";
}

/* ================= FIRESTORE CONFIG ================= */

async function getConfig() {
  const snap = await getDoc(doc(db, "system", "config"));
  return snap.exists() ? snap.data() : {};
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description = "No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= INPUT LOCK ================= */

function lockInput() {
  input.disabled = true;
}

function unlockInput() {
  input.disabled = false;
  input.focus();
}

/* ================= GLOBAL LOCK FLOW ENGINE ================= */

async function globalLockFlow(action) {

  const config = await getConfig();
  const correctPassword = config.globalLockPassword;

  print("-------------------------------------------");
  print("Enter verification password:");
  print("-------------------------------------------");

  lockInput();

  input.value = "";
  input.type = "password";

  const password = await new Promise(resolve => {
    input.onkeydown = (e) => {
      if (e.key === "Enter") {
        const val = input.value;
        input.value = "";
        input.type = "text";
        input.onkeydown = null;
        resolve(val);
      }
    };
  });

  if (password !== correctPassword) {
    print("Verification Failure, Closing Console.", "error");

    setTimeout(() => {
      document.body.innerHTML = "";
      window.close();
    }, 1200);

    return;
  }

  print("-------------------------------------------");
  print("Verification Confirmed. Are you sure? Y/N");

  const confirm1 = await new Promise(resolve => {
    input.onkeydown = (e) => {
      if (e.key === "Enter") {
        const val = input.value.trim().toUpperCase();
        input.value = "";
        input.onkeydown = null;
        resolve(val);
      }
    };
  });

  if (confirm1 !== "Y") {
    print("Command Canceled.");
    clearConsole();
    unlockInput();
    return;
  }

  print("-------------------------------------------");
  print('Intent Confirmed. Enter "Exe" or "Execute" or "Cancel".');

  const confirm2 = await new Promise(resolve => {
    input.onkeydown = (e) => {
      if (e.key === "Enter") {
        const val = input.value.trim();
        input.value = "";
        input.onkeydown = null;
        resolve(val);
      }
    };
  });

  if (confirm2.toLowerCase() === "cancel") {
    print("Command Canceled.");
    clearConsole();
    unlockInput();
    return;
  }

  if (confirm2.toLowerCase() !== "exe" && confirm2.toLowerCase() !== "execute") {
    print("Command Canceled.");
    clearConsole();
    unlockInput();
    return;
  }

  print("Executing Command...");

  await action();

  print("Command has been executed.");

  clearConsole();
  unlockInput();
}

/* ================= COMMANDS ================= */

register("system.globallock.enable", async () => {

  await globalLockFlow(async () => {
    await updateDoc(doc(db, "system", "config"), {
      globalLock: true
    });
  });

}, "Enables global system lock");

register("system.globallock.disable", async () => {

  await globalLockFlow(async () => {
    await updateDoc(doc(db, "system", "config"), {
      globalLock: false
    });
  });

}, "Disables global system lock");

/* ================= BASIC COMMANDS ================= */

register("clear", () => clearConsole(), "Clears console");

register("help", () => {
  print("=== COMMANDS ===", "info");
  Object.keys(helpData).forEach(c => {
    print(c + " → " + helpData[c]);
  });
}, "Shows help");

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  if (!commands[cmd]) {
    print("Unknown command", "error");
    return;
  }

  try {
    await commands[cmd](parts);
  } catch (e) {
    print("ERROR: " + e.message, "error");
  }
}

/* ================= INPUT ================= */

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
  }
});

print("Admin OS Ready. Type help.", "success");

</script>

</body>
</html>
