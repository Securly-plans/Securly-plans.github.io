<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin OS Console (Crash-Proof)</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">ADMIN OS CONSOLE — crash-proof mode</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<!-- Firebase (you already have firebase.js setting window.db) -->
<script src="js/firebase.js"></script>

<script>
/* =========================
   SAFE CORE LAYER
========================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* SAFE FIREBASE ACCESS */
function getDB() {
  if (!window.db) {
    throw new Error("Firestore (db) not initialized. Check firebase.js");
  }
  return window.db;
}

/* SAFE WRAPPER */
async function fb(fn) {
  try {
    const db = getDB();
    return await fn(db);
  } catch (err) {
    print("Firebase error: " + (err?.message || err), "error");
    console.error(err);
  }
}

/* =========================
   COMMAND SYSTEM
========================= */

const commands = {};

function register(name, fn) {
  commands[name] = fn;
}

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) {
    print("Unknown command: " + cmd, "error");
    return;
  }

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
    console.error(e);
  }
}

/* =========================
   HISTORY
========================= */

let history = [];
let hIndex = -1;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    history.push(input.value);
    hIndex = history.length;
    run(input.value);
    input.value = "";
  }

  if (e.key === "ArrowUp") {
    if (hIndex > 0) input.value = history[--hIndex];
  }

  if (e.key === "ArrowDown") {
    if (hIndex < history.length - 1) input.value = history[++hIndex] || "";
    else input.value = "";
  }
});

/* =========================
   HELP (DYNAMIC)
========================= */

register("help", async () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  const grouped = {};

  Object.keys(commands).forEach(cmd => {
    const group = cmd.includes(".") ? cmd.split(".")[0] : "general";
    if (!grouped[group]) grouped[group] = [];
    grouped[group].push(cmd);
  });

  Object.keys(grouped).forEach(group => {
    print(`\n[${group}]`, "info");
    grouped[group].sort().forEach(c => print(" - " + c));
  });
});

/* =========================
   SYSTEM
========================= */

register("clear", async () => {
  consoleEl.innerHTML = "";
});

register("status", async () => {
  print("=== SYSTEM STATUS ===", "info");
  print("Firebase DB: " + (window.db ? "OK" : "NOT INITIALIZED"),
    window.db ? "success" : "error"
  );
});

/* =========================
   USERS
========================= */

register("user.list", async () => {
  await fb(async (db) => {
    const snap = await db.collection("users").get();

    snap.forEach(d => {
      const u = d.data();
      print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
    });
  });
});

register("user.delete", async (a) => {
  const id = a[0];
  if (!id) return print("Usage: user.delete <id>", "error");

  await fb(async (db) => {
    await db.collection("users").doc(id).delete();
  });

  print("User deleted", "success");
});

register("user.role", async (a) => {
  const id = a[0];
  const role = a[1];

  if (!id || !role) return print("Usage: user.role <id> <role>", "error");

  await fb(async (db) => {
    await db.collection("users").doc(id).update({ role });
  });

  print("Role updated", "success");
});

register("user.lock", async (a) => {
  const id = a[0];
  const reason = a.slice(1).join(" ");

  await fb(async (db) => {
    await db.collection("users").doc(id).update({
      locked: true,
      lockReason: reason
    });
  });

  print("User locked", "error");
});

register("user.unlock", async (a) => {
  const id = a[0];

  await fb(async (db) => {
    await db.collection("users").doc(id).update({
      locked: false,
      lockReason: ""
    });
  });

  print("User unlocked", "success");
});

/* =========================
   INCIDENTS
========================= */

register("incident.list", async () => {
  await fb(async (db) => {
    const snap = await db.collection("incidentReports")
      .orderBy("timestamp", "desc")
      .get();

    snap.forEach(d => {
      const i = d.data();
      print(`${d.id} | ${i.title} | ${i.severity}`);
    });
  });
});

register("incident.create", async (a) => {
  const raw = a.join(" ");
  const [title, target, severity, details] = raw.split("|");

  await fb(async (db) => {
    await db.collection("incidentReports").add({
      title,
      target,
      severity,
      details,
      timestamp: Date.now(),
      status: "open"
    });
  });

  print("Incident created", "success");
});

/* =========================
   CHATS
========================= */

register("chat.list", async () => {
  await fb(async (db) => {
    const snap = await db.collection("chats").get();

    snap.forEach(d => {
      const c = d.data();
      print(`${d.id} | ${c.lastMessage || "no message"}`);
    });
  });
});

/* =========================
   LOGS
========================= */

register("logs.list", async () => {
  await fb(async (db) => {
    const snap = await db.collection("adminLogs")
      .orderBy("timestamp", "desc")
      .limit(30)
      .get();

    snap.forEach(d => {
      const l = d.data();
      print(`${l.type} | ${l.targetUser} | ${l.details}`);
    });
  });
});

/* =========================
   STATS
========================= */

register("stats", async () => {
  await fb(async (db) => {
    const users = await db.collection("users").get();
    const incidents = await db.collection("incidentReports").get();
    const chats = await db.collection("chats").get();

    const locked = users.docs.filter(d => d.data().locked).length;

    print(`Users: ${users.size}`, "info");
    print(`Locked: ${locked}`, "info");
    print(`Incidents: ${incidents.size}`, "info");
    print(`Chats: ${chats.size}`, "info");
  });
});

/* =========================
   INIT
========================= */

print("Admin OS loaded. Type 'help'.", "success");
</script>

</body>
</html>
