<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin OS Console</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">ADMIN OS CONSOLE — type "help"</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<script src="js/firebase.js"></script>

<script>
const db = window.db;

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");

/* =========================
   OUTPUT
========================= */
function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = msg;
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* =========================
   COMMAND SYSTEM
========================= */
const commands = {};

function register(name, fn) {
  commands[name] = fn;
}

function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  if (!commands[cmd]) {
    print("Unknown command: " + cmd, "error");
    return;
  }

  try {
    commands[cmd](parts);
  } catch (e) {
    print(e.message, "error");
  }
}

/* =========================
   HISTORY
========================= */
let history = [];
let hIndex = -1;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    history.push(input.value);
    hIndex = history.length;
    run(input.value);
    input.value = "";
  }

  if (e.key === "ArrowUp") {
    if (hIndex > 0) input.value = history[--hIndex];
  }

  if (e.key === "ArrowDown") {
    if (hIndex < history.length - 1) input.value = history[++hIndex] || "";
    else input.value = "";
  }
});

/* =========================
   HELP
========================= */
register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  print("USERS:");
  print(" user.create <name> <pass>");
  print(" user.delete <id>");
  print(" user.role <id> <role>");
  print(" user.lock <id> <reason>");
  print(" user.unlock <id>");
  print(" user.list");
  print(" user.search <text>");

  print("\nINCIDENTS:");
  print(" incident.create <title>|<target>|<severity>|<details>");
  print(" incident.list");

  print("\nCHATS:");
  print(" chat.list");

  print("\nLOGS:");
  print(" logs.list");

  print("\nSTATS:");
  print(" stats");
});

register("clear", () => consoleEl.innerHTML = "");

/* =========================
   HELPERS
========================= */
function hash(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

/* =========================
   USERS
========================= */

register("user.create", async (a) => {
  const name = a[0];
  const pass = a[1];

  if (!name || !pass) return print("Usage: user.create <name> <pass>", "error");

  await db.collection("users").add({
    username: name,
    passwordHash: hash(pass),
    role: "user",
    locked: false,
    created: Date.now()
  });

  print("User created", "success");
});

register("user.delete", async (a) => {
  const id = a[0];
  if (!id) return print("Usage: user.delete <id>", "error");

  await db.collection("users").doc(id).delete();
  print("User deleted", "success");
});

register("user.role", async (a) => {
  const id = a[0];
  const role = a[1];

  await db.collection("users").doc(id).update({ role });
  print("Role updated", "success");
});

register("user.lock", async (a) => {
  const id = a[0];
  const reason = a.slice(1).join(" ");

  await db.collection("users").doc(id).update({
    locked: true,
    lockReason: reason
  });

  print("User locked", "error");
});

register("user.unlock", async (a) => {
  const id = a[0];

  await db.collection("users").doc(id).update({
    locked: false,
    lockReason: ""
  });

  print("User unlocked", "success");
});

register("user.list", async () => {
  const snap = await db.collection("users").get();

  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
  });
});

register("user.search", async (a) => {
  const term = a.join(" ").toLowerCase();

  const snap = await db.collection("users").get();

  snap.forEach(d => {
    const u = d.data();
    if ((u.username || "").toLowerCase().includes(term)) {
      print(`${d.id} | ${u.username}`);
    }
  });
});

/* =========================
   INCIDENTS
========================= */

register("incident.create", async (a) => {
  const raw = a.join(" ");
  const [title, target, severity, details] = raw.split("|");

  await db.collection("incidentReports").add({
    title,
    target,
    severity,
    details,
    timestamp: Date.now(),
    status: "open"
  });

  print("Incident created", "success");
});

register("incident.list", async () => {
  const snap = await db.collection("incidentReports").orderBy("timestamp","desc").get();

  snap.forEach(d => {
    const i = d.data();
    print(`${d.id} | ${i.title} | ${i.severity}`);
  });
});

/* =========================
   CHATS
========================= */

register("chat.list", async () => {
  const snap = await db.collection("chats").get();

  snap.forEach(d => {
    const c = d.data();
    print(`${d.id} | ${c.lastMessage || "no message"}`);
  });
});

/* =========================
   LOGS
========================= */

register("logs.list", async () => {
  const snap = await db.collection("adminLogs")
    .orderBy("timestamp","desc")
    .limit(30)
    .get();

  snap.forEach(d => {
    const l = d.data();
    print(`${l.type} | ${l.targetUser} | ${l.details}`);
  });
});

/* =========================
   STATS
========================= */

register("stats", async () => {
  const users = await db.collection("users").get();
  const incidents = await db.collection("incidentReports").get();
  const chats = await db.collection("chats").get();

  const locked = users.docs.filter(d => d.data().locked).length;

  print(`Users: ${users.size}`, "info");
  print(`Locked: ${locked}`, "info");
  print(`Incidents: ${incidents.size}`, "info");
  print(`Chats: ${chats.size}`, "info");
});

/* =========================
   RUNNER
========================= */
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
  }
});
</script>

</body>
</html>
