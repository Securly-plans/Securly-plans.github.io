<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emerald AdminOS Console Beta</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}

/* ================= SUGGESTIONS ================= */
#suggestBox {
  position: absolute;
  bottom: 60px;
  left: 10px;
  background: #111;
  border: 1px solid #00ff88;
  padding: 6px;
  font-size: 12px;
  display: none;
  max-height: 160px;
  overflow-y: auto;
  min-width: 280px;
  z-index: 9999;
}

.suggest-item {
  padding: 4px;
  cursor: pointer;
}

.suggest-item:hover {
  background: #00ff88;
  color: black;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">
    AdminOS Console - Copyright 2026, Monroe Enterainment Services. Administrator Access Only.
  </div>

  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<div id="suggestBox"></div>

<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");
const suggestBox = document.getElementById("suggestBox");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) return print("Unknown command: " + cmd, "error");

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= FIXED SUGGESTIONS (CLICKABLE) ================= */

function updateSuggestions(val) {
  const inputVal = val.toLowerCase();

  if (!inputVal) {
    suggestBox.style.display = "none";
    return;
  }

  const matches = Object.keys(commands)
    .filter(c => c.startsWith(inputVal))
    .slice(0, 8);

  if (!matches.length) {
    suggestBox.style.display = "none";
    return;
  }

  suggestBox.innerHTML = "";

  matches.forEach(cmd => {
    const div = document.createElement("div");
    div.className = "suggest-item";
    div.textContent = "› " + cmd;

    div.onclick = () => {
      input.value = cmd;
      suggestBox.style.display = "none";
      run(cmd);
      input.value = "";
    };

    div.onmouseenter = () => {
      input.value = cmd;
    };

    suggestBox.appendChild(div);
  });

  suggestBox.style.display = "block";
}

/* ================= ANNOUNCEMENT SYSTEM ================= */

function setAnnouncement(data) {
  return updateDoc(doc(db, "system", "announcement"), data);
}

/* ================= GLOBAL LOCK ================= */

let globalLockState = null;

function startGlobalLock(mode) {
  globalLockState = { mode, password: "", confirmed: false, y: false };

  print("-------------------------------------------");
  print("Enter verification password:");
  print("-------------------------------------------");
}

function clearFlow() {
  globalLockState = null;
  consoleEl.innerHTML = "";
  suggestBox.style.display = "none";
}

function handleGlobalLockFlow(inputStr) {
  const state = globalLockState;

  switch(true) {

    case !state.password: {
      state.password = inputStr;

      getDoc(doc(db, "system", "config")).then(snap => {
        const real = snap.data()?.globalLockPassword;

        if (inputStr !== real) {
          print("Verification Failure, Closing Console.");
          setTimeout(() => window.close(), 1200);
          return;
        }

        state.confirmed = true;

        print("Verified. Are you sure? Y/N");
      });

      break;
    }

    case state.confirmed && !state.y: {
      const v = inputStr.toLowerCase();

      if (v === "n") {
        print("Cancelled.");
        clearFlow();
        return;
      }

      if (v === "y") {
        state.y = true;
        print('Enter "Exe" or "Execute" or "Cancel".');
      }

      break;
    }

    case state.y: {
      const v = inputStr.toLowerCase();

      if (v === "cancel") {
        clearFlow();
        return;
      }

      if (v === "exe" || v === "execute") {

        print("Executing...");

        setTimeout(() => {

          updateDoc(doc(db, "system", "config"), {
            globalLock: state.mode === "enable",
            loginDisabled: state.mode === "enable",
            chatDisabled: state.mode === "enable",
            adminDisabled: state.mode === "enable"
          });

          print("Executed.");
          clearFlow();

        }, 1200);
      }

      break;
    }
  }
}

/* ================= ALL ORIGINAL COMMANDS RESTORED ================= */

/* HELP */
register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  Object.entries(helpData).forEach(([cmd, desc]) => {
    print(cmd + " → " + desc);
  });

}, "Help menu");

/* SYSTEM */
register("system.status", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "System status");

register("system.reset", async () => {
  await updateDoc(doc(db, "system", "config"), {
    globalLock: false,
    loginDisabled: false,
    chatDisabled: false,
    adminDisabled: false
  });

  print("System reset complete", "success");
}, "Reset system");

register("system.lockdown.enable", () => startGlobalLock("enable"), "Enable lockdown");
register("system.lockdown.disable", () => startGlobalLock("disable"), "Disable lockdown");

/* DEBUG */
register("debug.db.test", async () => {
  const snap = await getDocs(collection(db, "users"));
  print("DB OK | users: " + snap.size, "success");
}, "Test DB");

register("debug.config.view", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "View config");

register("debug.latency", async () => {
  const start = Date.now();
  await getDocs(collection(db, "users"));
  print("Latency: " + (Date.now() - start) + "ms", "info");
}, "DB latency");

register("debug.console.clear", () => {
  consoleEl.innerHTML = "";
  print("Cleared", "success");
}, "Clear console");

/* USERS */
register("user.list", async () => {
  const snap = await getDocs(collection(db, "users"));
  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
  });
}, "List users");

register("user.delete", async (a) => {
  await deleteDoc(doc(db, "users", a[0]));
  print("User deleted", "success");
}, "Delete user");

register("user.role", async (a) => {
  await updateDoc(doc(db, "users", a[0]), { role: a[1] });
  print("Role updated", "success");
}, "Change role");

register("user.lock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: true,
    lockReason: a.slice(1).join(" ")
  });
  print("User locked", "error");
}, "Lock user");

register("user.unlock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: false,
    lockReason: ""
  });
  print("User unlocked", "success");
}, "Unlock user");

/* INPUT */
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
    suggestBox.style.display = "none";
  }
});

input.addEventListener("input", (e) => {
  updateSuggestions(e.target.value);
});

document.addEventListener("click", (e) => {
  if (!suggestBox.contains(e.target) && e.target !== input) {
    suggestBox.style.display = "none";
  }
});

print("Admin OS ready (fixed + restored v11). Type 'help'.", "success");

</script>

</body>
</html>
