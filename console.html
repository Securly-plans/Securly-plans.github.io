<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin OS Console Beta</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">ADMIN OS CONSOLE — Firebase v9 (Crash-Proof)</div>
  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<script type="module">

/* ================= FIREBASE (V9 MODULAR) ================= */
import { db } from "./js/firebase.js";

import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description = "No description") {
  commands[name] = fn;
  helpData[name] = description;
}

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) {
    print("Unknown command: " + cmd, "error");
    return;
  }

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= HISTORY ================= */

let history = [];
let hIndex = -1;

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    history.push(input.value);
    hIndex = history.length;
    run(input.value);
    input.value = "";
  }

  if (e.key === "ArrowUp") {
    if (hIndex > 0) input.value = history[--hIndex];
  }

  if (e.key === "ArrowDown") {
    if (hIndex < history.length - 1) input.value = history[++hIndex] || "";
    else input.value = "";
  }
});

/* ================= HELP (NOW DOCUMENTED) ================= */

register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  Object.keys(helpData).forEach(cmd => {
    print(`\n${cmd}`);
    print("  → " + helpData[cmd]);
  });
});

/* ================= SYSTEM ================= */

register("clear", () => {
  consoleEl.innerHTML = "";
}, "Clears the console output");

register("status", () => {
  print("Firebase: " + (db ? "OK" : "NOT LOADED"),
    db ? "success" : "error"
  );
}, "Checks Firebase connection status");

/* ================= LOGIN LOCK (NEW FEATURE) ================= */

register("system.loginlock", async (a) => {
  const value = a[0] === "true";

  await updateDoc(doc(db, "system", "config"), {
    loginDisabled: value
  });

  print("Login lock set to: " + value, "success");
}, "Enables/disables global login access");

/* ================= USERS ================= */

register("user.list", async () => {
  const snap = await getDocs(collection(db, "users"));

  snap.forEach(d => {
    const u = d.data();
    print(`${d.id} | ${u.username} | ${u.role} | locked:${u.locked}`);
  });
}, "Lists all users");

register("user.delete", async (a) => {
  await deleteDoc(doc(db, "users", a[0]));
  print("User deleted", "success");
}, "Deletes a user by ID");

register("user.role", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    role: a[1]
  });

  print("Role updated", "success");
}, "Changes a user's role");

register("user.lock", async (a) => {
  const reason = a.slice(1).join(" ");

  await updateDoc(doc(db, "users", a[0]), {
    locked: true,
    lockReason: reason
  });

  print("User locked", "error");
}, "Locks a user account");

register("user.unlock", async (a) => {
  await updateDoc(doc(db, "users", a[0]), {
    locked: false,
    lockReason: ""
  });

  print("User unlocked", "success");
}, "Unlocks a user account");

/* ================= INCIDENTS ================= */

register("incident.list", async () => {
  const q = query(
    collection(db, "incidentReports"),
    orderBy("timestamp", "desc")
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const i = d.data();
    print(`${d.id} | ${i.title} | ${i.severity}`);
  });
}, "Lists incident reports");

register("incident.create", async (a) => {
  const raw = a.join(" ");
  const [title, target, severity, details] = raw.split("|");

  await addDoc(collection(db, "incidentReports"), {
    title,
    target,
    severity,
    details,
    timestamp: Date.now(),
    status: "open"
  });

  print("Incident created", "success");
}, "Creates an incident report");

/* ================= CHATS ================= */

register("chat.list", async () => {
  const snap = await getDocs(collection(db, "chats"));

  snap.forEach(d => {
    const c = d.data();
    print(`${d.id} | ${c.lastMessage || "no message"}`);
  });
}, "Lists chat sessions");

/* ================= LOGS ================= */

register("logs.list", async () => {
  const q = query(
    collection(db, "adminLogs"),
    orderBy("timestamp", "desc"),
    limit(30)
  );

  const snap = await getDocs(q);

  snap.forEach(d => {
    const l = d.data();
    print(`${l.type} | ${l.targetUser} | ${l.details}`);
  });
}, "Shows latest admin logs");

/* ================= INIT ================= */

print("Admin OS ready (v9). Type 'help'.", "success");

</script>

</body>
</html>
