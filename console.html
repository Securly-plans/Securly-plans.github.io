<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emerald AdminOS Console Alpha</title>

<style>
body {
  margin: 0;
  background: #0b0b0b;
  color: #00ff88;
  font-family: monospace;
}

#wrap {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#header {
  padding: 10px;
  border-bottom: 1px solid #1f1f1f;
  color: #888;
}

#console {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  white-space: pre-wrap;
}

.line { margin: 2px 0; }
.error { color: #ff4d4d; }
.success { color: #00ff88; }
.warn { color: #ffd000; }
.info { color: #3b82f6; }

#inputBar {
  display: flex;
  border-top: 1px solid #1f1f1f;
  padding: 8px;
}

#cmdInput {
  flex: 1;
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
  font-family: monospace;
  padding: 6px;
  outline: none;
}

/* ================= COMMAND SUGGESTIONS ================= */
#suggestBox {
  position: absolute;
  bottom: 60px;
  left: 10px;
  background: #111;
  border: 1px solid #00ff88;
  padding: 6px;
  font-size: 12px;
  display: none;
  max-height: 150px;
  overflow-y: auto;
  min-width: 260px;
}

.suggest-item {
  padding: 4px;
  cursor: pointer;
}

.suggest-item:hover {
  background: #00ff88;
  color: black;
}
</style>
</head>

<body>

<div id="wrap">
  <div id="header">
    AdminOS Console - Copyright 2026, Monroe Enterainment Services.
  </div>

  <div id="console"></div>

  <div id="inputBar">
    <div>&gt;</div>
    <input id="cmdInput" autocomplete="off"/>
  </div>
</div>

<div id="suggestBox"></div>

<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  addDoc,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= CORE ================= */

const consoleEl = document.getElementById("console");
const input = document.getElementById("cmdInput");
const suggestBox = document.getElementById("suggestBox");

function print(msg, type="line") {
  const div = document.createElement("div");
  div.className = "line " + type;
  div.textContent = String(msg);
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

/* ================= COMMAND SYSTEM ================= */

const commands = {};
const helpData = {};

function register(name, fn, description="No description") {
  commands[name] = fn;
  helpData[name] = description;
}

/* ================= RUNNER ================= */

async function run(inputStr) {
  if (!inputStr.trim()) return;

  print("> " + inputStr, "warn");

  const parts = inputStr.split(" ");
  const cmd = parts.shift().toLowerCase();

  const fn = commands[cmd];

  if (!fn) return print("Unknown command: " + cmd, "error");

  try {
    await fn(parts);
  } catch (e) {
    print("ERROR: " + (e?.message || e), "error");
  }
}

/* ================= SUGGESTIONS (FIXED + CLICKABLE) ================= */

function updateSuggestions(val) {
  const inputVal = val.toLowerCase();

  if (!inputVal) {
    suggestBox.style.display = "none";
    return;
  }

  const matches = Object.keys(commands)
    .filter(c => c.startsWith(inputVal))
    .slice(0, 8);

  if (!matches.length) {
    suggestBox.style.display = "none";
    return;
  }

  suggestBox.innerHTML = "";

  matches.forEach(cmd => {
    const div = document.createElement("div");
    div.className = "suggest-item";
    div.textContent = "› " + cmd;

    div.onclick = () => {
      input.value = cmd;
      suggestBox.style.display = "none";
      run(cmd); // 🔥 CLICK RUNS COMMAND
      input.value = "";
    };

    div.onmouseenter = () => {
      input.value = cmd;
    };

    suggestBox.appendChild(div);
  });

  suggestBox.style.display = "block";
}

/* ================= HELP (FIXED) ================= */

register("help", () => {
  print("=== ADMIN OS COMMANDS ===", "info");

  Object.entries(helpData).forEach(([cmd, desc]) => {
    print(cmd + " → " + desc);
  });

}, "Help menu");

/* ================= SYSTEM (MINIMAL SAFE SET) ================= */

register("system.status", async () => {
  const snap = await getDoc(doc(db, "system", "config"));
  print(JSON.stringify(snap.data(), null, 2), "info");
}, "System status");

register("debug.console.clear", () => {
  consoleEl.innerHTML = "";
  print("Console cleared", "success");
}, "Clear console");

/* ================= INPUT ================= */

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    run(input.value);
    input.value = "";
    suggestBox.style.display = "none";
  }
});

input.addEventListener("input", (e) => {
  updateSuggestions(e.target.value);
});

document.addEventListener("click", (e) => {
  if (!suggestBox.contains(e.target) && e.target !== input) {
    suggestBox.style.display = "none";
  }
});

print("Admin OS ready (fixed v10). Type 'help'.", "success");

</script>

</body>
</html>
