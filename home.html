<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Dashboard</title>

<link rel="stylesheet" href="style.css">

<script>
  (function () {
    const isLoggedIn = localStorage.getItem("loggedIn") === "true";
    if (!isLoggedIn) {
      window.location.replace("index.html");
    }
  })();
</script>

<style>
:root{
  --bg:#0f1115;
  --panel:#1a1d24;
  --panel2:#222630;
  --border:#2e3440;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --primary:#4ade80;
  --danger:#ef4444;
  --info:#3b82f6;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding:16px 20px;
  background:#111827;
  border-bottom:1px solid var(--border);
}

.nav-left,
.nav-right{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.navbar a,
.navbar button{
  color:var(--text);
  text-decoration:none;
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  cursor:pointer;
  font-size:14px;
}

/* ================= NORMAL PAGE ================= */

header{
  padding:20px;
  border-bottom:1px solid var(--border);
}

h2{
  margin:20px;
  color:#4ade80;
}

main{
  padding:0 20px;
}

/* ================= NORMAL ANNOUNCEMENT ================= */
#announcementBar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 12px;
  text-align: center;
  font-size: 14px;
  background: #222;
  color: white;
  display: none;
  z-index: 99999;
}

/* ================= EMERGENCY OVERLAY (FULL SCREEN OVERRIDE) ================= */
#emergencyOverlay {
  position: fixed;
  inset: 0;
  background: #ef4444;
  color: white;
  display: none;
  z-index: 999999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
}

#emergencyOverlay h1 {
  font-size: 40px;
  margin-bottom: 20px;
  letter-spacing: 2px;
}

#emergencyOverlay p {
  font-size: 18px;
  max-width: 800px;
}
</style>
</head>

<body>

<div class="navbar">
  <div class="nav-left">
    <a href="home.html">Home</a>
  </div>

  <div class="nav-right">
    <span id="usernameDisplay"></span>
  </div>
</div>

<header>
  <h1>Home</h1>
  <input type="text" id="searchBar" placeholder="Search games...">
</header>

<h2>Games</h2>

<main id="gameGrid"></main>
<main id="videoGrid"></main>

<!-- NORMAL ANNOUNCEMENT -->
<div id="announcementBar"></div>

<!-- 🚨 EMERGENCY OVERLAY -->
<div id="emergencyOverlay">
  <h1>🚨 Emergency Broadcast</h1>
  <p id="emergencyMessage">System alert active.</p>
</div>

<!-- ================= FIRESTORE LISTENERS ================= -->
<script type="module">
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./js/firebase.js";

const announcementBar = document.getElementById("announcementBar");
const emergencyOverlay = document.getElementById("emergencyOverlay");
const emergencyMessage = document.getElementById("emergencyMessage");

/* ================= NORMAL ANNOUNCEMENT ================= */
onSnapshot(doc(db, "system", "announcement"), (snap) => {
  if (!snap.exists()) return;

  const data = snap.data();

  if (data.enabled && data.text) {
    announcementBar.style.display = "block";
    announcementBar.textContent = data.text;
    announcementBar.style.background =
      data.color === "danger" ? "#ef4444" :
      data.color === "warning" ? "#f59e0b" :
      data.color === "success" ? "#22c55e" :
      "#222";
  } else {
    announcementBar.style.display = "none";
  }
});

/* ================= EMERGENCY OVERRIDE ================= */
onSnapshot(doc(db, "system", "emergency"), (snap) => {
  if (!snap.exists()) {
    emergencyOverlay.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled) {
    emergencyOverlay.style.display = "flex";
    emergencyMessage.textContent =
      data.message || "System-wide emergency broadcast active.";
  } else {
    emergencyOverlay.style.display = "none";
  }
});
</script>

</body>
</html>
