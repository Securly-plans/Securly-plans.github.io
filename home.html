<!-- 📢 ANNOUNCEMENT SYSTEM -->
<script type="module">
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./js/firebase.js";

const bar = document.getElementById("announcementBar");
const emergencyBar = document.getElementById("emergencyBar");

/* NORMAL ANNOUNCEMENT */
onSnapshot(doc(db, "system", "announcement"), (snap) => {
  if (!snap.exists()) return bar.style.display = "none";

  const data = snap.data();

  if (data.enabled && data.text) {
    bar.style.display = "block";
    bar.textContent = data.text;

    if (data.color === "danger") bar.style.background = "#ef4444";
    else if (data.color === "warning") bar.style.background = "#f59e0b";
    else if (data.color === "success") bar.style.background = "#22c55e";
    else bar.style.background = "#222";
  } else {
    bar.style.display = "none";
  }
});

/* 🚨 EMERGENCY OVERRIDE (NEW) */
onSnapshot(doc(db, "system", "emergency"), (snap) => {
  if (!snap.exists()) {
    emergencyBar.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled) {
    emergencyBar.style.display = "block";
    emergencyBar.textContent =
      data.message || "EMERGENCY MODE ACTIVE - SITE STATUS ALERT";
  } else {
    emergencyBar.style.display = "none";
  }
});
</script>

<!-- NOTIFICATIONS (UNCHANGED) -->
<script type="module">
import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");
let notified = new Set();

if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

onSnapshot(collection(db, "chats"), (snapshot) => {
  snapshot.docChanges().forEach(change => {
    if (change.type !== "modified") return;

    const data = change.doc.data();
    const chatId = change.doc.id;

    if (data.type !== "private") return;
    if (!data.participants?.includes(me)) return;

    const messages = data.messages || [];
    const last = messages[messages.length - 1];

    if (!last || last.from === me) return;

    const key = chatId + "_" + last.time;
    if (notified.has(key)) return;

    notified.add(key);
    showNotification(last.from, last.text);
  });
});

function showNotification(sender, text) {
  if (Notification.permission !== "granted") return;

  new Notification("💬 New message from " + sender, {
    body: text.length > 60 ? text.slice(0, 60) + "..." : text,
    icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png"
  });
}
</script>

<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

const isVIP = localStorage.getItem("vip") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");

if (username && isLoggedIn) {
  usernameDisplay.textContent =
    (role === "admin" ? "🛡 " : isVIP ? "⭐ " : "👤 ") + username;
}

if (isLoggedIn) {
  document.getElementById("ticketslink").style.display = "inline-block";
  document.getElementById("profileLink").style.display = "inline-block";
  document.getElementById("viewUsersLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod" || isVIP) {
  document.getElementById("adminticketslink").style.display = "inline-block";
  document.getElementById("modChatLink").style.display = "inline-block";
}

if (role === "admin") {
  document.getElementById("adminLink").style.display = "inline-block";
}

/* SEARCH */
const searchBar = document.getElementById("searchBar");
const gameGrid = document.getElementById("gameGrid");
const videoGrid = document.getElementById("videoGrid");

function filterItems() {
  const query = searchBar.value.toLowerCase().trim();

  const allItems = [...gameGrid.children, ...videoGrid.children];

  allItems.forEach(item => {
    const text = item.textContent.toLowerCase();

    item.style.display = (!query || text.includes(query)) ? "" : "none";
  });
}

searchBar.addEventListener("input", filterItems);
</script>
