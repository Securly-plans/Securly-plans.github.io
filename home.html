<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Dashboard</title>

<style>
:root{
    --primary:#c40000;
    --primary-hover:#a30000;
    --bg:#f4f4f4;
    --card:#ffffff;
    --text:#222;
    --muted:#666;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* ================= NAVBAR ================= */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    padding:12px 18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.nav-left, .nav-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.navbar a,
.nav-btn{
    text-decoration:none;
    padding:7px 12px;
    border-radius:8px;
    font-size:14px;
    border:none;
    cursor:pointer;
    background:#eee;
    color:var(--text);
    transition:.2s;
}

.navbar a:hover{
    background:#ddd;
}

.admin-link{
    background:var(--primary);
    color:white !important;
}

.admin-link:hover{
    background:var(--primary-hover);
}

.chat-link{
    background:#333;
    color:white !important;
}

.logout-btn{
    background:var(--primary);
    color:white;
}

.logout-btn:hover{
    background:var(--primary-hover);
}

.username-badge{
    padding:6px 10px;
    border-radius:8px;
    background:#eee;
    font-size:14px;
}

/* ================= PAGE WRAPPER ================= */
.page{
    max-width:1200px;
    margin:20px auto;
    padding:0 15px;
}

/* ================= HEADER CARD ================= */
.page-header{
    background:var(--card);
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    margin-bottom:18px;
}

.page-header h1{
    margin:0 0 10px 0;
    color:var(--primary);
    font-size:22px;
}

#searchBar{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

#searchBar:focus{
    border-color:var(--primary);
}

/* ================= SECTIONS ================= */
.section-title{
    margin:15px 0;
    color:var(--primary);
    font-weight:bold;
}

/* ================= GRIDS ================= */
.game-grid,
.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

/* ================= FOOTER TEXT ================= */
.footer-text{
    text-align:center;
    color:var(--muted);
    margin:20px 0;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="nav-left">
        <a href="home.html">Home</a>
    </div>

    <div class="nav-right">

        <span id="usernameDisplay" class="username-badge"></span>

        <a href="chat.html" class="chat-link">Chat</a>

        <a href="tickets.html" id="ticketslink" style="display:none;">Support</a>

        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>

        <a href="admin-tickets.html" id="adminticketslink" class="admin-link" style="display:none;">Support Admin</a>

        <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">Admin</a>

        <a href="chatmod.html" id="modChatLink" class="admin-link" style="display:none;">Chat Mod</a>

        <a href="view-users.html" id="viewUsersLink" class="admin-link" style="display:none;">Users</a>

        <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
</div>

<!-- PAGE -->
<div class="page">

    <div class="page-header">
        <h1>Home Dashboard</h1>
        <input type="text" id="searchBar" placeholder="Search games...">
    </div>

    <div class="section-title">Games</div>

    <main id="gameGrid" class="game-grid"></main>
    <main id="videoGrid" class="video-grid"></main>

</div>

<!-- FOOTER -->
<h1 class="footer-text" style="color:purple;">NEW LINKS IN PROGRESS</h1>

<p class="footer-text">I am making new links if this gets blocked, just for you guys!</p>

<p class="footer-text">
Links:
<a href="https://securly-plans.github.io/">Securly-plans.github.io</a>
</p>

<p class="footer-text">Copyright 2026, Seth Flueter, Wyatt Monroe, Bohdi Domonell</p>

<p class="footer-text">Emerald Games - Alpha 1.8</p>

<!-- NOTIFICATIONS (UNCHANGED) -->
<script type="module">

import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");
let notified = new Set();

if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
}

onSnapshot(collection(db, "chats"), (snapshot) => {

    snapshot.docChanges().forEach(change => {

        if (change.type !== "modified") return;

        const data = change.doc.data();
        const chatId = change.doc.id;

        if (data.type !== "private") return;
        if (!data.participants?.includes(me)) return;

        const messages = data.messages || [];
        const last = messages[messages.length - 1];

        if (!last || last.from === me) return;

        const key = chatId + "_" + last.time;

        if (notified.has(key)) return;
        notified.add(key);

        new Notification("💬 New message from " + last.from, {
            body: last.text.length > 60 ? last.text.slice(0,60)+"..." : last.text,
            icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png"
        });
    });
});

</script>

<!-- LOGOUT / NAV -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.clear();
    window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");

if (username && isLoggedIn) {
    usernameDisplay.textContent = (role === "admin" ? "🛡 " : "👤 ") + username;
}

if (isLoggedIn) {
    document.getElementById("ticketslink").style.display = "inline-block";
    document.getElementById("profileLink").style.display = "inline-block";
    document.getElementById("viewUsersLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod") {
    document.getElementById("adminticketslink").style.display = "inline-block";
    document.getElementById("modChatLink").style.display = "inline-block";
}

if (role === "admin") {
    document.getElementById("adminLink").style.display = "inline-block";
}
</script>

<script src="script.js"></script>

</body>
</html>
