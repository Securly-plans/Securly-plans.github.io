<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald</title>

<link rel="stylesheet" href="style.css">

<!-- 🚨 SECURITY GATE (FIXED WITHOUT BREAKING FLOW) -->
<script>
(function () {

    const isLoggedIn = localStorage.getItem("loggedIn") === "true";

    // ONLY block if not logged in
    if (!isLoggedIn) {
        window.location.replace("index.html");
    }

})();
</script>

<style>
.navbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#222;
    padding:12px 18px;
    color:white;
    font-family:Arial;
}

.nav-left, .nav-right {
    display:flex;
    gap:10px;
    align-items:center;
}

.navbar a, .nav-btn {
    color:white;
    text-decoration:none;
    padding:8px 12px;
    border-radius:6px;
    background:#333;
    border:none;
    cursor:pointer;
    font-size:14px;
}

.admin-link { background:#2196f3; }
.logout-btn { background:#f44336; }

.username-badge {
    padding:6px 10px;
    border-radius:6px;
    background:#444;
    font-size:14px;
}
</style>

</head>

<body>

<!-- ================= NAVBAR (UNCHANGED STRUCTURE) ================= -->
<div class="navbar">

    <div class="nav-left">
        <a href="home.html">Home</a>
    </div>

    <div class="nav-right">

        <span id="usernameDisplay" class="username-badge"></span>

        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>

        <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">Admin</a>

        <button id="logoutBtn" class="logout-btn">Logout</button>

    </div>
</div>

<!-- ================= PAGE CONTENT (UNCHANGED) ================= -->

<header>
    <h1 style="color:powderblue;font-family:verdana;">Home</h1>
    <input type="text" id="searchBar" placeholder="Search games...">
</header>

<h2 style="color:green;font-family:verdana;">Games</h2>

<main id="gameGrid" class="game-grid"></main>
<main id="videoGrid" class="video-grid"></main>

<h1 style="color:purple;font-family:verdana;text-align:center;">
    NEW LINKS IN PROGRESS
</h1>

<p style="color:green;font-family:verdana;text-align:center;">
    I am making new links if this gets blocked, just for you guys!
</p>

<p style="color:purple;font-family:verdana;text-align:center;">
    Links:
    <a href="https://securly-plans.github.io/">Securly-plans.github.io</a>
</p>

<p style="color:yellow;font-family:verdana;text-align:center;">
    Copyright 2026, Seth Flueter, Wyatt Monroe, Bohdi Domonell
</p>

<p style="color:green;font-family:verdana;text-align:center;">
    Emerald Games - Alpha 1.5
</p>

<!-- ================= SCRIPT (ONLY FIXES, NO UI CHANGES) ================= -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {

    localStorage.removeItem("loggedIn");
    localStorage.removeItem("username");
    localStorage.removeItem("role");

    window.location.replace("index.html");
});

/* NAVBAR LOGIC (UNCHANGED FUNCTIONALLY) */
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

/* Username display */
const usernameDisplay = document.getElementById("usernameDisplay");
if (username && isLoggedIn) {
    usernameDisplay.textContent = (role === "admin" ? "🛡 " : "👤 ") + username;
}

/* Profile */
if (isLoggedIn) {
    document.getElementById("profileLink").style.display = "inline-block";
}

/* Admin */
if (role === "admin") {
    document.getElementById("adminLink").style.display = "inline-block";
}
</script>

<script src="script.js"></script>

</body>
</html>
