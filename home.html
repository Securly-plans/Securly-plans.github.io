<script type="module">
import { db } from "./js/firebase.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username = localStorage.getItem("username");
const saveRef = doc(db, "users", username);

/* =========================
   GLOBAL VIP CHECK (NEW)
========================= */
let isVIP = false;

async function loadVIP() {
  try {
    const snap = await getDoc(saveRef);

    const data = snap.exists() ? snap.data() : {};

    const role = data.role || localStorage.getItem("role");

    // VIP OR admin OR mod all get access
    if (data.vip === true || role === "admin" || role === "mod") {
      isVIP = true;
    }

  } catch (e) {
    console.warn("VIP check failed:", e);

    // fallback to role-only access if Firebase fails
    const role = localStorage.getItem("role");
    if (role === "admin" || role === "mod") {
      isVIP = true;
    }
  }

  window.isVIP = isVIP;
}

loadVIP();

/* =========================
   FULL INDEXEDDB BACKUP
========================= */
class IDBBackup {
  constructor(name) {
    this.name = name;
  }

  async open() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(this.name);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  async exportAll() {
    const db = await this.open();
    const out = { stores: {} };

    for (const store of db.objectStoreNames) {
      out.stores[store] = await new Promise((res, rej) => {
        const tx = db.transaction(store, "readonly");
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    db.close();
    return out;
  }

  async importAll(data) {
    const db = await this.open();

    for (const store in data.stores) {
      if (!db.objectStoreNames.contains(store)) continue;

      const tx = db.transaction(store, "readwrite");
      const os = tx.objectStore(store);

      os.clear();
      data.stores[store].forEach(v => os.put(v));
    }

    db.close();
  }
}

const backup = new IDBBackup("EmeraldDB");

/* =========================
   LOAD CLOUD SAVE ON START
========================= */
(async () => {
  try {
    const snap = await getDoc(saveRef);

    if (snap.exists() && snap.data().save) {
      console.log("Restoring cloud save...");

      await backup.importAll(snap.data().save);

      console.log("Restore complete.");
    }
  } catch (e) {
    console.warn("Restore failed:", e);
  }
})();

/* =========================
   SAVE BUTTON
========================= */
document.getElementById("saveBtn").addEventListener("click", async () => {
  const data = await backup.exportAll();

  await setDoc(saveRef, {
    save: data,
    time: Date.now(),
    vip: isVIP // optional tracking
  });

  alert("Saved to cloud!");
});
</script>
