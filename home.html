<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald</title>

<link rel="stylesheet" href="style.css">

<!-- ================= SECURITY GATE (FIXED) ================= -->
<script>
(function () {

    const isLoggedIn = localStorage.getItem("loggedIn") === "true";
    const bypass = localStorage.getItem("bypassGate") === "true";

    if (!isLoggedIn && !bypass) {
        window.location.replace("index.html");
    }

    // remove bypass after use
    localStorage.removeItem("bypassGate");

})();
</script>

<style>
.navbar {
    display:flex;
    justify-content:space-between;
    background:#222;
    padding:12px;
    color:white;
    font-family:Arial;
}

.nav-right a, .nav-right button {
    margin-left:10px;
    padding:8px 12px;
    background:#333;
    color:white;
    border:none;
    border-radius:6px;
    text-decoration:none;
    cursor:pointer;
}

.admin-link { background:#2196f3; }
.logout-btn { background:#f44336; }

.username-badge {
    background:#444;
    padding:6px 10px;
    border-radius:6px;
}
</style>

</head>

<body>

<div class="navbar">

    <div class="nav-left">
        <a href="home.html">Home</a>
    </div>

    <div class="nav-right">

        <span id="usernameDisplay" class="username-badge"></span>

        <a href="profile.html" id="profileLink" style="display:none;">Profile</a>

        <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">Admin</a>

        <button id="logoutBtn" class="logout-btn">Logout</button>

    </div>
</div>

<header>
    <h1 style="color:powderblue;">Home</h1>
    <input id="searchBar" placeholder="Search games...">
</header>

<h2 style="color:green;">Games</h2>

<main id="gameGrid"></main>
<main id="videoGrid"></main>

<h1 style="text-align:center;color:purple;">NEW LINKS IN PROGRESS</h1>

<p style="text-align:center;color:green;">
  I am making new links if this gets blocked.
</p>

<p style="text-align:center;color:purple;">
    Links:
    <a href="https://securly-plans.github.io/">Main</a>
</p>

<script>
/* ================= LOGOUT ================= */
document.getElementById("logoutBtn").onclick = () => {
    localStorage.clear();
    window.location.replace("index.html");
};

/* ================= NAVBAR ================= */
const role = localStorage.getItem("role");
const username = localStorage.getItem("username");

document.getElementById("usernameDisplay").textContent =
    username ? (role === "admin" ? "🛡 " : "👤 ") + username : "";

if (localStorage.getItem("loggedIn") === "true") {
    document.getElementById("profileLink").style.display = "inline-block";
}

if (role === "admin") {
    document.getElementById("adminLink").style.display = "inline-block";
}
</script>

<script src="script.js"></script>

</body>
</html>
