<!-- FIREBASE + IDB SYNC -->
<script type="module">
import { db } from "./js/firebase.js";
import {
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* -------------------------
   IndexedDB BACKUP ENGINE
-------------------------- */
class IDBBackup {
  constructor(dbName) {
    this.dbName = dbName;
  }

  async openDB() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(this.dbName);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  async exportAll() {
    const db = await this.openDB();
    const data = { stores: {} };

    for (const store of db.objectStoreNames) {
      data.stores[store] = await new Promise((res, rej) => {
        const tx = db.transaction(store, "readonly");
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    db.close();
    return data;
  }

  async importAll(json) {
    const db = await this.openDB();

    for (const storeName in json.stores) {
      if (!db.objectStoreNames.contains(storeName)) continue;

      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);

      store.clear();
      json.stores[storeName].forEach(v => store.put(v));
    }

    db.close();
  }
}

/* -------------------------
   INIT
-------------------------- */
const username = localStorage.getItem("username");
const backup = new IDBBackup("EmeraldDB");
const saveRef = doc(db, "users", username);

/* -------------------------
   LOAD FROM FIREBASE ON START
-------------------------- */
async function loadCloudSave() {
  const snap = await getDoc(saveRef);

  if (snap.exists() && snap.data().save) {
    console.log("Cloud save found → restoring IndexedDB...");
    await backup.importAll(snap.data().save);
  }
}
loadCloudSave();

/* -------------------------
   SAVE BUTTON (UPLOAD)
-------------------------- */
document.getElementById("saveBtn").addEventListener("click", async () => {
  const data = await backup.exportAll();

  await setDoc(saveRef, {
    save: data,
    lastSave: Date.now()
  });

  alert("Game saved to cloud!");
});
</script>

<!-- YOUR ORIGINAL LOGIC -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");

if (username) {
  document.getElementById("usernameDisplay").textContent =
    (role === "admin" ? "🛡 " : "👤 ") + username;
}

if (localStorage.getItem("loggedIn") === "true") {
  document.getElementById("ticketslink").style.display = "inline-block";
  document.getElementById("profileLink").style.display = "inline-block";
}

if (role === "admin") {
  document.getElementById("adminLink").style.display = "inline-block";
}

/* SEARCH */
const searchBar = document.getElementById("searchBar");

searchBar.addEventListener("input", () => {
  const q = searchBar.value.toLowerCase();

  [...gameGrid.children, ...videoGrid.children].forEach(el => {
    el.style.display = el.textContent.toLowerCase().includes(q)
      ? ""
      : "none";
  });
});
</script>

<script src="script.js"></script>
