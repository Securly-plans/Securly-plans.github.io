<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald</title>

<link rel="stylesheet" href="style.css">

<script>
  (function () {
    const isLoggedIn = localStorage.getItem("loggedIn") === "true";
    if (!isLoggedIn) {
      window.location.replace("index.html");
    }
  })();
</script>

<style>
:root{
  --bg:#0f1115;
  --panel:#1a1d24;
  --panel2:#222630;
  --border:#2e3440;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --primary:#4ade80;
  --danger:#ef4444;
  --info:#3b82f6;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= NAVBAR (RESTORED) ================= */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding:16px 20px;
  background:#111827;
  border-bottom:1px solid var(--border);
}

.nav-left,
.nav-right{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.navbar a,
.navbar button{
  color:var(--text);
  text-decoration:none;
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  cursor:pointer;
  font-size:14px;
}

.navbar a:hover,
.navbar button:hover{
  border-color:var(--info);
}

/* ================= HEADER ================= */
header{
  padding:20px;
  border-bottom:1px solid var(--border);
}

header h1{
  margin:0 0 10px;
  color:#93c5fd;
}

header input{
  width:100%;
  max-width:400px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#111827;
  color:var(--text);
  outline:none;
}

h2{
  margin:20px;
  color:#4ade80;
}

main{
  padding:0 20px;
}

/* ================= NORMAL ANNOUNCEMENT ================= */
#announcementBar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 12px;
  text-align: center;
  font-size: 14px;
  background: #222;
  color: white;
  display: none;
  z-index: 99999;
}

/* ================= EMERGENCY OVERLAY (FIXED) ================= */
#emergencyOverlay {
  position: fixed;
  inset: 0;
  background: #ef4444;
  color: white;
  display: none;
  z-index: 1000000;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}

#emergencyOverlay h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

#emergencyOverlay p {
  font-size: 20px;
  max-width: 900px;
}
</style>
</head>

<body>

<!-- ================= NAVBAR (RESTORED) ================= -->
<div class="navbar">

  <div class="nav-left">
    <a href="home.html">Home</a>
  </div>

  <div class="nav-right">
    <span id="usernameDisplay" class="username-badge"></span>

    <a href="chat.html" class="chat-link">Chat</a>
    <a href="tickets.html" id="ticketslink" style="display:none;">Support</a>
    <a href="profile.html" id="profileLink" style="display:none;">Profile</a>

    <a href="admin-tickets.html" id="adminticketslink" style="display:none;">Support Admin</a>
    <a href="admin.html" id="adminLink" style="display:none;">Admin</a>

    <a href="view-users.html" id="viewUsersLink" style="display:none;">Users</a>

    <button id="logoutBtn">Logout</button>
  </div>
</div>

<!-- ================= HEADER ================= -->
<header>
  <h1>Home</h1>
  <input type="text" id="searchBar" placeholder="Search games...">
</header>

<h2>Games</h2>

<main id="gameGrid"></main>
<main id="videoGrid"></main>

<!-- ================= ANNOUNCEMENT ================= -->
<div id="announcementBar"></div>

<!-- ================= EMERGENCY OVERLAY ================= -->
<div id="emergencyOverlay">
  <h1>Emergency Broadcast</h1>
  <p id="emergencyText">Loading emergency message...</p>
</div>

<!-- ================= FIRESTORE SYSTEM ================= -->
<script type="module">
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./js/firebase.js";

const announcementBar = document.getElementById("announcementBar");
const emergencyOverlay = document.getElementById("emergencyOverlay");
const emergencyText = document.getElementById("emergencyText");

/* ================= NORMAL ANNOUNCEMENT ================= */
onSnapshot(doc(db, "system", "announcement"), (snap) => {
  if (!snap.exists()) return;

  const data = snap.data();

  if (data.enabled && data.text) {
    announcementBar.style.display = "block";
    announcementBar.textContent = data.text;

    announcementBar.style.background =
      data.color === "danger" ? "#ef4444" :
      data.color === "warning" ? "#f59e0b" :
      data.color === "success" ? "#22c55e" :
      "#222";
  } else {
    announcementBar.style.display = "none";
  }
});

/* ================= EMERGENCY (FIXED TEXT + FULL OVERRIDE) ================= */
onSnapshot(doc(db, "system", "emergency"), (snap) => {
  if (!snap.exists()) {
    emergencyOverlay.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled) {
    emergencyOverlay.style.display = "flex";

    // ✅ FIX: now properly shows Firestore message
    emergencyText.textContent =
      data.message || "Emergency broadcast active. Please stand by.";
  } else {
    emergencyOverlay.style.display = "none";
  }
});
</script>

<!-- ================= LOGIC (UNCHANGED FUNCTIONALITY) ================= -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";
const isVIP = localStorage.getItem("vip") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");

if (username && isLoggedIn) {
  usernameDisplay.textContent =
    (role === "admin" ? "🛡 " : isVIP ? "⭐ " : "👤 ") + username;
}

if (isLoggedIn) {
  document.getElementById("ticketslink").style.display = "inline-block";
  document.getElementById("profileLink").style.display = "inline-block";
  document.getElementById("viewUsersLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod" || isVIP) {
  document.getElementById("adminticketslink").style.display = "inline-block";
}

if (role === "admin") {
  document.getElementById("adminLink").style.display = "inline-block";
}

/* SEARCH */
const searchBar = document.getElementById("searchBar");
const gameGrid = document.getElementById("gameGrid");
const videoGrid = document.getElementById("videoGrid");

function filterItems() {
  const query = searchBar.value.toLowerCase().trim();

  const allItems = [...gameGrid.children, ...videoGrid.children];

  allItems.forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = (!query || text.includes(query)) ? "" : "none";
  });
}

searchBar.addEventListener("input", filterItems);
</script>

<script src="script.js"></script>

</body>
</html>
