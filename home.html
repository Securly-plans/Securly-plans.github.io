<!-- LOGOUT + NAVBAR -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.clear();
    window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");
if (username && isLoggedIn) {
    usernameDisplay.textContent = (role === "admin" ? "🛡 " : "👤 ") + username;
}

if (isLoggedIn) {
    document.getElementById("profileLink").style.display = "inline-block";
}

if (role === "admin") {
    document.getElementById("adminLink").style.display = "inline-block";
}
</script>

<!-- ================= CHAT SYSTEM (ADDED ONLY) ================= -->
<script type="module">
import {
    doc,
    getDoc,
    setDoc,
    updateDoc,
    arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");

/* CREATE CHAT ID */
function getChatId(a, b) {
    return [a, b].sort().join("_");
}

/* GET OR CREATE DM */
async function getOrCreateDM(otherUser) {

    if (!me || !otherUser) return null;

    const chatId = getChatId(me, otherUser);
    const ref = doc(db, "chats", chatId);

    const snap = await getDoc(ref);

    if (!snap.exists()) {
        await setDoc(ref, {
            type: "dm",
            participants: [me, otherUser],
            messages: [],
            created: Date.now(),
            updated: Date.now()
        });
    }

    return chatId;
}

/* SEND MESSAGE */
async function sendMessage(chatId, text) {

    if (!chatId || !text) return;

    const ref = doc(db, "chats", chatId);

    await updateDoc(ref, {
        messages: arrayUnion({
            from: me,
            text,
            time: Date.now()
        }),
        updated: Date.now()
    });
}

/* GLOBAL CHAT HOOK */
window.startChat = async function(otherUser) {
    const chatId = await getOrCreateDM(otherUser);
    const msg = prompt("Message:");
    if (!msg) return;
    await sendMessage(chatId, msg);
};
</script>
