<script type="module">
import { db } from "./js/firebase.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username = localStorage.getItem("username");
const saveRef = doc(db, "users", username);

class IDBBackup {
  constructor(name) {
    this.name = name;
  }

  async open() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(this.name);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  async exportAll() {
    const db = await this.open();
    const out = { stores: {} };

    for (const store of db.objectStoreNames) {
      out.stores[store] = await new Promise((res, rej) => {
        const tx = db.transaction(store, "readonly");
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = () => rej(req.error);
      });
    }

    db.close();
    return out;
  }
}

const backup = new IDBBackup("EmeraldDB");

/* LOAD FROM FIREBASE (optional restore) */
(async () => {
  const snap = await getDoc(saveRef);

  if (snap.exists() && snap.data().save) {
    console.log("Save found in Firebase");
    // NOTE: restore logic not added here to avoid UI disruption
  }
})();

/* SAVE BUTTON ONLY */
document.getElementById("saveBtn").addEventListener("click", async () => {
  const data = await backup.exportAll();

  await setDoc(saveRef, {
    save: data,
    time: Date.now()
  });

  alert("Saved!");
});
</script>

<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");

if (username && isLoggedIn) {
  usernameDisplay.textContent = (role === "admin" ? "🛡 " : "👤 ") + username;
}

if (isLoggedIn) {
  document.getElementById("ticketslink").style.display = "inline-block";
  document.getElementById("profileLink").style.display = "inline-block";
  document.getElementById("viewUsersLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod") {
  document.getElementById("adminticketslink").style.display = "inline-block";
  document.getElementById("modChatLink").style.display = "inline-block";
}

if (role === "admin") {
  document.getElementById("adminLink").style.display = "inline-block";
}

/* SEARCH LOGIC */
const searchBar = document.getElementById("searchBar");
const gameGrid = document.getElementById("gameGrid");
const videoGrid = document.getElementById("videoGrid");

function filterItems() {
  const query = searchBar.value.toLowerCase().trim();

  const allItems = [...gameGrid.children, ...videoGrid.children];

  allItems.forEach(item => {
    const text = item.textContent.toLowerCase();

    item.style.display = (!query || text.includes(query)) ? "" : "none";
  });
}

searchBar.addEventListener("input", filterItems);
</script>
