<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Games</title>

<link rel="stylesheet" href="style.css">

<script>
  (function () {
    const isLoggedIn = localStorage.getItem("loggedIn") === "true";
    if (!isLoggedIn) {
      window.location.replace("index.html");

<style>
:root{
  --bg:#0f1115;
  --panel:#1a1d24;
  --panel2:#222630;
  --border:#2e3440;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --primary:#4ade80;
  --danger:#ef4444;
  --info:#3b82f6;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  padding:16px 20px;
  background:#111827;
  border-bottom:1px solid var(--border);
}

.nav-left,
.nav-right{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.navbar a,
.navbar button{
  color:var(--text);
  text-decoration:none;
  padding:8px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  cursor:pointer;
  font-size:14px;
}

.navbar a:hover,
.navbar button:hover{
  border-color:var(--info);
}

/* 🔵 RESTORED ADMIN BLUE BADGES */
.admin-link{
  background:rgba(59,130,246,0.15);
  color:#60a5fa !important;
  border-color:#3b82f6;
}

.logout-btn{
  background:rgba(239,68,68,0.15);
  border-color:var(--danger);
}

.chat-link{
  background:rgba(74,222,128,0.10);
  border-color:var(--primary);
}

.username-badge{
  padding:6px 10px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--muted);
}

/* HEADER */
header{
  padding:20px;
  border-bottom:1px solid var(--border);
}

header h1{
  margin:0 0 10px;
  color:#93c5fd;
}

header input{
  width:100%;
  max-width:400px;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#111827;
  color:var(--text);
  outline:none;
}

header input:focus{
  border-color:var(--info);
}

h2{
  margin:20px;
  color:#4ade80;
}

main{
  padding:0 20px;
}

/* =========================
   FIXED GAME GRID SIZE
========================= */
.game-grid, .video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
  gap:16px;
}

/* =========================
   NORMAL ANNOUNCEMENT BAR
========================= */
#announcementBar {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 12px;
  text-align: center;
  font-size: 14px;
  background: #222;
  color: white;
  display: none;
  z-index: 99999;
  border-top: 1px solid var(--border);
}

/* =========================
   🚨 EMERGENCY OVERLAY FIXED
========================= */
#emergencyOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ef4444;
  color: white;
  z-index: 100000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

#emergencyTitle {
  font-size: 30px;
  margin-bottom: 20px;
}
</style>
</head>

<script type="module" src="./js/session.js"></script>

<body>

<!-- NAVBAR (UNCHANGED STRUCTURE) -->
<div class="navbar">

  <div class="nav-left">
    <a href="home.html">Home</a>
  </div>

  <div class="nav-right">

    <span id="usernameDisplay" class="username-badge"></span>

    <a href="chat.html" class="chat-link">Chat</a>

    <a href="tickets.html" id="ticketslink" style="display:none;">Support</a>
    <a href="profile.html" id="profileLink" style="display:none;">Profile</a>

    <a href="admin-tickets.html" id="adminticketslink" class="admin-link" style="display:none;">
      Resp. Support
    </a>

    <a href="admin.html" id="adminLink" class="admin-link" style="display:none;">
      Admin
    </a>

    <a href="chatmod.html" id="modChatLink" class="admin-link" style="display:none;">
      Chat Mod
    </a>

    <a href="view-users.html" id="viewUsersLink" style="display:none;">
      Users
    </a>

    <button id="logoutBtn" class="logout-btn">Logout</button>

  </div>
</div>

<header>
  <h1>Home</h1>
  <input type="text" id="searchBar" placeholder="Search games...">
</header>

<h2>Games</h2>

<main id="gameGrid" class="game-grid"></main>
<main id="videoGrid" class="video-grid"></main>

<h1 style="color:#a78bfa; text-align:center; margin-top:40px;">
  NEW LINKS IN PROGRESS
</h1>

<p style="color:#4ade80; text-align:center;">
  I am making new links if this gets blocked, just for you guys!
</p>

<!-- NORMAL ANNOUNCEMENT -->
<div id="announcementBar"></div>

<!-- 🚨 EMERGENCY OVERLAY (FIXED TEXT SUPPORT) -->
<div id="emergencyOverlay">
  <div id="emergencyTitle">EMERGENCY BROADCAST</div>
  <div id="emergencyText"></div>
</div>

<script type="module">
import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./js/firebase.js";

const bar = document.getElementById("announcementBar");
const overlay = document.getElementById("emergencyOverlay");
const emergencyText = document.getElementById("emergencyText");

/* NORMAL ANNOUNCEMENT */
onSnapshot(doc(db, "system", "announcement"), (snap) => {
  if (!snap.exists()) {
    bar.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled && data.text) {
    bar.style.display = "block";
    bar.textContent = data.text;
  } else {
    bar.style.display = "none";
  }
});

/* 🚨 EMERGENCY BROADCAST (FIXED TEXT) */
onSnapshot(doc(db, "system", "emergency"), (snap) => {
  if (!snap.exists()) {
    overlay.style.display = "none";
    return;
  }

  const data = snap.data();

  if (data.enabled) {
    overlay.style.display = "flex";
    emergencyText.textContent =
      data.text || "System emergency active. Please wait for updates.";
  } else {
    overlay.style.display = "none";
  }
});
</script>

<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
  window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";
const isVIP = localStorage.getItem("vip") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");

if (username && isLoggedIn) {
  usernameDisplay.textContent =
    (role === "admin" ? "🛡 " : isVIP ? "⭐ " : "👤 ") + username;
}

if (isLoggedIn) {
  document.getElementById("ticketslink").style.display = "inline-block";
  document.getElementById("profileLink").style.display = "inline-block";
  document.getElementById("viewUsersLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod" || isVIP) {
  document.getElementById("adminticketslink").style.display = "inline-block";
  document.getElementById("modChatLink").style.display = "inline-block";
}

if (role === "admin") {
  document.getElementById("adminLink").style.display = "inline-block";
}

/* SEARCH */
const searchBar = document.getElementById("searchBar");
const gameGrid = document.getElementById("gameGrid");
const videoGrid = document.getElementById("videoGrid");

function filterItems() {
  const query = searchBar.value.toLowerCase().trim();
  const allItems = [...gameGrid.children, ...videoGrid.children];

  allItems.forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = (!query || text.includes(query)) ? "" : "none";
  });
}

searchBar.addEventListener("input", filterItems);
</script>

<script src="script.js"></script>

<!-- ================= PUSH NOTIFICATIONS (FIXED + CLEAN) ================= -->
<script type="module">
import { getMessaging, getToken, onMessage } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

import { app } from "./js/firebase.js";

/* ================= INIT MESSAGING ================= */

let messaging;

try {
  messaging = getMessaging(app);
} catch (e) {
  console.warn("FCM not supported:", e);
}

/* ================= REQUEST PERMISSION ================= */

async function initPush() {
  try {
    if (!messaging) return;

    const permission = await Notification.requestPermission();

    if (permission !== "granted") {
      console.log("Notification permission denied");
      return;
    }

    /* IMPORTANT: Replace with your real VAPID key from Firebase Console */
    const token = await getToken(messaging, {
      vapidKey: "BCDlkH0Kp2EWLGF3KA08a-FaGm9bMkPoIGWN9bPz5jdVOHAiyK5xg7Bfz1U236BHvG4l7QOKH2l_UI0DbwwTInI"
    });

    if (token) {
      console.log("FCM Token:", token);
      localStorage.setItem("fcmToken", token);
    }

  } catch (err) {
    console.error("Push init error:", err);
  }
}

/* ================= FOREGROUND NOTIFICATIONS ================= */

if (messaging) {
  onMessage(messaging, (payload) => {

    const title = payload?.notification?.title || "Notification";
    const body = payload?.notification?.body || "";

    alert(`${title}\n\n${body}`);
  });
}

/* ================= SERVICE WORKER REGISTRATION ================= */

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/js/firebase-messaging-sw.js")
    .then(() => console.log("Service Worker registered"))
    .catch(err => console.error("SW error:", err));
}

/* ================= START ================= */

initPush();
</script>
