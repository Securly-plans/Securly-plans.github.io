<script type="module">

import {
  collection,
  getDocs,
  getDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const me = localStorage.getItem("username");

const badge = document.getElementById("msgBadge");

/* ================= CHECK NEW MESSAGES ================= */
async function checkMessages() {

  if (!me) return;

  const chatsSnap = await getDocs(collection(db, "chats"));

  let hasNew = false;

  for (const chatDoc of chatsSnap.docs) {

    const data = chatDoc.data();

    // only private chats
    if (data.type !== "private") continue;

    if (!data.participants?.includes(me)) continue;

    const chatId = chatDoc.id;

    const seenRef = doc(db, "chatSeen", chatId + "_" + me);
    const seenSnap = await getDoc(seenRef);

    const lastSeen = seenSnap.exists()
      ? seenSnap.data().lastSeen
      : 0;

    const messages = data.messages || [];

    const unread = messages.some(m => m.time > lastSeen);

    if (unread) {
      hasNew = true;
      break;
    }
  }

  if (hasNew) {
    badge.style.display = "inline";
  } else {
    badge.style.display = "none";
  }
}

/* run loop */
setInterval(checkMessages, 5000);
checkMessages();

</script>

<!-- LOGOUT + NAVBAR -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.clear();
    window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");
if (username && isLoggedIn) {
    usernameDisplay.textContent = (role === "admin" ? "🛡 " : "👤 ") + username;
}

if (isLoggedIn) {
    document.getElementById("profileLink").style.display = "inline-block";
}

if (role === "admin") {
    document.getElementById("adminLink").style.display = "inline-block";
}

if (role === "admin" || role === "mod") {
    document.getElementById("modChatLink").style.display = "inline-block";
}

</script>

<script src="script.js"></script>
