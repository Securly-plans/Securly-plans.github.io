<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Login</title>
<link rel="stylesheet" href="staff.css">

<style>
.page {
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card {
    width: 380px;
}

.title {
    font-size: 20px;
    margin-bottom: 10px;
    color: #ffffff;
}

.sub {
    font-size: 13px;
    color: #8aa0b6;
    margin-bottom: 15px;
}
</style>
</head>

<body>

<div class="page">

<div class="card">

<div class="title">Staff Access Portal</div>
<div class="sub">Authenticate with your staff credentials</div>

<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">
<input id="staffId" placeholder="Staff ID (e.g. 042)">

<button id="loginBtn">Sign In</button>

<div id="status" class="status"></div>

</div>

</div>

<script type="module">
import { db } from "../js/firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.getElementById("loginBtn").onclick = async () => {

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const staffId = document.getElementById("staffId").value.trim();

  if (!firstName || !lastName || !staffId) {
    return document.getElementById("status").textContent = "All fields required";
  }

  const snap = await getDoc(doc(db, "staffAccounts", staffId));

  if (!snap.exists()) {
    return document.getElementById("status").textContent = "Staff account not found";
  }

  const data = snap.data();

  if (
    data.firstName !== firstName ||
    data.lastName !== lastName ||
    data.status !== "active"
  ) {
    return document.getElementById("status").textContent = "Invalid credentials";
  }

  localStorage.setItem("isStaff", "true");
  localStorage.setItem("staffId", staffId);
  localStorage.setItem("staffRole", data.staffRole);
  localStorage.setItem("staffPermissions", JSON.stringify(data.permissions));
  localStorage.setItem("staffName", data.displayName);

  window.location.href = "portal.html";
};
</script>

</body>
</html>
