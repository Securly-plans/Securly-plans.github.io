<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login</title>

<style>
:root{
    --bg:#0f1115;
    --panel:#1a1d24;
    --border:#2a2f3a;
    --text:#ffffff;
    --muted:#9ca3af;
    --primary:#3b82f6;
    --primaryHover:#2563eb;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--bg);
    font-family:Arial,sans-serif;
    color:var(--text);
}

.login-box{
    width:380px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:28px;
}

h1{
    margin-top:0;
    text-align:center;
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    background:#0f1115;
    border:1px solid var(--border);
    color:white;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:.2s;
}

.login-btn{
    background:var(--primary);
}

.login-btn:hover{
    background:var(--primaryHover);
}

.register-btn{
    margin-top:10px;
    background:#374151;
}

.register-btn:hover{
    background:#4b5563;
}

.status{
    margin-top:12px;
    text-align:center;
    color:var(--muted);
}
</style>
</head>

<body>

<div class="login-box">

    <h1>Staff Login</h1>

    <div class="subtitle">
        Staff Portal Authentication
    </div>

    <input
        id="name"
        placeholder="Last Name, First Name"
        autocomplete="username"
    >

    <input
        id="pass"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button class="login-btn" onclick="login()">
        Login
    </button>

    <button
        class="register-btn"
        onclick="location.href='register.html'"
    >
        Need to register your staff account?
    </button>

    <div id="status" class="status"></div>

</div>

<script type="module">

import { db } from "../js/firebase.js";

import {
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function hash(str) {

    const buffer = await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(str)
    );

    return [...new Uint8Array(buffer)]
        .map(b => b.toString(16).padStart(2,"0"))
        .join("");
}

window.login = async function () {

    const status = document.getElementById("status");

    const name =
        document.getElementById("name").value.trim();

    const pass =
        document.getElementById("pass").value;

    if (!name || !pass) {
        status.textContent = "Enter name and password.";
        return;
    }

    status.textContent = "Authenticating...";

    try {

        const snap =
            await getDocs(collection(db, "staffAccounts"));

        const hashed =
            await hash(pass);

        for (const docSnap of snap.docs) {

            const data = docSnap.data();

            if (
                data.fullName === name &&
                data.passwordHash === hashed
            ) {

                localStorage.setItem(
                    "staffSession",
                    "true"
                );

                localStorage.setItem(
                    "staffId",
                    data.staffId
                );

                localStorage.setItem(
                    "staffName",
                    data.fullName
                );

                localStorage.setItem(
                    "staffRole",
                    data.role
                );

                localStorage.setItem(
                    "staffPermissions",
                    JSON.stringify(
                        data.permissions || {}
                    )
                );

                window.location.href =
                    "portal.html";

                return;
            }
        }

        status.textContent =
            "Invalid staff credentials.";

    } catch (err) {

        console.error(err);

        status.textContent =
            "Login failed.";
    }
};

</script>

</body>
</html>
