<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0b1220, #020617);
    color: white;
}

.page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 380px;
    padding: 26px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

.title {
    font-size: 22px;
    font-weight: bold;
    color: #60a5fa;
    margin-bottom: 4px;
}

.sub {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    outline: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #3b82f6, #2563eb);
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.status {
    margin-top: 12px;
    font-size: 13px;
    min-height: 18px;
    color: #f87171;
}
</style>
</head>

<body>

<div class="page">
<div class="card">

<div class="title">Staff Access Portal</div>
<div class="sub">Linked to your Emerald gaming account</div>

<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">
<input id="staffId" placeholder="Staff ID (e.g. 042)">

<button id="loginBtn">Sign In</button>

<div id="status" class="status"></div>

</div>
</div>

<script type="module">
import { db } from "../js/firebase.js";
import { doc, getDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const btn = document.getElementById("loginBtn");
const status = document.getElementById("status");

btn.onclick = async () => {

    status.textContent = "";
    btn.disabled = true;
    btn.textContent = "Checking...";

    try {
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const staffId = document.getElementById("staffId").value.trim();

        const username = localStorage.getItem("username");
        const userId = localStorage.getItem("userId");

        // MUST be logged into game account first
        if (!username || !userId) {
            status.textContent = "You must be logged into a gaming account first.";
            return;
        }

        if (!firstName || !lastName || !staffId) {
            status.textContent = "All fields are required.";
            return;
        }

        // ✅ FIXED: correct collection name
        const snap = await getDoc(doc(db, "staffAccounts", staffId));

        if (!snap.exists()) {
            status.textContent = "Staff account not found.";
            return;
        }

        const data = snap.data();

        if (!data) {
            status.textContent = "Invalid staff record.";
            return;
        }

        // LINK CHECK (supports both formats safely)
        const linked =
            data.linkedUserId === userId ||
            data.linkedUser === username;

        if (!linked) {
            status.textContent = "This staff account is not linked to your gaming account.";
            return;
        }

        // NAME CHECK (case-insensitive)
        if (
            (data.firstName || "").toLowerCase() !== firstName.toLowerCase() ||
            (data.lastName || "").toLowerCase() !== lastName.toLowerCase()
        ) {
            status.textContent = "Name does not match staff record.";
            return;
        }

        if (data.status && data.status !== "active") {
            status.textContent = "Staff account is disabled.";
            return;
        }

        // SUCCESS LOGIN
        localStorage.setItem("isStaff", "true");
        localStorage.setItem("staffId", staffId);
        localStorage.setItem("staffRole", data.staffRole || "staff");
        localStorage.setItem("staffPermissions", JSON.stringify(data.permissions || []));
        localStorage.setItem("staffName", data.displayName || `${firstName} ${lastName}`);

        window.location.href = "portal.html";

    } catch (err) {
        console.error(err);
        status.textContent = "Login error occurred.";
    }

    btn.disabled = false;
    btn.textContent = "Sign In";
};
</script>

</body>
</html>
