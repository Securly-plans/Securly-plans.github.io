<!DOCTYPE html>
<html>
<head>
  <title>Staff Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f1115;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1a1d24;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      background: #0f1115;
      border: 1px solid #2a2f3a;
      color: white;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Staff Login</h2>
    <input id="name" placeholder="Full Name (Last, First)">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

<script type="module">
import { db, collection, getDocs } from "../js/firebase.js";

async function hash(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

window.login = async function () {
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  const snap = await getDocs(collection(db, "staffAccounts"));

  const hashed = await hash(pass);

  for (const d of snap.docs) {
    const data = d.data();

    if (data.fullName === name && data.passwordHash === hashed) {
      localStorage.setItem("staffSession", "true");
      localStorage.setItem("staffId", data.staffId);
      localStorage.setItem("staffRole", data.role);
      localStorage.setItem("staffPermissions", JSON.stringify(data.permissions));

      window.location.href = "portal.html";
      return;
    }
  }

  alert("Invalid login");
};
</script>

</body>
</html>
