<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Registration</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #0b1220, #020617);
    color: white;
}

.page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    width: 430px;
    padding: 26px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

.title {
    font-size: 22px;
    font-weight: bold;
    color: #60a5fa;
    margin-bottom: 6px;
}

.sub {
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    outline: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #3b82f6, #2563eb);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.status {
    margin-top: 12px;
    font-size: 13px;
    min-height: 18px;
    color: #f87171;
}
</style>
</head>

<body>

<div class="page">
<div class="card">

<div class="title">Staff Account Setup</div>
<div class="sub">Link your staff account to an existing gaming account</div>

<input id="staffId" placeholder="Staff ID (e.g. 042)">
<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">

<input id="username" placeholder="Gaming Username (must exist)">
<input id="staffKey" placeholder="Staff Invite Key">

<button id="createBtn">Create Staff Account</button>

<div id="status" class="status"></div>

</div>
</div>

<script type="module">
import { db } from "../js/firebase.js";
import { doc, getDoc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const status = document.getElementById("status");
const btn = document.getElementById("createBtn");

btn.onclick = async () => {

    status.textContent = "";
    btn.disabled = true;
    btn.textContent = "Creating...";

    try {
        const staffId = document.getElementById("staffId").value.trim();
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const username = document.getElementById("username").value.trim();
        const staffKey = document.getElementById("staffKey").value.trim();

        const currentUser = localStorage.getItem("username");
        const currentUserId = localStorage.getItem("userId");

        // Must be logged into gaming account
        if (!currentUser || !currentUserId) {
            status.textContent = "You must be logged into a gaming account first.";
            return;
        }

        if (!staffId || !firstName || !lastName || !username) {
            status.textContent = "All fields are required.";
            return;
        }

        // Staff key check
        if (staffKey !== "EMERALD-STAFF-2026") {
            status.textContent = "Invalid staff key.";
            return;
        }

        // Check gaming account exists
        const userSnap = await getDoc(doc(db, "users", username));

        if (!userSnap.exists()) {
            status.textContent = "Gaming account not found.";
            return;
        }

        const userData = userSnap.data();

        // Prevent duplicate staff account
        const staffSnap = await getDoc(doc(db, "staffAccounts", staffId));

        if (staffSnap.exists()) {
            status.textContent = "Staff ID already exists.";
            return;
        }

        // AUTO ROLE FROM GAMING ACCOUNT (NO CHEATING)
        const role = userData.role || "user";

        // AUTO PERMISSIONS
        let permissions = {
            accessFiles: false,
            accessChat: false,
            manageUsers: false,
            accessAdminPanel: false
        };

        if (role === "mod") {
            permissions.accessFiles = true;
            permissions.accessChat = true;
            permissions.accessAdminPanel = true;
        }

        if (role === "admin") {
            permissions.accessFiles = true;
            permissions.accessChat = true;
            permissions.manageUsers = true;
            permissions.accessAdminPanel = true;
        }

        await setDoc(doc(db, "staffAccounts", staffId), {
            staffId,
            firstName,
            lastName,
            displayName: `${firstName} ${lastName}`,

            linkedUser: username,
            linkedUserId: userData.userId || currentUserId,

            staffRole: role,
            permissions,

            status: "active",
            created: Date.now()
        });

        status.style.color = "#4ade80";
        status.textContent = "Staff account linked successfully.";

    } catch (err) {
        console.error(err);
        status.textContent = "Error creating staff account.";
    }

    btn.disabled = false;
    btn.textContent = "Create Staff Account";
};
</script>

</body>
</html>
