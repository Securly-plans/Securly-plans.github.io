<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Registration</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 420px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #60a5fa;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
    background: rgba(255,255,255,0.08);
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background: #3b82f6;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}

small {
    display: block;
    margin-top: 10px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">
    <h1>Staff Registration</h1>

    <input id="first" placeholder="First Name">
    <input id="last" placeholder="Last Name">

    <input id="username" placeholder="Game Username (must exist)">
    <input id="staffKey" placeholder="Staff Invite Key">
    <input id="password" type="password" placeholder="Password">

    <button onclick="registerStaff()">Create Staff Account</button>

    <small id="msg"></small>
</div>

<script type="module">
import { db } from "../firebase.js";
import { doc, getDoc, setDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function registerStaff() {
    const first = document.getElementById("first").value;
    const last = document.getElementById("last").value;
    const username = document.getElementById("username").value;
    const staffKey = document.getElementById("staffKey").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.textContent = "";

    // 1. check invite key (simple protection)
    if (staffKey !== "EMERALD-STAFF-2026") {
        msg.textContent = "Invalid staff key.";
        return;
    }

    // 2. check if game user exists (IMPORTANT LINK STEP)
    const userRef = doc(db, "users", username);
    const userSnap = await getDoc(userRef);

    if (!userSnap.exists()) {
        msg.textContent = "Game user not found. You must have a valid Emerald account.";
        return;
    }

    // 3. create staff account (THIS is the fix)
    const staffRef = doc(db, "staff", username);

    await setDoc(staffRef, {
        firstName: first,
        lastName: last,
        username: username,
        passwordHash: await sha256(password),
        linkedUser: username,
        role: "staff",
        created: Date.now()
    });

    msg.textContent = "Staff account created successfully!";
}

async function sha256(text) {
    const enc = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

window.registerStaff = registerStaff;
</script>

</body>
</html>
