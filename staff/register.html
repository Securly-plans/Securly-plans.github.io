<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Registration</title>
<link rel="stylesheet" href="staff.css">

<style>
.page {
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card {
    width: 420px;
}

.title {
    font-size: 20px;
    margin-bottom: 10px;
}

.warning {
    font-size: 12px;
    color: #9fb3c8;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="page">

<div class="card">

<div class="title">Create Staff Account</div>
<div class="warning">Only mod/admin gaming accounts can create staff access</div>

<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">

<button id="createBtn">Create Staff Account</button>

<div id="status" class="status"></div>

</div>

</div>

<script type="module">
import { db } from "../js/firebase.js";
import { doc, getDoc, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const username = localStorage.getItem("username");
const userId = localStorage.getItem("userId");
const role = localStorage.getItem("role");

if (!username || (role !== "admin" && role !== "mod")) {
  window.location.href = "../home.html";
}

async function getUserId(username) {
  const snap = await getDoc(doc(db, "users", username));
  if (!snap.exists()) throw new Error("User not found");
  return snap.data().userId;
}

async function getNextStaffId() {
  const ref = doc(db, "system", "staffCounter");

  return await runTransaction(db, async (tx) => {
    const snap = await tx.get(ref);

    let next = 1;

    if (snap.exists()) {
      next = (snap.data().current || 0) + 1;
      tx.update(ref, { current: next });
    } else {
      tx.set(ref, { current: 1 });
    }

    return String(next).padStart(3, "0");
  });
}

document.getElementById("createBtn").onclick = async () => {

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();

  if (!firstName || !lastName) return;

  try {

    const linkedUserId = await getUserId(username);
    const staffId = await getNextStaffId();

    const displayName = `${lastName}, ${firstName}`;

    const permissions =
      role === "admin"
        ? {
            internalAccess: true,
            internalFiles: true,
            internalWriter: true,
            chatModeration: true,
            userManagement: true
          }
        : {
            internalAccess: true,
            internalFiles: true,
            internalWriter: true,
            chatModeration: true,
            userManagement: false
          };

    await setDoc(doc(db, "staffAccounts", staffId), {
      staffId,
      firstName,
      lastName,
      displayName,

      linkedUserId,
      linkedGameUsername: username,

      staffRole: role,
      permissions,

      status: "active",
      createdAt: Date.now(),
      createdBy: username
    });

    document.getElementById("status").textContent =
      `Created: ${displayName} (${staffId})`;

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1200);

  } catch (err) {
    document.getElementById("status").textContent = err.message;
  }
};
</script>

</body>
</html>
