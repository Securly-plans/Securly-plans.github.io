<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Staff Portal</title>
<link rel="stylesheet" href="staff.css">

<style>
.layout {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.header {
    background: #121824;
    border: 1px solid #1f2a3a;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.grid {
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.grid button {
    padding: 15px;
}

.identity {
    font-size: 14px;
    color: #b9c7d6;
}

.logout {
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="layout">

<div class="header">

<h2>Staff Portal</h2>

<div class="identity" id="identity"></div>

<button class="logout" onclick="logout()">Logout</button>

</div>

<div class="grid">

<button onclick="location.href='../internal-dashboard.html'">Dashboard</button>
<button onclick="location.href='../internal-files.html'">Files</button>
<button onclick="location.href='../internal-writer.html'">Writer</button>

</div>

</div>

<script>
const isStaff = localStorage.getItem("isStaff") === "true";

if (!isStaff) {
  window.location.href = "../home.html";
}

const staffId = localStorage.getItem("staffId");
const staffRole = localStorage.getItem("staffRole");
const staffName = localStorage.getItem("staffName");

document.getElementById("identity").innerHTML = `
  Name: ${staffName}<br>
  Staff ID: ${staffId}<br>
  Role: ${staffRole}
`;

function logout() {
  localStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
