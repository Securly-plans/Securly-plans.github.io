<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create EmeraldOS Account</title>

<style>
body {
    margin: 0;
    background: #008080;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

.window {
    width: 420px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #404040 #404040 #ffffff;
}

.title {
    background: #000080;
    color: white;
    padding: 6px;
    font-weight: bold;
}

.content {
    padding: 15px;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 6px;
    margin-top: 5px;
    box-sizing: border-box;
    border: 2px inset white;
}

.info {
    background: white;
    padding: 10px;
    margin-bottom: 10px;
    font-size: 12px;
    border: 2px inset white;
}

.buttons {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
}

button {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #ffffff #404040 #404040 #ffffff;
    padding: 5px 15px;
    cursor: pointer;
}

button:active {
    border-color: #404040 #ffffff #ffffff #404040;
}
</style>
</head>

<body>

<div class="window">

    <div class="title">
        Create EmeraldOS Account
    </div>

    <div class="content">

        <div class="info">
            This account will be stored in EmeraldOS cloud storage.
        </div>

        <label>Username</label>
        <input id="os-user" type="text">

        <label>Password</label>
        <input id="os-pass" type="password">

        <label>Confirm Password</label>
        <input id="os-pass2" type="password">

        <div class="buttons">

            <button onclick="registerOS()">
                Create
            </button>

            <button onclick="location.href='../index.html'">
                Cancel
            </button>

        </div>

    </div>
</div>

<script type="module" src="os-auth.js"></script>

</body>
</html>
