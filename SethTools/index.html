<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmeraldOS Login</title>
    <link rel="stylesheet" href="os.css">

    <style>
        body {
            background: #008080;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-window {
            width: 420px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #000 #000 #fff;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.4);
        }

        .title-bar-login {
            background: #000080;
            color: white;
            padding: 5px 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .login-content {
            padding: 20px;
        }

        .logo {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 5px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 2px inset #fff;
            font-family: inherit;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        button {
            padding: 5px 20px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #fff #000 #000 #fff;
            cursor: pointer;
        }

        button:active {
            border-color: #000 #fff #fff #000;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #000080;
        }
    </style>
</head>

<body>

    <div class="login-window">

        <div class="title-bar-login">
            <span>EmeraldOS Login</span>
            <span>■</span>
        </div>

        <div class="login-content">

            <div class="logo">💎</div>

            <div class="subtitle">
                Welcome to EmeraldOS
            </div>

            <label>OS Username</label>
            <input id="os-user">

            <label>Password</label>
            <input id="os-pass" type="password">

            <div class="buttons">
                <button onclick="loginOS()">Login</button>
                <button onclick="location.href='../home.html'">
                    Cancel
                </button>
            </div>

            <div class="register-link">
                Need an EmeraldOS account?<br>
                <a href="register.html">
                    Create one here.
                </a>
            </div>

        </div>

    </div>

    <script type="module" src="os-auth.js"></script>

</body>
</html>
