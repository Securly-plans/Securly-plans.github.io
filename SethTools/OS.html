<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldOS</title>

<style>

/* =========================
   WINDOWS 95 BASE THEME
========================= */

body {
    margin: 0;
    font-family: "MS Sans Serif", Arial, sans-serif;
    background: #008080;
    overflow: hidden;
}

#desktop {
    position: absolute;
    inset: 0;
}

#desktop-icons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 15px;
}

.icon {
    width: 80px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: white;
    user-select: none;
}

/* =========================
   WINDOWS
========================= */

.window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 3px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    cursor: move;
}

/* =========================
   START MENU
========================= */

#start-menu {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 200px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    display: none;
}

#start-menu.show {
    display: block;
}

.start-menu-item {
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
}

.start-menu-item:hover {
    background: #000080;
    color: white;
}

/* =========================
   TASKBAR
========================= */

#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35px;
    background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex;
    align-items: center;
    padding: 2px;
}

#start-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}

/* =========================
   APP DASHBOARD (NEW)
========================= */

#app-dock {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 200px;
    background: rgba(192,192,192,0.9);
    border: 2px solid #fff;
    padding: 8px;
}

.app-item {
    font-size: 12px;
    padding: 4px;
    cursor: pointer;
}

.app-item:hover {
    background: #000080;
    color: white;
}

</style>
</head>

<body>

<!-- ================= DESKTOP ================= -->

<main id="desktop">

    <div id="desktop-icons">

        <div class="icon" onclick="Applications.notes()">📄 Notes</div>
        <div class="icon" onclick="Applications.files()">📁 Files</div>
        <div class="icon" onclick="Applications.store()">🛒 Store</div>
        <div class="icon" onclick="Applications.system()">💻 System</div>
        <div class="icon" onclick="Applications.chat()">💬 Chat</div>

    </div>

</main>

<!-- ================= APP DASHBOARD (NEW) ================= -->

<div id="app-dock">
    <b>Available Apps</b>
    <div id="app-list"></div>
</div>

<!-- ================= START MENU ================= -->

<aside id="start-menu">

    <div class="start-menu-item" onclick="Applications.notes()">📄 Notes</div>
    <div class="start-menu-item" onclick="Applications.files()">📁 File Explorer</div>
    <div class="start-menu-item" onclick="Applications.store()">🛒 App Store</div>
    <div class="start-menu-item" onclick="Applications.system()">💻 System</div>
    <div class="start-menu-item" onclick="Applications.chat()">💬 Chat</div>

</aside>

<!-- ================= WINDOWS ================= -->

<div id="windows-container"></div>

<!-- ================= TASKBAR ================= -->

<footer id="taskbar">

    <button id="start-btn">Start</button>

</footer>

<!-- ================= SCRIPTS ================= -->

<script src="os.js"></script>

<script>
// ================================
// START BUTTON LOGIC (FIXED)
// ================================

const startBtn = document.getElementById("start-btn");
const startMenu = document.getElementById("start-menu");

startBtn.addEventListener("click", (e) => {
    e.stopPropagation();

    startMenu.classList.toggle("show");
});

document.addEventListener("click", () => {
    startMenu.classList.remove("show");
});

// ================================
// APP REGISTRY DISPLAY (FROM OS.JS)
// ================================

function renderAppList() {

    const list = document.getElementById("app-list");
    if (!list || !window.appCatalog) return;

    list.innerHTML = "";

    window.appCatalog.forEach(app => {

        const div = document.createElement("div");
        div.className = "app-item";
        div.textContent = app.icon + " " + app.name;

        div.onclick = () => {

            openWindow(
                app.name,
                typeof app.content === "function"
                    ? app.content()
                    : app.content
            );
        };

        list.appendChild(div);
    });
}

window.addEventListener("DOMContentLoaded", () => {
    setTimeout(renderAppList, 200);
});
</script>

</body>
</html>
