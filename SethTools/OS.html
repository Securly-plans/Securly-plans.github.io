<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldOS</title>

<style>
body {
    margin: 0;
    font-family: "MS Sans Serif", Arial, sans-serif;
    background: #008080;
    overflow: hidden;
}

/* ================= DESKTOP ================= */

#desktop {
    position: absolute;
    inset: 0;
}

#desktop-icons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 15px;
}

.icon {
    width: 80px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: white;
    user-select: none;
}

/* installed apps */
#installed-apps-zone {
    position: absolute;
    top: 0;
    left: 120px;
    display: contents;
}

/* ================= WINDOWS ================= */

.window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 3px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    cursor: move;
}

/* ================= START MENU ================= */

#start-menu {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 200px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    display: none;
}

#start-menu.show {
    display: block;
}

.start-menu-item {
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
}

.start-menu-item:hover {
    background: #000080;
    color: white;
}

/* ================= TASKBAR ================= */

#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35px;
    background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex;
    align-items: center;
    padding: 2px;
}

#start-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- ================= DESKTOP ================= -->
<main id="desktop">

    <!-- BUILT-IN ICONS -->
    <div id="desktop-icons">
        <div class="icon" onclick="Applications.notes()">📄<br>Notes</div>
        <div class="icon" onclick="Applications.files()">📁<br>Files</div>
        <div class="icon" onclick="Applications.store()">🛒<br>Store</div>
        <div class="icon" onclick="Applications.system()">💻<br>System</div>
        <div class="icon" onclick="Applications.chat()">💬<br>Chat</div>
    </div>

    <!-- INSTALLED APPS -->
    <div id="installed-apps-zone"></div>

</main>

<!-- ================= START MENU ================= -->
<aside id="start-menu">
    <div class="start-menu-item" onclick="Applications.notes()">📄 Notes</div>
    <div class="start-menu-item" onclick="Applications.files()">📁 File Explorer</div>
    <div class="start-menu-item" onclick="Applications.store()">🛒 App Store</div>
    <div class="start-menu-item" onclick="Applications.system()">💻 System</div>
    <div class="start-menu-item" onclick="Applications.chat()">💬 Chat</div>
</aside>

<!-- ================= WINDOWS ================= -->
<div id="windows-container"></div>

<!-- ================= TASKBAR ================= -->
<footer id="taskbar">
    <button id="start-btn">Start</button>
</footer>

<!-- ================= OS SCRIPT ================= -->
<script src="os.js"></script>

<script>
// =============================
// START MENU CONTROL
// =============================

const startBtn = document.getElementById("start-btn");
const startMenu = document.getElementById("start-menu");

startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    startMenu.classList.toggle("show");
});

document.addEventListener("click", (e) => {
    if (!startMenu.contains(e.target)) {
        startMenu.classList.remove("show");
    }
});

// =============================
// SAFETY WRAPPER (optional fallback)
// =============================

function safeOpen(app) {
    if (window.Applications && window.Applications[app]) {
        window.Applications[app]();
    }
}

// =============================
// BOOT HANDLER
// =============================

window.addEventListener("DOMContentLoaded", () => {

    // wait for os.js to mount desktop apps
    setTimeout(() => {

        if (typeof renderDesktopApps === "function") {
            renderDesktopApps();
        }

    }, 100);
});
</script>

</body>
</html>
