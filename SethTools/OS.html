<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald OS test</title>
    <link rel="stylesheet" href="os.css">
</head>
<body>

    <div id="desktop">
    <div class="icon" onclick="openNotes()">📄<br>Notes</div>
    <div class="icon" onclick="openWindow('System Info', '<h2>Emerald OS Alpha</h2>')">💻<br>System</div>
    <div class="icon" onclick="openWindow('Chat', '<iframe src=\'https://securly-plans.github.io/chat.html\' style=\'width:100%; height:98%; border:none;\'></iframe>')">💬<br>Chat</div>
    <div class="icon" onclick="openAppStore()">🛒<br>App Store</div>

    <div id="installed-apps-zone" style="display: contents;"></div>
</div>
   <div id="taskbar">
    <button id="start-btn">Start</button>
    
    <div id="taskbar-apps" style="flex: 1; display: flex; gap: 5px; margin: 0 15px; overflow-x: auto;"></div>
    
    <div id="clock">00:00 PM</div>
</div>

    <div id="windows-container"></div>

    <script src="os.js"></script>
</body>
</html>
