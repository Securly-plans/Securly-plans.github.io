<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald OS test</title>
    <link rel="stylesheet" href="os.css">
</head>
<body>
   <div id="desktop">
    
    <div class="icon" onclick="openWindow('Textpad', '<textarea style=\'width:100%; height:90%; resize:none; border:none; outline:none;\'>Type your notes here...</textarea>')">
        📄<br>Notes
    </div>
    <div class="icon" onclick="openWindow('System Info', '<h2>Vanilla OS v1.0</h2><p>Built with 100% pure HTML, CSS, and JS.</p>')">

    </div>

    <div class="icon" onclick="openWindow('Chat', '<iframe src=\'https://securly-plans.github.io/chat.html\' style=\'width:100%; height:98%; border:none;\'></iframe>')">
        💬<br>Chat
    </div>
<div class="icon" onclick="openAppStore()">
    🛒<br>App Store
</div>
</div>

    <div id="taskbar">
        <button id="start-btn">./System_Start</button>
        <div id="clock">00:00 PM</div>
    </div>

    <div id="windows-container"></div>

    <script src="os.js"></script>
</body>
</html>
