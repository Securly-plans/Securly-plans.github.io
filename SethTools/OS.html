<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldOS</title>

<style>
body {
    margin: 0;
    font-family: "MS Sans Serif", Arial, sans-serif;
    background: #008080;
    overflow: hidden;
}

#desktop { position: absolute; inset: 0; }

#desktop-icons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 15px;
}

.icon {
    width: 80px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: white;
    user-select: none;
}

.window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 3px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    cursor: move;
}

/* RESIZE HANDLE */
.resize-handle {
    width: 12px;
    height: 12px;
    position: absolute;
    right: 0;
    bottom: 0;
    cursor: se-resize;
    background: #404040;
}

#start-menu {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 200px;
    background: #c0c0c0;
    border: 2px solid;
    display: none;
}

#start-menu.show { display: block; }

.start-menu-item {
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
}

.start-menu-item:hover {
    background: #000080;
    color: white;
}

#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35px;
    background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex;
    align-items: center;
    padding: 2px;
}

#start-btn {
    background: #c0c0c0;
    border: 2px solid;
}
</style>
</head>

<body>

<main id="desktop">

    <div id="desktop-icons"></div>
    <div id="installed-apps-zone"></div>

</main>

<aside id="start-menu">
    <div class="start-menu-item" onclick="Applications.notes()">📄 Notes</div>
    <div class="start-menu-item" onclick="Applications.files()">📁 Files</div>
    <div class="start-menu-item" onclick="Applications.store()">🛒 Store</div>
    <div class="start-menu-item" onclick="Applications.system()">💻 System</div>
    <div class="start-menu-item" onclick="Applications.chat()">💬 Chat</div>
</aside>

<div id="windows-container"></div>

<footer id="taskbar">
    <button id="start-btn">Start</button>
</footer>

<script src="os.js"></script>

<script>
const startBtn = document.getElementById("start-btn");
const startMenu = document.getElementById("start-menu");

startBtn.onclick = (e) => {
    e.stopPropagation();
    startMenu.classList.toggle("show");
};

document.addEventListener("click", (e) => {
    if (!startMenu.contains(e.target) && e.target !== startBtn) {
        startMenu.classList.remove("show");
    }
});
</script>

</body>
</html>
