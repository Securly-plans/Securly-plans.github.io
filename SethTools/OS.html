<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmeraldOS</title>

<style>
body {
    margin: 0;
    font-family: "MS Sans Serif", Arial, sans-serif;
    background: #008080;
    overflow: hidden;
}

#desktop {
    position: absolute;
    inset: 0;
}

#desktop-icons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 15px;
}

.icon {
    width: 80px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    color: white;
    user-select: none;
}

.window {
    position: absolute;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
}

.title-bar {
    background: #000080;
    color: white;
    padding: 3px;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    cursor: move;
}

#start-menu {
    position: absolute;
    bottom: 35px;
    left: 0;
    width: 200px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    display: none;
}

#start-menu.show {
    display: block;
}

.start-menu-item {
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
}

.start-menu-item:hover {
    background: #000080;
    color: white;
}

#taskbar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 35px;
    background: #c0c0c0;
    border-top: 2px solid #fff;
    display: flex;
    align-items: center;
    padding: 2px;
}

#start-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}

#app-dock {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 200px;
    background: rgba(192,192,192,0.9);
    border: 2px solid #fff;
    padding: 8px;
}

.app-item {
    font-size: 12px;
    padding: 4px;
    cursor: pointer;
}

.app-item:hover {
    background: #000080;
    color: white;
}
</style>
</head>

<body>

<!-- DESKTOP -->
<main id="desktop">
    <div id="desktop-icons">

        <div class="icon" onclick="safeOpen('notes')">📄 Notes</div>
        <div class="icon" onclick="safeOpen('files')">📁 Files</div>
        <div class="icon" onclick="safeOpen('store')">🛒 Store</div>
        <div class="icon" onclick="safeOpen('system')">💻 System</div>
        <div class="icon" onclick="safeOpen('chat')">💬 Chat</div>

    </div>
</main>

<!-- APP DOCK -->
<div id="app-dock">
    <b>Available Apps</b>
    <div id="app-list"></div>
</div>

<!-- START MENU -->
<aside id="start-menu">
    <div class="start-menu-item" onclick="safeOpen('notes')">📄 Notes</div>
    <div class="start-menu-item" onclick="safeOpen('files')">📁 File Explorer</div>
    <div class="start-menu-item" onclick="safeOpen('store')">🛒 App Store</div>
    <div class="start-menu-item" onclick="safeOpen('system')">💻 System</div>
    <div class="start-menu-item" onclick="safeOpen('chat')">💬 Chat</div>
</aside>

<!-- WINDOWS -->
<div id="windows-container"></div>

<!-- TASKBAR -->
<footer id="taskbar">
    <button id="start-btn">Start</button>
</footer>

<!-- OS SCRIPT -->
<script src="os.js"></script>

<script>
// =============================
// SAFE WRAPPER (FIXES CRASHES)
// =============================

function safeOpen(appName) {

    if (!window.Applications) {
        console.warn("Applications not loaded yet");
        return;
    }

    if (typeof window.Applications[appName] === "function") {
        window.Applications[appName]();
    } else {
        console.warn("App not found:", appName);
    }
}

// =============================
// START MENU
// =============================

const startBtn = document.getElementById("start-btn");
const startMenu = document.getElementById("start-menu");

startBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    startMenu.classList.toggle("show");
});

document.addEventListener("click", () => {
    startMenu.classList.remove("show");
});

// =============================
// APP LIST RENDER (SAFE)
// =============================

function renderAppList() {

    const list = document.getElementById("app-list");

    if (!list || !window.appCatalog) {
        console.warn("App catalog not ready yet");
        return;
    }

    list.innerHTML = "";

    window.appCatalog.forEach(app => {

        const div = document.createElement("div");
        div.className = "app-item";
        div.textContent = app.icon + " " + app.name;

        div.onclick = () => {

            if (typeof window.openWindow === "function") {
                window.openWindow(
                    app.name,
                    typeof app.content === "function"
                        ? app.content()
                        : app.content
                );
            } else {
                console.warn("openWindow not defined");
            }
        };

        list.appendChild(div);
    });
}

// Retry render until OS loads
function waitForOS() {
    let tries = 0;

    const interval = setInterval(() => {
        tries++;

        if (window.appCatalog || tries > 20) {
            clearInterval(interval);
            renderAppList();
        }
    }, 200);
}

window.addEventListener("DOMContentLoaded", waitForOS);

</script>

</body>
</html>
