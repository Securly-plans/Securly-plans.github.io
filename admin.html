<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{font-family:Courier New;padding:20px;background:#23262a;}
.box{background:white;padding:15px;border-radius:10px;margin-bottom:15px;}
.user{background:#eee;padding:10px;margin:10px 0;border-radius:8px;}
input,select{padding:8px;margin:5px;}
button{padding:8px;margin:5px;cursor:pointer;}

.locked{color:red;font-weight:bold;}
.unlocked{color:green;font-weight:bold;}

#toastContainer{position:fixed;top:20px;right:20px;z-index:9999;}
.toast{padding:10px;border-radius:6px;color:white;margin-bottom:8px;}
.toast.success{background:#4caf50;}
.toast.error{background:#f44336;}
.toast.info{background:#2196f3;}
</style>
</head>

<body>

<h1>Admin Panel</h1>

<div id="toastContainer"></div>

<div class="box">
  <h3>Add User</h3>
  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">
  <button onclick="createUser()">Add User</button>
</div>

<div class="box">
  <h3>System Settings</h3>
  <button id="redirectToggleBtn">Auto-Redirect</button>
</div>

<div class="box">
  <h3>Admin Logs</h3>
  <button onclick="openLog()">View Logs</button>
  <div id="logBox" style="display:none;"></div>
</div>

<div id="users"></div>

<script type="module">

import {
  collection,getDocs,addDoc,deleteDoc,updateDoc,doc,getDoc,setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= HASH PASSWORD (FIX) ================= */
async function hashPassword(password) {
  const msgUint8 = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ================= TOAST ================= */
function toast(msg,type="info"){
  const c=document.getElementById("toastContainer");
  const d=document.createElement("div");
  d.className="toast "+type;
  d.textContent=msg;
  c.appendChild(d);
  setTimeout(()=>d.remove(),3000);
}

/* ================= ADMIN CHECK ================= */
if(localStorage.getItem("role")!=="admin"){
  alert("Access denied");
  location.href="index.html";
}

/* ================= LOG ================= */
async function log(action){
  await addDoc(collection(db,"adminLogs"),{
    action,
    user:localStorage.getItem("username"),
    time:Date.now()
  });
}

/* ================= USERS ================= */
async function loadUsers(){
  const snap=await getDocs(collection(db,"users"));
  const box=document.getElementById("users");
  box.innerHTML="";

  snap.forEach(d=>{
    const data=d.data();
    const locked=data.locked;

    const div=document.createElement("div");
    div.className="user";

    div.innerHTML=`
      <b>ID:</b> ${d.id}<br>

      <span class="${locked?'locked':'unlocked'}">
        ${locked?"🔒 Locked":"🔓 Active"}
      </span><br>

      Username:<br>
      <input id="u-${d.id}" value="${data.username}"><br>

      Role:<br>
      <select id="r-${d.id}">
        <option value="user" ${data.role==="user"?"selected":""}>User</option>
        <option value="admin" ${data.role==="admin"?"selected":""}>Admin</option>
      </select><br>

      Password:<br>
      <input id="p-${d.id}" placeholder="new password"><br>

      <button onclick="saveUser('${d.id}')">Save</button>
      <button onclick="deleteUser('${d.id}')">Delete</button>
      <button onclick="toggleLock('${d.id}',${locked})">
        ${locked?"Unlock":"Lock"}
      </button>
    `;

    box.appendChild(div);
  });
}

/* ================= CREATE USER (HASH FIX) ================= */
window.createUser=async()=>{

  const username=newUser.value;
  const password=newPass.value;

  const passwordHash = await hashPassword(password); // ✅ FIXED

  await addDoc(collection(db,"users"),{
    username,
    passwordHash,
    role:"user",
    locked:false,
    created:Date.now()
  });

  toast("User created","success");
  log("Created user");
  loadUsers();
};

/* ================= SAVE USER (HASH FIX) ================= */
window.saveUser=async(id)=>{

  const u=document.getElementById("u-"+id).value;
  const r=document.getElementById("r-"+id).value;
  const p=document.getElementById("p-"+id).value;

  const data={username:u,role:r};

  if(p){
    data.passwordHash = await hashPassword(p); // ✅ FIXED
  }

  await updateDoc(doc(db,"users",id),data);

  toast("Saved","success");
  log("Updated "+id);
  loadUsers();
};

/* ================= DELETE ================= */
window.deleteUser=async(id)=>{
  await deleteDoc(doc(db,"users",id));
  toast("Deleted","info");
  log("Deleted "+id);
  loadUsers();
};

/* ================= LOCK ================= */
window.toggleLock=async(id,state)=>{
  await updateDoc(doc(db,"users",id),{locked:!state});
  toast("Updated","info");
  log("Lock toggle "+id);
  loadUsers();
};

/* ================= LOG VIEW ================= */
window.openLog=async()=>{
  const box=document.getElementById("logBox");

  if(box.style.display==="block"){
    box.style.display="none";
    return;
  }

  const snap=await getDocs(collection(db,"adminLogs"));

  box.innerHTML="<h4>Logs</h4>";

  snap.forEach(d=>{
    const x=d.data();
    box.innerHTML+=`<div>${x.user}: ${x.action}</div>`;
  });

  box.style.display="block";
};

/* ================= START ================= */
window.addEventListener("DOMContentLoaded",loadUsers);

</script>

</body>
</html>
