<!-- LOGOUT + NAVBAR -->
<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.clear();
    window.location.replace("index.html");
});

const role = localStorage.getItem("role");
const username = localStorage.getItem("username");
const isLoggedIn = localStorage.getItem("loggedIn") === "true";

const usernameDisplay = document.getElementById("usernameDisplay");
if (username && isLoggedIn) {
    usernameDisplay.textContent = (role === "admin" ? "🛡 " : "👤 ") + username;
}

if (isLoggedIn) {
    document.getElementById("profileLink").style.display = "inline-block";
}

if (role === "admin") {
    document.getElementById("adminLink").style.display = "inline-block";
}
</script>

<!-- ================= CHAT SYSTEM V1 (FIXED WORKING CORE) ================= -->
<script type="module">
import {
    collection,
    addDoc,
    query,
    where,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ---------------- OPEN CHAT UI ---------------- */
document.getElementById("chatBtn").addEventListener("click", async () => {

    const otherUser = prompt("Enter username to chat with:");
    if (!otherUser) return;

    const me = localStorage.getItem("username");

    if (!me) return alert("Not logged in");

    /* create consistent chat id (DM system) */
    const chatId = [me, otherUser].sort().join("_");

    const msg = prompt("Message:");
    if (!msg) return;

    await addDoc(collection(db, "chats", chatId, "messages"), {
        from: me,
        text: msg,
        time: serverTimestamp()
    });

    alert("Message sent!");
});
</script>

<script src="script.js"></script>
