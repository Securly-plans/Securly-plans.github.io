<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{font-family:Arial;padding:20px;background:#f4f4f4;}
.box{background:white;padding:15px;border-radius:10px;margin-bottom:15px;}
.user{background:#eee;padding:10px;margin:10px 0;border-radius:8px;}
input,select{padding:8px;margin:5px;}
button{padding:8px;margin:5px;cursor:pointer;}

.locked{color:red;font-weight:bold;}
.unlocked{color:green;font-weight:bold;}

#toastContainer{position:fixed;top:20px;right:20px;z-index:9999;}
.toast{padding:10px;border-radius:6px;color:white;margin-bottom:8px;}
.toast.success{background:#4caf50;}
.toast.error{background:#f44336;}
.toast.info{background:#2196f3;}
</style>
</head>

<body>

<h1 style="color:red;text-align:center;">Admin Panel</h1>

<h3 style="color:purple;text-align:center;">Administration Panel</h3>

<div id="toastContainer"></div>

<div class="box">
  <h3>Add User</h3>
  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">
  <button onclick="createUser()">Add User</button>
</div>

<div class="box">
  <h3>System Settings</h3>
  <button id="redirectToggleBtn">Loading...</button>
</div>

<div class="box">
  <h3>Admin Logs</h3>
  <button onclick="openLog()">View Logs</button>
  <div id="logBox" style="display:none;"></div>
</div>

<button onclick="window.location.href='chatmod.html'">Chat Moderation</button>

<button onclick="toggleChatMonitor()">▼ Show Chat Monitor</button>

<div class="box">
  <h3>Live Chat Monitor</h3>
  <button onclick="loadChats()">Refresh Chats</button>

  <div id="chatMonitorWrapper" style="display:none;">
    <div id="chatMonitor"></div>
  </div>
</div>

<div class="box">
  <h3>User Search</h3>
  <input id="userSearch" placeholder="Search username or ID...">
</div>

<div id="users"></div>

<script type="module">

import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= STATE ================= */
let chatMonitorOpen = false;

/* ================= TOAST ================= */
function toast(msg,type="info"){
  const c=document.getElementById("toastContainer");
  const d=document.createElement("div");
  d.className="toast "+type;
  d.textContent=msg;
  c.appendChild(d);
  setTimeout(()=>d.remove(),3000);
}

/* ================= ADMIN CHECK ================= */
if(localStorage.getItem("role")!=="admin"){
  alert("Access denied");
  location.href="index.html";
}

/* ================= LOG ================= */
async function log(action){
  await addDoc(collection(db,"adminLogs"),{
    action,
    user:localStorage.getItem("username"),
    time:Date.now()
  });
}

/* ================= HASH ================= */
async function hashPassword(password){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest("SHA-256", enc.encode(password));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ================= USERS ================= */
async function loadUsers() {
  const box = document.getElementById("users");
  box.innerHTML = "Loading users...";

  try {
    const snap = await getDocs(collection(db, "users"));

    console.log("Users fetched:", snap.size);

    const search =
      document.getElementById("userSearch")?.value?.toLowerCase() || "";

    box.innerHTML = "";

    if (snap.empty) {
      box.innerHTML = "<p>No users found in Firestore.</p>";
      return;
    }

    snap.forEach((d) => {
      const data = d.data() || {};

      const username = (data.username || "").toString();
      const role = data.role || "user";
      const locked = !!data.locked;

      // SAFE SEARCH (prevents crashes)
      if (
        search &&
        !d.id.toLowerCase().includes(search) &&
        !username.toLowerCase().includes(search)
      ) return;

      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <b>ID:</b> ${d.id}<br>

        <span class="${locked ? "locked" : "unlocked"}">
          ${locked ? "🔒 Locked" : "🔓 Active"}
        </span><br>

        Username:<br>
        <input id="u-${d.id}" value="${username}"><br>

        Role:<br>
        <select id="r-${d.id}">
          <option value="user" ${role === "user" ? "selected" : ""}>User</option>
          <option value="mod" ${role === "mod" ? "selected" : ""}>Mod</option>
          <option value="admin" ${role === "admin" ? "selected" : ""}>Admin</option>
        </select><br>

        Password:<br>
        <input id="p-${d.id}" placeholder="new password"><br>

        Notes:<br>
        <textarea id="n-${d.id}" style="width:100%;height:60px;">${data.adminNotes || ""}</textarea><br>

        ${locked ? `<div class="locked">Reason: ${data.lockReason || "No reason given"}</div>` : ""}

        <button onclick="saveUser('${d.id}')">Save</button>
        <button onclick="deleteUser('${d.id}')">Delete</button>
        <button onclick="toggleLock('${d.id}', ${locked})">
          ${locked ? "Unlock" : "Lock"}
        </button>
      `;

      box.appendChild(div);
    });

  } catch (err) {
    console.error("🔥 Firestore error loading users:", err);
    box.innerHTML = `
      <p style="color:red;">
        Failed to load users.<br>
        Check console (F12) for Firebase error.
      </p>
    `;
  }
}

/* ================= ACTIONS ================= */
window.createUser = async ()=>{
  const u = document.getElementById("newUser").value.trim();
  const p = document.getElementById("newPass").value;

  if(!u || !p) return toast("Missing fields","error");

  await addDoc(collection(db,"users"),{
    username:u,
    passwordHash:await hashPassword(p),
    role:"user",
    locked:false,
    created:Date.now()
  });

  toast("User created","success");
  loadUsers();
};

window.saveUser = async (id)=>{
  const u = document.getElementById("u-"+id).value;
  const r = document.getElementById("r-"+id).value;
  const p = document.getElementById("p-"+id).value;
  const n = document.getElementById("n-"+id).value;

  const data = {username:u, role:r, adminNotes:n};
  if(p) data.passwordHash = await hashPassword(p);

  await updateDoc(doc(db,"users",id),data);

  toast("Saved","success");
  loadUsers();
};

window.deleteUser = async (id)=>{
  await deleteDoc(doc(db,"users",id));
  toast("Deleted","info");
  loadUsers();
};

window.toggleLock = async (id,state)=>{
  let reason = "";

  if(!state){
    reason = prompt("Lock reason:");
    if(!reason) return;
  }

  await updateDoc(doc(db,"users",id),{
    locked:!state,
    lockReason:!state?reason:""
  });

  toast("Updated","info");
  loadUsers();
};

/* ================= LOGS ================= */
window.openLog = async ()=>{
  const box=document.getElementById("logBox");

  if(box.style.display==="block"){
    box.style.display="none";
    return;
  }

  const snap = await getDocs(collection(db,"adminLogs"));

  box.innerHTML="<h4>Logs</h4>";
  snap.forEach(d=>{
    const x=d.data();
    box.innerHTML += `<div>${x.user}: ${x.action}</div>`;
  });

  box.style.display="block";
};

/* ================= CHAT MONITOR ================= */
window.toggleChatMonitor = ()=>{
  const w=document.getElementById("chatMonitorWrapper");
  chatMonitorOpen=!chatMonitorOpen;
  w.style.display=chatMonitorOpen?"block":"none";
};

window.loadChats = async ()=>{
  const monitor=document.getElementById("chatMonitor");
  monitor.innerHTML="Loading...";

  const snap = await getDocs(collection(db,"chats"));
  monitor.innerHTML="";

  snap.forEach(c=>{
    const div=document.createElement("div");
    div.className="user";
    div.innerHTML=`<b>${c.id}</b>`;
    monitor.appendChild(div);
  });
};

/* ================= INIT ================= */
window.addEventListener("DOMContentLoaded", ()=>{
  loadUsers();

  document.getElementById("userSearch").addEventListener("input", loadUsers);
});
</script>

</body>
</html>
