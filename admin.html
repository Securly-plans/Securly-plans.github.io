<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Admin Panel</title>

<style>

body {
  font-family: Arial;
  padding: 20px;
  background: #f4f4f4;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.user {
  background: #eee;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

input {
  padding: 8px;
  margin: 5px;
}

button {
  margin: 5px;
  padding: 8px;
  cursor: pointer;
}

</style>

</head>

<body>

<h1>Admin Panel</h1>

<div class="box">

  <h3>Add User</h3>

  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">

  <button onclick="createUser()">Add User</button>

</div>

<div id="users"></div>

<script type="module">

import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ---------------- ADMIN KEY ---------------- */
const ADMIN_KEY = "MES-KEY/ADMIN-73-Ahf4";

const key = prompt("Enter admin key:");

if (key !== ADMIN_KEY) {
  alert("Access denied");
  window.location.href = "index.html";
}

/* ---------------- PASSWORD HASH ---------------- */
async function hashPassword(password) {

  const msgUint8 = new TextEncoder().encode(password);

  const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);

  const hashArray = Array.from(new Uint8Array(hashBuffer));

  return hashArray
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

/* ---------------- LOAD USERS ---------------- */
async function loadUsers() {

  const snapshot = await getDocs(collection(db, "users"));

  const container = document.getElementById("users");
  container.innerHTML = "";

  snapshot.forEach((docSnap) => {

    const data = docSnap.data();

    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <b>ID:</b> ${docSnap.id}<br>

      <b>Username:</b>
      <input value="${data.username}" id="u-${docSnap.id}">

      <br>

      <b>Password (raw):</b>
      <input type="text" placeholder="Set New Password" id="p-${docSnap.id}">

      <br>

      <button onclick="saveUser('${docSnap.id}')">
        Save
      </button>

      <button onclick="deleteUser('${docSnap.id}')">
        Delete
      </button>
    `;

    container.appendChild(div);
  });
}

/* ---------------- CREATE USER ---------------- */
window.createUser = async function() {

  const username = document.getElementById("newUser").value;
  const password = document.getElementById("newPass").value;

  if (!username || !password) {
    alert("Fill both fields");
    return;
  }

  const passwordHash = await hashPassword(password);

  await addDoc(collection(db, "users"), {
    username,
    passwordHash,
    created: Date.now()
  });

  alert("User created");

  document.getElementById("newUser").value = "";
  document.getElementById("newPass").value = "";

  loadUsers();
}

/* ---------------- SAVE USER ---------------- */
window.saveUser = async function(id) {

  const username = document.getElementById("u-" + id).value;
  const newPass = document.getElementById("p-" + id).value;

  const updateData = {
    username
  };

  if (newPass && newPass.trim() !== "") {
    updateData.passwordHash = await hashPassword(newPass);
  }

  await updateDoc(doc(db, "users", id), updateData);

  alert("User updated");

  loadUsers();
}

/* ---------------- DELETE USER ---------------- */
window.deleteUser = async function(id) {

  if (!confirm("Delete this user?")) return;

  await deleteDoc(doc(db, "users", id));

  alert("User deleted");

  loadUsers();
}

/* ---------------- START ---------------- */
loadUsers();

</script>

</body>
</html>
