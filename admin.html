<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin</title>
</head>

<body>

<h1>Admin Panel</h1>

<button onclick="viewLogs()">View Logs</button>

<div id="logs"></div>

<div id="users"></div>

<script type="module">
import {
  collection, getDocs, addDoc, deleteDoc, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

const role = localStorage.getItem("role");
if (role !== "admin") location = "index.html";

/* LOGGING */
async function log(action, target) {
  await addDoc(collection(db, "adminLogs"), {
    action,
    targetUser: target,
    performedBy: localStorage.getItem("username"),
    timestamp: Date.now()
  });
}

/* VIEW LOGS */
window.viewLogs = async () => {
  const snap = await getDocs(collection(db, "adminLogs"));

  const box = document.getElementById("logs");
  box.innerHTML = "";

  snap.forEach(d => {
    const x = d.data();
    box.innerHTML += `<p>${x.action} → ${x.targetUser}</p>`;
  });
};
</script>

</body>
</html>
