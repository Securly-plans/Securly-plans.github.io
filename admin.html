<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f4f4;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.user {
  background: #eee;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

input {
  padding: 8px;
  margin: 5px;
}

button {
  margin: 5px;
  padding: 8px;
  cursor: pointer;
}

.toggle-on {
  background: #4caf50;
  color: white;
  border: none;
}

.toggle-off {
  background: #f44336;
  color: white;
  border: none;
}
</style>

</head>

<body>

<h1>Admin Panel</h1>

<!-- ================= USERS ================= -->
<div class="box">

  <h3>Add User</h3>

  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">

  <button onclick="createUser()">Add User</button>

</div>

<!-- ================= SETTINGS ================= -->
<div class="box">

  <h3>System Settings</h3>

  <button id="redirectToggleBtn">Loading...</button>

</div>

<!-- ================= USER LIST ================= -->
<div id="users"></div>

<!-- ================= FIREBASE ================= -->
<script type="module">

import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* =================================================
   🔐 SAFE ACCESS CONTROL (FIXED)
================================================= */

function isAdminAllowed() {
  const role = localStorage.getItem("role");

  let keyAccess = false;

  try {
    const key = prompt("Enter admin key or Type 'Cancel' to use role:");

    if (key === "Wyatt-2") {
      keyAccess = true;
    }
  } catch (e) {
    console.warn("Prompt blocked:", e);
  }

  return role === "admin" || keyAccess;
}

/* Run access check BEFORE loading anything */
if (!isAdminAllowed()) {
  alert("Access denied: Admins only");
  window.location.href = "index.html";
}

/* =================================================
   🔑 PASSWORD HASH
================================================= */

async function hashPassword(password) {
  const msgUint8 = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));

  return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

/* =================================================
   🔥 SETTINGS (AUTO REDIRECT)
================================================= */

const settingsRef = doc(db, "settings", "appConfig");
const toggleBtn = document.getElementById("redirectToggleBtn");

async function loadSettings() {
  try {
    const snap = await getDoc(settingsRef);
    const enabled = snap.exists() ? snap.data().autoRedirect : false;
    updateToggleUI(enabled);
  } catch (err) {
    console.error("Settings load failed:", err);
    toggleBtn.textContent = "Settings failed to load";
  }
}

function updateToggleUI(enabled) {

  toggleBtn.textContent = enabled
    ? "Disable Auto Redirect"
    : "Enable Auto Redirect";

  toggleBtn.className = enabled
    ? "toggle-on"
    : "toggle-off";

  toggleBtn.onclick = async () => {

    const snap = await getDoc(settingsRef);
    const current = snap.exists() ? snap.data().autoRedirect : false;

    await setDoc(settingsRef, {
      autoRedirect: !current
    }, { merge: true });

    loadSettings();
  };
}

/* =================================================
   👤 USER SYSTEM
================================================= */

async function loadUsers() {

  try {
    const snapshot = await getDocs(collection(db, "users"));

    const container = document.getElementById("users");
    container.innerHTML = "";

    snapshot.forEach((docSnap) => {

      const data = docSnap.data();

      const div = document.createElement("div");
      div.className = "user";

      div.innerHTML = `
        <b>ID:</b> ${docSnap.id}<br>

        <b>Username:</b>
        <input value="${data.username}" id="u-${docSnap.id}">

        <br>

        <b>Role:</b>
        <select id="r-${docSnap.id}">
          <option value="user" ${data.role === "user" ? "selected" : ""}>User</option>
          <option value="admin" ${data.role === "admin" ? "selected" : ""}>Admin</option>
        </select>

        <br>

        <b>Password (new):</b>
        <input type="text" placeholder="Set New Password" id="p-${docSnap.id}">

        <br>

        <button onclick="saveUser('${docSnap.id}')">Save</button>
        <button onclick="deleteUser('${docSnap.id}')">Delete</button>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    console.error("User load failed:", err);
    document.getElementById("users").innerHTML =
      "<b style='color:red'>Failed to load users</b>";
  }
}

/* ---------------- CREATE USER ---------------- */
window.createUser = async function() {

  const username = document.getElementById("newUser").value;
  const password = document.getElementById("newPass").value;

  if (!username || !password) {
    alert("Fill both fields");
    return;
  }

  const passwordHash = await hashPassword(password);

  await addDoc(collection(db, "users"), {
    username,
    passwordHash,
    role: "user",
    created: Date.now()
  });

  document.getElementById("newUser").value = "";
  document.getElementById("newPass").value = "";

  loadUsers();
}

/* ---------------- SAVE USER ---------------- */
window.saveUser = async function(id) {

  const username = document.getElementById("u-" + id).value;
  const role = document.getElementById("r-" + id).value;
  const newPass = document.getElementById("p-" + id).value;

  const updateData = { username, role };

  if (newPass && newPass.trim() !== "") {
    updateData.passwordHash = await hashPassword(newPass);
  }

  await updateDoc(doc(db, "users", id), updateData);

  loadUsers();
}

/* ---------------- DELETE USER ---------------- */
window.deleteUser = async function(id) {

  if (!confirm("Delete this user?")) return;

  await deleteDoc(doc(db, "users", id));

  loadUsers();
}

/* =================================================
   🚀 START (SAFE BOOT ORDER)
================================================= */

window.addEventListener("DOMContentLoaded", () => {
  loadUsers();
  loadSettings();
});

</script>

</body>
</html>
