<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f4f4;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.user {
  background: #eee;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

input { padding: 8px; margin: 5px; }
button { padding: 8px; cursor: pointer; margin: 5px; }

.locked { color: red; font-weight: bold; }
.unlocked { color: green; font-weight: bold; }

.toast {
  padding: 10px;
  background: #333;
  color: white;
  margin: 5px;
}
</style>

</head>

<body>

<h1>Admin Panel</h1>

<div class="box">
  <h3>Add User</h3>
  <input id="newUser">
  <input id="newPass" type="password">
  <button onclick="createUser()">Add</button>
</div>

<div class="box">
  <h3>System Settings</h3>
  <button id="redirectToggleBtn">Loading...</button>
</div>

<div class="box">
  <h3>Admin Activity Log</h3>
  <button onclick="openLog()">View Logs</button>
  <div id="logBox" style="display:none;"></div>
</div>

<!-- ================= CHAT MONITOR (ONLY ADDITION) ================= -->
<div class="box">
  <h3>Chat Monitor</h3>
  <button onclick="loadChats()">View Chats</button>
  <div id="chatBox" style="display:none;margin-top:10px;"></div>
</div>

<div id="users"></div>

<script type="module">

import {
  collection, getDocs, addDoc,
  deleteDoc, updateDoc, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* toast */
function toast(msg){ alert(msg); }

/* admin check */
if (localStorage.getItem("role") !== "admin") {
  window.location.href = "index.html";
}

/* logs */
async function logAction(action){
  await addDoc(collection(db,"adminLogs"),{
    action,
    user: localStorage.getItem("username"),
    time: Date.now()
  });
}

/* settings */
const settingsRef = doc(db,"settings","appConfig");

async function loadSettings(){
  const snap = await getDoc(settingsRef);
  const enabled = snap.exists() ? snap.data().autoRedirect : false;

  const btn = document.getElementById("redirectToggleBtn");
  btn.textContent = enabled ? "Disable" : "Enable";

  btn.onclick = async () => {
    await setDoc(settingsRef,{autoRedirect:!enabled},{merge:true});
    toast("Updated");
  };
}

/* users */
async function loadUsers(){
  const snap = await getDocs(collection(db,"users"));
  const box = document.getElementById("users");
  box.innerHTML = "";

  snap.forEach(d=>{
    const u = d.data();

    box.innerHTML += `
      <div class="user">
        <b>${u.username}</b> - ${u.locked ? "🔒" : "🔓"}
      </div>
    `;
  });
}

/* ================= CHAT MONITOR (ONLY ADDITION) ================= */
window.loadChats = async function() {

  const box = document.getElementById("chatBox");

  if (box.style.display === "block") {
    box.style.display = "none";
    return;
  }

  const snap = await getDocs(collection(db,"chats"));

  box.innerHTML = "<h4>Chats</h4>";

  snap.forEach(d=>{
    const c = d.data();
    box.innerHTML += `
      <div style="padding:5px;border-bottom:1px solid #ccc">
        ${c.members.join(", ")}<br>
        ${c.lastMessage || ""}
      </div>
    `;
  });

  box.style.display = "block";
};

/* start */
window.addEventListener("DOMContentLoaded",()=>{
  loadUsers();
  loadSettings();
});

</script>

</body>
</html>
