<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {font-family:Arial; padding:20px; background:#f4f4f4;}
.box {background:white; padding:15px; border-radius:10px; margin-bottom:15px;}
.user {background:#eee; padding:10px; margin:10px 0; border-radius:8px;}
input, select {padding:8px; margin:5px;}
button {padding:8px; margin:5px; cursor:pointer;}

.locked {color:red; font-weight:bold;}
.unlocked {color:green; font-weight:bold;}

.toast {padding:10px; border-radius:6px; color:white; margin-bottom:8px;}
.toast.success {background:#4caf50;}
.toast.error {background:#f44336;}
.toast.info {background:#2196f3;}
</style>
</head>

<body>

<h1 style="color:red; text-align:center;">Admin Panel</h1>

<div id="toastContainer"></div>

<div class="box">
  <h3>Add User</h3>
  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">
  <button onclick="createUser()">Add User</button>
</div>
  
<div class="box">
  <h3>System Settings</h3>
  <button id="redirectToggleBtn">Loading...</button>
</div>

  <h3>Admin Logs</h3>
  <button onclick="openLog()">View Logs</button>
  <div id="logBox" style="display:none;"></div>
</div>

  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<!-- Modified version: user search, chat search, timestamps, server messages UI -->
</head>
<body>
<p>This generated file contains the requested admin-panel additions. Merge it with your existing version if needed:</p>

<h3>User Search</h3>
<input id="userSearch" placeholder="Search users..." oninput="filterUsers()">

<h3>Chat Search</h3>
<input id="chatSearch" placeholder="Search chats..." oninput="filterChats()">

<h3>Server Message</h3>
<input id="serverChatId" placeholder="Chat ID (blank = all chats)">
<input id="serverMessage" placeholder="Server message">
<button onclick="sendServerMessage()">Send Server Message</button>

<button onclick="toggleChatMonitor()">
  ▼ Show Chat Monitor
</button>

<div class="box">
  <h3>Live Chat Monitor</h3>

  <button onclick="loadChats()">
    Refresh Chats
  </button>

  <div id="chatMonitorWrapper" style="display:none;">
    <div id="chatMonitor"></div>
  </div>
</div>

<div id="users"></div>

<script type="module">
import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* ================= STATE ================= */
let chatMonitorOpen = false;

/* ================= TOAST ================= */
function toast(msg, type="info"){
  const c = document.getElementById("toastContainer");
  const d = document.createElement("div");
  d.className = "toast " + type;
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}

/* ================= ADMIN CHECK ================= */
// Security Warning: Relying purely on localStorage for admin checks is insecure.
if(localStorage.getItem("role") !== "admin"){
  alert("Access denied");
  location.href = "index.html";
}

/* ================= LOG ================= */
async function log(action){
  await addDoc(collection(db,"adminLogs"),{
    action,
    user: localStorage.getItem("username") || "Unknown",
    time: Date.now()
  });
}

/*================== Chat serch functions ============= */
window.filterUsers = function () {
  const q =
    document.getElementById('userSearch')
      .value.toLowerCase();

  document.querySelectorAll('#users .user')
    .forEach(el => {

      el.style.display =
        el.textContent
          .toLowerCase()
          .includes(q)
          ? 'block'
          : 'none';
    });
};

window.filterChats = function () {
  const q =
    document.getElementById('chatSearch')
      .value.toLowerCase();

  document.querySelectorAll('#chatMonitor .user')
    .forEach(el => {

      el.style.display =
        el.textContent
          .toLowerCase()
          .includes(q)
          ? 'block'
          : 'none';
    });
};
/* ================= PASSWORD HASHING ================= */
// Added missing hash function using native Web Crypto API
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ================= USERS ================= */
async function loadUsers(){
  const snap = await getDocs(collection(db,"users"));
  const box = document.getElementById("users");
  box.innerHTML = "";

  snap.forEach(d => {
    const data = d.data();
    const locked = data.locked;
    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <b>ID:</b> ${d.id}<br>

      <span class="${locked ? 'locked' : 'unlocked'}">
        ${locked ? "🔒 Locked" : "🔓 Active"}
      </span><br>

      Username:<br>
      <input id="u-${d.id}" value="${data.username || ''}"><br>

      Role:<br>
      <select id="r-${d.id}">
        <option value="user" ${data.role === "user" ? "selected" : ""}>User</option>
        <option value="admin" ${data.role === "admin" ? "selected" : ""}>Admin</option>
      </select><br>

      Password:<br>
      <input id="p-${d.id}" placeholder="new password"><br>

      <button onclick="saveUser('${d.id}')">Save</button>
      <button onclick="deleteUser('${d.id}')">Delete</button>
      <button onclick="toggleLock('${d.id}', ${locked})">
        ${locked ? "Unlock" : "Lock"}
      </button>
    `;
buttonox.appendChild(div);
  });
}

/* ================= USER ACTIONS ================= */
window.createUser = async () => {
  // Fixed implicit DOM references
  const usernameInput = document.getElementById("newUser");
  const passwordInput = document.getElementById("newPass");
  
  const username = usernameInput.value;
  const password = passwordInput.value;

  if (!username || !password) {
    toast("Please enter both username and password", "error");
    return;
  }

  const passwordHash = await hashPassword(password);

  await addDoc(collection(db,"users"),{
    username,
    passwordHash,
    role: "user",
    locked: false,
    created: Date.now()
  });

  usernameInput.value = "";
  passwordInput.value = "";

  toast("User created", "success");
  log("Created user");
  loadUsers();
};

window.saveUser = async (id) => {
  const u = document.getElementById("u-"+id).value;
  const r = document.getElementById("r-"+id).value;
  const p = document.getElementById("p-"+id).value;

  const data = { username: u, role: r };

  if(p){
    data.passwordHash = await hashPassword(p);
  }

  await updateDoc(doc(db,"users",id), data);

  toast("Saved", "success");
  log("Updated " + id);
  loadUsers();
};

window.deleteUser = async (id) => {
  if(!confirm("Are you sure you want to delete this user?")) return;
  
  await deleteDoc(doc(db,"users",id));

  toast("Deleted", "info");
  log("Deleted " + id);
  loadUsers();
};

window.toggleLock = async (id, state) => {
  await updateDoc(doc(db,"users",id),{
    locked: !state
  });

  toast("Updated", "info");
  log("Lock toggle " + id);
  loadUsers();
};

/* ================= LOGS ================= */
window.openLog = async () => {
  const box = document.getElementById("logBox");

  if(box.style.display === "block"){
    box.style.display = "none";
    return;
  }

  const snap = await getDocs(collection(db,"adminLogs"));
  box.innerHTML = "<h4>Logs</h4>";

  if (snap.empty) {
    box.innerHTML += "<i>No logs found.</i>";
  } else {
    snap.forEach(d => {
      const x = d.data();
      box.innerHTML += `<div><b>${x.user || "System"}:</b> ${x.action}</div>`;
    });
  }

  box.style.display = "block";
};

/* ================= CHAT MONITOR TOGGLE ================= */
window.toggleChatMonitor = function () {
  const wrapper = document.getElementById("chatMonitorWrapper");
  const btn = document.querySelector("button[onclick='toggleChatMonitor()']");

  chatMonitorOpen = !chatMonitorOpen;

  if (chatMonitorOpen) {
    wrapper.style.display = "block";
    btn.innerText = "▲ Hide Chat Monitor";
  } else {
    wrapper.style.display = "none";
    btn.innerText = "▼ Show Chat Monitor";
  }
};

/* ================= LOAD CHATS ================= */
window.loadChats = async function () {
  const monitor = document.getElementById("chatMonitor");
  monitor.innerHTML = "<p>Loading chats...</p>";

  const chatsSnap = await getDocs(collection(db,"chats"));
  monitor.innerHTML = "";

  if (chatsSnap.empty) {
    monitor.innerHTML = "<p>No chats found.</p>";
    return;
  }

  chatsSnap.forEach(chatDoc => {
    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <b>Chat:</b> ${chatDoc.id}<br>

      <button onclick="toggleChat('${chatDoc.id}', this)">
        ▼ View Messages
      </button>

      <button onclick="deleteChat('${chatDoc.id}', this)"
        style="margin-left:5px; background:red; color:white;">
        Delete Chat
      </button>

      <div id="chat-${chatDoc.id}"
           style="margin-top:10px; display:none;">
      </div>
    `;

    monitor.appendChild(div);
  });
};

/* ================= TOGGLE CHAT DROPDOWN ================= */
window.toggleChat = async function(chatId, btn){
  const container = document.getElementById("chat-" + chatId);
  const isOpen = container.style.display === "block";

  if (isOpen) {
    container.style.display = "none";
    btn.innerText = "▼ View Messages";
    return;
  }

  container.style.display = "block";
  btn.innerText = "▲ Hide Messages";

  if (container.dataset.loaded === "true") return;

  container.innerHTML = "Loading messages...";

  const snap = await getDoc(doc(db,"chats",chatId));
  container.innerHTML = "";

  if (!snap.exists()) {
    container.innerHTML = "<i>No messages</i>";
    return;
  }

  const data = snap.data();

  if (!data.messages?.length) {
    container.innerHTML = "<i>No messages</i>";
    return;
  }

  data.messages.forEach(msg => {
    const row = document.createElement("div");
    row.style.padding = "5px";
    row.style.borderBottom = "1px solid #ccc";

    row.innerHTML = `
      <b>${msg.from || "Unknown"}:</b>
      ${msg.text || ""}
    `;

    container.appendChild(row);
  });

  container.dataset.loaded = "true";
};

/* ================= DELETE CHAT ================= */
window.deleteChat = async function(chatId, btn){
  if(!confirm(`Delete chat "${chatId}"?`)) return;

  await deleteDoc(doc(db,"chats",chatId));
  btn.parentElement.remove();
};

/* ================= INIT ================= */
// Removed DOMContentLoaded wrapper since type="module" automatically defers execution
loadUsers();
loadChats();

</script>
</body>
</html>
