<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  background: #f4f4f4;
}

.box {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.user {
  background: #eee;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

input {
  padding: 8px;
  margin: 5px;
}

button {
  margin: 5px;
  padding: 8px;
  cursor: pointer;
}

.toggle-on {
  background: #4caf50;
  color: white;
  border: none;
}

.toggle-off {
  background: #f44336;
  color: white;
  border: none;
}

.locked {
  color: red;
  font-weight: bold;
}

.unlocked {
  color: green;
  font-weight: bold;
}
</style>

</head>

<body>

<h1>Admin Panel</h1>

<!-- ================= USERS ================= -->
<div class="box">

  <h3>Add User</h3>

  <input id="newUser" placeholder="Username">
  <input id="newPass" type="password" placeholder="Password">

  <button onclick="createUser()">Add User</button>

</div>

<!-- ================= SETTINGS ================= -->
<div class="box">

  <h3>System Settings</h3>

  <button id="redirectToggleBtn">Loading...</button>

</div>

<!-- ================= USER LIST ================= -->
<div id="users"></div>

<!-- ================= FIREBASE ================= -->
<script type="module">

import {
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { db } from "./js/firebase.js";

/* =================================================
   🔐 ACCESS CONTROL
================================================= */

function isAdminAllowed() {
  const role = localStorage.getItem("role");

  let keyAccess = false;

  try {
    const key = prompt("Enter admin key or Cancel to use role:");

    if (key === "Wyatt-2") {
      keyAccess = true;
    }
  } catch (e) {}

  return role === "admin" || keyAccess;
}

if (!isAdminAllowed()) {
  alert("Access denied: Admins only");
  window.location.href = "index.html";
}

/* =================================================
   🔑 HASH
================================================= */

async function hashPassword(password) {
  const msgUint8 = new TextEncoder().encode(password);
  const hashBuffer = await crypto.subtle.digest("SHA-256", msgUint8);
  const hashArray = Array.from(new Uint8Array(hashBuffer));

  return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}

/* =================================================
   🔥 SETTINGS
================================================= */

const settingsRef = doc(db, "settings", "appConfig");
const toggleBtn = document.getElementById("redirectToggleBtn");

async function loadSettings() {
  const snap = await getDoc(settingsRef);
  const enabled = snap.exists() ? snap.data().autoRedirect : false;

  toggleBtn.textContent = enabled
    ? "Disable Auto Redirect"
    : "Enable Auto Redirect";

  toggleBtn.className = enabled ? "toggle-on" : "toggle-off";

  toggleBtn.onclick = async () => {
    const snap = await getDoc(settingsRef);
    const current = snap.exists() ? snap.data().autoRedirect : false;

    await setDoc(settingsRef, {
      autoRedirect: !current
    }, { merge: true });

    loadSettings();
  };
}

/* =================================================
   👤 USERS
================================================= */

async function loadUsers() {

  const snapshot = await getDocs(collection(db, "users"));

  const container = document.getElementById("users");
  container.innerHTML = "";

  snapshot.forEach((docSnap) => {

    const data = docSnap.data();
    const isLocked = data.locked === true;

    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <b>ID:</b> ${docSnap.id}<br>

      <b>Status:</b>
      <span class="${isLocked ? "locked" : "unlocked"}">
        ${isLocked ? "🔒 Locked" : "🔓 Active"}
      </span>

      <br><br>

      <b>Username:</b>
      <input value="${data.username}" id="u-${docSnap.id}">

      <br>

      <b>Role:</b>
      <select id="r-${docSnap.id}">
        <option value="user" ${data.role === "user" ? "selected" : ""}>User</option>
        <option value="admin" ${data.role === "admin" ? "selected" : ""}>Admin</option>
      </select>

      <br>

      <b>Password (new):</b>
      <input type="text" id="p-${docSnap.id}" placeholder="Set New Password">

      <br>

      <button onclick="saveUser('${docSnap.id}')">Save</button>
      <button onclick="deleteUser('${docSnap.id}')">Delete</button>
      <button onclick="toggleLock('${docSnap.id}', ${isLocked})">
        ${isLocked ? "Unlock" : "Lock"}
      </button>
    `;

    container.appendChild(div);
  });
}

/* ---------------- CREATE USER ---------------- */
window.createUser = async function() {

  const username = document.getElementById("newUser").value;
  const password = document.getElementById("newPass").value;

  if (!username || !password) return alert("Fill both fields");

  const passwordHash = await hashPassword(password);

  await addDoc(collection(db, "users"), {
    username,
    passwordHash,
    role: "user",
    locked: false,
    created: Date.now()
  });

  document.getElementById("newUser").value = "";
  document.getElementById("newPass").value = "";

  loadUsers();
};

/* ---------------- SAVE USER ---------------- */
window.saveUser = async function(id) {

  const username = document.getElementById("u-" + id).value;
  const role = document.getElementById("r-" + id).value;
  const newPass = document.getElementById("p-" + id).value;

  const updateData = { username, role };

  if (newPass) {
    updateData.passwordHash = await hashPassword(newPass);
  }

  await updateDoc(doc(db, "users", id), updateData);

  loadUsers();
};

/* ---------------- DELETE USER ---------------- */
window.deleteUser = async function(id) {

  if (!confirm("Delete this user?")) return;

  await deleteDoc(doc(db, "users", id));

  loadUsers();
};

/* ---------------- LOCK / UNLOCK ---------------- */
window.toggleLock = async function(id, currentState) {

  await updateDoc(doc(db, "users", id), {
    locked: !currentState
  });

  loadUsers();
};

/* =================================================
   START
================================================= */

window.addEventListener("DOMContentLoaded", () => {
  loadUsers();
  loadSettings();
});

</script>

</body>
</html>
