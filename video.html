<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Chat</title>

<style>
body {
  font-family: Arial;
  background:#111;
  color:white;
  text-align:center;
}

video {
  width:45%;
  margin:10px;
  border-radius:10px;
  background:black;
}

button {
  padding:10px;
  margin:5px;
}
</style>
</head>

<body>

<h2>Video Chat</h2>

<video id="localVideo" autoplay muted></video>
<video id="remoteVideo" autoplay></video>

<br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<script type="module">

import { db } from "./js/firebase.js";
import {
doc, setDoc, getDoc, updateDoc, onSnapshot, collection, addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const servers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

let pc = new RTCPeerConnection(servers);
let localStream;

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

/* GET MEDIA */
async function initMedia(){
  localStream = await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
  });

  localStream.getTracks().forEach(track=>{
    pc.addTrack(track, localStream);
  });

  localVideo.srcObject = localStream;
}

/* CREATE CALL */
window.startCall = async function(){

  await initMedia();

  const callRef = doc(collection(db,"calls"));
  const callId = callRef.id;

  pc.onicecandidate = async (event)=>{
    if(event.candidate){
      await addDoc(collection(db,"calls",callId,"candidates"), event.candidate.toJSON());
    }
  };

  pc.ontrack = (event)=>{
    remoteVideo.srcObject = event.streams[0];
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(callRef,{
    offer: {
      type: offer.type,
      sdp: offer.sdp
    }
  });

  onSnapshot(callRef, (snap)=>{
    const data = snap.data();
    if(!pc.currentRemoteDescription && data?.answer){
      pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });

  window.currentCallId = callId;

  alert("Call created: " + callId);
};

/* JOIN CALL */
window.joinCall = async function(){

  const callId = prompt("Enter Call ID:");
  if(!callId) return;

  await initMedia();

  const callRef = doc(db,"calls",callId);

  pc.onicecandidate = async (event)=>{
    if(event.candidate){
      await addDoc(collection(db,"calls",callId,"candidates"), event.candidate.toJSON());
    }
  };

  pc.ontrack = (event)=>{
    remoteVideo.srcObject = event.streams[0];
  };

  const callData = (await getDoc(callRef)).data();

  await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await updateDoc(callRef,{
    answer:{
      type:answer.type,
      sdp:answer.sdp
    }
  });

};

</script>

</body>
</html>
