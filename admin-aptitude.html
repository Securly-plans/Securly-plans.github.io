<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerald Quiz</title>

<link rel="stylesheet" href="style.css">

<style>
:root{
  --primary:#c40000;
  --primary-hover:#a30000;
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#222;
  --muted:#666;
}

/* PAGE */
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 20px;
  background:#fff;
  border-bottom:1px solid #ddd;
}

.navbar a,
.navbar button{
  text-decoration:none;
  color:var(--text);
  padding:8px 12px;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
}

.username-badge{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid #ddd;
  color:var(--muted);
}

/* CENTER */
main{
  display:flex;
  justify-content:center;
  padding:30px 15px;
}

/* CARD */
.quiz-box{
  width:100%;
  max-width:700px;
  background:var(--card);
  padding:25px;
  border-radius:14px;
  box-shadow:0 2px 15px rgba(0,0,0,0.08);
  border-top:5px solid var(--primary);
}

/* QUESTIONS */
.question{
  margin-bottom:18px;
  padding:14px;
  border:1px solid #eee;
  border-radius:10px;
  background:#fafafa;
}

.question p{
  font-weight:bold;
  color:var(--primary);
  margin-bottom:10px;
}

/* INPUTS */
label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:var(--primary-hover);
}

/* RESULT */
#result{
  margin-top:15px;
  font-weight:bold;
  color:var(--primary);
}
</style>
</head>

<body>

<div class="navbar">
  <div>
    <a href="home.html">Home</a>
  </div>

  <div>
    <span id="usernameDisplay" class="username-badge"></span>
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<main>

<div class="quiz-box">

<h2>Moderation Quiz</h2>

<!-- Q1 -->
<div class="question">
<p>1. What is a PROHIBITED username change for "BestOfMen"?</p>
<label><input type="checkbox" name="q1" value="A"> BestOfWomen</label>
<label><input type="checkbox" name="q1" value="B"> Mr.Mr</label>
<label><input type="checkbox" name="q1" value="C"> EpIsland</label>
<label><input type="checkbox" name="q1" value="D"> Forty-FiveMen</label>
</div>

<!-- Q2 -->
<div class="question">
<p>2. Appropriate password change?</p>
<label><input type="radio" name="q2" value="A"> MensBest</label>
<label><input type="radio" name="q2" value="B"> Mr.Cock</label>
<label><input type="radio" name="q2" value="C"> TropicalParadise</label>
<label><input type="radio" name="q2" value="D"> BestOfMen</label>
</div>

<!-- Q3 -->
<div class="question">
<p>3. Which is a prohibited chat message?</p>
<label><input type="radio" name="q3" value="A"> I Like Big Balls and butts</label>
<label><input type="radio" name="q3" value="B"> Curry and Rice is delicious</label>
<label><input type="radio" name="q3" value="C"> I Like Kirbies</label>
<label><input type="radio" name="q3" value="D"> Part Four is the Best</label>
</div>

<!-- Q4 (ONLY PART 1 NOW) -->
<div class="question">
<p>4. Report worthy event? (multi-select)</p>
<label><input type="checkbox" name="q4" value="A"> Admin abusing authority</label>
<label><input type="checkbox" name="q4" value="B"> Minor violation</label>
<label><input type="checkbox" name="q4" value="C"> Mod editing without cause</label>
<label><input type="checkbox" name="q4" value="D"> Admin ignoring violation</label>
</div>

<button id="submitBtn">Submit Quiz</button>

<div id="result"></div>

</div>

</main>

<script>
window.addEventListener("DOMContentLoaded", () => {

  document.getElementById("logoutBtn").onclick = () => {
    localStorage.clear();
    window.location.href = "index.html";
  };

  const username = localStorage.getItem("username");
  if (username) {
    document.getElementById("usernameDisplay").textContent = "👤 " + username;
  }

  document.getElementById("submitBtn").addEventListener("click", gradeQuiz);

  function gradeQuiz() {

    let score = 0;
    let total = 4;
    let review = [];

    // Q1
    let q1 = [...document.querySelectorAll('input[name="q1"]:checked')]
      .map(e => e.value).sort().join("");

    if (q1 === "ABC") score++;
    else review.push("Q1 incorrect (A,B,C)");

    // Q2
    let q2 = document.querySelector('input[name="q2"]:checked');
    if (q2 && q2.value === "C") score++;
    else review.push("Q2 incorrect (C)");

    // Q3
    let q3 = document.querySelector('input[name="q3"]:checked');
    if (q3 && q3.value === "A") score++;
    else review.push("Q3 incorrect (A)");

    // Q4
    let q4 = [...document.querySelectorAll('input[name="q4"]:checked')]
      .map(e => e.value).sort().join("");

    if (q4 === "ACD") score++;
    else review.push("Q4 incorrect (A,C,D)");

    let percent = Math.round((score / total) * 100);

    let html = `
      Score: ${score}/${total}<br>
      Percentage: ${percent}%<br><br>
    `;

    if (review.length > 0) {
      html += "<b>Review:</b><br>";
      review.forEach(r => html += "❌ " + r + "<br>");
    } else {
      html += "🎉 Perfect score!";
    }

    document.getElementById("result").innerHTML = html;
  }

});
</script>

</body>
</html>
